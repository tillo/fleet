apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoconfig
  namespace: mail
spec:
  selector:
    matchLabels:
      app: autoconfig
  replicas: 2
  template:
    metadata:
      labels:
        app: autoconfig
    spec:
      priorityClassName: mdapi-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: autoconfig
              topologyKey: kubernetes.io/hostname
      containers:
      - name: autoconfig
        image: zot.mdapi.ch/mdapi/autoconfig:latest@sha256:9e4f4ac7b4f25fd532097626dc64d7b82b07d7185445bd14bd005dcd98a008a2
        imagePullPolicy: IfNotPresent
        resources: {}
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: TZ
          value: Europe/Zurich
        - name: MAIL_HOSTNAME
          value: mail.mdapi.ch
        - name: DISPLAY_NAME
          value: "Martino Dell'Ambrogio Personal Infrastructure"
        - name: DISPLAY_SHORT_NAME
          value: MDAPI
      imagePullSecrets:
      - name: zot-pull
