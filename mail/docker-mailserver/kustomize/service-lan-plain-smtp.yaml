# LAN-only plaintext SMTP listener (2525) for TLS-1.0-only devices — the HP
# M475dn's scan-to-email (infra-hnbe.5). The listener itself is created by
# user-patches.sh in ../values.yml; the chart hardcodes its Service ports with
# no extra-ports value, so the port can only be added here.
# Strategic merge on `ports` (merge key `port`) appends; the chart's ports are
# untouched. Not forwarded at the edge, so it is reachable from the LAN only.
apiVersion: v1
kind: Service
metadata:
  name: docker-mailserver
spec:
  ports:
    - name: smtp-lan-plain
      port: 2525
      targetPort: 2525
      protocol: TCP
