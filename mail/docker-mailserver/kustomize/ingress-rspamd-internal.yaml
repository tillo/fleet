# rspamd.mdapi.ch -> docker-mailserver-internal (ClusterIP), because 11334 is no longer
# on the LoadBalancer Service (service-lb-no-controller.yaml, infra-o4i3m.3). The chart
# hardcodes the backend to its own Service; `rules` has no merge key, so the whole list
# is restated here: same host, path and port name as the chart renders.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-mailserver-rspamd
spec:
  rules:
    - host: rspamd.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docker-mailserver-internal
                port:
                  name: rspamd
