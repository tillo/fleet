# Post-renders the docker-mailserver chart (see ../fleet.yml). Fleet feeds the
# helm-rendered manifests in as the kustomize base, then applies this patch
# (same pattern as metallb/ and cribl/). Patch-only, no `resources:` — same
# shape as metallb/kustomize, which carries no resources key either.
#
# This overlay exists for exactly FOUR reasons, all things the chart cannot
# express. (2) is service-lan-plain-smtp.yaml: the chart's Service ports are
# hardcoded, so the LAN-only 2525 listener's port is appended here. (3) is
# deployment-probes.yaml: the chart hardcodes its probes as dms-healthcheck,
# which stays green while Dovecot crash-loops (infra-1ts0d).
# (4) is service-lb-address.yaml: the chart renders no loadBalancerClass and no
# loadBalancerIP, so the Service's class and fixed .48 are set here (infra-ifhew).
# (Since chart 7.1.0 the chart itself keeps the rspamd controller and metrics
# off the LoadBalancer, on its <fullname>-internal ClusterIP Service: upstream
# PR #206, written for infra-o4i3m.3. Our port-delete patch and rspamd ingress
# patch went with it. tests/test_mail_rspamd_controller_requires_a_password.py
# asserts the outcome on the rendered bundle, not the mechanism.)
#
# ⛔ (1), the image pin. The chart hardcodes
# `image: {{ .Values.image.name }}:{{ .Values.image.tag }}` in its Deployment
# template and exposes no `repository`/`tag` pair, so Renovate's helm-values
# manager — whose heuristic needs a key ending in `image` holding BOTH
# `repository` and `tag|version` — can never match the ref in ../values.yml.
# No values-file rule could ever have reached it. Declared here as a
# Deployment-shaped patch, the ref falls to the kubernetes manager instead,
# which already owns the Lane-A pinDigests + digest-automerge rules: no new
# renovate.json rule was needed, and nothing had to be carved back out.
# ⚠️ The patch carries NO namespace: this chart renders the Deployment without
# one (metallb's does render it, and that patch sets it for that reason), and
# kustomize matches on namespace — a namespaced patch against a namespace-less
# base fails the whole build with "no matches for Id". Verified with
# `kubectl kustomize` on both shapes before committing.
patchesStrategicMerge:
- deployment-image-pin.yaml
- service-lb-address.yaml
# ⚠️ Any FUTURE `$patch: delete` on a Service port must run BEFORE this one: once a
# patch has added a port carrying `protocol`, kustomize matches Service ports on
# port+protocol and a later delete silently matches nothing (kubectl kustomize v5.8.1).
- service-lan-plain-smtp.yaml
- deployment-probes.yaml
