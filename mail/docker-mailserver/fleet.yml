defaultNamespace: mail
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: docker-mailserver
  repo: https://docker-mailserver.github.io/docker-mailserver-helm
  chart: docker-mailserver
  version: 6.0.0  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
# Post-render the chart with kustomize to declare the mail server image ref
# where a Renovate manager can actually reach it — the chart's own image schema
# (`image.name`/`image.tag`) is invisible to helm-values. See kustomize/.
kustomize:
  dir: kustomize
