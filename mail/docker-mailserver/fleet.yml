defaultNamespace: mail
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25
  releaseName: docker-mailserver
  repo: https://docker-mailserver.github.io/docker-mailserver-helm
  chart: docker-mailserver
  version: 5.1.1  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
# Post-render the chart with kustomize to declare the mail server image ref
# where a Renovate manager can actually reach it — the chart's own image schema
# (`image.name`/`image.tag`) is invisible to helm-values. See kustomize/.
kustomize:
  dir: kustomize
