certificate: mail-cert
# Track our own daily-rebuilt image (upstream :edge + apt security upgrade)
# instead of the docker.io upstream tag which is frozen at v15.1.0 (2025-08-12).
image:
  name: registry.mdapi.ch/mdapi/docker-mailserver
  tag: latest
  pullPolicy: Always
# Chart doesn't expose imagePullSecrets, so we provide our own ServiceAccount
# via extraDeploy below and skip the chart's SA template.
serviceAccount:
  create: false
  name: docker-mailserver
deployment:
  # Mail is priority 1 (2026-07-04 N-1 program).
  priorityClassName: mdapi-critical
  # Keel watches these annotations to auto-redeploy on new image digest.
  # We track :latest of our own daily-rebuilt image at registry.mdapi.ch
  # — force policy re-pulls on every poll regardless of tag.
  # pull-secret tells Keel which Secret in this ns holds the registry creds,
  # since the chart can't put imagePullSecrets on the PodSpec (it bolts the
  # secret onto a ServiceAccount via extraDeploy instead — fine for kubelet
  # pulls, invisible to Keel's HEAD requests).
  annotations:
    keel.sh/policy: force
    ## Without match-tag, `policy: force` lets Keel jump to ANY newer tag in
    ## the repo. On 2026-05-16 that pulled `:cache` (a BuildKit cache blob),
    ## breaking mail for ~3h. Lock Keel to re-pulling the same tag only.
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 4h"
    keel.sh/imagePullSecret: mdapi-registry
  env:
    ACCOUNT_PROVISIONER: LDAP
    LOG_LEVEL: info
    SUPERVISOR_LOGLEVEL: info
    ENABLE_CLAMAV: 1
    POSTMASTER_ADDRESS: tillo@tillo.ch
    OVERRIDE_HOSTNAME: mail.mdapi.ch
    TZ: Europe/Zurich
    RSPAMD_LEARN: 1
    RSPAMD_CHECK_AUTHENTICATED: 1
    ENABLE_MANAGESIEVE: 1
    VIRUSMAILS_DELETE_DELAY: 30
    POSTFIX_MESSAGE_SIZE_LIMIT: "300000000"
    PFLOGSUMM_TRIGGER: logrotate
    PFLOGSUMM_RECIPIENT: tillo@tillo.ch
    LOGWATCH_INTERVAL: weekly
    LOGWATCH_RECIPIENT: tillo@tillo.ch
    LDAP_SEARCH_BASE: dc=mdapi,dc=ch
    LDAP_QUERY_FILTER_USER: "(&(objectClass=room)(cn=%s)(ou:dn:=People))"
    LDAP_QUERY_FILTER_GROUP: "(&(objectClass=room)(cn=%s)(ou:dn:=group))"
    LDAP_QUERY_FILTER_ALIAS: "(&(objectClass=room)(cn=%s)(ou:dn:=alias))"
    LDAP_QUERY_FILTER_DOMAIN: "(&(objectClass=room)(cn=%s)(ou:dn:=domain))"
    DOVECOT_USER_FILTER: "(&(objectClass=room)(cn=%u)(ou:dn:=People))"
    DOVECOT_PASS_FILTER: "(&(objectClass=posixAccount)(mail=%u)(ou:dn:=People))"
    DOVECOT_USER_ATTRS: "=uid=5000,=gid=5000,description=home=/var/mail/%$"
    DOVECOT_PASS_ATTRS: "userPassword=password"
    DOVECOT_AUTH_BIND: "no"
    ENABLE_SASLAUTHD: 1
    SASLAUTHD_MECHANISMS: rimap
    SASLAUTHD_MECH_OPTIONS: "127.0.0.1"
    # Explicit values, NOT null: helm v3 removed null-valued keys from the
    # merged values (so envFrom / the ES secret provided them), but helm v4
    # (fleet-agent >= v0.15) KEEPS them and renders empty-value env vars,
    # which override envFrom — empty LDAP_SERVER_HOST wrote `server_host =`
    # into every postfix ldap-*.cf and hard-fataled smtpd/trivial-rewrite
    # (inbound mail down 2026-08-20 07:19-10:4xZ). The value is not secret
    # (in-cluster DNS); the ES still also provides it via envFrom.
    LDAP_SERVER_HOST: ldap://openldap.openldap.svc.cluster.local
    # Chart default is null -> empty env under helm v4; postfix ldap maps
    # would fatal on an empty start_tls the same way. Pin the intended value.
    LDAP_START_TLS: "no"
    SPAM_SUBJECT: ""
  secretEnvironments:
  - docker-mailserver-env-secret
  resources:
    limits:
      cpu: "4"
      ephemeral-storage: 500Mi
      memory: 6Gi
    requests:
      cpu: "1"
      ephemeral-storage: 100Mi
      memory: 1536Mi
persistent_volume_claims:
  mail-config:
    size: 1G
    storageClass: harvester-longhorn-2replicas
  mail-data:
    size: 100G
    storageClass: harvester-longhorn-2replicas
  mail-state:
    size: 10G
    storageClass: harvester-longhorn-2replicas
  mail-log:
    size: 20G
    storageClass: harvester-longhorn-2replicas
service:
  type: LoadBalancer
  loadBalancerClass: metallb
  externalTrafficPolicy: Cluster
  loadBalancerIP: 192.168.1.48
rspamd:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-response-headers: Authorization
      nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
      nginx.ingress.kubernetes.io/enable-modsecurity: "true"
      nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
      nginx.ingress.kubernetes.io/modsecurity-snippet: |
        SecRuleEngine On
        SecAuditEngine RelevantOnly
        SecAuditLogRelevantStatus "^(?:5|4(?!04))"
        SecAuditLogParts ABIJDEFHZ
        SecAuditLogType Serial
        SecAuditLogFormat JSON
        SecAuditLog /dev/stdout
        SecDebugLog /tmp/modsec_debug.log
        Include /etc/nginx/owasp-modsecurity-crs/nginx-modsecurity.conf
        SecRule REQUEST_URI "@beginsWith /checkv2" \
          "id:1000,\
          phase:1,\
          pass,\
          t:none,\
          nolog,\
          ctl:ruleRemoveById=949110"
    host: rspamd.mdapi.ch
    tls:
      enabled: true
      secret: rspamd-cert
dovecot:
  fullTextSearch:
    enabled: true
configMaps:
  postfix-main.cf:
    create: true
    path: postfix-main.cf
    data: |
      mynetworks = 127.0.0.0/8 10.52.0.0/22 192.168.1.0/24
      # Recognize $myhostname (mail.mdapi.ch) as a local destination so that
      # cron output from system users (e.g. clamav@mail.mdapi.ch) doesn't
      # try to relay back to ourselves and bounce as "loops back to myself".
      mydestination = $myhostname, localhost.$mydomain, localhost
      # Throttle SASL brute-force to 10 AUTH/min per client IP (2026-08-20).
      # anvil accounts clients by the PROXY-protocol IP, so this works where
      # in-pod fail2ban provably cannot (all external TCP arrives from the
      # haproxy hop; attacker IPs never appear as packet sources). Exceeded
      # clients get a temporary 450, not a lockout; $mynetworks is exempt by
      # default (smtpd_client_event_limit_exceptions); real MUAs do ~1 AUTH
      # per connection and never approach 10/min.
      smtpd_client_auth_rate_limit = 10
  dovecot.cf:
    create: true
    path: dovecot.cf
    data: |
      service imap {
            vsz_limit = 16GB
      }
      service indexer-worker {
            vsz_limit = 16GB
      }
      service decode2text {
            executable = script /usr/lib/dovecot/decode2text.sh
            user = docker
            unix_listener decode2text {
                  mode = 0666
            }
      }
      {{- if .Values.proxyProtocol.enabled }}
        haproxy_trusted_networks = {{ .Values.proxyProtocol.trustedNetworks }}

        {{- if and (.Values.deployment.env.ENABLE_IMAP) (not .Values.deployment.env.SMTP_ONLY) }}
        service imap-login {
            inet_listener imap {
                port = 143
            }

            inet_listener imaps {
                port = 993
                ssl = yes
            }

            inet_listener imap_proxyprotocol {
                haproxy = yes
                port = 10143
                ssl = no
            }

            inet_listener imaps_proxyprotocol {
                haproxy = yes
                port = 10993
                ssl = yes
            }
        }
        {{- end -}}

        {{- if and (.Values.deployment.env.ENABLE_POP3) (not .Values.deployment.env.SMTP_ONLY) }}
        service pop3-login {
            inet_listener pop3 {
                port = 110
            }

            inet_listener pop3s {
                port = 995
                ssl = yes
            }

            inet_listener pop3_proxyprotocol {
                haproxy = yes
                port = 10110
                ssl = no
            }

            inet_listener pop3s_proxyprotocol {
                haproxy = yes
                port = 10995
                ssl = yes
            }
        }
        {{- end -}}

        {{- if and (.Values.deployment.env.ENABLE_MANAGESIEVE) (not .Values.deployment.env.SMTP_ONLY) }}
        service managesieve-login {
            inet_listener sieve {
                port = 4190
            }

            inet_listener sieve_proxyprotocol {
                haproxy = yes
                port = 14190
            }
        }
        {{- end -}}
      {{- end -}}
  # Dovecot version gate (2026-08-20): upstream DMS is migrating to Dovecot 2.4
  # (v16). The 2.3 config dialect (plugin{} blocks) is a config-parser FATAL on
  # 2.4 — it took prod IMAP down 2026-08-20 03:51-06:02Z — and the 2.4 dialect
  # is equally fatal on 2.3. The chart-default 10-plugin.conf (2.3 FTS syntax,
  # subPath-mounted read-only) is therefore overridden to a comment stub, and
  # user-patches.sh installs the dialect that matches the RUNNING dovecot from
  # the three payload files below. This keeps one fleet state valid across the
  # frozen 2.3 base (src/docker-mailserver Dockerfile pin) AND the future v16
  # unfreeze. The 2.4 files were validated 2026-08-20 in a sandbox pod on the
  # broken edge image: doveconf parse, dovecot start, and against the real
  # openldap: passdb lookup, userdb lookup (uid/gid/home), doveadm -A iteration.
  # NOTE: the chart-default entry for this is keyed "fts-xapian-plugin.conf"
  # but mounts at /etc/dovecot/conf.d/10-plugin.conf — override THAT key (a
  # sibling "10-plugin.conf" entry would duplicate-mount the same path).
  fts-xapian-plugin.conf:
    create: true
    path: /etc/dovecot/conf.d/10-plugin.conf
    data: |
      # Intentionally empty (chart default overridden): FTS config is installed
      # by user-patches.sh as /etc/dovecot/conf.d/90-mdapi-fts.conf, gated on
      # the running dovecot version (2.3 vs 2.4 dialects are mutually fatal).
  dovecot-fts-23.conf:
    create: true
    path: dovecot-fts-23.conf
    data: |
      mail_plugins = $mail_plugins fts fts_xapian

      plugin {
          fts = xapian
          fts_xapian = partial=3 full=20 verbose=0

          fts_autoindex = yes
          fts_enforced = yes

          # Index attachements
          fts_decoder = decode2text
      }

      service indexer-worker {
          # limit size of indexer-worker RAM usage, ex: 512MB, 1GB, 2GB
          vsz_limit = 2GB
      }
  dovecot-fts-24.conf:
    create: true
    path: dovecot-fts-24.conf
    data: |
      mail_plugins {
        fts = yes
        fts_xapian = yes
      }

      # Mandatory in 2.4 for fts (no default language is defined)
      language en {
        default = yes
      }

      fts xapian {
        partial = 3
        verbose = 0
      }

      fts_autoindex = yes
      # 2.3 "fts_enforced = yes" equivalents
      fts_search_add_missing = yes
      fts_search_read_fallback = no

      # 2.3 "fts_decoder = decode2text" equivalent
      fts_decoder_driver = script
      fts_decoder_script_socket_path = decode2text

      service indexer-worker {
          # limit size of indexer-worker RAM usage, ex: 512MB, 1GB, 2GB
          vsz_limit = 2GB
      }
  dovecot-ldap-24-override.conf:
    create: true
    path: dovecot-ldap-24-override.conf
    data: |
      # mdapi overrides on top of DMS's auth-ldap.conf.ext (Dovecot 2.4 format).
      # Loaded after 10-auth.conf's !include — later assignments win; fields
      # blocks MERGE with the DMS defaults, so absent-attribute references from
      # the stock file must be explicitly overridden here.
      passdb ldap {
        fields {
          # DMS default rewrites the session user to %{ldap:uniqueIdentifier};
          # our posixAccounts have no such attribute — keep the login user.
          user = %{user}
          password = %{ldap:userPassword}
        }
      }
      userdb ldap {
        fields {
          uid = 5000
          gid = 5000
          # room-entry `description` holds "<domain>/<localpart>/"
          home = /var/mail/%{ldap:description}
          # Clear DMS's mail_path (%{ldap:mailStorageDirectory} — attribute
          # absent in our schema, and merged fields keep it): empty falls back
          # to the global mail_path (/var/mail/<domain>/<user>), correct for us.
          mail_path =
        }
      }
      passdb_ldap_filter = (&(objectClass=posixAccount)(mail=%{user})(ou:dn:=People))
      userdb_ldap_filter = (&(objectClass=room)(cn=%{user})(ou:dn:=People))
      # doveadm -A iteration (was iterate_attrs/iterate_filter in 2.3)
      userdb_ldap_iterate_filter = (&(objectClass=room)(ou:dn:=People))
      userdb_ldap_iterate_fields {
        user = %{ldap:cn}
      }
  user-patches.sh:
    create: true
    path: user-patches.sh
    data: |
      #!/bin/bash

      cat <<EOF >/etc/rspamd/local.d/multimap.conf
      sender_from_regexp {
        type = "from";
        filter = "email:addr";
        map = "file:///etc/rspamd/maps.d/sender_from_regexp.inc";
        symbol = "SENDER_FROM_REGEXP";
        regexp = true;
        score = 1.0;
      }
      EOF

      cat <<EOF >/etc/rspamd/maps.d/sender_from_regexp.inc
      \w+@\w+\.(?:tillo|mdapi)\.ch SENDER_FROM_REGEXP:-10:edgestuff
      EOF

      # Blocklist DNS (RBL/URIBL/EMAILBL) from public providers is throttled/slow via the
      # shared resolver; the default 5 DNS retransmits let one dead lookup stall a message to
      # the 8s task_timeout, which soft-rejected our users outbound mail with
      # "4.7.1 timeout processing message" (webmail unaffected). Fail slow lookups fast
      # (rspamd resolves in parallel) so the task finishes well under task_timeout; spam
      # checks still run. Verified 2026-06-11: heavy multi-blocklist scan 8s -> ~0.6s.
      cat <<EOF >/etc/rspamd/local.d/options.inc
      dns {
        timeout = 1s;
        retransmits = 2;
      }
      EOF

      # Belt-and-suspenders: authenticated (outbound) senders skip the DNS-heavy blocklist
      # groups entirely (DKIM signing, BAYES, SPF and local checks stay active).
      cat <<EOF >/etc/rspamd/local.d/settings.conf
      authenticated_outbound {
        priority = high;
        authenticated = true;
        apply {
          groups_disabled = ["rbl", "surbl", "dnswl", "emails", "asn"];
        }
      }
      EOF

      # Removed by docker-mailserver Dockerfile
      curl -o /usr/lib/dovecot/decode2text.sh https://raw.githubusercontent.com/bdraco/dovecot/refs/heads/master/src/plugins/fts/decode2text.sh
      chmod +x /usr/lib/dovecot/decode2text.sh
      
      # decode2text dependencies
      apt -y update
      apt -y install --no-install-recommends poppler-utils catdoc antiword unzip

      # === Dovecot version gate (2026-08-20) ===
      # (=== not --- : helm v4 fixDocSeparators shreds runs of >=6 dashes in
      # rendered output into bogus YAML docs -> Fleet ErrApplied. Same reason
      # the CAMAC ruler below uses ===.)
      # Install the FTS config (and on 2.4 the LDAP overrides for our schema)
      # matching the RUNNING dovecot — the 2.3 and 2.4 config dialects are
      # mutually fatal. See the configMaps comment above for background.
      if dovecot --version | grep -q "^2\.4"; then
        cp /tmp/docker-mailserver/dovecot-fts-24.conf /etc/dovecot/conf.d/90-mdapi-fts.conf
        cp /tmp/docker-mailserver/dovecot-ldap-24-override.conf /etc/dovecot/conf.d/95-mdapi-ldap-override.conf
      else
        cp /tmp/docker-mailserver/dovecot-fts-23.conf /etc/dovecot/conf.d/90-mdapi-fts.conf
        # Necessary for doveadm -A (2.3 dialect; this file is unread by 2.4)
        echo -e "iterate_attrs = cn=user\niterate_filter = (&(objectClass=room)(ou:dn:=People))" >> /etc/dovecot/dovecot-ldap.conf.ext
      fi

      {{- if .Values.proxyProtocol.enabled }}
      # NOTE: Keep in sync with upstream advice:
      # https://github.com/docker-mailserver/docker-mailserver/blob/v15.0.0/docs/content/examples/tutorials/mailserver-behind-proxy.md?plain=1#L238-L268

      # Duplicate the config for the submission(s) service ports (587 / 465) with adjustments for the PROXY ports (10587 / 10465) and `syslog_name` setting:
      postconf -Mf submission/inet | sed -e s/^submission/10587/ -e 's/submission/submission-proxyprotocol/' >> /etc/postfix/master.cf
      postconf -Mf submissions/inet | sed -e s/^submissions/10465/ -e 's/submissions/submissions-proxyprotocol/' >> /etc/postfix/master.cf
      # Enable PROXY Protocol support for these new service variants:
      postconf -P 10587/inet/smtpd_upstream_proxy_protocol=haproxy
      postconf -P 10465/inet/smtpd_upstream_proxy_protocol=haproxy

      # Create a variant for port 25 too (NOTE: Port 10025 is already assigned in DMS to Amavis):
      postconf -Mf smtp/inet | sed -e s/^smtp/12525/ >> /etc/postfix/master.cf
      # Enable PROXY Protocol support:
      # - Uses a different setting as port 25 is handled via the postscreen service
      # - Optionally configure a `syslog_name` to distinguish in logs:
      postconf -P \
        12525/inet/postscreen_upstream_proxy_protocol=haproxy \
        12525/inet/syslog_name=postfix/smtpd-proxyprotocol

      # Add the `proxy:` prefix to share this cache between each running postscreen service via `proxymap`:
      postconf 'postscreen_cache_map = proxy:btree:$data_directory/postscreen_cache'
      {{- end }}

      perl -p -i -e 's/^result_attribute = mail$/result_attribute = cn/g' /etc/postfix/ldap-domains.cf

      perl -p -i -e 's/^result_attribute = mail$/result_attribute = description/g' /etc/postfix/ldap-aliases.cf
      perl -p -i -e 's/^result_attribute         = mail$/result_attribute = description/g' /etc/postfix/ldap-groups.cf

      cp /etc/postfix/ldap-users.cf /etc/postfix/ldap-usersmap.cf
      perl -p -i -e 's/^result_attribute = mail$/result_attribute = description/g' /etc/postfix/ldap-users.cf
      perl -p -i -e 's/^result_attribute = mail$/result_attribute = cn/g' /etc/postfix/ldap-usersmap.cf
      postconf 'virtual_alias_maps = ldap:/etc/postfix/ldap-aliases.cf, ldap:/etc/postfix/ldap-groups.cf, ldap:/etc/postfix/ldap-usersmap.cf'

      # Redirect local-system cron output (clamav, amavis, etc.) to POSTMASTER.
      # Without this, mail to e.g. clamav@mail.mdapi.ch is delivered to a local
      # mailbox no one reads; combined with myhostname now in mydestination this
      # cleanly funnels operational mail to the postmaster.
      # NOTE: bare "dollar-u" syntax (no braces) -- Fleet substitutes brace
      # form and would fail to resolve a Fleet variable for the loop var.
      for u in clamav amavis nobody amavisd; do
        grep -q "^$u:" /etc/aliases || echo "$u: $POSTMASTER_ADDRESS" >> /etc/aliases
      done
      newaliases

      # === CAMAC enquete webhook (2026-07-11) ===
      # Sieve pipe program for the "CAMAC enquete webhook" rule in tillo's OWN
      # roundcube sieve script (managed via Roundcube/managesieve — deliberately
      # NOT a global sieve-before rule, which would also fire on other users'
      # mail). Sends the raw message to Windmill f/desk/camac_enquete_watch
      # (distance-tiered Pushover with swisstopo map).
      # CAMAC_WEBHOOK_TOKEN comes from the docker-mailserver-env-secret ES
      # (Akeyless), scoped in Windmill to run only that script; it is embedded at
      # startup because dovecot's pipe processes don't inherit the container env.
      # Bare dollar-var (no braces) per the Fleet-substitution NOTE above.
      cat > /usr/lib/dovecot/sieve-pipe/camac-webhook.sh <<CAMACEOF
      #!/bin/bash
      # Fire-and-forget async Windmill run; never fail the sieve action (mail
      # delivery must not depend on the webhook).
      python3 -c 'import json,sys; print(json.dumps({"raw_email": sys.stdin.read()}))' \
        | curl -s -m 20 -X POST \
            -H "Authorization: Bearer $CAMAC_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            https://windmill.mdapi.ch/api/w/mdapi/jobs/run/p/f/desk/camac_enquete_watch \
            >/dev/null 2>&1 || true
      exit 0
      CAMACEOF
      chown root:docker /usr/lib/dovecot/sieve-pipe/camac-webhook.sh
      chmod 750 /usr/lib/dovecot/sieve-pipe/camac-webhook.sh
# postfix_exporter sidecar (2026-08-20): queue-depth/delivery metrics — the
# last unprobed layer after the helm-v4 incidents (stuck deferred queue with
# healthy listeners; today's 7-message LMTP backlog was invisible to every
# synthetic probe). Chart wires: sidecar reading the showq socket
# (/var/mail-state/spool-postfix/public/showq) + mail.log, `metrics` port on
# the svc, ServiceMonitor picked up by the default {} selector. Image is the
# chart's digest-pinned default (lane B).
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    scrapeInterval: 30s
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
extraDeploy:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: docker-mailserver
  imagePullSecrets:
  - name: mdapi-registry
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
    name: docker-mailserver-env-secret
  spec:
    refreshInterval: 1m0s

    secretStoreRef:
      kind: ClusterSecretStore
      name: cm-akeyless

    target:
      name: docker-mailserver-env-secret
      creationPolicy: Owner

    data:
      - remoteRef:
          key: /mdapi/mail/docker-mailserver-env-secret/DOVECOT_URIS
        secretKey: LDAP_SERVER_HOST
      - remoteRef:
          key: /mdapi/mail/docker-mailserver-env-secret/DOVECOT_URIS
        secretKey: DOVECOT_URIS
      - remoteRef:
          key: /mdapi/mail/docker-mailserver-env-secret/LDAP_BIND_DN
        secretKey: LDAP_BIND_DN
      - remoteRef:
          key: /mdapi/mail/docker-mailserver-env-secret/LDAP_BIND_PW
        secretKey: LDAP_BIND_PW
      - remoteRef:
          key: /mdapi/mail/docker-mailserver-env-secret/CAMAC_WEBHOOK_TOKEN
        secretKey: CAMAC_WEBHOOK_TOKEN
