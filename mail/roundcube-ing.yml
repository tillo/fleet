apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundcube
  namespace: mail
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "220m"
    # Inject the RUM bootstrap. See rum-assets/ for the self-hosted bundle.
    # Accept-Encoding is cleared because sub_filter cannot match gzipped HTML;
    # it costs upstream compression on HTML only, not on assets.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding $rum_accept_encoding;
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '</head>' '<script defer src="https://rum.mdapi.ch/rum.js"></script></head>';
    nginx.ingress.kubernetes.io/server-alias: "webmail.coders.ch,webmail.coiffuredreams.ch,webmail.dellambrogio.ch,webmail.tillo.ch,webmail.lithia.eu"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
spec:
  ingressClassName: nginx
  rules:
    - host: webmail.mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: roundcube
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
      - webmail.mdapi.ch
      - webmail.coders.ch
      - webmail.coiffuredreams.ch
      - webmail.dellambrogio.ch
      - webmail.tillo.ch
      - webmail.lithia.eu
      secretName: webmail-cert
