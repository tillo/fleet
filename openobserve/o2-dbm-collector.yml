                     coalesce(pg_get_indexdef(s.indexrelid),'')    AS index_def,
                     'ha-recorder-pg-rw.home-assistant.svc.cluster.local'                                      AS server_address,
                     'pg_index_stats'                              AS o2_recipe
              FROM pg_stat_user_indexes s
