                attribute_columns:
                  [schema_name, total_bytes, heap_bytes, seq_scan, seq_tup_read,
                   idx_scan, n_live_tup, n_dead_tup, n_mod_since_analyze,
                   last_vacuum, last_autovacuum, last_analyze, autovacuum_count,
                   frozen_xid_age, dead_tup_pct, server_address, o2_recipe]
      sqlquery/pg_index_stats_envkc:
        driver: postgres
        datasource: "host=postgres.envuassu.svc.cluster.local port=5432 user=${env:PGUSER} password=${env:PGPASS_ENVKC} dbname=keycloak sslmode=disable"
        # 300s, matching pg_table_stats and for the same reason: one
        # pg_relation_size() plus one pg_get_indexdef() per INDEX per tick.
        collection_interval: 300s
        max_open_conn: 2
        queries:
          - sql: |
              SELECT s.schemaname                                  AS schema_name,
                     s.relname                                     AS table_name,
                     s.indexrelname                                AS index_name,
                     coalesce(s.idx_scan,0)::text                  AS idx_scan,
                     coalesce(s.idx_tup_read,0)::text              AS idx_tup_read,
                     coalesce(s.idx_tup_fetch,0)::text             AS idx_tup_fetch,
                     pg_relation_size(s.indexrelid)::text          AS index_bytes,
                     (i.indisunique OR i.indisprimary)::text       AS is_unique,
                     coalesce(pg_get_indexdef(s.indexrelid),'')    AS index_def,
                     'postgres.envuassu.svc.cluster.local'                                      AS server_address,
                     'pg_index_stats'                              AS o2_recipe
              FROM pg_stat_user_indexes s
              JOIN pg_index i ON i.indexrelid = s.indexrelid
              WHERE s.schemaname NOT IN ('pg_catalog','information_schema')
            logs:
              - body_column: index_def
                attribute_columns:
                  [schema_name, table_name, index_name, idx_scan, idx_tup_read,
                   idx_tup_fetch, index_bytes, is_unique, server_address, o2_recipe]
      postgresql/dbm_events_envkc:
        endpoint: "postgres.envuassu.svc.cluster.local:5432"
        transport: tcp
        username: ${env:PGUSER}
        password: ${env:PGPASS_ENVKC}
        databases: [keycloak]
        tls:
          insecure: true
        collection_interval: 10s
        query_sample_collection:
          max_rows_per_query: 1000
        top_query_collection:
          top_n_query: 200
          # 0 = NO EXPLAIN (receiver: `explained < maxExplainEachInterval`). EXPLAIN needs privileges on the
          # tables, and o2_dbm is pg_monitor ONLY (statistics, never table data). Granting pg_read_all_data would
          # let the monitor read every row. So there are no plans, and top queries still flow. Measured
          # 2026-09-24: 'permission denied for table …' on every explain of gitlab and HA queries.
          max_explain_each_interval: 0
          query_plan_cache_size: 1000
          # DELIBERATE DEVIATION FROM UPSTREAM, WHICH DEFAULTS TO 60s, so an
          # "align with upstream" pass does not revert it silently. It multiplies
          # every per-cycle cost, including the EXPLAIN pass
          # max_explain_each_interval bounds: the ceiling is 200 x 240 = 48,000
          # EXPLAINs/hour against a measured real rate of 1,775. So do NOT cut the
          # budget, and do NOT shorten query_plan_cache_ttl to catch plan
          # regressions sooner -- a shorter TTL pushes more queries back through
          # the cycle and multiplies the one cost here that is real.
          collection_interval: 15s
        # ON. These two events fill the Activity tab and the server-side Top
        # queries. Upstream has shipped them default-OFF since v0.148.0, so without
        # this block the collector looks healthy and emits ZERO events. Set one to
        # false to trim cost, but the block itself must STAY -- and events: must
        # stay a TOP-LEVEL receiver key, never nested inside the blocks above.
        events:
          db.server.query_sample: { enabled: true }
          db.server.top_query: { enabled: false }

    processors:
      ## Recipe filter, VERBATIM: keeps only rows a recipe tagged (o2_recipe / o2_*_event).
      filter/dbm:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["o2_recipe"] == nil and (attributes["o2_pg_event"] == nil or attributes["o2_pg_event"] == "other") and (attributes["o2_my_event"] == nil or attributes["o2_my_event"] == "other") and (attributes["o2_maria_event"] == nil or attributes["o2_maria_event"] == "other")'
      ## FIRST in every pipeline. Recipe says 768/192 for a collector on a DB host;
      ## this pod's limit is 384Mi, so 300/75 keeps the guard below the cgroup limit.
      memory_limiter:
        check_interval: 1s
        limit_mib: 600
        spike_limit_mib: 150
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      otlphttp/openobserve_dbm:
        logs_endpoint: http://openobserve.openobserve.svc.cluster.local:5080/api/default/v1/logs
        headers:
          Authorization: ${env:O2_DBM_AUTHORIZATION}
          stream-name: _o2_dbm_server
        sending_queue:
          enabled: true
          queue_size: 500
        retry_on_failure:
          enabled: true
          max_elapsed_time: 300s

    service:
      telemetry:
        metrics:
          level: basic
      pipelines:
        logs:
          receivers: [sqlquery/pg_blocking, sqlquery/pg_table_stats, sqlquery/pg_index_stats, sqlquery/pg_blocking_gitlab, sqlquery/pg_table_stats_gitlab, sqlquery/pg_index_stats_gitlab, sqlquery/pg_blocking_harec, sqlquery/pg_table_stats_harec, sqlquery/pg_index_stats_harec, sqlquery/pg_blocking_keycloak, sqlquery/pg_table_stats_keycloak, sqlquery/pg_index_stats_keycloak, sqlquery/pg_blocking_joplin, sqlquery/pg_table_stats_joplin, sqlquery/pg_index_stats_joplin, sqlquery/pg_blocking_windmill, sqlquery/pg_table_stats_windmill, sqlquery/pg_index_stats_windmill, sqlquery/pg_blocking_nextcloud, sqlquery/pg_table_stats_nextcloud, sqlquery/pg_index_stats_nextcloud, sqlquery/pg_blocking_bussola, sqlquery/pg_table_stats_bussola, sqlquery/pg_index_stats_bussola, sqlquery/pg_blocking_litellm, sqlquery/pg_table_stats_litellm, sqlquery/pg_index_stats_litellm, sqlquery/pg_blocking_paperless, sqlquery/pg_table_stats_paperless, sqlquery/pg_index_stats_paperless, sqlquery/pg_blocking_guac, sqlquery/pg_table_stats_guac, sqlquery/pg_index_stats_guac, sqlquery/pg_blocking_envnc, sqlquery/pg_table_stats_envnc, sqlquery/pg_index_stats_envnc, sqlquery/pg_blocking_envkc, sqlquery/pg_table_stats_envkc, sqlquery/pg_index_stats_envkc]
          processors: [memory_limiter, filter/dbm, batch]
          exporters: [otlphttp/openobserve_dbm]
        logs/dbm_events:
          receivers: [postgresql/dbm_events, postgresql/dbm_events_gitlab, postgresql/dbm_events_harec, postgresql/dbm_events_keycloak, postgresql/dbm_events_joplin, postgresql/dbm_events_windmill, postgresql/dbm_events_nextcloud, postgresql/dbm_events_bussola, postgresql/dbm_events_litellm, postgresql/dbm_events_paperless, postgresql/dbm_events_guac, postgresql/dbm_events_envnc, postgresql/dbm_events_envkc]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/openobserve_dbm]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o2-dbm-collector
  namespace: openobserve
  labels:
    app.kubernetes.io/name: o2-dbm-collector
  ## Roll when the auth/target secrets change (they are env, read once at start).
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: o2-dbm-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o2-dbm-collector
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zot-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otelcol
          image: zot.mdapi.ch/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0@sha256:43649a46ed32d3b2bfd9bd89e29884782d3c350492761b918ba227dd73ef3719
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          envFrom:
            - secretRef:
                name: o2-dbm-grafana-pg
            - secretRef:
                name: o2-dbm-ingest
            - secretRef:
                name: o2-dbm-targets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: o2-dbm-collector
