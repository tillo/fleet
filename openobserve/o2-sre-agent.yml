    import os
    import sys

    APP_DIR = "/app"  # image WORKDIR; `python <script>` does NOT put cwd on sys.path
    for path in (APP_DIR, os.path.dirname(os.path.abspath(__file__))):
        if path not in sys.path:
            sys.path.insert(0, path)


    def say(msg):
        print(f"o2-agent-shim: {msg}", flush=True)


    def install_gate():
        import rca_gate
        import src.server as server

        original = server.create_app  # resolved through the package's lazy __getattr__
        lookup = rca_gate.o2_incident_lookup(
            os.environ["O2_TOOL_API_URL"].split("/api/")[0],
            os.environ["O2_MCP_USERNAME"],
            os.environ["O2_MCP_PASSWORD"],
        )

        def create_app():
            app = original()
            app.add_middleware(rca_gate.RcaGate, lookup=lookup, log=say)
            return app

