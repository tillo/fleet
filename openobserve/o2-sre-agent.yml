    A patch that no longer fits a future image logs `o2-agent-shim: ... NOT applied` and the
    stock app runs; the openobserve-ai key budget in litellm is then the only spend stop.
    Then runs the stock entry point (`src.main:main`, i.e. `python -m src.main`).
