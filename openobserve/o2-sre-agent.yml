    """Entrypoint shim for o2-sre-agent: RCA budget gate + 100k context cap, then the stock app.

    Installs two patches from rca_gate.py (rationale there), each FAIL-OPEN on its own:
      1. src.server.create_app -> the same app wrapped in rca_gate.RcaGate;
      2. src.opencode.gateway.build_gateway_provider -> the same provider block with
