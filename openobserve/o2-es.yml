# OpenObserve admin credentials. Pushed to Akeyless before first deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-admin
  namespace: openobserve
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: openobserve-admin
    creationPolicy: Owner
  data:
  - remoteRef: { key: /mdapi/openobserve/o2/root-email }
    secretKey: ZO_ROOT_USER_EMAIL
  - remoteRef: { key: /mdapi/openobserve/o2/root-password }
    secretKey: ZO_ROOT_USER_PASSWORD
---
# S3 access creds for OpenObserve. Migrated 2026-06-17 from the in-cluster Garage
# to Ceph RGW: now sourced from the RGW CephObjectStoreUser keys mirrored into
# Akeyless /mdapi/openobserve/rgw/*. Secret name + keys kept so o2-sts is
# unchanged. Old /mdapi/openobserve/garage/o2-* paths retained for rollback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-openobserve-s3-creds
  namespace: openobserve
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: garage-openobserve-s3-creds
    creationPolicy: Owner
  data:
  - remoteRef: { key: /mdapi/openobserve/rgw/access-key }
    secretKey: access_key
  - remoteRef: { key: /mdapi/openobserve/rgw/secret-key }
    secretKey: secret_key
---
# litellm virtual key for the OpenObserve AI assistant (o2-sre-agent), 2026-09-01.
# Scoped at the litellm side to ds-pro / ds-flash / local-only — not a master key,
# so it cannot reach the claude-* routes (Max subscription, ToS) or spend outside
# those three. Created via litellm /key/generate with alias "openobserve-ai".
# Consumed ONLY by the o2-sre-agent Deployment; the OpenObserve StatefulSet does
# not get it (verified: O2_AI_ENABLED + O2_AGENT_URL alone are sufficient there).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-ai
  namespace: openobserve
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: openobserve-ai
    creationPolicy: Owner
  data:
  - remoteRef: { key: /mdapi/openobserve/ai/litellm-key }
    secretKey: O2_AI_API_KEY
