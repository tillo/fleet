apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openobserve
  namespace: openobserve
  annotations:
    reloader.stakater.com/auto: "true"
    # Keel annotations removed with the digest pin (approved 2026-08-12,
    # ext:o2-search-topk-blind): a 24h force-poll on latest-amd64 was a silent
    # upgrade path — o2 version changes are now deliberate git edits here.
spec:
  serviceName: openobserve
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: openobserve
        # Use the non-SIMD amd64 variant; the SIMD build SIGILLs on Xeon nodes
        # without AVX2. Pinned by digest (approved 2026-08-12, infra-health
        # ext:o2-search-topk-blind): unpinned latest-amd64 + pullPolicy Always
        # meant any pod recreation could silently change the o2 version —
        # observed across the 08-10 08:45Z restart while diagnosing the
        # search-layer blindness. Digest = the build running since that
        # restart (resolved from the live pod's imageID on 2026-08-12).
        # To upgrade: resolve the new digest deliberately and edit here.
        image: public.ecr.aws/zinclabs/openobserve@sha256:acca9befd53991d159ce23255ad2b8917a578c72f4c24086cd304c8a0cda7d26
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: openobserve-config
        - secretRef:
            name: openobserve-admin
        env:
        - name: ZO_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-openobserve-s3-creds
              key: access_key
        - name: ZO_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: garage-openobserve-s3-creds
              key: secret_key
        ports:
        - { name: http, containerPort: 5080 }
        - { name: grpc, containerPort: 5081 }
        readinessProbe:
          httpGet: { path: /healthz, port: 5080 }
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 5080 }
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: "2",  memory: 4Gi }
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: harvester-longhorn-2replicas
      resources: { requests: { storage: 20Gi } }
