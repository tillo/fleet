# Pull secret for zot.mdapi.ch, needed by the OTel Collector (2026-09-22).
#
# ⛔ This namespace had no zot credential at all until now: OpenObserve and the
# o2-sre-agent both come from public.ecr.aws, which is anonymous, so the
# collector is the first workload here to pull from zot. Without this the pull
# fails with
#     pull access denied, repository does not exist or may require
#     authorization: authorization failed: no basic auth credentials
# which leads with "repository does not exist" and sends you looking for a
# missing image rather than a missing credential.
#
# Kept inside THIS bundle rather than added to the shared zot-pull-secrets
# bundle, following the precedent set by litellm/litellm-zot-pull-es.yml: it
# limits blast radius, and ⛔ adding `openobserve` to zot-pull-secrets as well
# would leave two ExternalSecrets fighting over the same Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
  namespace: openobserve
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: zot-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"zot.mdapi.ch":{"username":"zot","password":"{{ .password }}","auth":"{{ printf "zot:%s" .password | b64enc }}"}}}
  data:
    - remoteRef:
        key: /mdapi/zot/zot-auth/password
      secretKey: password
