apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openobserve
  namespace: openobserve
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    ## 600 (was 300, 2026-09-24): an incident RCA runs synchronously behind this
    ## ingress and took up to 312 s. A 300 s cut returned 504, discarded the finished
    ## analysis, and left the incident locked ("Analysis already in progress").
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    ## /metrics is not served to the Internet (infra-az8.26, pentest 2026-10-22 F35).
    ## OpenObserve answers it with no authentication: ~190-315 KB of Prometheus
    ## internals, and ~950 series labelled with an organization. Nothing uses it
    ## through this ingress (the UI never calls it, and no scrape points here).
    ## A scrape, if one is ever added, goes to Service openobserve:5080 inside
    ## the cluster. The match uses $uri, which nginx has already decoded and
    ## normalised, so //metrics, /./metrics and %6Detrics are caught too.
    ## /config stays open on purpose: the login page fetches it (get_config)
    ## before anyone is signed in, for sso_enabled/native_login_enabled and the RUM
    ## block. See o2-rum-ing.yml for why that RUM token is public by design.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri ~* "^/metrics(/|$)") {
        return 404;
      }
spec:
  ingressClassName: nginx
  rules:
    - host: logs.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openobserve
                port:
                  number: 5080
  tls:
    - hosts:
        - logs.mdapi.ch
      secretName: openobserve-cert
