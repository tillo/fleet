## OpenFGA: the authorisation store behind OpenObserve RBAC (Phase 1, 2026-09-24).
## Design and evidence: ~/o2-correlation-2026-09-23/RBAC-STUDY.md and RBAC-PHASE1.md.
defaultNamespace: openfga
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  ## PSA warn+audit=baseline (2026-09-28, ledger alert:PsaLabelDrift). Fleet
  ## stamps namespaceLabels only at namespace CREATION, so the live namespace was
  ## labelled by hand the same day (server dry-run: no violations); this makes a
  ## recreated namespace come back labelled instead of bare.
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
dependsOn:
  - name: mdapi-prod-external-secrets
helm:
  maxHistory: 25
