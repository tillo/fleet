## Postgres datastore for OpenFGA (O2 RBAC Phase 1, 2026-09-24).
##
## ⛔ OpenFGA MUST persist. Its in-memory store was tested on a scratch O2: a restart
## wiped every grant (a granted read went from 200 to 403). This database IS the
## RBAC state: roles, grants and group memberships for OpenObserve. If it is
## lost, every non-root O2 principal falls back to 403 (fail-closed; root and
## ingestion tokens keep working, both tested).
##
## Pattern copied from monitoring-grafana/grafana-pg.yml: 2 instances, switchover
## (never restart the primary in place; the 2026-09-24 DBM rollout measured
## what the default costs), barman to its own in-cluster RGW bucket over TLS,
## daily base backup.
##
## The app credential is CNPG-generated (secret openfga-pg-app, key `uri`): it
## never leaves the cluster and needs no Akeyless entry. A restore from barman
## recreates the role; the secret is re-generated by CNPG on bootstrap.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-pg
  namespace: openfga
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: harvester-longhorn-2replicas
    size: 2Gi

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 64MB
      effective_cache_size: 128MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  bootstrap:
    initdb:
      database: openfga
      owner: openfga

  backup:
    barmanObjectStore:
      ## Own bucket (OBC below), in-cluster Ceph RGW over TLS with the house CA.
      destinationPath: s3://cnpg-openfga-pg
      endpointURL: https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443
      endpointCA:
        name: rgw-transit-ca
        key: ca.crt
      s3Credentials:
        accessKeyId:
          name: cnpg-openfga-pg
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-openfga-pg
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: cnpg-rgw-region
          key: REGION
      data:
        compression: gzip
        jobs: 1
      wal:
        compression: gzip
    retentionPolicy: "14d"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: openfga-pg-daily
  namespace: openfga
spec:
  schedule: "0 40 2 * * *"
  backupOwnerReference: self
  ## Take the first base backup right away: WAL archiving alone is not a backup.
  immediate: true
  cluster:
    name: openfga-pg
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cnpg-openfga-pg
  namespace: openfga
spec:
  bucketName: cnpg-openfga-pg
  storageClassName: ceph-bucket
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-rgw-region
  namespace: openfga
stringData:
  REGION: us-east-1
