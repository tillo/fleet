## No Ingress on purpose: Wyoming is a raw TCP protocol with no authentication
## of its own, consumed only by Home Assistant from inside the cluster. HA
## reaches it at wyoming-openwakeword.wyoming.svc.cluster.local:10400.
apiVersion: v1
kind: Service
metadata:
  name: wyoming-openwakeword
  namespace: wyoming
spec:
  selector:
    app: wyoming-openwakeword
  ports:
    - name: wyoming
      port: 10400
      protocol: TCP
      targetPort: 10400
  type: ClusterIP
