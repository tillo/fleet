# Apache: no version in the Server header or on error pages (edge-dast,
# infra-7rog.31.12). Read by apache2.conf's IncludeOptional conf-enabled/*.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spider3-server-tokens
  namespace: spider3
data:
  zz-server-tokens.conf: |
    ServerTokens Prod
    ServerSignature Off
