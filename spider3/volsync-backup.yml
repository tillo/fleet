## Restic repo secret for the VolSync backup of spider3-data-ceph (PVC-audit G4,
## beads infra-jjb). Shared /mdapi/volsync/ceph-backup creds, per-PVC subpath
## in the offsite-swept external-Garage ceph-backup bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-ceph-backup-restic
  namespace: spider3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: volsync-ceph-backup-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:https://api.garage.home.tillo.ch/ceph-backup/spider3-data-ceph"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /mdapi/volsync/ceph-backup/restic-password
    - secretKey: access_key_id
      remoteRef:
        key: /mdapi/volsync/ceph-backup/access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: /mdapi/volsync/ceph-backup/secret-access-key
---
## spider3 user file storage (web + SFTPGo double-mount) — data is owned by
## the sftpgo uid 10006 / gid 33 (www-data), incl. 0700/0640 entries, so the
## mover MUST run as that identity to read everything.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: spider3-data-ceph
  namespace: spider3
spec:
  sourcePVC: spider3-data-ceph
  trigger:
    # TEMP verification slot after the mover-uid fix; revert to "30 3 * * *"
    schedule: "0 18 * * *"
  restic:
    repository: volsync-ceph-backup-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    moverSecurityContext:
      runAsUser: 10006
      runAsGroup: 33
      runAsNonRoot: true
    cacheCapacity: 2Gi
    cacheStorageClassName: harvester-longhorn-1replica
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
