
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: spider3
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spider3-data-ceph
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
