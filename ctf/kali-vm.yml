## Kali CTF workstation — adopted into Fleet 2026-09-02.
##
## Pre-existing hand-built VM; this manifest describes what is already running
## (currently Halted) so Fleet can own it. Nothing is recreated by adopting it.
##
## Unlike ripe-atlas/atlas-probe there is NO image pin here: the boot disk is a
## plain `ceph-block` PVC with no `harvesterhci.io/imageId`, i.e. this VM was
## built from installation media rather than from a Harvester VM image.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kali
  namespace: ctf
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: linux
  annotations:
    ## The 100Gi boot disk already exists as PVC kali-disk-0-z0ym1-ceph;
    ## Harvester does not recreate a PVC that is already there.
    harvesterhci.io/volumeClaimTemplates: '[{"metadata": {"name": "kali-disk-0-z0ym1-ceph"}, "spec": {"accessModes": ["ReadWriteMany"], "resources": {"requests": {"storage": "100Gi"}}, "volumeMode": "Block", "storageClassName": "ceph-block"}}]'
    ## Pinned so a Fleet-driven recreate keeps both L2 identities.
    harvesterhci.io/mac-address: '{"dmz":"2e:e6:ac:80:d9:2e","lan":"d2:64:0f:24:e0:18"}'
    network.harvesterhci.io/ips: '[]'
spec:
  ## Halted on purpose — the VM is stopped and adopting it must not start it.
  ## Harvester remembers RerunOnFailure as the strategy to use when started
  ## (annotation harvesterhci.io/vmRunStrategy), which is controller
  ## bookkeeping and therefore excluded from the diff in fleet.yaml.
  runStrategy: Always
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: kali
      annotations:
        harvesterhci.io/sshNames: '["default/tillo-exion","mdapirancher/martino.dellambrogio-mdambp"]'
    spec:
      architecture: amd64
      hostname: kali
      evictionStrategy: LiveMigrateIfPossible
      terminationGracePeriodSeconds: 120

      ## mgmt=true is injected for any VM on a mgmt-network NAD; cpumanager=true
      ## is required by dedicatedCpuPlacement below. Both declared explicitly so
      ## git matches what actually lands.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network.harvesterhci.io/mgmt
                    operator: In
                    values:
                      - "true"
                  - key: cpumanager
                    operator: In
                    values:
                      - "true"

      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
          maxSockets: 1
          ## Pinned CPUs. This is why requests below equal limits: the
          ## overcommit webhook does not apply to a dedicated-placement VM, so
          ## unlike atlas-probe the requests ARE part of the desired state and
          ## belong in git rather than in comparePatches.
          dedicatedCpuPlacement: true
        memory:
          guest: 8Gi
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: "4"
            memory: 8Gi
        ## Only a uuid exists on the live object; KubeVirt does not add a serial
        ## here, so none is declared.
        firmware:
          uuid: 4e50994c-0146-5b71-bc4b-b0d12c9e46ed
        features:
          acpi:
            enabled: true
        machine:
          type: q35
        devices:
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          disks:
            - name: disk-0
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: dmz
              model: virtio
              macAddress: "2e:e6:ac:80:d9:2e"
              bridge: {}
            - name: lan
              model: virtio
              macAddress: "d2:64:0f:24:e0:18"
              bridge: {}

      networks:
        - name: dmz
          multus:
            networkName: default/dmz
        - name: lan
          multus:
            networkName: default/lan

      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: kali-disk-0-z0ym1-ceph
        ## Secret kali-mp34v is pre-existing and deliberately NOT declared here:
        ## its user-data carries authorized_keys, which this publicly mirrored
        ## repo must not hold. Bringing it under Fleet means an ExternalSecret
        ## sourcing the keys from Akeyless, as ripe-atlas does — tracked as
        ## follow-up. The VM is Halted, so the user-data is inert meanwhile.
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: kali-mp34v
            networkDataSecretRef:
              name: kali-mp34v
