defaultNamespace: litellm
namespace: litellm
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
dependsOn:
  - name: mdapi-prod-cert-manager
helm:
  maxHistory: 25
# VPA (mode=Auto) writes resources.requests/limits onto running pods after
# start. Strip from the diff so Fleet stops flagging Modified.
diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: Deployment
    name: litellm
    namespace: litellm
    operations:
    - {"op": "remove", "path": "/spec/template/spec/containers/0/resources"}
