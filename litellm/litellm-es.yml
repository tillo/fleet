apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env-secret
spec:
  refreshInterval: 1m0s

  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless

  target:
    name: litellm-env-secret
    creationPolicy: Owner

  data:
    # Backend URLs live in Akeyless (not this public repo) so the laptop's
    # internal hostnames are never committed. Values, e.g.:
    #   LMSTUDIO_WIRED_URL = http://mbp-mda.home.tillo.ch:1234/v1
    #   LMSTUDIO_WIFI_URL  = http://mbp-mda-wifi.home.tillo.ch:1234/v1
    - remoteRef:
        key: /mdapi/litellm/litellm-env-secret/LMSTUDIO_WIRED_URL
      secretKey: LMSTUDIO_WIRED_URL
    - remoteRef:
        key: /mdapi/litellm/litellm-env-secret/LMSTUDIO_WIFI_URL
      secretKey: LMSTUDIO_WIFI_URL
    - remoteRef:
        key: /mdapi/litellm/litellm-env-secret/ANTHROPIC_API_KEY
      secretKey: ANTHROPIC_API_KEY
    - remoteRef:
        key: /mdapi/litellm/litellm-env-secret/LITELLM_MASTER_KEY
      secretKey: LITELLM_MASTER_KEY
