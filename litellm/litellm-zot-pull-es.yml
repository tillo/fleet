# Pull secret for zot.mdapi.ch, kept inside this bundle (rather than adding a
# block to the shared zot-pull-secrets bundle) to limit blast radius. Same
# Akeyless source and template. Do NOT also add `litellm` to zot-pull-secrets
# or two ExternalSecrets will fight over this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
  namespace: litellm
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: zot-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"zot.mdapi.ch":{"username":"zot","password":"{{ .password }}","auth":"{{ printf "zot:%s" .password | b64enc }}"}}}
  data:
    - remoteRef:
        key: /mdapi/zot/zot-auth/password
      secretKey: password
