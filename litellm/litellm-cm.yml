apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # --- local: one LM Studio on the laptop, reached via two NICs.
      #     api_base values are injected from Akeyless (see litellm-es.yml) so no
      #     internal hostname lands in this public repo. os.environ/ refs in
      #     api_base are resolved by LiteLLM (same as the documented Azure pattern).
      - model_name: local-wifi
        litellm_params:
          model: openai/qwen/qwen3-coder-30b   # provider=openai, model id as served by LM Studio
          api_base: os.environ/LMSTUDIO_WIFI_URL
          api_key: "lm-studio"                 # dummy; LM Studio ignores it
      # --- Anthropic tails (directly selectable, and used as fallbacks) ---
      #     Since 2026-08-18 these go through claude-shim (headless Claude Code
      #     on the Max subscription) instead of the pay-per-token API. The
      #     per-model request_timeout overrides the global 20s fail-fast, which
      #     is sized for the local LM Studio hops, not a real Claude answer.
      - model_name: opus
        litellm_params:
          model: openai/claude-opus-5
          api_base: http://claude-shim.litellm.svc.cluster.local:8085/v1
          api_key: "shim"
          request_timeout: 300
      - model_name: fable
        litellm_params:
          model: openai/claude-fable-5
          api_base: http://claude-shim.litellm.svc.cluster.local:8085/v1
          api_key: "shim"
          request_timeout: 300
      # --- public aliases: PRIMARY = wired; chain is defined in fallbacks ---
      - model_name: infra
        litellm_params:
          model: openai/qwen/qwen3-coder-30b
          api_base: os.environ/LMSTUDIO_WIRED_URL
          api_key: "lm-studio"
      - model_name: infra-fable
        litellm_params:
          model: openai/qwen/qwen3-coder-30b
          api_base: os.environ/LMSTUDIO_WIRED_URL
          api_key: "lm-studio"
      - model_name: local-only
        litellm_params:
          model: openai/qwen/qwen3-coder-30b
          api_base: os.environ/LMSTUDIO_WIRED_URL
          api_key: "lm-studio"

    litellm_settings:
      fallbacks:
        - infra:       ["local-wifi", "opus"]    # wired -> wifi -> Opus
        - infra-fable: ["local-wifi", "fable"]   # wired -> wifi -> Fable
        - local-only:  ["local-wifi"]            # wired -> wifi -> STOP (fails closed)
      num_retries: 0            # don't retry a dead endpoint; fall over immediately
      request_timeout: 20
      allowed_fails: 1          # one failure trips the cooldown
      cooldown_time: 30         # skip a downed path for 30s instead of re-timing-out

    general_settings:
      # Background health checks removed 2026-08-18: each check is a real paid
      # 1-token completion against the Anthropic deployments (~5k/day across
      # 2 pods), and probes of the normally-asleep wifi backend hang 600 s
      # (health checks ignore request_timeout). Failover is handled by
      # allowed_fails/cooldown_time on real traffic instead.
      master_key: os.environ/LITELLM_MASTER_KEY
