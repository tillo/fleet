apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  annotations:
    # Restart pods when the ConfigMap or the Akeyless-backed Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: litellm
  replicas: 2
  template:
    metadata:
      labels:
        app: litellm
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: litellm
              topologyKey: kubernetes.io/hostname
      containers:
      - name: litellm
        # Same tag, same IMAGE — the platform manifests are byte-identical to the
        # hand-pushed ones. The INDEX digest differs (zot serves no attestation
        # entries), so a pod imageID of sha256:e91dfbdd… is correct, not a bad pull.
        # Repointed 2026-10-01 off the hand-pushed `mdapi/litellm`
        # (no pull-through behind it: an uncached tag answers 404 MANIFEST_UNKNOWN)
        # onto the ghcr.io pull-through, which self-heals. Same remedy as openbao on
        # 2026-09-22, after `mdapi/python` was LOST the same way. Supply-chain: well
        # past the 1.82.7/1.82.8 malware. Pinned; no Keel auto-bump — Renovate owns
        # the bump as an MR. It looks the version up at ghcr.io (registryAliases) but
        # rewrites THIS line, so the tag is materialised by the pull-through on the
        # first pull — no mirror-refresh job. (An ignored MR is therefore silent; a
        # generic "pin behind upstream" backstop belongs with f/probe/image_policy_lint,
        # not as a per-image CronJob.)
        image: zot.mdapi.ch/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
        imagePullPolicy: IfNotPresent
        # NO --ui FLAG. It does not exist in v1.97.0 -- click rejects it with
        # "Error: No such option: --ui" and exits 2, i.e. both replicas
        # CrashLoopBackOff and llm.mdapi.ch goes dark. Verified in the running
        # image 2026-08-26. The admin UI is served unconditionally at /ui once a
        # master_key is set; what it needs is a DATABASE_URL, below.
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: litellm-env-secret
        env:
        # The admin UI's "Authentication Error, Not connected to DB!" is raised
        # behind `if prisma_client is None` in every management endpoint, and
        # prisma_client is only built when DATABASE_URL is present
        # (proxy_server.py:999-1001). Virtual keys / spend tracking need it too.
        # Secret + key are CNPG-generated (see litellm-pg.yml); same pattern as
        # jump/guacamole.yml, so no password round-trips through Akeyless.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-pg-app
              key: uri
        # ── OTLP span export to OpenObserve (2026-09-22) ────────────────────
        # litellm becomes the estate's FIRST span emitter. Before this there was
        # nothing producing traces anywhere: no collector, no Jaeger, no Tempo,
        # and no otlp/otel string in the whole fleet repo -- which is why
        # OpenObserve's Traces, Service Graph and Service Catalog were empty
        # rather than merely switched off.
        #
        # ⚠️ NO /v1/traces SUFFIX HERE. The OTel exporter appends the signal path
        # itself, so this must end at /api/<org>; writing the full path gives
        # .../v1/traces/v1/traces and every span 404s.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://openobserve.openobserve.svc.cluster.local:5080/api/default"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_SERVICE_NAME
          value: "litellm"
        # litellm exports DIRECT to o2, bypassing the collector's k8sattributes,
        # so it must state its own namespace (2026-09-23). Without it O2 files
        # litellm spans under identity set `default` and they never correlate
        # with litellm's pod_logs. litellm builds its Resource with
        # OTELResourceDetector, which reads this variable (checked in the image).
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME)"
        # OTEL_EXPORTER_OTLP_HEADERS arrives via envFrom -> litellm-env-secret
        # (Akeyless /mdapi/openobserve/otel/ingest-header). See litellm-es.yml.
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        # Probes added 2026-08-26 after the OOM outage. Their ABSENCE was why a
        # pod that never bound port 4000 kept its Service endpoint and reported
        # 1/1 READY for the whole incident -- `kubectl get pods` said healthy
        # while llm.mdapi.ch served 502.
        #
        # ⚠ NEVER probe /health. It is auth-gated AND calls perform_health_check,
        # i.e. a real billed completion against every deployment -- the exact
        # cost that got background health checks removed on 2026-08-18 (see the
        # general_settings note in litellm-cm.yml). A kubelet probing it every
        # 10s would reinstate that spend permanently and worse.
        # /health/liveliness | /health/liveness | /health/readiness are all
        # unauthenticated and cheap (measured 0.01-0.09s in-cluster).
        #
        # READINESS USES /health/liveliness, NOT /health/readiness -- deliberate.
        # /health/readiness reports {"status":"healthy","db":"connected"}, so it
        # would evict BOTH replicas from the Service whenever litellm-pg blips.
        # But completions do not need the DB (this proxy served them for 8 days
        # without one); only the admin UI and virtual keys do. Gating chat
        # traffic on Postgres would chain the gateway's availability to a
        # database it does not need -- the same mistake that cost Grafana ~32h
        # when its backend DB lived on ha-recorder-pg (see monitoring-grafana/
        # grafana-pg.yml). Port-bound is the right readiness signal here.
        startupProbe:
          httpGet: { path: /health/liveliness, port: 4000 }
          periodSeconds: 10
          timeoutSeconds: 5
          # 600s. litellm's import graph is slow and first boot also runs Prisma
          # migrations; generous here costs nothing because the startup probe
          # stops once it passes, and liveness does not run until it does.
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health/liveliness, port: 4000 }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /health/liveliness, port: 4000 }
          periodSeconds: 20
          timeoutSeconds: 5
          # ~60s of continuous failure before a restart -- conservative on
          # purpose so a transient stall does not turn into a restart loop.
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            # 256Mi was sized for the DB-less proxy. Attaching DATABASE_URL
            # (49de189) pulls in Prisma and its Rust query engine at startup and
            # the pods went straight into an OOMKill loop at the old 1Gi cap --
            # both replicas, exit 137, ~45s apart, llm.mdapi.ch 502 throughout.
            memory: 512Mi
          limits:
            memory: 2Gi
      # ── guardrail-rearm: keeps the DB guardrail registered in THIS pod ──────
      # litellm 1.103.2 only registers a DB-stored guardrail in a process's
      # in-memory registry via ProxyConfig._init_non_llm_objects_in_db, whose
      # sole caller add_deployment() is reached from startup ONLY inside
      # `if store_model_in_db is True:` (proxy_server.py ~10231). We run
      # store_model_in_db: false on purpose (see litellm-cm.yml — turning it on
      # makes litellm a second writer of config alongside Fleet), so a fresh
      # process NEVER loads the guardrail.
      #
      # ⛔ It fails with no signal at all: the cloud deployments keep naming it
      # in litellm_params.guardrails, and litellm keeps answering
      # `x-litellm-applied-guardrails: customer-data-guard` on every response,
      # because an unresolved guardrail name is ignored rather than rejected.
      # Measured 2026-10-05/06: worked from creation (09:55:09Z) until the
      # 14:00:50Z/14:01:48Z roll, then metadata.guardrail_information was JSON
      # null on 100% of rows (1885/1885 gateway-wide) for ~19h55m — every cloud
      # door unmasked. Found only because /guardrails/apply_guardrail 404'd.
      #
      # This sidecar closes it for good: it polls the registration state on
      # loopback and replays the DB row back through PUT /guardrails/{id}
      # whenever the process has lost it, so a roll can no longer disarm the
      # guardrail and neither can anything else. The script is in
      # litellm-guardrail-rearm-cm.yml; the reason it is a sidecar rather than a
      # lifecycle postStart hook is that a failing postStart KILLS the main
      # container, whereas this one cannot affect litellm's own lifecycle.
      #
      # ⚠ It must never exit: pod readiness is all-containers-ready, so a
      # crash-looping sidecar would pull a healthy litellm replica out of the
      # Service. Hence no probe, and a script that swallows every error.
      - name: guardrail-rearm
        image: zot.mdapi.ch/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
        imagePullPolicy: IfNotPresent
        # Same image as the proxy purely so there is no second artifact to pin,
        # patch or scan — it only needs /app/.venv/bin/python3, not litellm.
        command: ["/app/.venv/bin/python3", "-u", "/opt/guardrail-rearm/rearm.py"]
        env:
        # Deliberately secretKeyRef, NOT envFrom: the sidecar needs the master
        # key and nothing else. envFrom would hand it every provider credential
        # in litellm-env-secret for no reason.
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-env-secret
              key: LITELLM_MASTER_KEY
        # Every DB guardrail the sidecar must keep registered, as
        # "name=id,name=id". ONE ENTRY PER GUARDRAIL: the disarm failure this
        # sidecar exists for is per-process and per-NAME, so a guardrail left
        # out here is silently never re-armed after a roll. Add a guardrail to
        # the DB, add it here.
        #
        # gheim-pii-guard is the row created 2026-10-07 in
        # LiteLLM_GuardrailsTable. It masks request text with the gheim-ch-560m
        # detector served on mbp-mda over WireGuard. It is INERT: default_on is
        # false and no model names it, so it runs only when invoked explicitly
        # (POST /guardrails/apply_guardrail) until an operator scopes it. Its
        # custom_code carries the detector's bearer token and a fail-open shell,
        # which is why the row lives in the DB and never here.
        #
        # gheim-rt-guard is the row created 2026-10-08 in the same table. It is
        # gheim-pii-guard's ROUND-TRIP counterpart: it masks PII in request text
        # to `<PERSON_1>.<blob>` sentinels, where the blob is the CipherTrust
        # Manager ciphertext of the real value, and restores the real values in
        # the response. INERT for the same reason and by the same means
        # (default_on false, no model names it), so it runs only on an explicit
        # `guardrails: ["gheim-rt-guard"]` on a request or POST
        # /guardrails/apply_guardrail.
        #
        # ⛔ Its row's `mode` must be the LIST ["pre_call", "post_call"]: the
        # name being in this env only re-arms it after a restart, it does not
        # pick the hooks. With `pre_call` alone the response pass never runs and
        # a round-tripped caller reads sentinels back -- see litellm-cm.yml.
        #
        # ⛔ Never attach this AND gheim-pii-guard to the same model. They mask
        # the same spans by different means -- one writes a bare `<PERSON_1>`,
        # the other a blob-bearing sentinel -- so the text that reaches the
        # upstream, and what the response pass has to restore from, depend on
        # which of the two ran last. Attach one or the other, never both.
        #
        # ⛔ It also carries a credential in custom_code (the CipherTrust
        # service user's password and the detector bearer), so like the other
        # two the row lives in the DB and never here.
        - name: GUARDRAILS
          value: customer-data-guard=405df09d-2db5-465b-b617-b34406ca4fd0,gheim-pii-guard=35a0bb55-a813-4509-8173-d3bd13e19fc5,gheim-rt-guard=271fc01d-513b-4637-b091-5f81253572a7
        # The scalar pair the script falls back to when GUARDRAILS is empty or
        # unusable. Kept deliberately redundant so that reverting only one of
        # this Deployment / litellm-guardrail-rearm-cm.yml cannot leave the loop
        # idling with nothing to re-arm.
        - name: GUARDRAIL_NAME
          value: customer-data-guard
        # The row's own id, from LiteLLM_GuardrailsTable. Not a secret: it
        # appears in the admin UI URL and in this repo's history.
        - name: GUARDRAIL_ID
          value: 405df09d-2db5-465b-b617-b34406ca4fd0
        - name: CHECK_INTERVAL_SECONDS
          value: "300"
        volumeMounts:
        - name: guardrail-rearm
          mountPath: /opt/guardrail-rearm
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi
      imagePullSecrets:
      - name: zot-pull
      volumes:
      - name: config
        configMap:
          name: litellm-config
      # The re-arm script. A ConfigMap rather than a baked image so the logic is
      # reviewable here and a fix does not need a new image tag.
      - name: guardrail-rearm
        configMap:
          name: litellm-guardrail-rearm
