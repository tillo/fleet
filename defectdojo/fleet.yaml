# DefectDojo — the estate's findings store and the record of every risk
# acceptance (epic infra-7rog.4). The scanners (grype in CI, the runtime
# pod-image scan) keep producing reports; Windmill imports them through the
# API, and a "won't fix" becomes a DefectDojo risk acceptance with an owner
# and an expiry instead of a line in a .grype.yaml.
#
#  - Database: CNPG cluster defectdojo-pg (defectdojo-mdapi/), not the
#    chart's bundled Bitnami postgresql. Its app credential is the
#    CNPG-generated defectdojo-pg-app Secret.
#  - Secrets: none generated by the chart (createSecret / createValkeySecret
#    false); defectdojo-mdapi/ materialises them from Akeyless, so a helm
#    re-install cannot re-randomise DD_SECRET_KEY or the AES key that
#    encrypts stored tool credentials.
#  - Access: defectdojo.mdapi.ch behind oauth2-proxy-admin, then DefectDojo's
#    own login. The API is used in-cluster only (windmill → the django svc);
#    the NetworkPolicy in defectdojo-mdapi/ admits nobody else.
#  - DefectDojo's own notification channels stay off: the curator's digest
#    remains the one place a finding interrupts anybody.
defaultNamespace: defectdojo
dependsOn:
  - name: mdapi-prod-defectdojo-mdapi
helm:
  maxHistory: 25
  releaseName: defectdojo
  repo: https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
  chart: defectdojo
  version: 1.9.65
  values:
    createSecret: false
    createValkeySecret: false
    createPostgresqlSecret: false
    trackConfig: disabled

    host: defectdojo.mdapi.ch
    siteUrl: https://defectdojo.mdapi.ch
    # The in-cluster names Windmill and the blackbox probe call by.
    alternativeHosts:
      - defectdojo-django.defectdojo.svc.cluster.local
      - defectdojo-django.defectdojo.svc

    # Docker Hub through the pull-through mirror; tags follow the chart's
    # appVersion (3.4.304), so the chart pin is the image pin.
    images:
      django:
        image:
          registry: mirror.gcr.io
      nginx:
        image:
          registry: mirror.gcr.io
    imagePullPolicy: IfNotPresent

    admin:
      user: admin
      mail: tillo@mdapi.ch

    extraConfigs:
      DD_CSRF_TRUSTED_ORIGINS: https://defectdojo.mdapi.ch
      DD_SESSION_COOKIE_SECURE: "True"
      DD_CSRF_COOKIE_SECURE: "True"

    django:
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: nginx
        activateTLS: true
        secretName: defectdojo-tls
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
          nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
          # Scan reports are uploaded through the UI too.
          nginx.ingress.kubernetes.io/proxy-body-size: 64m
          # No auth-response-headers: DefectDojo authenticates its own
          # sessions and API tokens; a forwarded Authorization header would
          # only collide with `Authorization: Token …`.
      uwsgi:
        appSettings:
          processes: 2
          threads: 4
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi
      nginx:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi

    celery:
      beat:
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
      worker:
        # Deduplication of a large grype import runs here.
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi

    # The initializer Job is named with a render timestamp (staticName
    # false), so every upgrade gets a fresh Job and the immutable
    # spec.template never blocks a helm upgrade. keepSeconds 0 = no TTL: a
    # TTL-deleted Job would show up in Fleet as a Missing resource.
    initializer:
      keepSeconds: 0
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 768Mi

    dbMigrationChecker:
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          cpu: 200m
          memory: 200Mi

    postgresql:
      enabled: false
      auth:
        username: defectdojo
        database: defectdojo
        existingSecret: defectdojo-pg-app
        secretKeys:
          userPasswordKey: password
    postgresServer: defectdojo-pg-rw.defectdojo.svc.cluster.local

    # Celery broker only: queued tasks are re-creatable, nothing to persist.
    valkey:
      enabled: true
      auth:
        existingSecret: defectdojo-valkey-specific
        existingSecretPasswordKey: valkey-password
      image:
        registry: mirror.gcr.io
        imagePullPolicy: IfNotPresent
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
