apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  namespace: squid
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: squid
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: squid
    spec:
      containers:
        - name: squid
          # Track tag, not the `edge` alias: Canonical stopped rebuilding `edge` on
          # 2025-11-24, so its digest never moved and Renovate had nothing to offer.
          image: ubuntu/squid:7.2-26.04_edge@sha256:74a4935c1329cde41522d2fbc8351101b9ac3be0b5129c49e1803ff6df589027
          # The 26.04 rock's entrypoint is `pebble enter`, which keeps service output
          # in its own log, so access/cache logs never reach stdout. Run the script
          # pebble would wrap (it tails the log files to stdout, then execs squid).
          command: ["/usr/local/bin/entrypoint.sh"]
          args: ["-f", "/etc/squid/squid.conf", "-NYC"]
          resources: {}
          ports:
            - containerPort: 443
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: squid-conf
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
            - name: squid-cert
              mountPath: /etc/squid/ssl
              readOnly: true
            - name: squid-ldap
              mountPath: /etc/squid/ldap
              readOnly: true
      volumes:
        - name: squid-conf
          configMap:
            name: squid-conf
        - name: squid-cert
          secret:
            secretName: squid-cert
        - name: squid-ldap
          secret:
            secretName: squid-ldap
