apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: squid-ldap
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: squid-ldap
    creationPolicy: Owner
  data:
    # Squid's own read-only directory account (infra-r1xf.2); it used to read
    # the cn=admin password straight out of the openldap env secret.
    - remoteRef:
        key: /mdapi/ldap/service-accounts/svc-squid
      secretKey: ADMIN_PASS
