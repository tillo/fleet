## Nested under gitlab-runner-builder/ like ../fullbuild-mr: it deploys into that
## namespace and inherits its egress NetworkPolicy (netpol-gitlab-runner-builder),
## falco exception and PSA labels. No `namespace:` key, no fleet-paths entry.
defaultNamespace: gitlab-runner-builder
dependsOn:
  - name: mdapi-prod-external-secrets
  - name: mdapi-prod-gitlab-runner-builder
helm:
  maxHistory: 25
  releaseName: gitlab-runner-spot-fallback
  repo: https://charts.gitlab.io
  chart: gitlab-runner
  # Same chart line as gitlab-runner-builder.
  version: 0.95.1
  valuesFiles:
    - values.yml
