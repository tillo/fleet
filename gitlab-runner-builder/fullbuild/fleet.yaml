## Nested under gitlab-runner-builder/ so it deploys into THAT namespace and
## inherits what is scoped to it: the egress NetworkPolicy
## (netpol-gitlab-runner-builder), the falco exception
## `mdapi_ci_builder_tooling` and the PSA labels. No `namespace:` key — the
## parent bundle owns the namespace. Fleet discovers nested bundles by
## recursion, so fleet-paths.txt and the GitRepo need no entry.
defaultNamespace: gitlab-runner-builder
dependsOn:
  - name: mdapi-prod-external-secrets
  - name: mdapi-prod-gitlab-runner-builder
helm:
  maxHistory: 25
  releaseName: gitlab-runner-fullbuild
  repo: https://charts.gitlab.io
  chart: gitlab-runner
  # Same chart line as gitlab-runner-builder.
  version: 0.94.2
  valuesFiles:
    - values.yml
