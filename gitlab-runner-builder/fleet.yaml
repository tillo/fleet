defaultNamespace: gitlab-runner-builder
namespace: gitlab-runner-builder
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
dependsOn:
  - name: mdapi-prod-external-secrets
helm:
  maxHistory: 25
  releaseName: gitlab-runner-builder
  repo: https://charts.gitlab.io
  chart: gitlab-runner
  # Track the same major line as the in-chart runner shipped with GitLab.
  version: 0.94.3
  valuesFiles:
    - values.yml
