## Nested under gitlab-runner-builder/ like ../fullbuild: it deploys into that
## namespace and inherits its egress NetworkPolicy, falco exception and PSA
## labels. No `namespace:` key, no fleet-paths/GitRepo entry.
defaultNamespace: gitlab-runner-builder
dependsOn:
  - name: mdapi-prod-external-secrets
  - name: mdapi-prod-gitlab-runner-builder
helm:
  maxHistory: 25
  releaseName: gitlab-runner-fullbuild-mr
  repo: https://charts.gitlab.io
  chart: gitlab-runner
  # Same chart line as gitlab-runner-builder.
  version: 0.94.2
  valuesFiles:
    - values.yml
