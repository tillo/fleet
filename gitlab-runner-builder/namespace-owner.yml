## The one object of the namespace-owner bundle (see fleet.yaml): a bundle
## renders a Helm release, and this keeps that release non-empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: namespace-owner
  namespace: gitlab-runner-builder
data:
  owner: "fleet bundle gitlab-runner-builder (namespace, labels, PSA)"
  runners: "fullbuild/ (builder-full), fullbuild-mr/ (builder-full-mr)"
