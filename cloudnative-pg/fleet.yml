defaultNamespace: cnpg-system
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25
  releaseName: cnpg
  repo: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  # ⛔ CAPPED AT <0.30.0 (beads infra-zkak) — do not raise this by hand either.
  # 0.29.1 carries operator 1.30.1. The operator's CRD marks
  # `spec.backup.barmanObjectStore` deprecated with REMOVAL IN 1.31, and the chart
  # bump that delivers it (0.29 -> 0.30) is a MINOR that the blanket automerge rule
  # would otherwise merge unattended — deleting, in one go, both the backup stanza
  # gitlab-pg archives through and the API its recovery manifest reads.
  # The cap lives in renovate.json (`cloudnative-pg`, allowedVersions "<0.30.0");
  # raise this line only together with that rule, and only once every cluster has
  # migrated to the Barman Cloud Plugin.
  version: 0.29.1  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
