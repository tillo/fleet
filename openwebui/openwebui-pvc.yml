## Open WebUI's whole state: SQLite (users, chats, prompts, model presets),
## uploaded documents and the Chroma vector store, all under DATA_DIR.
## Without this the app is amnesiac — every rollout drops all accounts and
## history, which is how the first draft of this bundle was written.
##
## Backup class is DECLARED here, at definition time (2026-09-23): `weekly`,
## because chat.mdapi.ch accounts/history exist nowhere else (the enforcer's
## WEEKLY_NS reasoning). The recurring-job labels are exactly the set
## f/heal/backup_label_enforcer derives for that class, so the enforcer finds
## nothing to patch and stays a pure detector instead of racing Fleet.
##
## Local tier (2026-10-21, infra-j45a.1): also a member of the `daily` group, a
## daily Longhorn backup to the in-cluster RGW target with retain 5. The daily
## ceph_pvc_snapshot cannot serve a Longhorn PVC, and a Longhorn snapshot does
## not survive the daily trim (see longhorn/recurringjob-daily.yml). This label
## is orthogonal to the backup class, and the enforcer does not manage it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: openwebui
  labels:
    mdapi.ch/backup-class: weekly
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/weekly: enabled
    recurring-job-group.longhorn.io/daily: enabled
spec:
  storageClassName: harvester-longhorn-2replicas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # SQLite + config is tens of MB; the headroom is for RAG uploads and the
      # embedding cache, which is what actually grows.
      storage: 20Gi
