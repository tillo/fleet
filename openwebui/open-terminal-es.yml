## API key for Open Terminal, injected as OPEN_TERMINAL_API_KEY. The same key
## must be given to Open WebUI's terminal tool config (PVC-resident app DB, not
## reproducible from this repo).
##
## Minted 2026-09-26 (openssl rand -hex 32), value lives in Akeyless only:
##   akeyless create-secret -n /mdapi/openwebui/open-terminal-secret/OPEN_TERMINAL_API_KEY -v '<key>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal-secret
  namespace: openwebui
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: open-terminal-secret
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /mdapi/openwebui/open-terminal-secret/OPEN_TERMINAL_API_KEY
      secretKey: OPEN_TERMINAL_API_KEY
