## The terminal agent's working directory (/home/user). Scratch space, not
## precious. `none` is MEMBERSHIP of the `nobackup` group, not an absence of
## labels — an unlabelled Longhorn volume is auto-put in `default`. Declared so
## the enforcer stops misclassifying it as `weekly` (openwebui is in WEEKLY_NS)
## and so it stops tripping LonghornBackupClassUndeclared. No VolSync
## ReplicationSource either — losing it costs whatever an agent had
## half-finished, unlike openwebui-data (chats, accounts) which is weekly-backed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-terminal-home
  namespace: openwebui
  labels:
    mdapi.ch/backup-class: none
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nobackup: enabled
spec:
  storageClassName: harvester-longhorn-2replicas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
