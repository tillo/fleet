## Open-Terminal — shell access tool for chat.mdapi.ch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-terminal
  namespace: openwebui
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-terminal
  template:
    metadata:
      labels:
        app: open-terminal
    spec:
      containers:
      - name: open-terminal
        image: ghcr.io/open-webui/open-terminal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: open-terminal-secret
              key: API_KEY
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: open-terminal
  namespace: openwebui
spec:
  selector:
    app: open-terminal
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
