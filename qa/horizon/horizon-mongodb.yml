## Throwaway MongoDB for the QA Horizon: emptyDir, so every restart starts EMPTY again
## (synthetic data only; nothing worth keeping, nothing to leak). One mongod, one
## database per copy (`horizon`, `horizon_off`), the way qa/keycloak has one Postgres DB
## per copy: two Horizons on one database would interleave their sealed event chains.
##
## A single-member replica set, like prod's, because Horizon's config import/export needs
## multi-document transactions. The member is 127.0.0.1 and clients use
## directConnection=true, so no headless-Service membership dance (prod values.yml says
## why 8.0 needs one) and no rs-init Job.
##
## No auth, on purpose: a password would be a credential to store somewhere, and this repo
## is mirrored publicly. The guarantee is the network -- only the two Horizon pods may
## connect (horizon-netpol.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-mongodb
  namespace: horizon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: horizon-mongodb
  template:
    metadata:
      labels:
        app: horizon-mongodb
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          ## prod's pin (fleet horizon/values.yml)
          image: mongo:8.0@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              mongod --replSet rs0 --bind_ip_all --dbpath /data/db & pid=$!
              until mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done
              mongosh --quiet --eval '
                try { rs.status(); print("rs already initiated"); }
                catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"127.0.0.1:27017"}]}); print("rs initiated"); }'
              wait "$pid"
          ports:
            - {name: mongo, containerPort: 27017}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-mongodb
  namespace: horizon
spec:
  selector:
    app: horizon-mongodb
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
