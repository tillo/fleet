## Proof bundle for the QA GitRepo: ships a ConfigMap holding SYNTHETIC data, so a green
## bundle means the QA Fleet path works end to end and says nothing about prod.
##
## takeOwnership: the ConfigMap lived in the qa-baseline bundle until the paths were split
## (2026-11-23), so on the first sync after the split Fleet found it owned by the other
## release ("must equal bootstrap-qa-qa-synthetic-test"). Adopting is right here: it is the
## same object and the other bundle no longer declares it.
defaultNamespace: qa-synthetic-test
helm:
  takeOwnership: true
