## Throwaway Postgres for QA Keycloak: emptyDir, so every restart starts EMPTY again
## (synthetic data only; nothing worth keeping, nothing to leak).
##
## No password at all (trust auth), on purpose: a password would be a credential
## to store somewhere, and this repo is mirrored publicly. The guarantee is the
## network instead -- only the keycloak pods may connect (keycloak-netpol.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-pg
  namespace: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-pg
  template:
    metadata:
      labels:
        app: keycloak-pg
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: postgres
          image: zot.mdapi.ch/library/postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-h", "127.0.0.1"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: keycloak-pg-init
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-pg
  namespace: keycloak
spec:
  selector:
    app: keycloak-pg
  ports:
    - port: 5432
      targetPort: 5432
---
## keycloak-off gets its OWN database. Sharing one made JDBC_PING put both copies in one
## Infinispan cluster, whose JGroups traffic the fence (rightly) blocks: the instrumented
## copy reported "Keycloak cluster health check: DOWN" and never became Ready
## (measured 2026-11-24). Separate databases = two independent single-node Keycloaks,
## which is also the fair on/off comparison.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-pg-init
  namespace: keycloak
data:
  10-keycloak-off.sql: |
    CREATE DATABASE keycloak_off OWNER keycloak;
