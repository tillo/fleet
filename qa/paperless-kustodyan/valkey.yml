## Throwaway Valkey for QA paperless (no persistence, no password: reachable from the two
## paperless pods only, paperless-netpol.yml). Same image as prod's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-qa-valkey
  namespace: paperless-kustodyan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-qa-valkey
  template:
    metadata:
      labels:
        app: paperless-qa-valkey
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-qa-valkey
  namespace: paperless-kustodyan
spec:
  selector:
    app: paperless-qa-valkey
  ports:
    - port: 6379
      targetPort: 6379
