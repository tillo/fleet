## paperless-kustodyan in the QA cluster as PLAIN paperless-ngx, INSTRUMENTED for IAST
## (infra-7rog.41.10, user decision 2026-11-24 option b).
##
## ⛔ Data: synthetic only (qa/README.md). SQLite + media on emptyDir, a throwaway Valkey,
## documents typed in by the QA traffic (made-up text, *@example.invalid). The Kustodyan
## add-on is loaded but INERT: every KUSTODYAN_PROTECT_* is false, no sensitive tags, no
## searchable content, no RPS URL and no client id/secret -- the vendor RPS is never
## called (and could not be reached: egress is DNS, Valkey and the sink only). Prod is
## untouched by this bundle.
##
## The admin password is NOT in this (public) repo: Secret paperless-qa-admin, created in
## the QA cluster only by ~/src/spot-qa/paperless-qa-admin.py (random, stored nowhere).
## The tracer wraps granian because DD_IAST_ENABLED=true (the image's iast-exec);
## `paperless-off` is the same image without it -- what prod runs -- for overhead.
## Namespace and labels: qa/qa-baseline.
defaultNamespace: paperless-kustodyan
dependsOn:
  - name: bootstrap-qa-qa-baseline
helm:
  maxHistory: 5
