## Backstage in the QA cluster, INSTRUMENTED for IAST (infra-7rog.41 wave 1).
##
## ⛔ Data: synthetic only (qa/README.md). In-memory SQLite (the base app-config's
## database), a catalog of made-up entities from backstage-config.yml, a made-up
## signed-in user. No prod Secret, no ExternalSecret: the one env value that looks
## like a credential (GITLAB_TOKEN) is a fixed dummy so the config parses; nothing
## it could open is reachable from here (backstage-netpol.yml).
##
## The tracer runs because DD_IAST_ENABLED=true (the image's iast-entry wraps the
## CMD only then); `backstage-off` is the same image with the switch unset -- what
## prod runs -- as the overhead control. Namespace and labels: qa/qa-baseline.
defaultNamespace: backstage
## the namespace and its labels come from qa-baseline; deploying first would create it bare
dependsOn:
  - name: bootstrap-qa-qa-baseline
helm:
  maxHistory: 5
