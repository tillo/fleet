              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bussola-off
  namespace: bussola
spec:
  selector:
    app: bussola-off
  ports:
    - port: 8080
