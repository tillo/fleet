## Bussola in the QA cluster, INSTRUMENTED for IAST (infra-7rog.41.2).
##
## ⛔ Data: synthetic only (qa/README.md). The database is an emptyDir Postgres that
## starts empty; the only rows it ever holds are the ones the seed/ZAP traffic types
## into the app under made-up identities (*@example.invalid). Nothing is copied from
## prod, and no prod Secret is referenced: there is no ExternalSecret here at all.
##
## The tracer runs because DD_IAST_ENABLED=true (the image's app/avvio.py wraps
## uvicorn in ddtrace-run only then); it reports to the QA iast-sink and can reach
## nothing else (bussola-netpol.yml).
## No namespaceLabels: namespace `bussola` and its labels (incl. mdapi.ch/iast-tracer,
## which qa/iast-sink admits the trace port for) are declared in qa/qa-baseline/
## namespaces.yml, the one place labels for this namespace live.
defaultNamespace: bussola
helm:
  maxHistory: 5
