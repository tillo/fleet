## QA MCP fence: the two MCPs reach DNS, the QA Horizon and the IAST sink, nothing else (no
## internet: the vendor packages are baked into the image). Ingress: only QA traffic pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: evertrust-mcp
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  namespace: evertrust-mcp
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [horizon-mcp, stream-mcp]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              mdapi.ch/qa-traffic: "true"
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: horizon
          podSelector:
            matchLabels:
              app: horizon
      ports:
        - {protocol: TCP, port: 9000}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iast
          podSelector:
            matchLabels:
              app: iast-sink
      ports:
        - {protocol: TCP, port: 8126}
---
## QA traffic (MCP client calls): DNS and the two MCPs, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qa-traffic
  namespace: evertrust-mcp
spec:
  podSelector:
    matchLabels:
      mdapi.ch/qa-traffic: "true"
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [horizon-mcp, stream-mcp]}
      ports:
        - {protocol: TCP, port: 8080}
