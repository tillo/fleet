    mdapi.ch/iast-tracer: "true"
---
## The QA copy of Horizon (bundle qa/horizon, infra-7rog.41.12): its own MongoDB with
## synthetic data, a throwaway local Tink keyset, never prod Horizon or prod CipherTrust.
## Declared one MR BEFORE the app bundle (memory iast_canary_traps..., trap 5).
apiVersion: v1
kind: Namespace
metadata:
  name: horizon
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    mdapi.ch/qa: "true"
    mdapi.ch/iast-tracer: "true"
---
## The QA copies of horizon-mcp and stream-mcp (bundle qa/evertrust-mcp, infra-7rog.41.11),
