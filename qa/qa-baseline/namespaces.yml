## One bundle owns every QA namespace: since Fleet v0.16 a bundle deploying into a
## namespace resets its labels to its OWN namespaceLabels, so a second bundle touching
## these namespaces would strip PSA labels (fleet test test_namespace_labels_agree_across_bundles).
apiVersion: v1
kind: Namespace
metadata:
  name: qa-baseline
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: qa-synthetic-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
## Reserved for the iast-sink (bead infra-7rog.41.1) and the instrumented test app.
apiVersion: v1
kind: Namespace
metadata:
  name: iast
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    mdapi.ch/qa: "true"
---
## The QA copy of Bussola (qa/bussola). Declared HERE, not in that bundle, because
## since Fleet v0.16 a namespace's labels follow the LAST bundle that deployed into
## it: qa/iast-sink names the namespace `iast` without labels, so a second label list
## anywhere would make the two flip each other (tests/test_namespace_labels_agree_
## across_bundles.py). The tracer label lets qa/iast-sink admit its trace port.
apiVersion: v1
kind: Namespace
metadata:
  name: bussola
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    mdapi.ch/qa: "true"
    mdapi.ch/iast-tracer: "true"
---
## The QA copy of Backstage (qa/backstage, infra-7rog.41 wave 1). Labels live here for
## the same reason as bussola's above; the tracer label admits it to the sink's port.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    mdapi.ch/qa: "true"
    mdapi.ch/iast-tracer: "true"
---
## The QA copy of Keycloak (bundle qa/keycloak, epic infra-7rog.41): a TEST realm only,
## never the prod IdP. Labels here for the same reason as bussola's.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    mdapi.ch/qa: "true"
    mdapi.ch/iast-tracer: "true"
---
## The QA copy of paperless-kustodyan as plain paperless-ngx (bundle qa/paperless-kustodyan,
## epic infra-7rog.41). Root-in-container like prod (s6), so baseline enforce.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-kustodyan
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
