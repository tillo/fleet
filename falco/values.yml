## Falco — runtime security detection for mdapi-prod.
##
## PHASE 1: OBSERVE ONLY. No alerting, no dedicated OpenObserve output, no
## custom rule exceptions. The point of this phase is to find out what actually
## fires on this estate before deciding what deserves to page, and before
## writing exceptions for noise that may not materialise.
##
## Falco writes JSON to stdout, which rancher-logging-root-fluentbit already
## collects on all three nodes, so events reach OpenObserve through the existing
## pipeline. That is deliberate: it avoids putting an OpenObserve credential on
## three privileged pods just to learn what the default ruleset does here.
##
## Every value below was chosen against a measurement taken 2026-09-22, not
## against the chart defaults. See ~/studies/falco-integration-design-20260922.md.

## ⛔ image.registry is deliberately NOT set to zot.mdapi.ch.
##
## zot is a pull-through cache with an EXPLICIT per-upstream prefix allow-list
## (zot/zot-s3-config-es.yml), and `falcosecurity` is not in it — verified
## 2026-09-22, 0 occurrences against a control that returns 1, and there is no
## catch-all wildcard. Pointing at the mirror without adding the prefixes would
## give ImagePullBackOff on all three nodes.
##
## Phase-2 follow-up: add `falcosecurity/falco`, `falcosecurity/falcoctl` and
## `falcosecurity/falcosidekick` to zot's docker.io allow-list, then set
## image.registry here AND falcoctl.image.registry AND the sidekick's own —
## the top-level key covers only the falco image. Note the container plugin
## (ghcr.io/falcosecurity/plugins/plugin/container) is pulled by falcoctl as an
## OCI artifact at pod start, which bypasses the kubelet and the mirror
## entirely: it needs direct ghcr.io egress regardless.

driver:
  enabled: true
  ## modern_ebpf (CO-RE), NOT kmod, and not `auto`.
  ##
  ## Measured on qui/quo/qua: kernel 6.12.0-160000.28-default,
  ## /sys/kernel/btf/vmlinux present (5,307,251 bytes), CONFIG_DEBUG_INFO_BTF=y,
  ## CONFIG_BPF_SYSCALL=y, CONFIG_BPF_JIT=y, CONFIG_BPF_LSM=y.
  ##
  ## This is the single reason Falco fits this estate: there is no out-of-tree
  ## module to compile against each new kernel. Compare cephfs-kmod, which has
  ## to build ceph.ko from kernel-source on every node after every kernel bump.
  ## `auto` would probably resolve the same way, but a driver choice on a
  ## privileged agent should be stated, not inferred at runtime.
  kind: modern_ebpf
  modernEbpf:
    ## Drops `privileged: true` in favour of CAP_BPF, CAP_PERFMON,
    ## CAP_SYS_RESOURCE and CAP_SYS_PTRACE. Requires kernel >= 5.8; we are on
    ## 6.12. A new always-on agent on every node should hold the smallest
    ## privilege that actually works.
    leastPrivileged: true
    ## qui sustains ~65-70k syscalls/s (GitLab CI runner + KubeVirt VMs); the
    ## 8 MB default ring buffer overflows in ~hourly per-CPU bursts, dropping
    ## ~5% of events (FalcoSyscallDrops). 16 MB did not absorb them (drops
    ## recurred 09-29 as scattered 5-15 min bursts, not just the 02:00 backup
    ## window). 32 MB across 16 buffers (32 cores / cpusForEachBuffer 2) is
    ## 512 MB — still under the 1 Gi limit. Next lever if it returns:
    ## cpusForEachBuffer.
    bufSizePreset: 6

collectors:
  enabled: true
  containerEngine:
    enabled: true
    engines:
      ## Only the CRI engine is real here.
      ##
      ## Verified 2026-09-22 on the nodes: /run/containerd/containerd.sock does
      ## NOT exist. The kubelet talks to /run/k3s/containerd/containerd.sock
      ## (containerd 2.1.5-k3s1 under RKE2). Chart 9.2.0 does list the k3s path
      ## among the CRI defaults, so this would likely work unpinned — but it
      ## would work by probe order, and if it ever failed the symptom is silent:
      ## Falco keeps running and every event simply loses its pod, namespace and
      ## image. Pin the socket that was measured to exist.
      cri:
        enabled: true
        sockets:
          - /run/k3s/containerd/containerd.sock
      ## Everything below is absent on this estate. Left explicitly off so a
      ## future reader can see they were considered, not forgotten.
      docker:
        enabled: false
      podman:
        enabled: false
      containerd:
        enabled: false  # probes /run/host-containerd/... — not present here
      lxc:
        enabled: false
      libvirt_lxc:
        enabled: false
      bpm:
        enabled: false
  ## k8s-metacollector deliberately off in phase 1. Without it Falco falls back
  ## to container annotations, which still yield pod ID, name, namespace and
  ## labels — enough to attribute an event to a workload. Enabling it adds a
  ## cluster-wide component and another ghcr.io plugin pull; revisit only if an
  ## alert genuinely needs owner-workload fields.
  kubernetes:
    enabled: false

controller:
  kind: daemonset

## Tolerations are left at the chart defaults (master + control-plane
## NoSchedule). Verified 2026-09-22 that qui, quo and qua carry NO taints at
## all, so nothing is needed to reach all three today — but the defaults cost
## nothing and keep coverage if a control-plane taint is ever introduced. Note
## they are the only thing here still naming the legacy `master` label; that is
## the chart's, not ours, and it is additive rather than a selector, so it
## cannot shrink coverage the way a nodeSelector can.

## Priority class is left unset on purpose: mdapi-default is the cluster's
## GLOBAL-DEFAULT, so Falco inherits it. What matters is that Falco must NOT be
## moved into the shed-first mdapi-low bucket — a detector evicted under memory
## pressure is absent exactly when the cluster is behaving strangely.

resources:
  ## ~512Mi x 3 nodes. Booked deliberately: the cluster sits at 70/76/80% memory
  ## with swap 0 and a standing ~10 GiB N-1 shortfall, so this is roughly 15-20%
  ## of the gap that programme is trying to close. Not free, not disqualifying.
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

falco:
  ## JSON so the existing fluentbit -> fluentd -> OpenObserve path parses it
  ## into fields rather than shipping an opaque line.
  json_output: true
  buffered_outputs: true
  ## Chart default is `debug`. On three nodes running KubeVirt that is a
  ## firehose, and OpenObserve already uses ~19.1 GB/day of a 50 GB/day ceiling.
  ## `notice` is the phase-1 floor; revisit once the real event rate is known.
  priority: notice
  ## Dropped syscalls are BLIND WINDOWS, not a performance curiosity. Make Falco
  ## announce them rather than silently miss events it was deployed to catch.
  syscall_event_drops:
    threshold: 0.1
    actions:
      - log
      - alert
    rate: 0.03333
    max_burst: 10

falcoctl:
  artifact:
    ## Install the pinned ruleset once, at pod start.
    install:
      enabled: true
    ## ⛔ Chart default is TRUE, and it is wrong for this estate.
    ##
    ## `follow` runs a sidecar that re-pulls falco-rules:5 from ghcr.io every
    ## 168h and swaps the ruleset underneath a running Falco. That is a floating
    ## dependency inside an otherwise pinned, git-reviewed bundle: detection
    ## behaviour would change with no MR, no diff and no way to say afterwards
    ## which rules were live when an event fired — or failed to.
    ##
    ## Rules change when git says they change. Pinning the exact rules version
    ## (rather than the :5 major) is the logical next step once phase 1 has
    ## shown what the current set actually does here.
    follow:
      enabled: false

falcosidekick:
  enabled: true
  replicaCount: 2
  ## No outputs configured in phase 1 — see the header. Sidekick is deployed for
  ## its Prometheus metrics, which are exactly what is needed to baseline the
  ## per-rule event rate before writing a single alert threshold.
  ##
  ## Phase 3 adds the OpenObserve output (stream `falco`, which is also
  ## falcosidekick's own default name for it) behind an ExternalSecret. That
  ## secret must use a SCOPED OpenObserve ingest user, not the existing
  ## openobserve-admin credential — and, because a Fleet Helm bundle silently
  ## ignores loose manifests, the ExternalSecret has to live in a raw sibling
  ## bundle, not in this directory.
  webui:
    enabled: false

## Scrape Falco's own metrics.
metrics:
  enabled: true
serviceMonitor:
  create: true

## ── PHASE 2: exceptions, written from MEASURED events ────────────────────────
##
## Measured 2026-09-22 over 90 minutes across all three nodes: 3,367 matches of
## "Drop and execute new binary in container", which is priority 2 (CRITICAL).
## That one rule is the only thing standing between this estate and a usable
## severity alert, because everything else that fires is priority 4 or 5.
##
##   2,509 (74.5%)  gitlab-gitaly-0        /tmp/gitaly-<random>/gitaly-{git-prev,hooks}
##     ~680         runner-*-project-N-*   CI build tooling, many images
##     180          transmission-pia-*     /usr/bin/wg + /sbin/ip, 60 of each per hour
##
## 2026-09-28 follow-up: the CRITICAL alert (FalcoCriticalRuleFiring) fired on this
## rule again at ~2/h. Attributed the residual in OpenObserve — four more benign
## self-inflicted sources, none of them present in the 09-22 sample:
##
##   windmill-*             /tmp/rclone                 worker's on-demand rclone
##   flaresolverr-*         /app/chromedriver           its whole purpose
##   jump-bastion-*         /usr/bin/mosh-server        setcap copy-up, per connect
##   transmission-pia-*     /usr/bin/transmission-remote  port-manager, every 60s
##
## These are scoped the same way (image AND exact path) and joined into the same
## macro below, not appended as new rules.
##
## 2026-10-03 follow-up: the CRITICAL alert fired again, and OpenObserve incident
## 3KAijVwdaw1SlcXLboHrVQo7RB6 (46 alerts) attributed 196 events across FOUR
## rules — 154 "Terminal shell in container", 27 on this one, 10 "Linux Kernel
## Module Injection Detected", 5 "Remove Bulk Data from Disk". Every source was
## benign; none was a security incident, and the trigger was a mass container
## start (rook-ceph rolled, Falco's own DaemonSet restarted), not an intrusion.
## ⚠️ Read `FalcoNewRuleFired` with care: its expression compares series PRESENCE
## at two instants, so a Falco redeploy re-arms "novel" for every rule that has
## matched since. It fired here on volume, not on novelty.
##
## Four sources were new in this incident, on top of the six above:
##
##   openvpn-* (ns jump)     /usr/sbin/openvpn + /usr/sbin/xtables-nft-multi
##   mkguard, ws-escrow      ns gitlab-runner-builder — an exception REGRESSION
##   tdarr-*                 vendored ffprobe
##   formbricks-*            Prisma schema-engine, out of node_modules
##
## The other three rules got their own hooks below (Terminal shell, Remove Bulk
## Data, Kernel Module). All four are extension points upstream provides for
## exactly this purpose; no rule is disabled anywhere in this file.
##
## ⭐ The rule ships its OWN extension points and this uses them rather than
## appending exceptions or disabling anything: upstream defines
## `known_drop_and_execute_containers` (an empty list) and
## `known_drop_and_execute_activities` (a macro pinned to `never_true`) purely so
## adopters can narrow it. The macro is the right hook — the list would whitelist
## an entire IMAGE for every behaviour, whereas the macro can demand the image
## AND the exact path.
##
## ⛔ Scope, not disable. `insmod` or a dropped binary ANYWHERE else — including
## cephfs-kmod, jump-bastion, or a Gitaly container running something that is not
## its own bundled git — still fires at CRITICAL.
##
## ✅ Validated before commit against the real base ruleset inside a running pod
## (falco 0.45.0): `falco -V /etc/falco/falco_rules.yaml -V <this file>` ⇒
## schema_valid true, 0 errors, 0 warnings on BOTH files. `-V` is repeatable, so
## the base and the custom file are checked together — validating this file alone
## reports a phantom LOAD_UNUSED_MACRO on `known_drop_and_execute_activities`,
## because in isolation nothing references the hook it overrides.
##
## ✅ And checked against the incident's own 196 events: all 7 offending images
## now read covered, leaving only roundcube's single `dash` event by design.
customRules:
  mdapi-exceptions.yaml: |-
    ## ══ Terminal shell in container ══════════════════════════════════════════
    ## Rook's log-collector sidecar runs logrotate inline via `bash -x -e -m -c`
    ## on every container start (146 of this incident's 153 ceph events), and the
    ## rook-ceph-tools toolbox pod is an interactive shell by design (7).
    ## Together that is 153 of the 196 events in incident
    ## 3KAijVwdaw1SlcXLboHrVQo7RB6 — the single largest source. Scoped to the
    ## image AND the container name.
    ## ⛔ Roundcube's single `dash` event (ns mail) is deliberately NOT excepted:
    ## one dpkg trigger is not worth an exception on a mail container.
    - macro: mdapi_rook_ceph_shell
      condition: >
        (container.image.repository endswith "/ceph/ceph"
         and container.name in ("log-collector", "rook-ceph-tools"))

    - macro: user_expected_terminal_shell_in_container_conditions
      condition: (mdapi_rook_ceph_shell)
      override:
        condition: replace

    ## ══ Remove Bulk Data from Disk ═══════════════════════════════════════════
    ## Our own escrow cleanup shreds temp key files (~/.escrow-tmp,
    ## ~/.claude/jobs/*/tmp/akci/). Scoped to the image AND the exact binary, so
    ## a shred anywhere else in the bastion still fires at WARNING.
    - macro: mdapi_jump_bastion_escrow_shred
      condition: >
        (container.image.repository endswith "/mdapi/jump-bastion"
         and proc.exepath = "/usr/bin/shred")

    - macro: user_known_remove_data_activities
      condition: (mdapi_jump_bastion_escrow_shred)
      override:
        condition: replace

    ## ══ Linux Kernel Module Injection Detected ═══════════════════════════════
    ## Loading kernel modules IS the job of the PCI device plugin. This upstream
    ## hook is an image LIST rather than a macro, so it takes `items: append` —
    ## the exception is the image alone, not image+path, because the rule itself
    ## matches on the repository.
    - list: allowed_container_images_loading_kernel_module
      items: ["docker.io/rancher/harvester-pcidevices"]
      override:
        items: append

    ## ══ Drop and execute new binary in container ═════════════════════════════
    ## Gitaly unpacks its bundled Git into a per-start temp dir and execs it from
    ## there, so every git operation trips is_exe_upper_layer. This is how Gitaly
    ## is built, not a finding.
    ## ⚠️ The numeric suffix is random per start, hence the glob. If a Gitaly
    ## upgrade changes that layout the exception stops matching and the noise
    ## returns — which is the FAIL-LOUD direction, and visible on the dashboard.
    - macro: mdapi_gitaly_bundled_git
      condition: >
        (container.image.repository endswith "/cng/gitaly"
         and proc.exepath glob "/tmp/gitaly-*/gitaly-*")

    ## The transmission-pia pod runs two sidecars that apk-install their tools at
    ## startup (into the writable layer, hence EXE_UPPER_LAYER) and re-exec them
    ## on a timer:
    ##   • the PIA VPN sidecar re-execs WireGuard + iproute2 (wg/ip), 60 each/h;
    ##   • the port-manager sidecar (alpine:3, apk-adds transmission-remote +
    ##     wireguard-tools + openssh-client) calls `transmission-remote -p <port>`
    ##     every 60s to arbitrate the peer-port between PIA and the static 51413.
    ## openssh-client's `ssh` is deliberately NOT excepted: it only execs during
    ## the fallback probe, i.e. when PIA is already down, which is worth hearing.
    - macro: mdapi_transmission_pia
      condition: >
        (k8s.ns.name = "tv"
         and k8s.pod.name startswith "transmission-pia-"
         and proc.exepath in ("/usr/bin/wg", "/sbin/ip", "/usr/bin/transmission-remote"))

    ## GitLab CI runner pods. Downloading and running tooling IS what a build
    ## does, and the tool set changes every pipeline, so an exepath allow-list
    ## would need editing weekly.
    ## ⛔ This is the one exception here that trades away real coverage: Falco
    ## will no longer report a dropped binary inside a CI build. That is accepted
    ## deliberately — CI supply-chain risk is handled by PINNING the tools (see
    ## mdapi/ci-templates/scan.yml, which pins a release and verifies its
    ## sha256), not by a runtime detector watching an ephemeral pod.
    ## Scoped to the runner pods only; the rest of ns bootstrap still fires.
    - macro: mdapi_ci_runner_tooling
      condition: >
        (k8s.ns.name = "bootstrap"
         and k8s.pod.name startswith "runner-")

    ## jump-bastion's entrypoint `setcap`s mosh-server so the non-root `tillo`
    ## user can bind udp/443. setcap triggers an overlayfs copy-up, so the binary
    ## lands in the upper (writable) layer and every mosh connect reads as a
    ## dropped binary. The image itself is pre-baked; only the copy-up is at fault.
    - macro: mdapi_jump_bastion_mosh
      condition: >
        (container.image.repository endswith "/mdapi/jump-bastion"
         and proc.exepath = "/usr/bin/mosh-server")

    ## FlareSolverr's whole job is to drive Chromium at Cloudflare; the
    ## mdapi/flaresolverr rebuild replaces the vendored /app/chromedriver with the
    ## apt one and python execs it on every solve. EXE_UPPER_LAYER by construction.
    - macro: mdapi_flaresolverr_chromedriver
      condition: >
        (container.image.repository endswith "/mdapi/flaresolverr"
         and proc.exepath = "/app/chromedriver")

    ## Windmill workers download rclone to /tmp on demand and exec it for the
    ## S3/RGW/synology file-resource jobs (e.g. the offsite home-assistant-backups
    ## sync). The binary is fetched at runtime, hence EXE_UPPER_LAYER.
    - macro: mdapi_windmill_rclone
      condition: >
        (container.image.repository endswith "/windmill-labs/windmill"
         and proc.exepath = "/tmp/rclone")

    ## ── added 2026-10-03 (incident 3KAijVwdaw1SlcXLboHrVQo7RB6) ─────────────

    ## The openvpn sidecar (alpine, ns jump) apk-installs iptables + openvpn at
    ## entrypoint and re-execs them, so both land in the writable layer.
    - macro: mdapi_openvpn_alpine
      condition: >
        (k8s.ns.name = "jump"
         and k8s.pod.name startswith "openvpn-"
         and proc.exepath in ("/usr/sbin/openvpn", "/usr/sbin/xtables-nft-multi"))

    ## ⚠ REGRESSION FIX. mdapi_ci_runner_tooling above is scoped to
    ## `ns bootstrap AND pod startswith runner-`, but the CI job pods now also run
    ## as `mkguard` and `ws-escrow` in ns gitlab-runner-builder — so an exception
    ## written to cover CI build tooling stopped covering it, silently. The
    ## observed events are `openssl make c_rehash` / `update-ca-certificates`,
    ## i.e. a build compiling OpenSSL from source.
    ## ⛔ Same coverage trade-off as the bootstrap macro, and accepted for the same
    ## reason: this exempts a whole namespace, and CI supply-chain risk is handled
    ## by PINNING the tools (mdapi/ci-templates/scan.yml, sha256-verified), not by
    ## a runtime detector watching an ephemeral pod.
    - macro: mdapi_ci_builder_tooling
      condition: >
        (k8s.ns.name = "gitlab-runner-builder")

    ## Tdarr execs its vendored ffprobe (under assets/app/ffmpeg/linux_x64/) to
    ## probe media files. Its whole purpose; named as benign in the incident
    ## write-up but never actually excepted until now.
    - macro: mdapi_tdarr_ffprobe
      condition: >
        (container.image.repository endswith "/haveagitgat/tdarr"
         and proc.exepath endswith "/ffmpeg/linux_x64/ffprobe")

    ## Formbricks runs Prisma's schema-engine out of node_modules on migrate.
    - macro: mdapi_formbricks_prisma
      condition: >
        (container.image.repository endswith "/formbricks/formbricks"
         and proc.exepath glob "*/prisma/*/schema-engine-*")

    ## ── added 2026-10-04 (ledger alert:FalcoCriticalRuleFiring) ─────────────

    ## The bastion runs the interim image (apt at entrypoint), so anything built
    ## into /tmp sits in the writable layer. A `go test` sweep of the beads tree
    ## writes /tmp/go-build<N>/b<N>/*.test and execs each one: 74 CRITICAL matches
    ## in 24 minutes on 2026-10-04, which paged. Scoped to the image AND Go's own
    ## build-temp prefix, so a binary dropped anywhere else in the bastion
    ## (/tmp/evil) still fires. `startswith`, not glob: the paths are nested.
    - macro: mdapi_jump_bastion_gotest
      condition: >
        (container.image.repository endswith "/mdapi/jump-bastion"
         and proc.exepath startswith "/tmp/go-build")

    ## Compiling ESP32 firmware is the esphome pod's job. The ESP-IDF toolchain
    ## unpacks into /root/.cache/esphome/idf/tools/ and is exec'd from there:
    ## 3556 matches in 2 minutes on 2026-10-01 (gcc, cc1, as, ar, ld, cmake).
    - macro: mdapi_esphome_idf
      condition: >
        (container.image.repository endswith "/esphome/esphome"
         and proc.exepath startswith "/root/.cache/esphome/idf/tools/")

    ## Replace the upstream placeholder (`never_true`) with the scoped set above.
    - macro: known_drop_and_execute_activities
      condition: >
        (mdapi_gitaly_bundled_git
         or mdapi_transmission_pia
         or mdapi_ci_runner_tooling
         or mdapi_jump_bastion_mosh
         or mdapi_flaresolverr_chromedriver
         or mdapi_windmill_rclone
         or mdapi_openvpn_alpine
         or mdapi_ci_builder_tooling
         or mdapi_tdarr_ffprobe
         or mdapi_formbricks_prisma
         or mdapi_jump_bastion_gotest
         or mdapi_esphome_idf)
      override:
        condition: replace
