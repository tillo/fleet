defaultNamespace: falco
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # Kernel-adjacent eBPF agent: hostPID + hostPath mounts put it above the
  # `baseline` profile the rest of the estate warns on. Declare the intent here,
  # the same way cephfs-kmod does for its module loader, so this namespace stays
  # correct if PodSecurity is ever moved from warn/audit to enforce.
  pod-security.kubernetes.io/enforce: privileged
helm:
  maxHistory: 25
  releaseName: falco
  repo: https://falcosecurity.github.io/charts
  chart: falco
  version: 9.2.0  # app 0.45.0 — Renovate-managed (renovate.json, fleet manager)
  valuesFiles:
    - values.yml
