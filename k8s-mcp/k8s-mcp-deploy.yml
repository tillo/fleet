apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp
  template:
    metadata:
      labels:
        app: k8s-mcp
    spec:
      # The k8s-mcp SA (k8s-mcp-rbac.yml) — but NOT auto-mounted: the pod-wide
      # automount would hand the token to the caddy container too, which is the
      # one facing the network. The projected sa-token volume below goes into
      # kube-mcp-server only, at the path client-go's in-cluster config reads,
      # and the kubelet rotates it (client-go re-reads the file).
      serviceAccountName: k8s-mcp
      automountServiceAccountToken: false
      containers:
      - name: kube-mcp-server
        image: registry.mdapi.ch/mdapi/kubernetes-mcp-server:latest@sha256:38314712d952382ea6bd3935be8928639323c0ab867b40914cc2957105ed78b9
        imagePullPolicy: Always
        args:
          - --config
          - /etc/kubernetes-mcp-server/config.toml
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/kubernetes-mcp-server
          readOnly: true
        - name: sa-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true

      # Kept fully-qualified (library/caddy) because that is what LIVE holds:
      # Keel wrote the canonical form back on its last force-poll and the value
      # outlived the daemon (retired 2026-10-02). Declaring the short form
      # caddy:2-alpine would drift against live -> Fleet Modified.
      #
      # PINNED BY TAG + DIGEST since 2026-09-03 — do not go back to :2-alpine.
      # `2-alpine` is a major-line tag: it rolls across 2.x MINORS on its own
      # (it is how we got to 2.11.4). For a reverse proxy whose whole job is a
      # Caddyfile in the k8s-mcp-caddy ConfigMap that is a config contract — a
      # renamed/retired directive in a 2.x minor takes the MCP endpoint down
      # unattended, with nobody reading the release notes. Renovate owns this
      # now (renovate.json) and opens an MR with changelog for 2.12+.
      #
      # Mixed-lane pod: kubernetes-mcp-server above is Lane A (`:latest` + digest),
      # this container is Lane B (pinned tag + digest). The Keel annotations that
      # used to be what kept the Lane-A container updated are gone with the
      # 2026-10-02 retirement — Renovate reads BOTH refs out of this file now, so
      # the split is a comment-level distinction, not an annotation one.
      # Leave imagePullPolicy unset: a non-latest tag defaults to IfNotPresent,
      # which keeps this Lane B. Do NOT set Always (lint: pinned+Always re-pulls
      # every start and cannot boot when the registry is down).
      - name: caddy
        image: library/caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
        ## Explicit since 2026-09-28: live read `Always` while git declared nothing
        ## (ledger alert:ImagePolicyWarn).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: k8s-mcp-secrets
              key: AUTH_TOKEN
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi

      imagePullSecrets:
      - name: mdapi-registry

      volumes:
      - name: config
        configMap:
          name: k8s-mcp-config
      - name: sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: caddy-config
        configMap:
          name: k8s-mcp-caddy
