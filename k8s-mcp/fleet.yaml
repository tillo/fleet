# defaultNamespace (not namespace:) — the bundle carries cluster-scoped RBAC
# (k8s-mcp-rbac.yml: the read-only ClusterRoleBindings of the k8s-mcp
# ServiceAccount), which a pinned namespace: would silently drop
# (tests/test_namespaced_bundle_no_cluster_scoped.py).
defaultNamespace: k8s-mcp
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
targets:
  - clusterName: mdapi-prod
dependsOn:
  - name: mdapi-prod-cert-manager
  - name: mdapi-prod-external-secrets
helm:
  maxHistory: 25
