apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-mcp-secrets
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: k8s-mcp-secrets
    creationPolicy: Owner
  # No kubeconfig key any more: the server runs as its in-cluster ServiceAccount
  # (k8s-mcp-rbac.yml). The Rancher admin kubeconfig it used to carry
  # (/mdapi/k8s-mcp/KUBECONFIG) must not come back.
  data:
    - remoteRef:
        key: /mdapi/k8s-mcp/AUTH_TOKEN
      secretKey: AUTH_TOKEN
