## clamav — ONE shared clamd + freshclam for docker-mailserver (rspamd antivirus
## module) and the personal Nextcloud (files_antivirus, daemon mode), replacing the
## two private copies (~963 MiB inside the mail pod, ~0.93 GiB in
## nextcloud-aio-clamav). infra-8f4.50, user-approved 2026-11-07.
## ⛔ Tenants (envuassu, ...) keep their own ClamAV: clamav-netpol.yml admits only
## the two platform callers.
defaultNamespace: clamav
namespace: clamav
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
