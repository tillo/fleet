## clamd's TCP listener. Callers use the FQDN clamav.clamav.svc.cluster.local:3310
## (rspamd: mail/docker-mailserver/values.yml; Nextcloud: CLAMAV_HOST in
## nextcloud/nextcloud/kustomize). Who may connect is clamav-netpol.yml.
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: clamav
  labels:
    app: clamav
spec:
  selector:
    app: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
