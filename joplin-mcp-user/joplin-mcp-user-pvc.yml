## One SQLite file: each person's Joplin "applications" credential, Fernet-
## encrypted with STORE_KEY (joplin-mcp-user-es.yml) and keyed by an HMAC of
## their Keycloak subject, plus the pending Connect links (30 min). A few KB.
##
## Nothing here needs a backup: a lost store costs each person one more Connect
## + Authorise on notes.mdapi.ch, never a note. The credentials it held stay
## listed on their Joplin Applications page until they delete them there.
## storageClassName is explicit because two classes claim `(default)`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joplin-mcp-user-data
  namespace: joplin-mcp-user
  annotations:
    # The comment above is the decision; this is its machine-readable half.
    # f/probe/pvc_backup_coverage cannot read comments and paged on this PVC
    # (PvcBackupUncovered + PVMissingBackupStrategy, infra-r9mzd, 10-30..11-04).
    mdapi.ch/backup-exempt: "Connect credentials; a loss costs one re-Connect"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
