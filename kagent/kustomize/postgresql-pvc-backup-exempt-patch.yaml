# infra-r9mzd.16 (user decision 2026-11-04, option A): the chart-bundled
# Postgres holds only the session/task history of the read-only kagent agents;
# agent definitions are CRDs in the kagent-mdapi bundle. The history is
# regenerable by use, so the PVC is exempted from the backup-coverage alerts
# (PvcBackupUncovered / PVMissingBackupStrategy) instead of being VolSync'd.
# Strategic-merge adds only this annotation; namespace is explicit because the
# chart renders it and kustomize matches on it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kagent-postgresql
  namespace: kagent
  annotations:
    mdapi.ch/backup-exempt: "kagent session/task history only; regenerable, agents are CRDs"
