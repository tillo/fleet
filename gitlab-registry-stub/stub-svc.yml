# The NAME and PORT are the contract: they are what the chart renders as the registry
# api_url (gitlab.registry.api.url = http://<release>-registry.<ns>.svc:5000).
apiVersion: v1
kind: Service
metadata:
  name: gitlab-registry
  namespace: bootstrap
spec:
  selector:
    app: gitlab-registry-stub
  ports:
  - name: http
    port: 5000
    targetPort: 8080
    protocol: TCP
