## Read-only zot pull credential for CI JOB pods (infra-8f4.54 stage 5).
## The shared runner's [runners.kubernetes] image_pull_secrets (gitlab/values.yaml)
## names it, so a job whose `image:` or `services:` is the image the pipeline just
## built — now on zot.mdapi.ch (mdapi/<project> on main, mdapi-dev/<project>
## elsewhere), no longer on GitLab's registry — can be pulled. Users: backstage
## (dast service), keycloak/horizon-cli (smoke), node-debug (tools-run).
## Same source and shape as zot-pull-secrets/zot-pull-es.yml: the htpasswd user
## `zot`, which zot's accessControl allows to READ only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
  namespace: bootstrap
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: zot-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"zot.mdapi.ch":{"username":"zot","password":"{{ .password }}","auth":"{{ printf "zot:%s" .password | b64enc }}"}}}
  data:
    - remoteRef:
        key: /mdapi/zot/zot-auth/password
      secretKey: password
