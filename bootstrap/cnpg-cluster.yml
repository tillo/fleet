apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-pg
  namespace: bootstrap
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  ## switchover, NOT the default in-place restart: a restart-requiring change (e.g. a
  ## shared_preload_libraries edit) otherwise restarts the PRIMARY in place, a full DB
  ## outage (grafana-pg, 2026-09-24: ~3 min of connection refused). Switchover promotes
  ## the replica first, so only the switchover gap remains.
  primaryUpdateMethod: switchover

  ## ⭐ 2026-09-19: without this the CNPG collector is never scraped, so
  ## cnpg_collector_last_available_backup_timestamp does not exist for this
  ## cluster and NO backup-freshness alert can fire on it — on GitLab's own
  ## database. Three of the seven CNPG clusters were blind this way.
  ## See monitoring-rules/52-cnpg-backups.yml.
  monitoring:
    enablePodMonitor: true

  ## Keep primary + replica on different nodes. CNPG defaults to *soft*
  ## (preferred) anti-affinity, which can let both copies co-locate on one
  ## node during a rolling restart -- then a node loss takes out both and the
  ## replica buys zero protection (the trap ha-recorder-pg hit 2026-06-15).
  ## required is always satisfiable here (2 instances, 3 nodes).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: harvester-longhorn-2replicas
    size: 5Gi

  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
      effective_cache_size: 768MB
    # GitLab's required extensions, plus pg_stat_statements which our
    # bundled bitnami install already has loaded.
    shared_preload_libraries:
    - pg_stat_statements

    ## Synchronous replication so a CNPG failover is lossless (RPO 0): the
    ## primary waits for the standby to confirm each commit. Default async
    ## drops the last unreplicated writes on promotion. dataDurability:
    ## preferred falls back to async if the standby is down so GitLab writes
    ## never stall on a missing replica. (Mirrors ha-recorder-pg; CNPG >=1.25.)
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  ## Read-only monitoring login for the O2 DBM collector (openobserve/o2-dbm-collector.yml).
  ## pg_monitor = read pg_stat_* / pg_stat_statements; it cannot read table data.
  ## Password: Akeyless /mdapi/bootstrap/gitlab-pg-o2dbm/password.
  managed:
    roles:
      - name: o2_dbm
        ensure: present
        login: true
        inRoles: [pg_monitor]
        connectionLimit: 8
        passwordSecret:
          name: gitlab-pg-o2dbm

  bootstrap:
    initdb:
      database: gitlabhq_production
      owner: gitlab
      # CNPG auto-creates a Secret `gitlab-pg-app` with the generated
      # password. We read it post-deploy and stage it in akeyless / GitLab
      # values for the cutover.
      postInitTemplateSQL:
      - CREATE EXTENSION IF NOT EXISTS pg_trgm
      - CREATE EXTENSION IF NOT EXISTS btree_gist
      - CREATE EXTENSION IF NOT EXISTS amcheck
      - CREATE EXTENSION IF NOT EXISTS pg_stat_statements

  backup:
    barmanObjectStore:
      # WAL + base backups land in Garage on salt/pepper (independent of
      # the prod cluster's storage layer). Switched 2026-05-13 from
      # api.minio.home.tillo.ch as part of MinIO retirement (#19).
      destinationPath: s3://cnpg-gitlab-pg
      ## ⭐ 2026-09-19: moved off the salt/pepper Garage to the IN-CLUSTER Ceph
      ## RGW, as part of retiring both those hosts. This is the "local" half of
      ## the backup architecture: short-window PITR and granular restore live
      ## here; the offsite copy is a separate, client-side-encrypted channel.
      ##
      ## ⛔ NEW bucket name on purpose. The Garage bucket was `gitlab-pg-backup`;
      ## reusing it would mean a half-applied change (new store, stale
      ## endpointURL) kept writing to Garage and SUCCEEDED, silently. With a
      ## distinct name that mistake fails closed with NoSuchBucket.
      ##
      ## ⛔⛔ Changing destinationPath starts an EMPTY archive. WAL archiving
      ## alone is not a backup -- paperless-pg proved that with 33k objects and
      ## zero base backups. A one-shot Backup is taken immediately after this
      ## lands, and `lastSuccessfulBackup` is the only acceptable evidence.
      ##
      ## ⭐ TLS restored. !369 landed this store on plain http, which handed
      ## back exactly the property the Garage terminator was built for on
      ## 2026-09-05: pods on qui/quo/qua reach an RGW pod on another node across
      ## the physical LAN, over an UNENCRYPTED VXLAN overlay, and barman does not
      ## encrypt. "It stays in the cluster" was the wrong reassurance -- the
      ## cluster is three separate machines. RGW now carries its own house-PKI
      ## leaf (rook-ceph-objectstore-users/rgw-tls-cert.yml) and this dials it.
      endpointURL: https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443
      ## The CA here is the house chain (MDAPI Root + MDAPI Issuing CA 01), which
      ## is what a Horizon-issued RGW leaf chains to.
      ## ⭐ Renamed garage-transit-ca -> rgw-transit-ca on 2026-09-21, across all
      ## six namespaces at once. Contents byte-identical; the old name was the
      ## last thing on the estate still calling Garage a live dependency.
      ## ⭐ Changing this name costs NOTHING here: measured on CNPG 1.30, the
      ## instance pods do not reference the secret at all (the operator resolves
      ## endpointCA through the API at backup time), so there is no pod-spec
      ## change and no switchover.
      endpointCA:
        name: rgw-transit-ca
        key: ca.crt
      s3Credentials:
        accessKeyId:
          name: cnpg-gitlab-pg
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-gitlab-pg
          key: AWS_SECRET_ACCESS_KEY
        # Garage validates the SigV4 region scope on HeadBucket; barman
        # defaults to us-east-1, so the region must be set explicitly.
        region:
          name: cnpg-rgw-region
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
    retentionPolicy: "14d"
---
# Daily base backup at 03:00 Europe/Zurich.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitlab-pg-daily
  namespace: bootstrap
spec:
  cluster:
    name: gitlab-pg
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  immediate: false
---
## Password for the o2_dbm login (O2 Database Monitoring). CNPG requires a basic-auth
## secret whose username matches the role name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-pg-o2dbm
  namespace: bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: gitlab-pg-o2dbm
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          ## CNPG only re-reads a password secret it WATCHES: without this label a role that was
          ## reconciled before ESO created the secret stays "pending-reconciliation" forever
          ## (gitlab-pg / ha-recorder-pg, 2026-09-24), and a rotated password is never applied.
          cnpg.io/reload: "true"
      data:
        username: o2_dbm
        password: "{{ .password }}"
  data:
    - remoteRef:
        key: /mdapi/bootstrap/gitlab-pg-o2dbm/password
      secretKey: password
---
## Declares pg_stat_statements in `gitlabhq_production` (the O2 DBM receiver reads the view there).
## Adopting the existing database is safe: owner gitlab is the CURRENT owner (checked in
## pg_database), and databaseReclaimPolicy defaults to retain, so deleting this object
## never drops the database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gitlab-pg-gitlabhq-production
  namespace: bootstrap
spec:
  name: gitlabhq_production
  owner: gitlab
  cluster:
    name: gitlab-pg
  extensions:
    - name: pg_stat_statements
      ensure: present
