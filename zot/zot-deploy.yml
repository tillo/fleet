## 2026-06-05: storage moved from 20 Gi Longhorn PVC to external Garage S3
## (bucket `zot-images`, see zot-s3-config-es.yml). Deployment hardened for
## IR-critical role: 2 replicas, anti-affinity, RollingUpdate, PDB.
## The 4.3 GiB of existing images were rclone-synced to S3 prior to cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zot
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: zot
              topologyKey: kubernetes.io/hostname
      containers:
        - name: zot
          # Lane B (boot-safe, pinned 2026-06-12): zot IS the in-cluster registry,
          # so it must boot from each node's image cache without needing to pull
          # itself. Pinned to the running version (v2.1.17) + IfNotPresent.
          # Renovate bumps this tag via MR. Do NOT revert to :latest+Always.
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.23@sha256:b68f727fe35c1eb45b2ae91519dfb0e33192d69b5104882c3e7809b7146c4a02
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            ## Named so the VMPodScrape (zot-scrape.yml) can target `registry`
            ## rather than a bare number: /metrics is served on the SAME port
            ## and process (extensions.metrics + http port 5000), so there is no
            ## second listener to expose.
            - name: registry
              containerPort: 5000
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: cache
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /etc/zot/sync-creds.json
              subPath: sync-creds.json
              readOnly: true
            ## UI session cookie keys, shared by every replica (see the
            ## sessionKeysFile note in zot-s3-config-es.yml).
            - name: config
              mountPath: /etc/zot/session-keys.json
              subPath: session-keys.json
              readOnly: true
            - name: auth
              mountPath: /etc/zot/htpasswd
              subPath: htpasswd
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          ## startupProbe (2026-11-07, infra-8f4.54): zot opens :5000 only AFTER it
          ## has parsed the whole S3 store into its boltdb metaDB ("parsing
          ## storage and initializing"; the metaDB is on by htpasswd auth and
          ## lives in the emptyDir, so every NEW pod parses from scratch). Since
          ## the registry move doubled the store (13.5 -> 27 GiB, 78 repos) that
          ## first parse outlasts the liveness budget (30 s + 3 x 30 s): measured on
          ## the 19:09Z and 19:13Z rolls, each new pod was killed (exit 143) mid
          ## parse, and only its second start — resuming from the half-filled
          ## metaDB in the surviving emptyDir — came up (4 s). A startupProbe holds
          ## liveness off until the port opens: up to 30 x 10 s = 5 min.
          startupProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        ## Local cache + boltdb metadata. With S3 backend, the rootDirectory
        ## is only a working area / metadata index — losing it on restart
        ## just means the next push re-stages from S3. Per-replica.
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: config
          secret:
            secretName: zot-s3-config
        - name: auth
          secret:
            secretName: zot-auth
