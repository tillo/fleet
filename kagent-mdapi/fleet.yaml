# The estate's own kagent objects (epic infra-7rog.3): secrets, the two MCP
# tool servers behind agentgateway, the read-only `mdapi-ops` agent, the
# kagent.mdapi.ch Ingress and the namespace's NetworkPolicies. Raw sibling of
# the kagent/ helm bundle, which never applies loose manifests.
defaultNamespace: kagent
dependsOn:
  - name: mdapi-prod-kagent
  - name: mdapi-prod-external-secrets
