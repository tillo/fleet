defaultNamespace: kube-bench
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # kube-bench needs the host view (privileged + hostPath + hostPID) to audit
  # the node it runs on. This namespace is therefore deliberately privileged;
  # it carries exactly one workload and nothing user-facing.
  pod-security.kubernetes.io/enforce: privileged
