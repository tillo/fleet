apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-mirror
  namespace: openbao
spec:
  schedule: "7 * * * *"          # hourly at :07
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 2026-08-24 (infra-health approved, OpenBaoMirrorStale occ 4). The run is
      # ~370 serial items, each with up to 8 retries * 30 s timeout + backoff, so
      # anything that slows Akeyless or OpenBao pushes the run past a 600 s
      # deadline: 08-10, 08-20 (3 consecutive hourly hangs) and 08-22/23 (3 of 4)
      # all died DeadlineExceeded rather than finishing. Deadline 600 -> 1800 s
      # (still far inside the hourly cadence, and concurrencyPolicy Forbid keeps
      # runs from overlapping) and backoffLimit 1 -> 3 so a single bad hour
      # self-recovers. Detection is unchanged: the staleness alert already
      # covers a genuinely stuck mirror, and the script now logs per-phase
      # timings so the slow phase is identifiable instead of guessed at.
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: openbao-mirror
          restartPolicy: Never
          imagePullSecrets:
          - name: zot-pull
          containers:
          - name: mirror
            ## ⛔ Was zot.mdapi.ch/mdapi/python:3.12-alpine — a HAND-PUSH into
            ## zot's own storage, which had already been LOST: on 2026-09-22 zot
            ## answered NAME_UNKNOWN for mdapi/python, and registry.mdapi.ch (the
            ## upstream its `mdapi/**` sync prefix points at) does not have it
            ## either. This job survived only on containerd cache, exactly like
            ## mdapi/litellm did.
            ##
            ## ⭐ Repointed rather than just re-pushed. `library/**` is a real
            ## docker.io pull-through prefix, so this path SELF-HEALS: if zot's
            ## storage is migrated or GC'd again, the next pull re-syncs it. A
            ## re-push would only have recreated the same fragility.
            ## (mdapi/python was also restored, so nothing breaks mid-flight.)
            image: zot.mdapi.ch/library/python:3.12-alpine
            imagePullPolicy: IfNotPresent
            command: ["python3","/script/mirror.py"]
            resources:
              requests: {cpu: 100m, memory: 64Mi}
              limits: {memory: 256Mi}
            volumeMounts:
            - {name: script, mountPath: /script}
            - {name: creds, mountPath: /creds, readOnly: true}
            - {name: trust, mountPath: /trust, readOnly: true}
          volumes:
          - {name: script, configMap: {name: openbao-mirror-script}}
          - {name: creds, secret: {secretName: akeyless-mirror-creds}}
          - {name: trust, configMap: {name: mdapi-trust-bundle}}
