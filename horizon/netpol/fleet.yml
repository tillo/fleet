# Namespace-PINNED on purpose: this bundle holds namespaced Calico policies only.
# A cluster-scoped object committed here would be silently dropped
# (tests/test_namespaced_bundle_no_cluster_scoped.py). Kept apart from the horizon
# chart bundle one level up; Fleet recurses into horizon/, so no GitRepo path change.
defaultNamespace: horizon
namespace: horizon
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
