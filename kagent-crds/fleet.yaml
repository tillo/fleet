# kagent CRDs (Agent, ModelConfig, RemoteMCPServer, ... plus the kmcp CRDs the
# controller watches). Separate bundle so a chart upgrade never races its own
# CRDs; the kagent/ bundle dependsOn this one. Epic infra-7rog.
defaultNamespace: kagent
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: kagent-crds
  chart: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
  version: 0.10.6
