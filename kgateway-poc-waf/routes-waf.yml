## One host per WAF matrix row (~/kgw-poc/matrix.sh: waf-on, waf-off, waf-exc,
## waf-body). All resolve through the split-horizon *.kgw.mdapi.ch zone to .66.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waf
  namespace: kgw-poc
spec:
  parentRefs:
    - name: kgw
      sectionName: https
  hostnames: ["waf.kgw.mdapi.ch"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wafoff
  namespace: kgw-poc
spec:
  parentRefs:
    - name: kgw
      sectionName: https
  hostnames: ["wafoff.kgw.mdapi.ch"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wafexc
  namespace: kgw-poc
spec:
  parentRefs:
    - name: kgw
      sectionName: https
  hostnames: ["wafexc.kgw.mdapi.ch"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
