defaultNamespace: rook-ceph
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
# The operator bundle must be Active (CRDs registered) before the CephCluster CR
# applies. dependsOn references the OTHER bundle's name. Fleet derives bundle names
# from the GitRepo name + path. Verified 2026-06-14: GitRepo "mdapi-prod" (branch
# main, clusterGroup prod) names bundles "mdapi-prod-<dir>".
dependsOn:
  - name: mdapi-prod-rook-ceph
helm:
  maxHistory: 25
  releaseName: rook-ceph-cluster
  repo: https://charts.rook.io/release
  chart: rook-ceph-cluster
  # Lane B: keep the cluster chart pinned to the SAME minor as the operator.
  version: v1.20.7
  valuesFiles:
    - values.yml
# The Rook operator/CRD defaults many CephCluster /spec fields that aren't in the
# rendered manifest, which Fleet reports as drift (Modified). These are benign
# defaults (live config is correct) — ignore them in the diff (metallb pattern,
# observed 2026-06-14). Device list (/spec/storage/nodes) is intentionally NOT
# ignored so real disk changes still surface.
diff:
  comparePatches:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      namespace: rook-ceph
      name: rook-ceph
      # The chart renders these spec fields (from values cephClusterSpec) but Rook
      # omitempty-strips the default/false ones from the live CR, so each shows as
      # drift. Excluding them from the comparison on both sides suppresses that
      # (verified: dropping the exclusions made the CephCluster show 10 Modified
      # fields). Do NOT drop fields from values.yml to "fix" this: some defaults
      # differ from ours (e.g. Rook defaults dashboard.ssl=true, we set false).
      #
      # jsonPointers, NOT `operations: remove`. A remove op whose path is absent
      # FAILS, and Fleet (v0.15 jsonpatch normalizer) stops at the first failing op
      # and discards EVERY op for the object. 10 of these 14 are absent on the live
      # CR by design, so as remove ops none of them ever applied to the live side.
      # Drift suppression still worked (the desired-side strip carries it), but the
      # agent logged two errors per reconcile, ~150/h, a third of the infra-8f4.19
      # agent log storm. Each jsonPointer is applied independently and an absent
      # path is skipped silently. Never use `add value: false` instead (value is
      # string-typed; a bare bool fatals the gitjob).
      jsonPointers:
        - /spec/cleanupPolicy
        - /spec/healthCheck
        - /spec/network/connections/compression
        - /spec/network/connections/encryption
        - /spec/cephVersion/allowUnsupported
        - /spec/crashCollector/disable
        - /spec/dashboard/ssl
        - /spec/mgr/allowMultiplePerNode
        - /spec/mon/allowMultiplePerNode
        - /spec/storage/useAllNodes
        - /spec/skipUpgradeChecks
        - /spec/continueUpgradeAfterChecksEvenIfNotHealthy
        - /spec/removeOSDsIfOutAndSafeToRemove
        - /spec/upgradeOSDRequiresHealthyPGs
