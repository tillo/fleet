apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowflake-proxy
  namespace: snowflake-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snowflake-proxy
  template:
    metadata:
      labels:
        app: snowflake-proxy
    spec:
      containers:
      - name: snowflake-proxy
        image: thetorproject/snowflake-proxy:latest@sha256:045186c89b7b97e2a6c5d0f463583750ece9ccdf3461ed4f92f063f5ad65e958
        env:
        - name: TZ
          value: Europe/Zurich
        resources:
          requests:
            memory: 64Mi
            # Throttled repeatedly at 500m during relay-traffic bursts
            # (ContainerCpuThrottling ×4, 2026-08). Best-effort Tor relay:
            # give it headroom rather than let CFS throttle it. 10x
            # request:limit ratio kept. 2026-08-18, user-approved.
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 1000m
