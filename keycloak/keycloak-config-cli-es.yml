# Admin login for the keycloak-config-cli CronJob: the apibot automation account
# (master realm, manage rights on tilloch). The Akeyless items already exist and
# are the ones every other apibot caller reads; nothing secret lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config-cli-apibot
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: keycloak-config-cli-apibot
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /mdapi/keycloak/apibot/username
      secretKey: KEYCLOAK_USER
    - remoteRef:
        key: /mdapi/keycloak/apibot/password
      secretKey: KEYCLOAK_PASSWORD
