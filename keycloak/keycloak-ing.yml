apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    # Inject the RUM bootstrap. See rum-assets/ for the self-hosted bundle.
    # Accept-Encoding is cleared because sub_filter cannot match gzipped HTML;
    # it costs upstream compression on HTML only, not on assets.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding $rum_accept_encoding;
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '</head>' '<script defer src="https://rum.mdapi.ch/rum.js"></script></head>';
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  rules:
    - host: idp.mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: keycloak
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - idp.mdapi.ch
      secretName: keycloak-cert
