# Rook Ceph OPERATOR values — Lane B.
# The operator image is pinned by the chart. Since v1.21 the chart NO LONGER pins the CSI
# images: csi.<image>.repository/tag default to "" and the ceph-csi-operator falls back to
# its built-in set. Every csi.<image> left empty below floats with the operator.
# pullPolicy defaults to IfNotPresent.

csi:
  enableRbdDriver: true          # RWO block (StorageClass ceph-block)
  enableCephfsDriver: true       # RWX file  (StorageClass ceph-filesystem)
  enableNFSDriver: false         # not needed for k8s consumers; CephNFS export is separate
  provisionerReplicas: 2         # 3-node cluster
  # CSI plugin DaemonSet runs on every node; provisioners are HA at 2 replicas.
  #
  # ⛔ NEVER leave this unset. The chart renders the key unconditionally
  # (`ROOK_CREATE_CSI_OPERATOR_RESOURCES: {{ .Values.csi.createCsiOperatorResources | quote }}`),
  # so an unset value renders a NULL, which Helm applies as "key absent" while Fleet
  # renders it as "" — the two layers then disagree forever and the bundle reports
  # `configmap.v1 rook-ceph/rook-ceph-operator-config modified {"data":
  # {"ROOK_CREATE_CSI_OPERATOR_RESOURCES":""}}` on every sync. That kept
  # mdapi-prod-rook-ceph non-Ready from 2026-10-20, which blocked rook-ceph-cluster
  # and rook-ceph-csi-drivers via dependsOn and left the GitRepo ErrApplied.
  #
  # ⭐ "true" is also the CORRECT value, not just the stable one. Rook reads it via
  # CSIOperatorResourcesEnabled() (pkg/operator/ceph/controller/controller_utils.go,
  # v1.21.0) as `GetOperatorSetting(key, "true") == "true"` — so both ABSENT and ""
  # differ in meaning: absent falls back to the default "true", while "" compares
  # unequal and means FALSE. Had Fleet's patch ever landed as "", Rook would have
  # stopped creating/updating the CephConnection and ClientProfile CRs the
  # ceph-csi-operator needs (both exist in rook-ceph and are field-managed by rook).
  # Matches upstream's own deploy/examples/operator.yaml.
  createCsiOperatorResources: "true"

  # ⛔⛔ DO NOT pin cephcsi HERE — Rook v1.21.0 deletes it on every reconcile.
  # Setting csi.cephcsi.{repository,tag} makes the chart write
  # `plugin: quay.io/cephcsi/cephcsi:<tag>` into rook-csi-operator-image-set-configmap,
  # and the operator's resetStaleCSIImageSetConfigMap() (v1.21.0
  # pkg/operator/ceph/csi/controller.go) blanks every key whose `plugin` merely
  # STARTS WITH `quay.io/cephcsi/cephcsi:v3.17` — its idea of a leftover v1.20
  # default. A v3.17.1 pin matches that prefix, so the two layers fight forever:
  # Fleet writes, Rook clears ~80 s later (2026-10-22 06:40:02Z vs 06:41:22Z),
  # mdapi-prod-rook-ceph sits at Modified, rook-ceph-cluster is held by dependsOn
  # and the CephCluster never gets its new image.
  #
  # The pin lives in rook-ceph-csi-drivers/csi-image-set.yml instead, referenced by
  # OperatorConfig.imageSet — Rook only resets the chart's configmap, by literal
  # name, so that one is left alone. Empty values here fall through to the
  # ceph-csi-operator's own defaults, which is exactly what the operator asks for.
  #
  # ⛔ The pin itself is not optional: qui/quo/qua are Xeon E5-2667 v2 (Ivy Bridge:
  # AVX, no AVX2) and v3.18.x is Rocky 10 glibc → "CPU does not support x86-64-v3",
  # exit 127. Lift the pin only to a build that starts on an Ivy Bridge node.

# Operator-side ServiceMonitors (CSI metrics). Needs the Prometheus-operator CRDs
# (ServiceMonitor) already present via the rancher/VM monitoring stack.
monitoring:
  enabled: true

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    # 512Mi OOMKilled (2026-06-21); operator reconcile spikes with OSD count
    # (18 OSDs) during CRUSH/topology recompute. 1Gi ceiling.
    memory: 1Gi

# Keep the operator off any future non-storage/tainted nodes if the cluster grows.
# (3 bare-metal nodes today all carry storage, so no nodeSelector needed yet.)

# Rook's OBC `additionalConfig` allowlist. The chart default is "maxObjects,maxSize",
# and that default REJECTS every OBC declaring additionalConfig.bucketPolicy.
#
# ⭐ Widened 2026-10-07 to admit `bucketPolicy`. Rook gates which additionalConfig keys
# an OBC may set, and the check runs in Provision() AND Grant() alike (Rook v1.20.7,
# pkg/operator/ceph/object/bucket/util.go additionalConfigSpecFromMap, gated on
# opcontroller.ObcAdditionalConfigKeyIsAllowed):
#     error provisioning bucket: failed to process additionalConfig:
#     OBC config "bucketPolicy" is not allowed, requeuing
#
# ⛔ This was not a new-OBC problem. All seven cnpg-*-pg OBCs carry
# additionalConfig.bucketPolicy (fleet MR !596, 2026-09-29 — the "durable fix" for the
# RgwBucketUnswept incident) and had been failing identically ever since: 281 rejections
# each in the operator log, continuous from the operator's first reconcile. They are
# `Bound` — provisioned before the field was added — so nothing in status showed it. The
# declared policy never took effect, and the offsite grants were in fact being maintained
# by that window's manual re-grant and by f/heal/rgw_backup_bucket_grant, NOT by Rook.
# Making the declared config true is the point of this line. (beads infra-prji)
#
# Rook's own values.yaml documents this exact widening as the supported way to do it:
#   "maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle,bucketOwner"
# ⭐ Only bucketPolicy is added. bucketMaxObjects/bucketMaxSize/bucketLifecycle/bucketOwner
# stay disallowed: nothing in the estate sets them, and the chart calls them risky.
#
# ⚠️ EXPOSURE, accepted deliberately: an OBC author can now attach a bucket policy to
# their own bucket. The estate already depends on exactly that — with the policy declared,
# Rook re-applies it instead of deleting whatever it finds, which is what made the
# 2026-09-28 wipe possible. Leaving it undeclared is the worse half: an absent
# additionalConfig.bucketPolicy makes Rook DELETE the live policy.
# ⭐ Checked before flipping this: all 7 live policies contain exactly the single
# OffsiteSweepRead statement the OBCs declare and nothing else, so Rook's PutBucketPolicy
# diffs empty and is a no-op on them rather than a replacement that drops statements.
obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketPolicy"
