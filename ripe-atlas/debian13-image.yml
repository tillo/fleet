## Debian 13 (trixie) generic cloud image — boot disk for the RIPE Atlas
## software probe. The RIPE NCC ships official packages for Debian 11/12/13 and
## Enterprise Linux 8/9/10; other builds are community-supported.
##
## Harvester copies the qcow2 into a Longhorn backing image on first reconcile
## and never re-reads the URL. Re-importing mints a new image UID, and with it a
## new StorageClass name — see the pin in atlas-probe-vm.yml.
apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineImage
metadata:
  name: debian13
  namespace: atlas
  annotations:
    harvesterhci.io/storageClassName: harvester-longhorn-2replicas
spec:
  displayName: Debian-13-GenericCloud
  sourceType: download
  url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
