# PodBelowVpaFloor (infra-r9mzd.5): a running pod whose memory REQUEST sits below its
# VPA's lowerBound for 30 min — the pod was admitted unmutated (webhook down) or the VPA
# cannot apply its recommendation (single-replica Recreate). Off-mode VPAs are
# recommendation-only and must never fire. Pod -> Deployment is joined through the
# ReplicaSet name.
rule_files:
- monitoring-rules/80-vpa-admission.yml
evaluation_interval: 1m
tests:
- name: below-floor-pages-after-30m
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="cribl",pod="leader-abc12-xyz",owner_kind="ReplicaSet",owner_name="leader-abc12"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="cribl",pod="leader-abc12-xyz",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="cribl",pod="leader-abc12-xyz",container="leader",resource="memory",unit="byte"}
    values: 1073741824x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="cribl",verticalpodautoscaler="leader",target_kind="Deployment",target_name="leader",container="leader",resource="memory",unit="byte",update_mode="Recreate"}
    values: 2048000000x60
  alert_rule_test:
  - eval_time: 25m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts: []
  - eval_time: 40m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts:
    - exp_labels:
        namespace: cribl
        pod: leader-abc12-xyz
        container: leader
        resource: memory
        target_kind: Deployment
        target_name: leader
        verticalpodautoscaler: leader
        service: vpa
        severity: warning
        team: mdapi
        component: Platform
        statuspage: exclude
      exp_annotations:
        summary: "cribl/leader-abc12-xyz (leader) runs with memory request 1.074G, 20%+ below its VPA floor 2.048G"
        description: |
          The pod's memory request is more than 20% below the lowerBound of VPA cribl/leader
          (Deployment leader) and has been for 30 min. Either it was admitted while
          the VPA admission webhook was down (failurePolicy Ignore), or the
          updater cannot apply the recommendation (Recreate on a single replica:
          --min-replicas=2). If its memory limit is below the VPA upperBound it is
          at OOM risk under the load VPA measured.
          ⚠️ Requests trailing the floor by a few percent are floor DRIFT on a VPA the
          updater cannot converge, not a fault — that is why this needs 20% (rule comment).
          Check: kubectl -n cribl get pod leader-abc12-xyz -o jsonpath='{.metadata.annotations.vpaUpdates}'
          Fix: recreate the pod once, or move the VPA to InPlaceOrRecreate +
          updatePolicy.minReplicas: 1 (vpa-objects/vpa-auto.yaml header).
- name: minor-floor-drift-silent
  # The live case that made this a recurring O2 incident (2026-11-08): windmill-workers-native
  # was admitted at a 250Mi request and the VPA floor later drifted up to 283Mi — 12% under,
  # with a 2Gi limit against a 285Mi upperBound, so no OOM was possible. A single-replica
  # Recreate VPA can never converge (the updater runs --min-replicas=2), so ANY upward drift
  # of the smoothed floor leaves the pod under it. Drift is not the incident this alert exists
  # for: that is a pod admitted unmutated, which lands 1.5x-4x under (turtles 128Mi vs 512Mi).
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="windmill",pod="workers-native-f49df4445-qlmm6",owner_kind="ReplicaSet",owner_name="workers-native-f49df4445"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="windmill",pod="workers-native-f49df4445-qlmm6",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="windmill",pod="workers-native-f49df4445-qlmm6",container="windmill-worker",resource="memory",unit="byte"}
    values: 262144000x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="windmill",verticalpodautoscaler="workers-native",target_kind="Deployment",target_name="workers-native",container="windmill-worker",resource="memory",unit="byte",update_mode="Recreate"}
    values: 297160373x60
  alert_rule_test:
  - eval_time: 50m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts: []
- name: exactly-at-the-materiality-threshold-silent
  # The gap must be STRICTLY material: request < 0.8 * floor. A request of exactly 80% of the
  # floor is the boundary, and the boundary is silent (800 < 800 is false).
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="tv",pod="seerr-aaa11-bbb",owner_kind="ReplicaSet",owner_name="seerr-aaa11"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="tv",pod="seerr-aaa11-bbb",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="tv",pod="seerr-aaa11-bbb",container="seerr",resource="memory",unit="byte"}
    values: 800000000x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="tv",verticalpodautoscaler="seerr",target_kind="Deployment",target_name="seerr",container="seerr",resource="memory",unit="byte",update_mode="Recreate"}
    values: 1000000000x60
  alert_rule_test:
  - eval_time: 50m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts: []
- name: at-or-above-floor-silent
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="tv",pod="plex-def34-uvw",owner_kind="ReplicaSet",owner_name="plex-def34"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="tv",pod="plex-def34-uvw",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="tv",pod="plex-def34-uvw",container="plex",resource="memory",unit="byte"}
    values: 9000000000x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="tv",verticalpodautoscaler="plex",target_kind="Deployment",target_name="plex",container="plex",resource="memory",unit="byte",update_mode="Recreate"}
    values: 6400000000x60
  alert_rule_test:
  - eval_time: 50m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts: []
- name: off-mode-vpa-silent
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="db",pod="pg-1",owner_kind="StatefulSet",owner_name="pg"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="db",pod="pg-1",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="db",pod="pg-1",container="pg",resource="memory",unit="byte"}
    values: 100000000x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="db",verticalpodautoscaler="pg",target_kind="StatefulSet",target_name="pg",container="pg",resource="memory",unit="byte",update_mode="Off"}
    values: 900000000x60
  alert_rule_test:
  - eval_time: 50m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts: []
- name: statefulset-below-floor-pages
  interval: 1m
  input_series:
  - series: kube_pod_owner{namespace="db",pod="pg-1",owner_kind="StatefulSet",owner_name="pg"}
    values: 1x60
  - series: kube_pod_status_phase{namespace="db",pod="pg-1",phase="Running"}
    values: 1x60
  - series: kube_pod_container_resource_requests{namespace="db",pod="pg-1",container="pg",resource="memory",unit="byte"}
    values: 100000000x60
  - series: kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound{namespace="db",verticalpodautoscaler="pg",target_kind="StatefulSet",target_name="pg",container="pg",resource="memory",unit="byte",update_mode="Initial"}
    values: 900000000x60
  alert_rule_test:
  - eval_time: 50m
    groupname: platform.vpa-admission
    alertname: PodBelowVpaFloor
    exp_alerts:
    - exp_labels:
        namespace: db
        pod: pg-1
        container: pg
        resource: memory
        target_kind: StatefulSet
        target_name: pg
        verticalpodautoscaler: pg
        service: vpa
        severity: warning
        team: mdapi
        component: Platform
        statuspage: exclude
      exp_annotations:
        summary: "db/pg-1 (pg) runs with memory request 100M, 20%+ below its VPA floor 900M"
        description: |
          The pod's memory request is more than 20% below the lowerBound of VPA db/pg
          (StatefulSet pg) and has been for 30 min. Either it was admitted while
          the VPA admission webhook was down (failurePolicy Ignore), or the
          updater cannot apply the recommendation (Recreate on a single replica:
          --min-replicas=2). If its memory limit is below the VPA upperBound it is
          at OOM risk under the load VPA measured.
          ⚠️ Requests trailing the floor by a few percent are floor DRIFT on a VPA the
          updater cannot converge, not a fault — that is why this needs 20% (rule comment).
          Check: kubectl -n db get pod pg-1 -o jsonpath='{.metadata.annotations.vpaUpdates}'
          Fix: recreate the pod once, or move the VPA to InPlaceOrRecreate +
          updatePolicy.minReplicas: 1 (vpa-objects/vpa-auto.yaml header).
- name: admission-controller-single-replica-warns
  interval: 1m
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="kube-system",deployment="vpa-vertical-pod-autoscaler-admission-controller"}
    values: 2x10 1x50
  alert_rule_test:
  - eval_time: 20m
    groupname: platform.vpa-admission
    alertname: VpaAdmissionControllerDegraded
    exp_alerts: []
  - eval_time: 40m
    groupname: platform.vpa-admission
    alertname: VpaAdmissionControllerDegraded
    exp_alerts:
    - exp_labels:
        namespace: kube-system
        deployment: vpa-vertical-pod-autoscaler-admission-controller
        service: vpa
        severity: warning
        team: mdapi
        component: Platform
        statuspage: exclude
      exp_annotations:
        summary: "VPA admission controller has 1 available replica (want 2)"
        description: |
          One more node loss and the VPA mutating webhook (failurePolicy Ignore)
          admits every new pod at its chart defaults, unmutated — the 11-03 qua
          outage window. Check: kubectl -n kube-system get pods -o wide -l app.kubernetes.io/component=admission-controller
