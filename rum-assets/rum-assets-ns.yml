apiVersion: v1
kind: Namespace
metadata:
  name: rum-assets
  ## PSA warn+audit=baseline (2026-09-28, ledger alert:PsaLabelDrift). Declared on
  ## THIS object, not as fleet.yaml namespaceLabels: the bundle ships its own
  ## Namespace, and adding namespaceLabels made Fleet claim the namespace a second
  ## time ("namespace.v1 rum-assets is not owned by us", bundle Modified). Labels on
  ## a managed manifest are reconciled on every deploy, not only at creation.
  labels:
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
