## Self-hosted OpenObserve RUM assets for the public websites.
##
## ⛔ The SDK is VENDORED, not loaded from a CDN. These are public,
## customer-facing pages; a third-party <script> on them would be a
## supply-chain dependency on someone else's uptime and integrity. The bundle
## is @openobserve/browser-rum 0.4.2, taken from the npm registry and pinned
## here byte-for-byte.
##
## Served by a tiny read-only nginx at rum.mdapi.ch, and pulled in by a
## sub_filter injection on each site's Ingress — so no site's own HTML has to
## be rebuilt, which matters because the three targets have three different
## release paths (a fleet ConfigMap, a container image, and a Helm chart).
##
## ⚠️ rum.js carries the RUM client token. That token is PUBLIC by
## construction — a browser SDK cannot hold a secret, and OpenObserve already
## serves the same value from logs.mdapi.ch/config without authentication.
## What bounds abuse is the rate limit on /rum (openobserve/o2-rum-ing.yml),
## not the token's secrecy. It is substituted at deploy time from the
## openobserve-rum ExternalSecret rather than written here, so the publicly
## mirrored repo does not carry it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rum-assets
  namespace: rum-assets
data:
  rum-init.js: |
    // RUM bootstrap for the public mdapi.ch / envuassu.ch sites.
    //
    // Loaded by a sub_filter injection at the ingress (see each site's Ingress
    // annotation) so no site's own HTML has to be rebuilt to carry it.
    //
    // The bundle registers itself as window.OO_RUM (see the tail of
    // openobserve-rum.js: (0,i.Z)(s.J,"OO_RUM",$)). openobserveRum is accepted too
    // in case a future bundle renames it, so a rename degrades to "RUM off" rather
    // than a page error.
    (function () {
      try {
        var R = window.OO_RUM || window.openobserveRum;
        if (!R || typeof R.init !== 'function') { return; }
        // Correlation identity (2026-09-24): report the BACKEND WORKLOAD as `service`
        // and its namespace as global context `k8s_namespace` (O2 stores it as
        // context_k8s_namespace, which is in the k8s-namespace semantic group), so
        // O2 joins RUM -> ingress_access (service) -> pod_logs (service_name). Each
        // Ingress backend Service has the same name as its workload, so one name
        // joins both. The vhost stays available as context `site`.
        // Unknown hosts fall back to the hostname, the old behaviour.
        var ID = {
          'mdapi.ch': ['showcase', 'showcase'], 'www.mdapi.ch': ['showcase', 'showcase'],
          'envuassu.ch': ['envuassu-site', 'envuassu'], 'www.envuassu.ch': ['envuassu-site', 'envuassu'],
          'start.mdapi.ch': ['portal', 'portal'],
          'webmail.mdapi.ch': ['roundcube', 'mail'], 'webmail.dellambrogio.ch': ['roundcube', 'mail'],
          'cloud.mdapi.ch': ['nextcloud-aio-apache', 'nextcloud'], 'cloud.envuassu.ch': ['nextcloud-aio-apache', 'envuassu'],
          'idp.mdapi.ch': ['keycloak', 'keycloak'], 'login.envuassu.ch': ['keycloak', 'envuassu'],
          'gitlab.mdapi.ch': ['gitlab-webservice-default', 'bootstrap'],
          'windmill.mdapi.ch': ['windmill-app', 'windmill']
        };
        var id = ID[location.hostname];
        // start.mdapi.ch/request is the dellambrogio request page (its own Ingress), not the portal.
        if (location.hostname === 'start.mdapi.ch' && location.pathname.indexOf('/request') === 0) {
          id = ['dellambrogio', 'dellambrogio'];
        }
        R.init({
          clientToken: '__RUM_CLIENT_TOKEN__',
          applicationId: 'mdapi-websites',
          site: 'logs.mdapi.ch',
          organizationIdentifier: 'default',
          service: id ? id[0] : location.hostname,
          env: 'production',
          version: '1',
          apiVersion: 'v1',
          insecureHTTP: false,
          // Resource and long-task tracking are ON: these are content sites and
          // page-load performance is the whole reason to measure them.
          trackResources: true,
          trackLongTasks: true,
          trackUserInteractions: true,
          // ⛔ Session replay is OFF and must stay off. It records the DOM. These
          // pages are public, but the same bootstrap must never be pointed at
          // webmail or Nextcloud, where the DOM is somebody's mail and documents.
          sessionReplaySampleRate: 0,
          defaultPrivacyLevel: 'mask-user-input',
          // Small estate: sample everything. ~3k page views/day against a
          // 200 GB/day licence is not a sizing question.
          sessionSampleRate: 100,
          // RUM -> backend trace linking (DEMO 2026-09-24), per host.
          // ⛔ Same-origin ONLY: a traceparent header on a cross-origin request
          // turns it into a CORS preflight and can break the page. A host is
          // listed here only once its Ingress trusts incoming spans
          // (nginx.ingress.kubernetes.io/opentelemetry-trust-incoming-span).
          // Otherwise the SDK records trace ids that exist nowhere.
          allowedTracingUrls: ({ 'windmill.mdapi.ch': true })[location.hostname]
            ? [{ match: location.origin + '/api/', propagatorTypes: ['tracecontext'] }]
            : [],
          traceSampleRate: 100
        });
        if (typeof R.setGlobalContextProperty === 'function') {
          R.setGlobalContextProperty('site', location.hostname);
          if (id) { R.setGlobalContextProperty('k8s_namespace', id[1]); }
        }
        if (typeof R.startSessionReplayRecording === 'function') {
          // belt and braces: never start a recorder even if a default changes
        }
      } catch (e) { /* never break the page for telemetry */ }
    })();
