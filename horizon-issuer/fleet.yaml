# defaultNamespace only (NOT `namespace:`) — the chart installs cluster-scoped CRDs,
# which `namespace:` would forbid ("invalid cluster scoped object found").
defaultNamespace: horizon-issuer
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: horizon-issuer
  # Anonymous chart repo (trailing slash required for relative chart resolution).
  repo: https://repo.evertrust.io/repository/charts/
  chart: horizon-issuer
  version: 2.0.0
  valuesFiles:
    - values.yml
