apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trapeye-daemonset
  namespace: honeypot
spec:
  selector:
    matchLabels:
      app: trapeye-daemonset
  template:
    metadata:
      labels:
        app: trapeye-daemonset
    spec:
      priorityClassName: mdapi-low
      ## Only on nodes that hold a licensed decoy seat. TrapEye licenses decoys
      ## per instance and the plan is full (8 seats). A DaemonSet that lands on
      ## every node turns each new node into an agent the backend rejects
      ## (Authentication Error, no services served): quarto 2026-10-18..26.
      ## An agent cannot mint its own UUID; the console's Add decoy must
      ## register it. Keep this list, the volume items below and
      ## trapeye-es.yml in step. quarto runs on the seat the NodePort decoy
      ## held until 2026-10-27 (0 interactions since 07-29).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [qua, qui, quo, quarto]
      ## registry.mdapi.ch is private — without this the pull is anonymous and
      ## GitLab answers 403, leaving the new pod in ImagePullBackOff while the one
      ## it replaces keeps serving (so the decoy looks healthy and the certificate
      ## silently stays unpatched). See honeypot/mdapi-registry-es.yml.
      imagePullSecrets:
      - name: mdapi-registry
      containers:
      - name: trapeye
        image: registry.mdapi.ch/mdapi/trapeye-image:1.8.0-mdapi.328@sha256:a2b37be53b8f4caa039e16cd9c3eed71a230cdbb6ce74b5f4107a7e41046ae81
        imagePullPolicy: IfNotPresent
        ports:
        - name: ftp
          containerPort: 21
          hostPort: 21
        - name: ssh
          containerPort: 22
          hostPort: 2222
        - name: smtp
          containerPort: 25
          hostPort: 25
        - name: smtps
          containerPort: 465
          hostPort: 25465
        - name: http
          containerPort: 80
          hostPort: 8080
        ## Not 8443: RKE2's Traefik (dual mode, config.yaml.d/99-traefik.yaml)
        ## holds hostPort 8443 on every node. Not 9443 either: Horizon's `network`
        ## discovery campaign scans it, and a decoy there mints a new cert per restart.
        - name: https
          containerPort: 443
          hostPort: 4443
        - name: ldap
          containerPort: 389
          hostPort: 3268
        - name: ldaps
          containerPort: 636
          hostPort: 3269
        - name: rdp
          containerPort: 3389
          hostPort: 3389
        - name: postgresql
          containerPort: 5432
          hostPort: 5432
        ## Per-node fixed UUID. A DaemonSet pod can't select a per-node key
        ## through the downward API alone, so the UUID map is mounted as files
        ## (one per node name) and the entrypoint picks its own before exec'ing
        ## the vendor binary unchanged (/app/trapeye, image entrypoint "./trapeye"
        ## with workdir /app). Fails loudly rather than starting without a UUID —
        ## a missing key would otherwise let the agent mint a fresh one on every
        ## restart, which is exactly the churn this replaces. Adding a node needs a
        ## free seat: enrol it in the console (Add decoy -> Docker) or retire a
        ## decoy and reuse its UUID, then its key in Akeyless + the ExternalSecret,
        ## the volume item, and the affinity list.
        command: ["/usr/bin/sh", "-c"]
        args:
        - |
          TRAPEYE_UUID=`cat /etc/trapeye-uuid/$NODE_NAME 2>/dev/null`
          if [ -z "$TRAPEYE_UUID" ]; then
            echo "FATAL: no TRAPEYE_UUID mapping for node $NODE_NAME" >&2
            exit 1
          fi
          export TRAPEYE_UUID
          echo "trapeye: node $NODE_NAME -> UUID $TRAPEYE_UUID"
          exec /app/trapeye
        env:
        - name: TZ
          value: Europe/Zurich
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - secretRef:
            name: trapeye-env-secret
        volumeMounts:
        - name: trapeye-uuid
          mountPath: /etc/trapeye-uuid
          readOnly: true
        - name: trapeye-tls
          mountPath: /etc/trapeye-tls
          readOnly: true
      volumes:
      - name: trapeye-tls
        secret:
          secretName: trapeye-tls
      - name: trapeye-uuid
        secret:
          secretName: trapeye-uuid-secret
          items:
          - key: TRAPEYE_UUID_NODE_qui
            path: qui
          - key: TRAPEYE_UUID_NODE_quo
            path: quo
          - key: TRAPEYE_UUID_NODE_qua
            path: qua
          - key: TRAPEYE_UUID_NODE_quarto
            path: quarto
