## ClusterOutput → Cribl LogStream Leader's HTTP source on port 8080.
## Cribl pipeline drops the log body after pattern match (see step 6).
##
## NOTE: Cribl side must have an HTTP/REST source listening on :8080
## before this Output starts succeeding. If logs aren't arriving, check:
##   kubectl -n cattle-logging-system logs deployment/mdapi-fluentd | grep cribl

apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  annotations:
  name: cribl
  namespace: cattle-logging-system
spec:
  http:
    endpoint: http://logstream-leader-internal.cribl.svc.cluster.local:8080
    content_type: application/json
    json_array: true
    ## Fail-fast instead of hanging a flush thread forever on a wedged Cribl
    ## source. On 2026-06-11 a torn write corrupted the Cribl httpraw source
    ## persistent-queue; the source accepted connections but never processed
    ## the POST bodies. With no read_timeout (fluentd default is unlimited),
    ## the flush threads blocked indefinitely — no error, no retry — and the
    ## WAF/modsec feed silently stalled for ~44h. read_timeout forces those
    ## hung flushes to error and retry (and re-resolve to a healthy worker);
    ## open_timeout bounds the TCP connect.
    open_timeout: 5
    read_timeout: 30
    ## Buffer locally for up to 10s then flush; on Cribl outage chunks
    ## get retried up to retry_max_times with exponential backoff.
    ## flush_mode: interval is required for flush_interval to take effect
    ## (default 'lazy' uses timekey, which holds chunks for 10+ minutes).
    buffer:
      ## type file (was memory 512m) + retry_forever (was retry_max_times 5)
      ## — 2026-08-03→08-10 incident: the Cribl leader's config/PQ PVC moved
      ## to ceph-block on 08-03 exactly as the OSD-recreate campaign's
      ## backfill load started; httpraw sat in backpressure for days, the
      ## 512m MEMORY buffer overflowed (BufferOverflowError, drop_oldest
      ## had nothing droppable) and retry exhaustion discarded the rest — a
      ## week of the modsec/WAF feed lost. A file buffer on /buffers (node
      ## disk, ~360G free) turns Cribl backpressure into delay instead of
      ## loss; retry_forever keeps chunks until Cribl accepts them, with
      ## total_limit_size + drop_oldest as the bounded last-resort valve.
      ## (Previous history: 32m → 512m at chart 108.x when journald +
      ## kube-audit sources were added.)
      ## no explicit `path`: this output is instantiated once PER referencing
      ## ClusterFlow (all-logs + ingress-nginx-logs) and fluentd rejects two
      ## plugins sharing one buffer path — the operator auto-generates a
      ## unique /buffers path per instance when path is unset (configcheck
      ## proved the collision on 2026-08-10).
      type: file
      flush_mode: interval
      flush_interval: 10s
      ## flush_thread_count: parallelize HTTP POSTs to Cribl so chunk
      ## drain rate keeps up with the new combined volume
      ## (root pod logs + rke2-journald-aggregator + kube-audit forward).
      flush_thread_count: 4
      retry_type: exponential_backoff
      retry_forever: true
      retry_max_interval: 30s
      chunk_limit_size: 2m
      total_limit_size: 16g
      overflow_action: drop_oldest_chunk
