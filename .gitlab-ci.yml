# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# All jobs run on the in-cluster mdapi runner. Set it as the default so inline
# jobs (e.g. fleet-lint) that don't extend a shared template — which already
# carry `tags: [mdapi]` — aren't left untagged and stuck pending with no
# eligible runner. (The runner also accepts untagged jobs as of 2026-06-12, but
# tagging is the durable guarantee independent of runner registration state.)
default:
  tags:
    - mdapi

stages:
- lint
- build
- test
- deploy
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
fleet-lint:
  stage: lint
  image: python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
  # On-demand Renovate pipelines (see the `renovate` job) must run the renovate job
  # and nothing else: main was already linted by the push pipeline that produced it.
  rules:
  - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api"'
    when: never
  - if: '$CI_PIPELINE_SOURCE'   # always set, so this is the catch-all it reads like
  before_script:
  - pip install --quiet --no-cache-dir pyyaml
  script:
  - python3 lint.py

# Bundle validation — the three gates in tools/ci/ (read tools/ci/README.md first).
#
# Why this exists: until 2026-09-12 nothing in CI could see inside a Helm chart. lint.py
# says so itself — it only sees RAW workload manifests, "NOT workloads whose
# imagePullPolicy lives in Helm values". 33 of 160 bundles are chart-based and nothing
# had ever checked what they render to. This is a CI technique, not an Argo CD feature:
# plain `helm template` + `kubectl kustomize`.
#
# Binaries are pinned by version AND sha256 and verified before use — bump both together.
# Renovate custom.regex managers (renovate.json) own these pairs: kubeconform and fleet move
# version AND sha256 in one commit (github-release-attachments reads the release checksums).
# helm and kubectl are VERSION-ONLY there (no datasource can digest get.helm.sh or dl.k8s.io),
# so their MR is dashboard-approved and stays red until the sha is filled in — `sha256sum -c`
# below is that gate, not a formality. KUBE_VERSION tracks the CLUSTER and is NOT tracked.
# ⛔ Do NOT add `artifacts:` for the rendered directory. Three charts (horizon,
# victoria-metrics-operator, vpa) mint a fresh CA and private key on every render, so
# the output contains real private keys.
fleet-validate:
  stage: lint
  image: alpine:3@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
  # 140 s of chart rendering that an on-demand Renovate run has no reason to repeat.
  rules:
  - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api"'
    when: never
  - if: '$CI_PIPELINE_SOURCE'   # always set, so this is the catch-all it reads like
  variables:
    # Track the cluster. Currently v1.35.2+rke2r1.
    KUBE_VERSION: "1.35.2"
    HELM_VERSION: "v4.3.0"
    HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
    KUBECTL_VERSION: "v1.36.3"
    KUBECTL_SHA256: "ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336"
    KUBECONFORM_VERSION: "v0.8.0"
    KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    FLEET_VERSION: "v0.16.3"
    FLEET_SHA256: "f2238394dbf87a02ec8a7e74b6a3d9d8d3f60c81388516ed68046b9bc6f48d6a"
    VMUTILS_VERSION: "v1.155.0"
    VMUTILS_SHA256: "b6181fc16cf19835706ea5d67215eea56c1fe87350fdfd82a5ff803ea2c1a907"
  before_script:
  - apk add --no-cache python3 py3-yaml curl tar git
  - mkdir -p "$CI_PROJECT_DIR/.bin"
  - curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
  - echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
  - tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
  - mv /tmp/linux-amd64/helm "$CI_PROJECT_DIR/.bin/helm"
  - curl -fsSL -o "$CI_PROJECT_DIR/.bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
  - echo "${KUBECTL_SHA256}  $CI_PROJECT_DIR/.bin/kubectl" | sha256sum -c -
  - curl -fsSL -o /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
  - echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
  - tar -xzf /tmp/kubeconform.tgz -C "$CI_PROJECT_DIR/.bin" kubeconform
  - curl -fsSL -o "$CI_PROJECT_DIR/.bin/fleet" "https://github.com/rancher/fleet/releases/download/${FLEET_VERSION}/fleet-linux-amd64"
  - echo "${FLEET_SHA256}  $CI_PROJECT_DIR/.bin/fleet" | sha256sum -c -
  - curl -fsSL -o /tmp/vmutils.tgz "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/${VMUTILS_VERSION}/vmutils-linux-amd64-${VMUTILS_VERSION}.tar.gz"
  - echo "${VMUTILS_SHA256}  /tmp/vmutils.tgz" | sha256sum -c -
  - tar -xzf /tmp/vmutils.tgz -C /tmp vmalert-tool-prod
  - mv /tmp/vmalert-tool-prod "$CI_PROJECT_DIR/.bin/vmalert-tool"
  - chmod +x "$CI_PROJECT_DIR/.bin/"*
  script:
  # 0. repo invariants (tests/README.md). Cheapest gate — ~15s, no binaries, no network —
  #    so it runs first and fails before the 3-minute render. Each test encodes one
  #    incident that actually happened, and each was proven to FAIL when violated before
  #    it shipped.
  - python3 -m unittest discover -s tests -v
  # 0b. alert-rule unit tests (tests/rules/*.test.yml) against the PrometheusRules the
  #     cluster loads, with vmalert-tool -- the evaluator family of the cluster's vmalert.
  - VMALERT_TOOL="$CI_PROJECT_DIR/.bin/vmalert-tool" python3 tools/ci/rule-tests.py
  # 0c. every image digest this change ADDS must resolve to linux/amd64 at its registry
  #     (infra-r9mzd.23: an automerged caddy digest was an empty index, k8s-mcp down 3.5 h).
  #     The diff base must be in the (shallow) clone, hence the deepen.
  - git fetch -q --deepen=50 origin || true
  - python3 tools/ci/image-platforms.py
  # 1. every bundle must build offline, and fit in etcd
  - FLEET="$CI_PROJECT_DIR/.bin/fleet" python3 tools/ci/bundle-gate.py
  # 2. render the chart bundles (scratch dir holds generated Secrets — never an artifact)
  - rm -rf "$CI_PROJECT_DIR/.rendered"
  - HELM="$CI_PROJECT_DIR/.bin/helm" KUBECTL="$CI_PROJECT_DIR/.bin/kubectl" python3 tools/ci/render-bundles.py --output "$CI_PROJECT_DIR/.rendered" --kube-version "$KUBE_VERSION"
  # 3. schema-check the rendered output AND every tracked manifest
  - KUBECONFORM="$CI_PROJECT_DIR/.bin/kubeconform" python3 tools/ci/validate-manifests.py --rendered "$CI_PROJECT_DIR/.rendered" --kube-version "$KUBE_VERSION"
  after_script:
  - rm -rf "$CI_PROJECT_DIR/.rendered"

include:
  - project: mdapi/ci-templates
    file: /secret-scan.yml
    ref: main

# Pinned here rather than in ci-templates (which floats on :latest for ~24 projects):
# this job gates what public-mirror publishes, so the scanner that decides must not
# change under us without a commit. Tag AND digest; the digest is what is pulled.
# Renovate owns GITLEAKS_VERSION/GITLEAKS_SHA256 as ONE dependency (custom.regex,
# github-release-attachments), so the bump MR carries the matching sha. Version bumps are
# MR-only because this scanner must move with the image above.
secret-scan:
  extends: .secret-scan
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Skipped on an on-demand Renovate pipeline for the same reason as public-mirror:
  # it gates what gets published, and published pipelines do not run here at all.
  rules:
  - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api"'
    when: never
  - if: '$CI_PIPELINE_SOURCE'   # always set, so this is the catch-all it reads like

# Renovate — Lane-B image bumps + all Fleet Helm chart versions (config in
# renovate.json). Runs ONLY on a pipeline
# schedule, a manual web run, or an on-demand API pipeline (see the rules below),
# never on normal pushes/MRs. Minor/patch MRs
# auto-merge after their soak window (renovate.json, owner decision 2026-06-29);
# majors stay MR-only. Token from the masked RENOVATE_TOKEN CI variable (Akeyless
# source of truth: /mdapi/renovate/gitlab-token). Part of the 2026-06 image-policy work.
# The runner image is pinned and Renovate bumps it like any CI image; MR pipelines never
# run this job, so a bad runner release shows up as a failed scheduled run — revert the pin.
#
# Release notes: Renovate runs on GitLab but several Lane-B deps (zot, Technitium)
# have sourceUrl on github.com. Fetching their changelogs needs a github.com
# token — without it Renovate logs "Release Notes retrieval skipped … no github.com
# credentials". Renovate auto-reads the GITHUB_COM_TOKEN env var, sourced from the
# masked GITHUB_COM_TOKEN CI variable (read-only, no-scope PAT; Akeyless source of
# truth: /mdapi/renovate/github-com-token). No variables: entry needed — GitLab
# exposes masked CI variables to the job environment automatically.
#
# zot credentials: Bussola's image is pinned as zot.mdapi.ch/mdapi/bussola, and
# zot serves /v2/ behind Basic auth. Without a host rule for that host Renovate
# got a 401 and logged "Failed to look up docker package …: no-result" on every
# run from 2026-08-29 (when the Bussola pin landed) to 2026-09-03 — the pin was
# silently untracked the whole time. Read-only zot account, from the masked
# ZOT_TOKEN CI variable (Akeyless source of truth: /mdapi/zot/zot-auth/password).
renovate:
  stage: lint
  # One Renovate at a time. Runs can take 7-8 minutes, so without this a second
  # pipeline (the 4-hourly schedule landing on an on-demand run, or two hooks in a
  # row) starts a competing Renovate on the same branches and the two fight over
  # rebases. Queued pipelines wait their turn instead.
  resource_group: renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # ON-DEMAND RUN — created by POST /projects/26/pipeline from the Windmill
    # receiver f/gitlab/renovate_on_demand (GitLab project hook on this repo and on
    # mdapi/trapeye-image). Renovate only re-reads state, so the other four jobs are
    # `when: never` for this source+variable pair (fleet-lint, fleet-validate,
    # secret-scan, public-mirror) and this job is the whole pipeline: ~6 s of setup
    # instead of ~200 s of other people's linting, and no public mirror push.
    #
    # RENOVATE_SCOPE narrows the run to a single repo. Set from the triggering repo:
    # trapeye-image is 16 s of a 377 s run, so an event there does not need to pay
    # for the 361 s fleet pass. Left unset (events on this repo, which also own the
    # Dependency Dashboard) the run keeps the full default repo list below.
    - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api" && $RENOVATE_SCOPE'
      variables:
        RENOVATE_REPOSITORIES: $RENOVATE_SCOPE
    - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api"'
  image:
    name: ghcr.io/renovatebot/renovate:44.222.0@sha256:a8cb8222b49d15da701436954b7463427d535eae2203b294655c9a29675c47d1
    entrypoint: [""]
  tags:
    - mdapi
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.mdapi.ch/api/v4
    RENOVATE_AUTODISCOVER: "false"
    # This repo plus the image builders whose own pins Renovate owns. mdapi/trapeye-image
    # rebuilds the TrapEye decoy agent from an upstream ghcr tag held in a Dockerfile
    # ARG; bumping that ARG is its only version-specific edit, because the patch and the
    # injection offsets are re-derived from the binary at build time and both are
    # fail-closed. Its own renovate.json carries the rules; without listing it here
    # Renovate never looks at it, since autodiscover is off.
    # mdapi/backstage is the Backstage APP: upstream ships no runnable image, so the
    # Backstage version lives in that repo (backstage.json + @backstage/* ranges) and
    # its renovate.json groups each release into one MR. This repo then only moves
    # the image digest that build publishes.
    # mdapi/jump-bastion pins tools inside its image (node, gh, herdr, skopeo + Go
    # modules: ARG *_VERSION with `# renovate:` lines); this repo moves only its tag,
    # so without it those pins aged until a CVE alert (infra-ik4p.1).
    # mdapi/docker-mailserver the same for ClamAV and step-cli (ARG *_VERSION+SHA256);
    # its renovate.json automerges patches only, because a merge there pushes :latest
    # and this repo's digest MR for it automerges with no soak.
    # mdapi/renovate-config holds the shared presets the others extend; it is listed so
    # its CI validator image follows this job's pin (a preset is read live from its
    # main either way, listed or not).
    # The rest of the image builders surveyed on infra-ik4p, each extending
    # local>mdapi/renovate-config:image-repo with every `ARG *_VERSION` annotated, and
    # all MR-only (automerge false) until each earns graduation:
    # mdapi/chrony (chrony from gitlab.com tags; the runtime apk must match),
    # mdapi/kubernetes-mcp-server (the upstream server + the Go modules its Dockerfile
    # raises for CVEs), mdapi/stream-mcp and mdapi/horizon-mcp (npm: the MCP package,
    # supergateway, npm itself), mdapi/horizon-ciphertrust (maven, plus the tink
    # artifact from this GitLab's maven registry: see the maven host rule below), and
    # mdapi/wan-speedtest (the Ookla CLI, read from its download page).
    # mdapi/certspotter (the certspotter Go module, golang.org/x pins, tini from GitHub
    # releases; f/probe/renovate_pin_coverage flagged it first, infra-ik4p.11), and
    # mdapi/horizon-cli (the horizon-cli RPM on repo.evertrust.io: see the Evertrust
    # host rules below, infra-ik4p.15).
    # mdapi/roundcube (its build is apache/Dockerfile, so repin_sha256 has nothing to
    # re-pin there and says so, infra-ik4p.14).
    # Every other mdapi repo with a Dockerfile or a lockfile Renovate reads (infra-ik4p.28):
    # same renovate.json shape, MR-only, the graduation ladder empty. They were the
    # not-onboarded backlog of f/probe/renovate_pin_coverage; the floating FROMs it
    # flagged there were pinned first, so listing them does not page.
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH,mdapi/trapeye-image,mdapi/backstage,mdapi/jump-bastion,mdapi/docker-mailserver,mdapi/renovate-config,mdapi/chrony,mdapi/kubernetes-mcp-server,mdapi/stream-mcp,mdapi/horizon-mcp,mdapi/horizon-ciphertrust,mdapi/wan-speedtest,mdapi/certspotter,mdapi/horizon-cli,mdapi/roundcube,mdapi/autoconfig,mdapi/bussola,mdapi/coiffuredreams,mdapi/dellambrogio,mdapi/elco-remocon-net-appdaemon,mdapi/envuassu,mdapi/external-dns-unbound-webhook,mdapi/flaresolverr,mdapi/formbricks-kustodyan,mdapi/iomemory-vsl-loader,mdapi/ivodellambrogio,mdapi/joplin-mcp,mdapi/keycloak,mdapi/kustodyan-mcp,mdapi/mail-mcp,mdapi/mardi-gras,mdapi/memsearch,mdapi/mirror,mdapi/nameserver,mdapi/nextcloud-mcp,mdapi/ntppool-agent,mdapi/opennic-tier2,mdapi/paperless-kustodyan,mdapi/paperless-mcp,mdapi/portal,mdapi/rsync,mdapi/spider3,mdapi/threadfin,mdapi/tink-java-ciphertrust,mdapi/unbound,mdapi/vecchiserver,mdapi/znc,mdapi/node-debug
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@mdapi.ch>"
    # The maven rule: the platform token is a `hostType: gitlab` rule the maven
    # datasource does not use, so a private package on this GitLab's maven registry
    # (horizon-ciphertrust's tink-ciphertrust) would look up as no releases at all
    # (tests/test_renovate_maven_host_rule.py).
    # The two Evertrust rules: registry.evertrust.io (horizon-ciphertrust's Horizon base
    # image) and repo.evertrust.io (horizon-cli's RPM) answer 401 to anonymous lookups.
    # Without them Renovate gets no releases and the pins silently stop moving. One
    # read-only vendor PULL credential serves both, from the protected CI variables
    # EVERTRUST_REGISTRY_USER/PASSWORD (Akeyless /kyos/evertrust/registry/dockerconfigjson).
    # Each rule names its exact host and its one datasource
    # (tests/test_renovate_evertrust_host_rules.py, infra-ik4p.15).
    RENOVATE_HOST_RULES: '[{"matchHost":"registry.mdapi.ch","hostType":"docker","username":"renovate-bot","password":"$RENOVATE_TOKEN"},{"matchHost":"zot.mdapi.ch","hostType":"docker","username":"zot","password":"$ZOT_TOKEN"},{"matchHost":"gitlab.mdapi.ch","hostType":"maven","username":"renovate-bot","password":"$RENOVATE_TOKEN"},{"matchHost":"registry.evertrust.io","hostType":"docker","username":"$EVERTRUST_REGISTRY_USER","password":"$EVERTRUST_REGISTRY_PASSWORD"},{"matchHost":"repo.evertrust.io","hostType":"rpm","username":"$EVERTRUST_REGISTRY_USER","password":"$EVERTRUST_REGISTRY_PASSWORD"}]'
    # Indirected through a project variable on purpose. A job-level `variables:`
    # entry in this file OUTRANKS a schedule/manual pipeline variable, so with
    # `LOG_LEVEL: info` hardcoded here there was no way to get a debug run
    # without editing and merging this file first — verified 2026-09-03, when a
    # scheduled run with LOG_LEVEL=debug still reported `run at log level
    # "info"`. Default lives in the RENOVATE_LOG_LEVEL project variable (info);
    # to debug once, play the schedule with RENOVATE_LOG_LEVEL=debug and delete
    # the schedule variable only AFTER the job has finished. Schedule variables
    # are resolved when the JOB starts, not when the pipeline record is created,
    # so deleting straight after `play` silently gives a plain info run instead
    # (that cost two wasted runs on 2026-09-03).
    LOG_LEVEL: $RENOVATE_LOG_LEVEL
    # The ONLY commands a postUpgradeTask may run (global-only option; Renovate tests
    # the TEMPLATED command against these). Anchored at both ends, and the templated
    # part limited to a charset with no shell meaning:
    #   1. the GitLab chart re-vendor that renovate.json's patch-only rule runs
    #      (infra-4hna), digits only: `python3 /tmp/renovate-tools/vendor-gitlab-chart.py
    #      X.Y.Z` -- THIS repo's tools/vendor-gitlab-chart.py, installed by before_script
    #      (infra-ik4p.12; the script takes the checkout from the cwd);
    #      tests/test_gitlab_chart_is_renovate_reachable.py keeps it and the rule in step;
    #   2. the SHA re-pin the image repos run after every update, so a version+SHA
    #      pair lands green: `python3 /tmp/renovate-tools/repin_sha256.py
    #      {{{depName}}}` — THIS repo's tools/repin_sha256.py, which before_script
    #      installs there (infra-ik4p.1);
    #      tests/test_renovate_repin_sha256_is_allowed.py holds the depName charset.
    # A command runs with this job's token, and the list is global: it admits the
    # command for EVERY repo in RENOVATE_REPOSITORIES. So both entries name a copy
    # before_script installs from this checkout, never a repo-relative path: a listed
    # repo cannot swap in its own code. ⛔ Keep it that way for any new entry.
    # `expand: false` — GitLab must not read the `$` anchor as a variable reference.
    RENOVATE_ALLOWED_COMMANDS:
      value: '["^python3 /tmp/renovate-tools/vendor-gitlab-chart\\.py [0-9]+\\.[0-9]+\\.[0-9]+$", "^python3 /tmp/renovate-tools/repin_sha256\\.py [A-Za-z0-9@][A-Za-z0-9@._/:-]*$"]'
      expand: false
  before_script:
    # The two allow-listed scripts (entries 1 and 2 above): one copy each, from this
    # checkout, read-only, at the path the allow-list names.
    - install -D -m 0555 tools/vendor-gitlab-chart.py /tmp/renovate-tools/vendor-gitlab-chart.py
    - install -D -m 0555 tools/repin_sha256.py /tmp/renovate-tools/repin_sha256.py
    # This GitLab recomputes MR mergeability only ON DEMAND: after any push to
    # main, every open MR sits at detailed_merge_status=checking until something
    # asks for a recheck, so Renovate's nightly automerge pass saw the MRs as
    # unmergeable and never merged them (diagnosed 2026-07-03: four nights of
    # green, conflict-free minor-bump MRs left open; sidekiq shows
    # MergeRequestMergeabilityCheckWorker firing only for explicit API
    # rechecks). Poke a synchronous recheck for every open renovate/* MR and
    # give the workers a moment before Renovate evaluates automerge.
    - |
      node -e '
      const base = process.env.CI_API_V4_URL, proj = process.env.CI_PROJECT_ID;
      const h = {"PRIVATE-TOKEN": process.env.RENOVATE_TOKEN};
      (async () => {
        const mrs = await (await fetch(`${base}/projects/${proj}/merge_requests?state=opened&per_page=100`, {headers: h})).json();
        for (const m of mrs.filter(m => m.source_branch.startsWith("renovate/"))) {
          await fetch(`${base}/projects/${proj}/merge_requests/${m.iid}?with_merge_status_recheck=true`, {headers: h});
          console.log(`mergeability recheck poked: !${m.iid} ${m.source_branch}`);
        }
        await new Promise(r => setTimeout(r, 20000));
      })().catch(e => console.error("recheck poke failed (non-fatal):", e.message));
      '
  script:
    - renovate

# Public mirror — publishes a FILTERED snapshot of this repo to
# github.com/tillo/fleet. This replaced the GitLab push mirror (remote mirror 85,
# disabled 2026-09-05): a push mirror replicates refs, not subtrees, so it had no
# way to withhold the hosting-tenant namespace.
#
# The published repo is a single orphan commit — no history is exported, so nothing
# that ever sat in an old commit can leak later.
#
# Three fail-closed gates live in the script; read the header there before changing it.
# Onboarding a tenant = add its name to .mirror/private-names.txt and its directory
# to .mirror/private-paths.txt. Forget the second and GATE 1 fails this job.
#
# `needs:` makes the scan a structural precondition. Without it, only stage order kept
# this job behind secret-scan — one `needs: []` or stage edit away from publishing
# unscanned. GATE 3 then re-scans the exact staged tree with a gitleaks pinned here by
# version AND sha256 (same pattern as fleet-validate; bump with the secret-scan image).
#
# Inert until MIRROR_SSH_KEY exists (masked, protected file variable holding a
# deploy key with write access to the GitHub repo).
public-mirror:
  stage: deploy
  image: alpine:3@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
  rules:
  # An on-demand Renovate pipeline publishes NOTHING. Without this, every API run on
  # main would mint a fresh orphan snapshot and force-push it to the public GitHub
  # mirror, with an unchanged tree (the script has no "already identical" gate), and
  # would do it far more often than the 4-hourly schedule ever did.
  - if: '$RENOVATE_ON_DEMAND && $CI_PIPELINE_SOURCE == "api"'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main" && $MIRROR_SSH_KEY'
  needs: [secret-scan, fleet-lint, fleet-validate]
  variables:
    # The tag, v-prefixed: Renovate resolves releases/tags/<this value> literally. The
    # tarball name drops the v with ${GITLEAKS_VERSION#v} below.
    GITLEAKS_VERSION: "v8.30.1"
    GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  before_script:
  - apk add --no-cache git openssh-client bash grep findutils sed tar curl
  - curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
  - echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
  - tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
  - gitleaks version
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cp "$MIRROR_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
  - export MIRROR_REMOTE="git@github.com:tillo/fleet.git"
  - bash .mirror/publish-public-mirror.sh "$CI_PROJECT_DIR"
