# The EnvoyProxy CRD (gateway.envoyproxy.io) on its own: 1.59 MB of the Envoy
# Gateway CRD set's 2.4 MB, so with the other seven it does not fit one release
# Secret (1 MiB limit; see envoy-gateway-crds/fleet.yaml). Rendered by
# tools/vendor-envoy-gateway-crds.sh — never edit crds.yaml by hand;
# tests/test_envoy_gateway_crds_match_controller.py pins it to the controller.
defaultNamespace: envoy-gateway-system
helm:
  maxHistory: 25
  releaseName: envoy-gateway-crds-envoyproxy
