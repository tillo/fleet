apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwrt-repo
  labels:
    app: openwrt-repo
spec:
  # RWO and a single replica: the syncer is the only writer, and a release
  # directory is published by rename, which needs one filesystem view.
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
