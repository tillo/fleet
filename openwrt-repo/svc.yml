apiVersion: v1
kind: Service
metadata:
  name: openwrt-repo
  labels:
    app: openwrt-repo
  annotations:
    metallb.io/address-pool: prod-pool
    # First free address in prod-pool above the .40-.61 run and backlog's .63.
    metallb.io/loadBalancerIPs: 192.168.1.64
spec:
  type: LoadBalancer
  loadBalancerClass: metallb
  # ⛔ This is the access control, not a performance knob. Local keeps the
  # client's real source address on the packet, which is the only thing the
  # pod's nginx allowlist can trust; under Cluster policy the source is SNAT'd
  # to whichever node forwarded it and every client looks identical. It is also
  # what makes an ingress -- and therefore a forgeable X-Forwarded-For -- both
  # unnecessary and ineffective here (fleet.yaml says why).
  externalTrafficPolicy: Local
  selector:
    app: openwrt-repo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
