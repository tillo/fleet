# Read-only project token on mdapi/openwrt (project 33): read_api to list
# package versions, read_package_registry to download them. Nothing else -- it
# cannot write, cannot push, and cannot see another project.
#
# The syncer pulls from the forge rather than CI pushing into the cluster, which
# is why this credential points the way it does: the cluster holds a reader, and
# GitLab CI holds no cluster access at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwrt-repo-gitlab-token
spec:
  refreshInterval: 1m0s

  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless

  target:
    name: openwrt-repo-gitlab-token
    creationPolicy: Owner

  data:
    - remoteRef:
        key: /mdapi/openwrt/repo-mirror-token
      secretKey: token
