apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwrt-repo
  labels:
    app: openwrt-repo
spec:
  replicas: 1
  # The PVC is RWO and the syncer publishes releases by renaming directories
  # into place; two pods on two nodes would be two filesystems, not two views
  # of one. Roll forward, never surge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwrt-repo
  template:
    metadata:
      labels:
        app: openwrt-repo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ceph-block hands the volume over owned by root; both containers run as
        # 101 so a chown at start is the only thing that needs privilege. No
        # fsGroup: this volume is a single writer's store, not a shared group
        # tree, and the chown is one predictable step instead of a kubelet
        # recursive policy applied on every mount.
        - name: prepare
          image: docker.io/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "chown -R 101:101 /srv"]
          volumeMounts:
            - name: repo
              mountPath: /srv
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repo
              mountPath: /srv
              readOnly: true          # the web tier never writes
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
        - name: syncer
          image: docker.io/library/python:3.13-alpine@sha256:2dd78ad5cf13a0b68f5134dc49aa9950203a8cf4b7463431b9f3b398287c5059
          command: ["python3", "/scripts/sync.py"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GITLAB_URL
              value: https://gitlab.mdapi.ch
            - name: GITLAB_PROJECT_ID
              value: "33"
            - name: SRV_DIR
              value: /srv
            # Declared here rather than only defaulted in sync.py: this is the
            # one value that decides which branch's build the router is offered,
            # so a rename should be a visible one-line diff, not a hidden edit.
            - name: PROD_REF
              value: openwrt-25.12-tillo
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openwrt-repo-gitlab-token
                  key: token
          volumeMounts:
            - name: repo
              mountPath: /srv
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: openwrt-repo
        - name: nginx-conf
          configMap:
            name: openwrt-repo-nginx
        - name: scripts
          configMap:
            name: openwrt-repo-sync
