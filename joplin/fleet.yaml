defaultNamespace: joplin
namespace: joplin
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
dependsOn:
  - name: mdapi-prod-cert-manager
helm:
  maxHistory: 25
# Expected drift between fleet manifest and live state:
#   1. VPA (mode=Auto) writes resources.requests/limits onto running
#      pods after start.
# The image is deliberately NOT stripped: git carries the resolved digest
# (Renovate Lane A), so an image difference is a real change that must roll.
diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: Deployment
    name: postgres
    namespace: joplin
    operations:
    - {"op": "remove", "path": "/spec/template/spec/containers/0/resources"}
  - apiVersion: apps/v1
    kind: Deployment
    name: joplin-mcp
    namespace: joplin
    operations:
    - {"op": "remove", "path": "/spec/template/spec/containers/0/resources"}
  - apiVersion: apps/v1
    kind: Deployment
    name: joplin
    namespace: joplin
    operations:
    - {"op": "remove", "path": "/spec/template/spec/containers/0/resources"}
