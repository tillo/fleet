defaultNamespace: macos-vm
namespace: macos-vm
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest

## The disk and the Service predate this bundle, so Helm would refuse them with
## "invalid ownership metadata" and loop on install. takeOwnership adopts them
## once; it is harmless afterwards.
helm:
  maxHistory: 25
  takeOwnership: true

## ⛔ Load-bearing. The disk holds an installed operating system that cannot be
## rebuilt from this repository -- reinstalling it needs a human at the console
## for every phase. Removing this bundle must not garbage-collect that volume.
keepResources: true
