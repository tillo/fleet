## Off-site backup for macos-disk -- the estate's last PVC with no backup story.
## The disk holds an installed macOS, its iCloud session and the keychain ACL
## grant the Find My collector needs: not reproducible from this repo, and a
## reinstall needs a human at the console for every phase.
##
## Shared /mdapi/volsync/ceph-backup creds and a per-PVC subpath in the
## offsite-swept Garage ceph-backup bucket (as jump/esphome/...), so this needs
## no new bucket and no new grant on the offsite-backup key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-ceph-backup-restic
  namespace: macos-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: volsync-ceph-backup-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ## In-cluster Garage, not api.garage.home.tillo.ch: that name resolves to
        ## the ingress VIP, so backups would hairpin through ingress-nginx and
        ## fail exactly when the front door is degraded.
        ## ⭐ 2026-09-19: moved off the salt/pepper Garage to Backblaze B2 DIRECT,
        ## following the openvpn-pki canary. restic encrypts client-side, so these
        ## repos are the "send directly encrypted" half of the architecture and need
        ## no local staging. The B2 copy was never rclone-crypt wrapped (this bucket
        ## is in the offsite job's NO_ENCRYPT set precisely because restic already
        ## encrypts), so it is a REAL restic repo: config, data/ and snapshots/ were
        ## verified present for all 11 repos before switching. History carries over
        ## and nothing re-uploads -- 404 GiB leaves Garage in total.
        ##
        ## ⛔⛔ The offsite key's grant on this bucket was revoked FIRST. The offsite
        ## job runs `rclone sync`, which MIRRORS DELETIONS and derives its bucket
        ## list from that key's grants -- leaving it would have had the next 02:00
        ## run delete every snapshot written here, as they are absent from Garage.
        ##
        ## ⛔ B2's S3 endpoint is region us-west-001, read from b2_authorize_account's
        ## `s3ApiUrl`. Do not guess: 002/003/004 and eu-central all fail and read as
        ## "B2 is not S3 compatible" when it is only a different region. The S3
        ## endpoint keeps the AWS_* shape, so restic's native b2: backend and its
        ## B2_ACCOUNT_ID/KEY env are not needed.
        RESTIC_REPOSITORY: "s3:https://s3.us-west-001.backblazeb2.com/saltminio/ceph-backup/macos-disk"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .b2_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .b2_app_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /mdapi/volsync/ceph-backup/restic-password
    - secretKey: b2_key_id
      remoteRef:
        key: /mdapi/volsync/b2/account-id
    - secretKey: b2_app_key
      remoteRef:
        key: /mdapi/volsync/b2/account-key
---
## Daily, not hourly: restic must read the whole ~55 GiB image every run to chunk
## it, so each run costs real IO even though only changed chunks upload. 04:20
## UTC sits after the 02:00-04:00 backup cluster.
##
## ⚠️ Crash-consistent: the snapshot is taken while the guest runs, so a restore
## replays the journal as an abrupt power cut would. macOS ignores ACPI powerdown
## so there is no cheap way to quiesce it, and the guest already takes that same
## cut on every pod replacement. The mover works on a CLONE, so it never contends
## for the RWO source the VM holds.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: macos-disk
  namespace: macos-vm
spec:
  sourcePVC: macos-disk
  trigger:
    schedule: "20 4 * * *"
  restic:
    repository: volsync-ceph-backup-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    ## Images are uid/gid 1000 and lost+found is mode 2770 root:1000, so the
    ## mover needs gid 1000 to read the volume. fsGroup is not optional: the
    ## cache PVC is provisioned root-owned, and a mover that cannot write it
    ## silently runs cacheless, still reporting success.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    ## 8Gi: cache scales with pack count and this repo is ~10x the next largest.
    cacheCapacity: 8Gi
    cacheStorageClassName: harvester-longhorn-1replica
    pruneIntervalDays: 14
    ## Shallow on purpose -- depth is expensive for a disk image, where each
    ## snapshot pins the chunks that changed.
    retain:
      daily: 14
      weekly: 4
      monthly: 3
