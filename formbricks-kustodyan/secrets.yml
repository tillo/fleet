# Formbricks sandbox + Kustodyan (RPS) protection of survey answers, sibling of
# paperless-kustodyan. Same dev tenant and CoreAdmin credentials, its own RPS account
# `formbric` (target Formbricks, configuration FormbricksResponses) provisioned by
# kustodyan-mcp/provisioning/formbricks_provision.py.
#
# App-wide secret: the raw values plus the two connection strings templated from the
# postgres password (mergePolicy Merge keeps both the templated and the plain keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: formbricks-env
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: formbricks-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://postgres:{{ .POSTGRES_PASSWORD }}@formbricks-postgres:5432/formbricks?schema=public"
        HUB_DATABASE_URL: "postgresql://postgres:{{ .POSTGRES_PASSWORD }}@formbricks-postgres:5432/formbricks?sslmode=disable"
  data:
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/postgres-password
      secretKey: POSTGRES_PASSWORD
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/nextauth-secret
      secretKey: NEXTAUTH_SECRET
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/encryption-key
      secretKey: ENCRYPTION_KEY
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/cron-secret
      secretKey: CRON_SECRET
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/hub-api-key
      secretKey: HUB_API_KEY
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/cube-api-secret
      secretKey: CUBEJS_API_SECRET
---
# Gateway: engine client of the `formbric` account, a read-only Formbricks management key for
# survey lookups, and who may reveal — the sha256(API key) -> RPS role map for API callers, plus
# the per-account seed and the break-glass administrators of the role-management page. The seed is
# only used to fill an empty role store; after that the page (and its volume) is the source of truth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: formbricks-gateway
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: formbricks-gateway
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /kyos/kustodyan/formbricks-client-id
      secretKey: KUSTODYAN_CLIENT_ID
    - remoteRef:
        key: /kyos/kustodyan/formbricks-client-secret
      secretKey: KUSTODYAN_CLIENT_SECRET
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/apikey-gateway
      secretKey: FORMBRICKS_API_KEY
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/role-map
      secretKey: KUSTODYAN_ROLE_MAP
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/user-roles
      secretKey: KUSTODYAN_USER_ROLES
    - remoteRef:
        key: /mdapi/formbricks-kustodyan/role-admins
      secretKey: KUSTODYAN_ROLE_ADMINS
---
# Second kustodyan-mcp instance, bound to the formbricks account (same gate token as the
# paperless-bound one in ns kustodyan-mcp).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kustodyan-mcp-secrets
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: kustodyan-mcp-secrets
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /kyos/kustodyan/gate-token
      secretKey: MCP_BEARER_TOKEN
    - remoteRef:
        key: /kyos/kustodyan/formbricks-client-id
      secretKey: KUSTODYAN_CLIENT_ID
    - remoteRef:
        key: /kyos/kustodyan/formbricks-client-secret
      secretKey: KUSTODYAN_CLIENT_SECRET
---
# Pull secret for zot.mdapi.ch (the image registry), templated from the zot password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: zot-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"zot.mdapi.ch":{"username":"zot","password":"{{ .password }}","auth":"{{ printf "zot:%s" .password | b64enc }}"}}}
  data:
    - remoteRef:
        key: /mdapi/zot/zot-auth/password
      secretKey: password
