# phase2 2026-08-03: ceph-block replacements for three AIO chart-created Longhorn
# PVCs. The AIO chart pins PVC names/SC in its templates (immutable-field trap on
# helm upgrade), so the new PVCs live here and the Deployments are repointed via
# the kustomize patches. Old Longhorn PVCs retained as rollback until final sweep.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-aio-clamav-ceph
  namespace: nextcloud
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-aio-database-dump-ceph
  namespace: nextcloud
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-aio-nextcloud-data-ceph
  namespace: nextcloud
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 700Gi
