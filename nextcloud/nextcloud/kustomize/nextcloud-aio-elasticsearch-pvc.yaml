# FTS index volume on Ceph at CREATION time (PVC storageClassName is
# immutable — this patch only works because the 07-05 drop deleted the old
# Longhorn PVC; the index is rebuildable, deliberately not backed up).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-aio-elasticsearch
  namespace: nextcloud
spec:
  storageClassName: ceph-block
