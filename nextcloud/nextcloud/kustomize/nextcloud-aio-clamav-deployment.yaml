apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-clamav
  namespace: nextcloud
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-clamav
          # A2 (infra-ka2): explicit request floors sized from the VPA
          # recommender's targets — VPA Auto does NOT mutate envuassu pods
          # (works in other namespaces; tracked separately). No limits.
          resources:
            requests:
              cpu: 50m
              memory: 1300Mi
          imagePullPolicy: IfNotPresent
      volumes:
        - name: nextcloud-aio-clamav
          persistentVolumeClaim:
            claimName: nextcloud-aio-clamav-ceph
