apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-notify-push
  namespace: nextcloud
spec:
  # See sibling -apache patch for rationale (Recreate avoids cross-node RWX
  # window during rollouts; podAffinity below only enforces at schedule time).
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      containers:
        - name: nextcloud-aio-notify-push
          # A2 (infra-ka2): explicit request floors sized from the VPA
          # recommender's targets — VPA Auto does NOT mutate envuassu pods
          # (works in other namespaces; tracked separately). No limits.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
          imagePullPolicy: IfNotPresent
          env:
            # Talk to apache directly instead of the public URL: ingress-nginx
            # (use-forwarded-headers=false) replaces X-Forwarded-For, so via the
            # ingress Nextcloud never sees the client the push server forwards and
            # `occ notify_push:self-test` fails its trusted-proxy check. Caddy in
            # the apache pod trusts private ranges and keeps the header.
            # Port = this bundle's apache Service TCP port.
            - name: NEXTCLOUD_URL
              value: http://nextcloud-aio-apache:11000
            - name: POSTGRES_PASSWORD
              $patch: delete
            - name: REDIS_HOST_PASSWORD
              $patch: delete
          envFrom:
            - secretRef:
                name: nextcloud-aio-env-secret
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: io.kompose.service
                operator: In
                values:
                - nextcloud-aio-nextcloud
            topologyKey: "kubernetes.io/hostname"
