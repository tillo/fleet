## S2a (infra-ka2, 2026-08-14): Nextcloud through the normal ingress —
## restores ModSec/WAF coverage and cert-manager certs; kills the dedicated
## LB IP. ModSec snippet cloned from the proven owncloud ingress: the
## controller-mounted Nextcloud CRS rule-exclusions plugin does the heavy
## lifting; 1008 keeps native-client OAuth2 loopback redirects working; 1011
## blankets /remote.php/dav/ for sync-client PROPFIND variants (920340/941100
## family). owncloud's /graph/ rule (1009) is ownCloud-only — not cloned.
## 1012 (2026-09-02, waf-audit FP): rule 932260 (RCE: Unix Shell Expression)
## false-positives on the mimetype icon lookup's `mime=application/gzip`
## query value — legit folder-browse traffic, not scanner activity. Scoped
## to /core/mimeicon and to rule 932260 alone so the rest of CRS still
## covers this endpoint.
## The original nc.mdapi.ch host was retired 2026-08-17 (cloud.mdapi.ch is
## the sole domain since the ownCloud cutover); internal split-horizon
## records are auto-managed from this Ingress by the external-dns ->
## unbound-webhook chain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-aio
  namespace: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecAuditEngine RelevantOnly
      SecAuditLogRelevantStatus "^(?:5|4(?!04))"
      SecAuditLogParts ABIJDEFHZ
      SecAuditLogType Serial
      SecAuditLogFormat JSON
      SecAuditLog /dev/stdout
      SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE PROPFIND PROPPATCH MKCOL COPY MOVE LOCK UNLOCK REPORT"
      Include /etc/nginx/modsec-plugins/nextcloud-rule-exclusions-before.conf
      SecRule REQUEST_URI "@beginsWith /index.php/apps/oauth2/" \
        "id:1008,phase:1,pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS"
      SecRule REQUEST_URI "@beginsWith /remote.php/dav/" \
        "id:1011,phase:1,pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS"
      SecRule REQUEST_URI "@beginsWith /core/mimeicon" \
        "id:1012,phase:1,pass,nolog,ctl:ruleRemoveById=932260"
      Include /etc/nginx/owasp-modsecurity-crs/nginx-modsecurity.conf
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /.well-known/caldav  { return 301 https://$host/remote.php/dav/; }
      location = /.well-known/carddav { return 301 https://$host/remote.php/dav/; }
    # APACHE_MAX_SIZE / NEXTCLOUD_UPLOAD_LIMIT are 16G — 17g gives headroom.
    nginx.ingress.kubernetes.io/proxy-body-size: "17g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    # cloud.mdapi.ch: household cutover from ownCloud 10 -> Nextcloud on
    # 2026-08-17. ownCloud was put in maintenance mode and its ingress
    # retargeted to oc-legacy.mdapi.ch (kept for rollback). Public DNS for
    # cloud.mdapi.ch already resolves to this ingress (unchanged from oC).
    # cloud.mdapi.ch is added to Nextcloud trusted_domains via occ (runtime).
    - host: cloud.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud-aio-apache
                port:
                  number: 11000
  tls:
    - hosts:
        - cloud.mdapi.ch
      secretName: nextcloud-cloud-tls
