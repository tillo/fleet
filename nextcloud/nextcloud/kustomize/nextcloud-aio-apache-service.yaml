## S2a (infra-ka2, 2026-08-14): apache behind the ingress — ClusterIP on the
## reverse-proxy port. Replaces the dedicated MetalLB LoadBalancer .40 with
## direct TLS/QUIC (3443/4443/443) that bypassed the WAF. Talk's TURN
## LoadBalancer (.41) is unaffected.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-aio-apache
  namespace: nextcloud
spec:
  type: ClusterIP
  loadBalancerClass: null
  externalTrafficPolicy: null
  loadBalancerIP: null
  ports:
    - name: http
      port: 11000
      protocol: TCP
      targetPort: 11000
