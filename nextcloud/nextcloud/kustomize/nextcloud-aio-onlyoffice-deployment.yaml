apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-onlyoffice
  namespace: nextcloud
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-onlyoffice
          # A2 (infra-ka2): explicit request floors sized from the VPA
          # recommender's targets — VPA Auto does NOT mutate envuassu pods
          # (works in other namespaces; tracked separately). No limits.
          resources:
            requests:
              cpu: 150m
              memory: 1500Mi
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              $patch: delete
          envFrom:
            - secretRef:
                name: nextcloud-aio-env-secret
