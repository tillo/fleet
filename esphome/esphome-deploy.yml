apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: esphome
spec:
  selector:
    matchLabels:
      app: esphome
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: esphome
    spec:
      dnsConfig:
        nameservers:
          - 192.168.1.1
      dnsPolicy: None
      containers:
      - name: esphome
        image: esphome/esphome:latest@sha256:c994a49a945094643b14c213bfd500a95ffed94cd68848772828192e126bd375
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6052
        env:
        - name: TZ
          value: Europe/Zurich
        - name: ESPHOME_DASHBOARD_USE_PING
          value: 'true'
        envFrom:
          - secretRef:
              name: esphome-env-secret
        volumeMounts:
        - name: esphome-config
          mountPath: /config
        - name: esphome-secrets
          mountPath: /config/secrets.yaml
          subPath: secrets.yaml
      volumes:
      - name: esphome-config
        persistentVolumeClaim:
          claimName: esphome-config-ceph
      - name: esphome-secrets
        secret:
          secretName: esphome-secrets
