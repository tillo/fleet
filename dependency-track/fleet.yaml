# OWASP Dependency-Track — the estate's component INVENTORY (epic infra-7rog.42).
#
# ONE job: hold an SBOM per running thing and re-evaluate it continuously
# against new advisories, so "where does library X run right now" has an
# answer -- including libraries that have no CVE yet. It is NOT the findings
# record: DefectDojo stays the record (grype stays its feed) and DT publishes
# nothing into it, so no finding is ever recorded twice.
#
#  - Producers: Windmill f/security/dependency_track_sync uploads the CI SBOM
#    of each mdapi/* project (project `mdapi/<project>`, version = short sha)
#    and an SBOM per running third-party image (f/lib/runtime_images naming),
#    marking superseded versions inactive. Nothing else writes BOMs.
#  - Database: CNPG cluster dependency-track-pg (dependency-track-mdapi/);
#    its CNPG-generated -app Secret carries exactly the username/password
#    keys the chart reads.
#  - KEK: secretManagement provider `database`, the KEK from Akeyless through
#    ESO (dependency-track-mdapi/dependency-track-es.yml). Losing it makes
#    every DB-stored secret (the GitHub advisory token, notification creds)
#    unreadable -- hence Akeyless, never a chart-generated Secret.
#  - Access: dtrack.mdapi.ch behind oauth2-proxy-admin (Keycloak, role
#    mdapi-admin), then DT's own OIDC login (Keycloak public client
#    `dependency-track`, kc-gate mdapi-admin). The API is used in-cluster
#    (Windmill, Backstage) through the apiserver Service; the NetworkPolicy in
#    dependency-track-mdapi/ admits nobody else.
#  - Notifications: none configured in DT. CVE news is not paged (role map,
#    docs security-findings.md); Alertmanager only hears about record
#    integrity (monitoring-rules/89-dependency-track.yml).
#  - Images come from Docker Hub through mirror.gcr.io; tags follow the
#    chart's appVersion, so the chart pin below is the image pin (Renovate's
#    fleet manager tracks it).
defaultNamespace: dependency-track
dependsOn:
  - name: mdapi-prod-dependency-track-mdapi
helm:
  maxHistory: 25
  releaseName: dependency-track
  repo: https://dependencytrack.github.io/helm-charts
  chart: dependency-track
  version: 2.10.0
  values:
    image:
      registry: mirror.gcr.io

    database:
      jdbcUrl: "jdbc:postgresql://dependency-track-pg-rw.dependency-track.svc.cluster.local:5432/dtrack?reWriteBatchedInserts=true&sslmode=require"
      existingSecret:
        name: dependency-track-pg-app
        usernameKey: username
        passwordKey: password

    secretManagement:
      provider: database
      database:
        kek:
          mode: config
          existingSecret:
            name: dependency-track-kek
            key: kek

    # BOM uploads wait here until the worker ingests them; nothing on it is
    # irreplaceable (the producer re-uploads), so backup class `none` -- the
    # same label set f/heal/backup_label_enforcer derives.
    fileStorage:
      provider: local
      local:
        size: 5Gi
        storageClassName: harvester-longhorn-2replicas
        labels:
          mdapi.ch/backup-class: none
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/nobackup: enabled

    apiServer:
      topology: monolith
      # The JVM sizes its heap at 80 % of the cgroup limit (the image's
      # JAVA_OPTIONS sets MaxRAMPercentage=80, and ExitOnOutOfMemoryError), so
      # 3Gi is a 2.4 GiB heap. The first NVD/GHSA/OSV mirror is the memory peak;
      # re-measure it after the first full run (infra-7rog.42.1) and trim once
      # the steady state is known.
      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
      extraEnv:
        - name: DT_OIDC_ENABLED
          value: "true"
        - name: DT_OIDC_ISSUER
          value: https://idp.mdapi.ch/realms/tilloch
        - name: DT_OIDC_CLIENT_ID
          value: dependency-track
        - name: DT_OIDC_USERNAME_CLAIM
          value: preferred_username
        - name: DT_OIDC_USER_PROVISIONING
          value: "true"
        - name: DT_OIDC_TEAM_SYNCHRONIZATION
          value: "true"
        - name: DT_OIDC_TEAMS_CLAIM
          value: groups

    frontend:
      enabled: true
      extraEnv:
        - name: OIDC_ISSUER
          value: https://idp.mdapi.ch/realms/tilloch
        - name: OIDC_CLIENT_ID
          value: dependency-track
        - name: OIDC_SCOPE
          value: openid profile email
        - name: OIDC_LOGIN_BUTTON_TEXT
          value: Sign in with mdapi SSO
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi

    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: dtrack.mdapi.ch
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
        nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
        nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
        # A BOM can be uploaded through the UI too.
        nginx.ingress.kubernetes.io/proxy-body-size: 64m
        # No auth-response-headers: DT authenticates its own sessions (OIDC
        # bearer / API key); a forwarded Authorization header would collide.
      tls:
        - secretName: dependency-track-tls
          hosts:
            - dtrack.mdapi.ch
