defaultNamespace: rook-ceph
helm:
  maxHistory: 25
  # The users are created out-of-band (kubectl) before this bundle exists, so let
  # Fleet/Helm adopt the pre-existing CephObjectStoreUser CRs in place (avoids
  # delete+recreate, which would rotate the RGW keys that Akeyless already holds).
  takeOwnership: true
# Raw manifests for the object store: the per-app CephObjectStoreUsers for apps
# moving off Garage to RGW, plus the RGW server certificate (rgw-tls-cert.yml).
# The certificate is here rather than beside the values that name it because
# rook-ceph-cluster/ is a HELM bundle -- Fleet renders only the chart there, so a
# loose manifest in that directory is silently never applied.
# The rook-ceph-cluster chart (v1.20.0) has no cephObjectStoreUsers key, so users
# are declared here. Keys are mirrored to Akeyless (/mdapi/<app>/rgw/*) and the
# app's S3 connection secret is built from those. (openobserve's user is still
# kubectl-only — adopting it here needs care to avoid rotating its in-use keys.)
