## The SMB password of the single Time Machine user `timemachine`. Generated
## 2026-10-28 and held only in Akeyless; the Mac keeps it in its keychain after
## `tmutil setdestination`. Mounted as a file (PASSWORD_FILE), never an env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timemachine-smb
  namespace: timemachine
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: timemachine-smb
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /mdapi/timemachine/smb-password
      secretKey: password
