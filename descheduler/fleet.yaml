defaultNamespace: descheduler
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce), the 2026-09-21 promise. Declared
  # here because, since the Rancher 2.15.2 / Fleet v0.16 upgrade (2026-10-29
  # 13:57Z), live PSA labels match this list exactly in 96 of 101 bundle
  # namespaces: the hand-applied ones on 64 namespaces vanished within the
  # hour. This MR is the canary that proves Fleet now applies the list to an
  # EXISTING namespace (PsaLabelDrift, infra-wbq54).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: descheduler
  repo: https://kubernetes-sigs.github.io/descheduler/
  chart: descheduler
  # Pinned to the k8s-1.35 matching line. Bump deliberately alongside RKE2.
  version: 0.37.0
  valuesFiles:
    - values.yml
