# Secrets for the "Continue with Plex" path on start.mdapi.ch/request (2026-09-24).
#
# The door is the plex-oidc-bridge's (plex-auth/) one confidential OIDC client; the
# client id/secret are the SAME Akeyless items the bridge reads. The cookie secret
# signs the short-lived "Plex-verified" cookie. The Windmill token is scoped to
# run:flow/f/marketplace/request_membership_plex only.
# All server-side: read from the environment by PHP, never emitted into HTML.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dellambrogio-plex
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: dellambrogio-plex
    creationPolicy: Owner
  data:
    - remoteRef:
        key: /mdapi/plex-auth/oidc-client-id
      secretKey: PLEX_OIDC_CLIENT_ID
    - remoteRef:
        key: /mdapi/plex-auth/oidc-client-secret
      secretKey: PLEX_OIDC_CLIENT_SECRET
    - remoteRef:
        key: /mdapi/dellambrogio/plex-cookie-secret
      secretKey: PLEX_COOKIE_SECRET
    - remoteRef:
        key: /mdapi/dellambrogio/windmill-plex-token
      secretKey: WINDMILL_PLEX_TOKEN
