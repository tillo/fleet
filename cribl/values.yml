## Cribl image: Lane A — the `latest` tag keeps tracking upstream, the @sha256
## below is what git freezes. Owned by Renovate's helm-values manager: a new
## upstream build shows up as a digest MR after the 1-day soak, and automerges.
## Chart default pins criblImage.tag to chart appVersion (4.17.1), which is why
## we opt out explicitly.
## ⚠️ The digest rides ON the tag (`<tag>@sha256:<digest>`), not in a field of
## its own: helm-values rewrites the tag in place (autoReplaceStringTemplate).
criblImage:
  repository: zot.mdapi.ch/cribl/cribl
  pullPolicy: IfNotPresent
  tag: latest@sha256:22250b3497b2fd302ed7ac21f2307fbc03d101c205c29a16681aaef75c4606d5

## IR-resilience: pull through the in-cluster Zot cache so the leader
## can come back from a cold start even if cribl.io is unreachable.
## Pairs with the zot-pull dockerconfigjson Secret in the cribl ns
## (owned by fleet bundle `zot-pull-secrets/`).
imagePullSecrets:
  - name: zot-pull

## No updater annotations anywhere: Keel was retired 2026-10-02 and this ref is
## Renovate-owned (see above). The kustomize post-render overlay in kustomize/
## (see fleet.yml) remains, but only for the PVC repoint patches — the keel
## annotation patch it used to carry is gone.

config:
  scName: harvester-longhorn-2replicas
  ## Liveness/readiness probe overrides — chart default is 60s delay, 10s
  ## period, 1s timeout, 3 failures = 30s of unhealthy before kill. Under
  ## sustained PQ-drain backpressure (httpraw source spiking 1–2.5 MB
  ## chunks per worker), the /api/v1/health endpoint can't reply within
  ## 1s, the pod gets killed mid-drain, restarts hot into the same load,
  ## and crashloops. 2026-05-25 10:16–10:32 UTC: 17 restarts in 16 min
  ## while the pod was using <12% of its CPU/RAM budget — the probe was
  ## the killer, not resources.
  ##
  ## New budget: 60s delay (unchanged), 15s period × 6 failures × 5s
  ## timeout = 90s of unhealthy before kill. Cribl PQ-drain bursts
  ## typically settle in 5–10s; 90s leaves room for cold-cache reloads
  ## without losing the liveness signal entirely.
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 9000
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 9000
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
## 2026-06-14: chart default CPU limit is 2 cores; the leader's bursty
## httpraw PQ-drain (1–2.5 MB chunks/worker) saturates both → 99.8% CFS
## throttle (44.7% of periods throttled cumulatively) while avg use is only
## ~0.3 core. The chart also derives CRIBL_K8S_CPU_LIMIT from limits.cpu, so
## raising it lets cribl size more worker processes too. Memory is untouched
## (live ~0.9 GiB of 4 GiB).
## 2026-06-29: 4 cores still hit ~14% CFS throttle on PQ-drain bursts
## (ContainerCpuThrottling). Bump 4 -> 6 to give the bursty leader headroom.
resources:
  limits:
    cpu: "6"
    memory: 4096Mi
  requests:
    cpu: "1"
    memory: 1024Mi
persistence:
  size: 50Gi
service:
  ports:
    - name: api
      port: 9000
      protocol: TCP
      external: true
    - name: leadercomm
      port: 4200
      protocol: TCP
      external: false
    - name: httpraw
      port: 8080
      protocol: TCP
      external: true
ingress:
  enable: true
  host: cribl.mdapi.ch
  prefix: /
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
  tls:
    - secretName: cribl-cert
      hosts:
        - cribl.mdapi.ch
    