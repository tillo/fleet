defaultNamespace: cribl
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
# ⚠️ This chart is pulled from an EXTERNAL Helm repo at BUNDLING time, and Fleet
# bundles the whole GitRepo as a unit: when criblio.github.io is unavailable the
# GitRepo goes Stalled=True and bundling freezes for EVERY bundle in this repo,
# not just this one. Nothing else can deploy until it clears, and Fleet does not
# retry the same commit — a new commit (or a forceSyncGeneration bump) is what
# unsticks it. Seen 2026-08-28: a transient 503 on the repo index froze an
# unrelated monitoring-rules change. If this recurs often enough to be a
# nuisance, the fix is to vendor the chart into this repo rather than resolve it
# upstream on every bundling run.
helm:
  maxHistory: 25
  releaseName: logstream-leader
  repo: https://criblio.github.io/helm-charts/
  chart: logstream-leader
  version: 4.20.1  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
# Post-render the chart with kustomize to repoint the leader Deployment at the
# phase-2 ceph PVC (2026-08-03). Same helm+kustomize pattern as
# envuassu/nextcloud; verified locally with `helm template | kubectl kustomize`
# before committing. This overlay used to carry the Keel annotations too - gone
# with the Keel retirement 2026-10-02; image updates are Renovate's now.
kustomize:
  dir: kustomize
