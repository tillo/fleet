# phase2 2026-08-03: ceph-block replacement for the chart-created leader-config-claim.
# The chart pins the PVC name/SC in its templates (immutable-field trap on upgrade),
# so the new PVC lives here and the Deployment is repointed via kustomize patch.
# Old Longhorn PVC retained as rollback until the phase-2 final sweep.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: leader-config-claim-ceph
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
