# Phase-2 (2026-08-03): the logstream-leader chart still renders the original
# Longhorn leader-config-claim; data moved to leader-config-claim-ceph and the
# live old PVC was deleted. Delete-patch it out of the render (same pattern as
# envuassu/nextcloud/kustomize/phase2-delete-old-pvcs.yaml). NO namespace on
# purpose: the logstream-leader chart renders without one (0d1035e lesson) and
# a namespaced patch finds no target.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: leader-config-claim
  $patch: delete
