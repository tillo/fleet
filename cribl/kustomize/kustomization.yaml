# Post-renders the logstream-leader helm chart (see ../fleet.yml). Fleet feeds the
# helm-rendered manifests in as the kustomize base, then applies these patches
# (same pattern as envuassu/nextcloud/kustomize). The one resources: entry is the
# phase-2 ceph-block PVC that replaces the chart-created Longhorn one (2026-08-03).
resources:
- leader-config-claim-ceph-pvc.yaml
patchesStrategicMerge:
- phase2-delete-old-pvc.yaml
- logstream-leader-keel-patch.yaml
- logstream-leader-pvc-repoint.yaml
