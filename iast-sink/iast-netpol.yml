## Who may talk to the sink, and what anything in ns `iast` may talk to.
##
## The sink has no authentication: a tracer cannot send one. So admission is
## by network position, like the otel-collector it forwards to.
##   ingress :8126 — tracer pods in this namespace; Windmill (the DefectDojo
##     sync reads GET /sarif); the jump seat (operators); the blackbox
##     exporter (availability probe); the node network
##     (kubelet probes arrive from the node IP).
##   egress — DNS and the otel-collector's OTLP/HTTP port, nothing else.
##
## ⛔ NO SaaS. The second policy holds every OTHER pod in the namespace (the
## instrumented test apps) to "the sink and DNS only": even a tracer that was
## left pointing at a Datadog intake (*.datadoghq.*) cannot reach it from here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iast-sink
  namespace: iast
spec:
  podSelector:
    matchLabels:
      app: iast-sink
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: windmill
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jump
        ## the blackbox probe of monitoring-rules/90-iast-sink.yml
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 8126
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iast-tracers-sink-only
  namespace: iast
spec:
  ## NotIn also selects pods with no `app` label at all.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [iast-sink]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: iast-sink
      ports:
        - protocol: TCP
          port: 8126
