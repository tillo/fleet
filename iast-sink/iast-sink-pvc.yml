## The deduplicated findings (first/last seen, count) survive a restart here.
## Not backed up on purpose: DefectDojo is the record of every finding the
## sync imported, and a lost file only means the next traffic re-reports them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iast-sink-data
  namespace: iast
  annotations:
    mdapi.ch/backup-exempt: "derived state: DefectDojo holds the record; new traffic re-reports every finding"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
