## egress-guard: cluster-scoped Calico Tier + GlobalNetworkPolicy for the egress
## default-deny programme (infra-wk4ux.5, under infra-az8.4). See egress-guard-learn.yml.
##
## Own bundle because both objects are cluster-scoped (same reason as admission-policies/).
## ⛔ NO dependsOn: a security observation layer must not sit in the dependency path of
## anything, and the cluster must come up from scratch without it.
## defaultNamespace only names where Fleet keeps the Helm release.
defaultNamespace: kube-system
helm:
  maxHistory: 25
