# Namespace-PINNED on purpose: this bundle holds namespaced Calico policies only.
# A cluster-scoped object committed here would be silently dropped
# (tests/test_namespaced_bundle_no_cluster_scoped.py). Kept apart from
# windmill/rbac, which cannot be pinned because it carries a ClusterRoleBinding.
defaultNamespace: windmill
namespace: windmill
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25
