# `heal` reads Secrets BY NAME, in the namespaces that hold them (SA token audit
# 2026-11-10, infra-p6q07.2). Until then this was `secrets: get` on ANY name behind a
# ClusterRoleBinding, so any heal-tagged job could fetch both long-lived cluster-admin
# token Secrets. The readers:
#   restic_snapshot_freshness  each VolSync ReplicationSource's restic repository Secret
#   rgw_backup_bucket_grant    each CNPG bucket's OBC owner keys (Secret = OBC name)
#   k8s_orphan_audit           each VM's cloud-init secretRef / networkDataSecretRef
#   ha_upgrade_rollback, horizon_lic001_heal, openbao_failover_check   fixed names
# ⛔ Do not edit these lists by hand-guessing: the test
# tests/test_windmill_heal_reads_secrets_by_name_only.py derives them from the
# ReplicationSource / OBC / VirtualMachine manifests and fails both ways (a new backup
# not granted, or a grant nothing needs). Names apply in every bound namespace; the
# test keeps the admin tokens and platform namespaces out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - atlas-probe-cloudinit
      - cm-9nsoo
      - cnpg-agentgateway-pg
      - cnpg-backstage-pg
      - cnpg-bussola-pg
      - cnpg-defectdojo-pg
      - cnpg-gitlab-pg
      - cnpg-grafana-pg
      - cnpg-guac-pg
      - cnpg-ha-recorder-pg
      - cnpg-joplin-pg
      - cnpg-keycloak-pg
      - cnpg-litellm-pg
      - cnpg-openfga-pg
      - cnpg-paperless-pg
      - home-assistant-env-secret
      - horizon-mcp-secrets
      - kali-mp34v
      - mgmt-1-cloudinit
      - mgmt-2-cloudinit
      - mgmt-3-cloudinit
      - openbao-drill-check
      - trapeye-vm-dmz-hqlge
      - trapeye-vm-lan-mp4wq
      - volsync-ceph-backup-restic
      - volsync-openvpn-pki-restic
      - volsync-tenant-1-postgres-restic
