# The `heal-storage` worker group (tag `heal-storage`, infra-az8.19.11, decided
# 2026-11-05): the ONLY account that may exec into or delete a pod in any
# namespace, or delete a Node. Exactly three reviewed scripts carry the tag:
#   longhorn_eio_autoheal   - execs `ls` into whichever pod mounts the EIO
#                             volume, then deletes that pod (any namespace)
#   longhorn_rwx_split_heal - deletes stranded pods of a split RWX volume (any ns)
#   resource_waste          - removes Node objects of hosts gone for good
# Longhorn-backed workloads appear in every new tenant namespace, so these
# cannot be fenced per namespace. Every other `heal` script gets its exec /
# pod delete from a namespaced Role. A script that needs a new namespace gets
# a Role there; it does not move to this tag.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker-heal-storage
  namespace: windmill
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal-storage
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # The websocket upgrade is a GET, newer apiservers authorize it as create: grant both.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windmill-worker-heal-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windmill-worker-heal-storage
subjects:
  - kind: ServiceAccount
    name: windmill-worker-heal-storage
    namespace: windmill
