---
# The `heal` worker group (tag `heal`): the ~40 scripts that change PROD objects
# or exec into pods. Each grant below names the script that needs it; a new
# heal script that needs more adds a line here, it does not go back to default.
#
# Since infra-az8.19.11 (2026-11-05) it can exec into / delete pods ONLY in the
# namespaces bound below, and delete no Node; the any-namespace storage heals
# moved to `heal-storage`. It can still create Jobs in kube-system (node_opt_image_prune).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker-heal
  namespace: windmill
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal
rules:
  # ⛔ No pods/exec, pods delete or nodes delete here (infra-az8.19.11): those
  # are per-namespace RoleBindings below; the any-namespace storage heals run as
  # windmill-worker-heal-storage.
  # pvc_grow (size), backup_label_enforcer (labels)
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [patch]
  # k8s_job_janitor (any ns), node_opt_image_prune (kube-system)
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
  # k8s_job_janitor
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [delete]
  # ceph_pvc_snapshot (ns of each VolSync ReplicationSource)
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, delete]
  # kubevirt_stuck_vmi_finalizer
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [patch]
  # volsync_restic_stale_lock
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windmill-worker-heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windmill-worker-heal
subjects:
  - kind: ServiceAccount
    name: windmill-worker-heal
    namespace: windmill
---
# Pod exec / pod delete for `heal`, one RoleBinding per namespace that needs it
# (infra-az8.19.11). Inventory 2026-11-05: every tag-heal script and flow step
# in the workspace, cross-checked against 7 d of tag-heal job history (46
# scripts). A heal script that needs another namespace adds a RoleBinding here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal-pod-exec
rules:
  # The websocket upgrade is a GET, newer apiservers authorize it as create: grant both.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal-pod-delete
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
