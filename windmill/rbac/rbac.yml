    namespace: windmill
---
# The `heal` worker group (tag `heal`): the ~40 scripts that change PROD objects
# or exec into pods. Each grant below names the script that needs it; a new
# heal script that needs more adds a line here, it does not go back to default.
#
# ⚠️ Still effectively admin-equivalent: exec into any pod, delete any pod or
# Node, create Jobs in kube-system. What the split buys is that the ~70 read-only
# probes on `default` no longer carry these verbs, and a heal job cannot touch
# RBAC, webhooks, CRDs or Rancher objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker-heal
  namespace: windmill
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal
rules:
  # longhorn_eio_autoheal, longhorn_rwx_split_heal (any ns), frigate_nest_camera_bounce,
  # horizon_lic001_heal, ingress_worker_flush, wan_speedtest (its own pod)
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # 17 exec-only scripts + longhorn_eio_autoheal (ns computed). The websocket
  # upgrade is a GET, newer apiservers authorize it as create: grant both.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  # pvc_grow (size), backup_label_enforcer (labels)
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [patch]
  # resource_waste: removes Node objects of hosts gone for good
  - apiGroups: [""]
    resources: [nodes]
    verbs: [delete]
  # k8s_job_janitor (any ns), node_opt_image_prune (kube-system)
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
  # k8s_job_janitor
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [delete]
  # ceph_pvc_snapshot (ns of each VolSync ReplicationSource)
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, delete]
  # kubevirt_stuck_vmi_finalizer
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [patch]
  # volsync_restic_stale_lock
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windmill-worker-heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windmill-worker-heal
subjects:
  - kind: ServiceAccount
    name: windmill-worker-heal
    namespace: windmill
---
# wan_speedtest: one speedtest pod per run (deleted by the ClusterRole grant)
apiVersion: rbac.authorization.k8s.io/v1
