# openbao_failover_check: the quarterly drill creates and purges ExternalSecret + Secret openbao-drill-check
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: windmill-worker-heal
  namespace: openbao
rules:
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [create]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    resourceNames: [openbao-drill-check]
    verbs: [delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openbao-drill-check]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: windmill-worker-heal
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: windmill-worker-heal
subjects:
  - kind: ServiceAccount
    name: windmill-worker-heal
    namespace: windmill
