# Direct kube-API path for the automation plane (infra-health hardening,
# approved 2026-08-09): f/lib/mdapi k8s() talks to kubernetes.default.svc with
# the worker pods' own ServiceAccount token instead of the Rancher proxy.
#
# The `windmill` SA (the `default` worker group) was cluster-admin from then
# until 2026-10-30. infra-az8.19.2 option A replaced that binding with
# windmill-worker-reader (below): read-only, no exec. Every script that writes
# or execs now carries worker tag `heal` and runs as windmill-worker-heal.
# The SA keeps its NAME on purpose: OpenBao's kubernetes-auth roles
# windmill-archive / windmill-snapshot bind bound_service_account_names=windmill
# (fleet openbao-bootstrap), used by f/secrets/get_secret,
# openbao_secrets_archive and openbao_raft_snapshot, all on `default`.
#
# ⛔ Do not bring a cluster-admin binding back to fix a 403 on `default`: give
# the script tag `heal` and add the verb to windmill-worker-heal.
---
# The API server's own account (infra-az8.19, pentest-2026-10-22 F16/F26).
# windmill-app is the internet-facing component and never calls the kube-API:
# it serves the UI/API and queues jobs in Postgres, the workers run them. Until
# 2026-10-28 it shared the `windmill` SA above, so an RCE in the API server was a
# cluster-admin token on disk. It now runs as this account with NO token mounted
# and no binding anywhere. windmill/values.yml points windmill.app.serviceAccountName
# here; the chart has no automount knob for the app, so the SA carries it.
#
# Ordering is safe either way: if the Deployment rolls before this SA exists,
# the new ReplicaSet just fails to create pods (FailedCreate) and the old pods
# keep serving until it does.
#
# ⚠️ If a future Windmill feature in the server needs the API (EE worker
# autoscaling, the operator), give THIS account a namespaced Role for exactly
# that, never a cluster-wide binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-app
  namespace: windmill
automountServiceAccountToken: false
---
# Per-group worker accounts (infra-az8.19.2). values.yml sets
# windmill.workerGroupsRequireServiceAccount, so every worker group names one of
# these (or `windmill` above, which only the default group uses).
#
# Inventory 2026-10-29: 30 d of Windmill job history (v2_job by tag), the
# workspace scripts' kube-API calls, and the 2026-10-25..29 kube-apiserver audit
# log on qua/qui/quo. That log records only create/delete/patch, but every
# windmill-SA write in it came from the default group.
#   native, gpu, long -> no kube-API use at all -> no token
#   certs             -> one Secret read          -> the Role below
#
# ⚠️ This narrows what a job's RUNTIME holds on these pods (a compromised
# dependency, a pod exec). It does NOT narrow what a script AUTHOR can do: the
# author picks the tag, and `heal` is still effectively admin-equivalent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker-nokube
  namespace: windmill
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker-certs
  namespace: windmill
---
# f/infra_certs/aruba_aos6_cert_sync: GET secrets/aruba-apin0325-cert in
# monitoring (tls.crt + tls.key, staged for the AOS-6 IAP to download).
# f/infra_certs/aruba_cert_sync: the two AOS-8 APs' certs (infra-az8.19.12 moved
# it from `default` to `certs`, so private keys stay off the default group). A
# new certs-tagged script that needs another Secret adds its name here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: windmill-worker-certs
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aruba-apin0325-cert", "aruba-apin0505-cert", "aruba-apin0315-cert"]  # gitleaks:allow (Secret names, not values)
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: windmill-worker-certs
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: windmill-worker-certs
subjects:
  - kind: ServiceAccount
    name: windmill-worker-certs
    namespace: windmill
---
# f/infra_certs/santillo_cert_sync: the NAS cert pushed over SSH (infra-az8.19.12,
# moved from `default` to `certs` with aruba_cert_sync).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: windmill-worker-certs
  namespace: transit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["santillo-cert"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: windmill-worker-certs
  namespace: transit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: windmill-worker-certs
subjects:
  - kind: ServiceAccount
    name: windmill-worker-certs
    namespace: windmill
---
# Option A of infra-az8.19.2 (user decision 2026-10-30): split the default
# group's power into a READER and a HEALER.
#
# windmill-worker-reader: get/list/watch on every built-in resource by name and
# on every CRD group, NOTHING else. No write verb anywhere, no escalate/bind/
# impersonate, no subresources except pods/log. Bound to `windmill` (the default
# group) and to windmill-worker-heal.
#
# Left out on purpose:
#   - management.cattle.io (Rancher users/tokens; the two scripts that read it go
#     through their own mgmt kubeconfig, not this SA)
#   - aggregated API groups that are really proxies or actions:
#     ext.cattle.io, subresources.kubevirt.io (VNC/console),
#     upload.cdi.kubevirt.io, acme.infomaniak.com
#   - pods/exec|attach|portforward|proxy, nodes/proxy, services/proxy: a GET on
#     any of these is code execution, which is why built-in groups are listed
#     resource by resource instead of "*" (RBAC "*" matches subresources too).
#
#   - secrets (infra-az8.19.12): RBAC cannot narrow a list by selector, so a
#     `secrets` list here would read every ServiceAccount token and app
#     credential in the cluster. The four probes that listed them now use
#     cert-manager Certificates/CertificateRequests, Rancher catalog Apps and
#     the workloads' imagePullSecrets names instead. Named reads are granted
#     below (windmill-worker-secrets, windmill-worker-pull-secrets); `heal`
#     gets any Secret by name through windmill-worker-heal-secrets.
#
# Generated by ~/windmill-worker-sa-20261029/gen_reader_role.py on the jump seat
# from `kubectl api-resources` (2026-10-30). A new CRD group is covered
# automatically; a new BUILT-IN resource needs a re-run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-reader
rules:
  - apiGroups: [""]
    resources: [componentstatuses, configmaps, endpoints, events, limitranges, namespaces, nodes, persistentvolumeclaims, persistentvolumes, pods, pods/log, podtemplates, replicationcontrollers, resourcequotas, serviceaccounts, services]
    verbs: [get, list, watch]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: [mutatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings, validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: ["certificates.k8s.io"]
    resources: [certificatesigningrequests]
    verbs: [get, list, watch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: [flowschemas, prioritylevelconfigurations]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingressclasses, ingresses, ipaddresses, networkpolicies, servicecidrs]
    verbs: [get, list, watch]
  - apiGroups: ["node.k8s.io"]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
  - apiGroups: ["resource.k8s.io"]
    resources: [deviceclasses, resourceclaims, resourceclaimtemplates, resourceslices]
    verbs: [get, list, watch]
  - apiGroups: ["scheduling.k8s.io"]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [csidrivers, csinodes, csistoragecapacities, storageclasses, volumeattachments, volumeattributesclasses]
    verbs: [get, list, watch]
  - apiGroups:
      - acme.cert-manager.io
      - addons.cluster.x-k8s.io
      - auditlog.cattle.io
      - autoscaling.k8s.io
      - barmancloud.cnpg.io
      - bmc.tinkerbell.org
      - catalog.cattle.io
      - cdi.kubevirt.io
      - ceph.rook.io
      - cert-manager.io
      - clone.kubevirt.io
      - cluster.x-k8s.io
      - core.haproxy.org
      - crd.projectcalico.org
      - csi.ceph.io
      - devices.harvesterhci.io
      - export.kubevirt.io
      - external-secrets.io
      - externaldns.k8s.io
      - fleet.cattle.io
      - forklift.cdi.kubevirt.io
      - frrk8s.metallb.io
      - gateway.networking.k8s.io
      - generators.external-secrets.io
      - harvesterhci.io
      - helm.cattle.io
      - horizon.evertrust.io
      - hub.traefik.io
      - instancetype.kubevirt.io
      - ipam.cluster.x-k8s.io
      - k3s.cattle.io
      - k8s.cni.cncf.io
      - kubeovn.io
      - kubevirt.io
      - loadbalancer.harvesterhci.io
      - logging-extensions.banzaicloud.io
      - logging.banzaicloud.io
      - longhorn.io
      - metal.harvesterhci.io
      - metallb.io
      - migrations.kubevirt.io
      - monitoring.coreos.com
      - network.harvesterhci.io
      - node.harvesterhci.io
      - objectbucket.io
      - operator.victoriametrics.com
      - policy.networking.k8s.io
      - pool.kubevirt.io
      - postgresql.cnpg.io
      - provisioning.cattle.io
      - rke.cattle.io
      - runtime.cluster.x-k8s.io
      - snapshot.kubevirt.io
      - snapshot.storage.k8s.io
      - telemetry.cattle.io
      - tinkerbell.org
      - traefik.containo.us
      - traefik.io
      - trust.cert-manager.io
      - turtles-capi.cattle.io
      - ui.cattle.io
      - upgrade.cattle.io
      - volsync.backube
      - whereabouts.cni.cncf.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windmill-worker-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windmill-worker-reader
subjects:
  - kind: ServiceAccount
    name: windmill
    namespace: windmill
  - kind: ServiceAccount
    name: windmill-worker-heal
