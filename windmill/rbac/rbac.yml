# longhorn_backup_retry (snapshot + backup CRs), longhorn_degraded_stuck / longhorn_rebuild_stuck (stuck replicas)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: windmill-worker-heal
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [create]
  - apiGroups: [longhorn.io]
    resources: [replicas]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: windmill-worker-heal
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: windmill-worker-heal
subjects:
  - kind: ServiceAccount
    name: windmill-worker-heal
    namespace: windmill
