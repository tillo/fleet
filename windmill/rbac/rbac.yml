# Direct kube-API path for the automation plane (infra-health hardening,
# approved 2026-08-09). f/lib/mdapi k8s() now talks to kubernetes.default.svc
# with the worker pods' own ServiceAccount token instead of round-tripping
# through the Rancher proxy on mbptillo — that proxy flapped 6× on
# 08-07/08-08 and blinded ~120 scheduled probes/heals each time (the
# Longhorn autoheals were provably blind during the flaps). The Rancher URL
# stays as the helper's fallback for off-cluster callers or RBAC breakage.
#
# Scope: cluster-admin on the existing `windmill` SA (app + workers). This is
# power-equivalent to what every job already holds — g/all/RANCHER_TOKEN is an
# admin token readable by any workspace job — so it adds no new privilege,
# only removes the mbptillo dependency. No pod spec change, so nothing rolls:
# the SA token is already mounted in the running workers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windmill-automation-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: windmill
    namespace: windmill
