## pods/exec for windmill-worker-heal-storage, PER NAMESPACE (infra-p6q07.2).
##
## Its only exec caller is longhorn_eio_autoheal.fs_probe, which probes a pod that
## mounts a Longhorn volume. One RoleBinding per namespace that runs such a pod
## (measured live 2026-11-19: 44). Before this the grant was cluster-wide, which
## reached the privileged hostPID pods of kube-system, rook-ceph, longhorn-system
## and harvester-system = root on every node.
##
## ⭐ Longhorn is the DEFAULT StorageClass, so a new tenant usually needs a line
## here. Without one, fs_probe gets 403 and reports "inconclusive": the heal skips
## that pod SILENTLY. f/probe/rbac_hygiene measures the gap live
## (rbac_heal_storage_exec_uncovered_namespaces) and RbacHealStorageExecUncovered
## names the namespace. ⛔ Never bind this in a platform namespace (kube-system,
## rook-ceph, longhorn-system, harvester-system, cattle-*): the test
## tests/test_windmill_heal_storage_exec_is_per_namespace.py refuses it.
## The command stays pinned by admission-policies/heal-storage-exec-pin.yml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windmill-worker-heal-storage-exec
rules:
  # The websocket upgrade is a GET, newer apiservers authorize it as create: grant both.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
