postgresql:
  # ⚠️ auth.postgresPassword is left at the chart default ON PURPOSE: the chart
  # renders it as an inline POSTGRES_PASSWORD on the StatefulSet (no secret
  # option), and the postgres image reads it ONLY when it initialises an empty
  # PGDATA. It is NOT the live password (rotated 2026-10-28, infra-az8.19.1 —
  # the live one is in Akeyless, see windmill/external-secrets/
  # windmill-database-url-es.yml). If the PVC is ever re-initialised, the app
  # will fail auth until you run ALTER ROLE postgres inside the pod.
  persistence:
    enabled: true
    storageClass: "harvester-longhorn-2replicas"
    size: 5Gi

windmill:
  baseDomain: windmill.mdapi.ch
  baseProtocol: https
  # DATABASE_URL from a Secret (ExternalSecret windmill-database-url, bundle
  # windmill/external-secrets) instead of the chart's inline databaseUrl, which
  # carried the chart's PUBLIC default password into every app/worker pod spec
  # (infra-az8.19.1). Applies to the app and every worker group. The env now
  # holds a secretKeyRef, so `get deployments` no longer reveals it.
  # Not databaseUrlAsFile: with nsjail off (infra-az8.19.3) a job runs as root
  # in the worker container and reads a mounted file as easily as the env;
  # revisit together with nsjail.
  databaseUrlSecretName: windmill-database-url
  databaseUrlSecretKey: url
  # Unpinned as of 2026-10-21 (php2shell) — `tag: ""` follows the chart's
  # appVersion. The 2026-09-02 pin (`tag: "1.798.0"`) existed because this chart
  # shipped a dangling appVersion: 1.799.0 was NEVER published to ghcr, so the
  # 2026-09-01 rollout left six pods in ImagePullBackOff for a day and
  # mdapi-prod-windmill became the one un-ready bundle. Pinning the newest
  # *published* version fixed that but silently froze the app version.
  #
  # chart 4.0.288 asks for appVersion 1.844.0 and ghcr HAS it (manifest API
  # checked 2026-10-21) — as does windmill-extra:1.844.0, which makes the
  # separate windmillExtra pin (1.724.0) obsolete: its tag falls back to
  # windmill.tag, then to the appVersion.
  #
  # Why now: 1.798.0 carried /usr/bin/php 8.3.30 (php2shell, CVE-2026-109618/9).
  # 1.844.0 is Debian trixie and ships NO php binary at all, and this workspace
  # has 0 .php scripts, so nothing loses an interpreter.
  # ⛔ Before believing a future Renovate chart bump, HEAD the appVersion on
  # ghcr: this chart has shipped unpublished appVersions before, and the
  # failure mode is silent — pods in ImagePullBackOff while the old ReplicaSet
  # keeps serving.
  tag: ""
  # Lane B: all windmill component images are pinned (chart appVersion). The
  # chart defaults imagePullPolicy to Always (boot-fragile, no update benefit on
  # a pinned tag). Set IfNotPresent across all components (operator/app/
  # worker-groups/hub/indexer/extra all read $.Values.windmill.imagePullPolicy).
  imagePullPolicy: IfNotPresent
  app:
    # Tokenless, binding-free account (fleet windmill/rbac/rbac.yml, infra-az8.19).
    # The internet-facing API server must not carry the workers' cluster-admin
    # token; it never calls the kube-API (2026-10-28: its only outbound TCP is
    # Postgres 5432). Workers still run as `windmill`.
    serviceAccountName: windmill-app
    extraEnv:
      # Windmill AI (customai provider) points at the in-cluster litellm
      # service; the API server's SSRF guard refuses private base URLs
      # without this (2026-08-18). Scope: AI base URLs only.
      - name: ALLOW_PRIVATE_AI_BASE_URLS
        value: "true"
  # Per-group worker accounts (infra-az8.19.2). Every group must name its own SA,
  # so a new group cannot silently inherit the chart's global `windmill` account,
  # which is the default group's reader (windmill/rbac/rbac.yml). The render fails
  # instead. Only `default` still runs as `windmill`.
  workerGroupsRequireServiceAccount: true
  # Override the chart's default workerGroups list to bump the default
  # group's memory limit from 2Gi → 4Gi. Introduced for the (retired
  # 2026-10-28) scrypted_data_backup script, which streamed a ~50 MiB
  # tarball + base64 buffers peaking ~250 MiB; the other config_backup
  # jobs stream tarballs the same way, and under load the shared worker
  # pod can easily exceed 2Gi across concurrent jobs. Helm lists don't merge
  # so we must re-declare all 3 chart-default groups verbatim.
  workerGroups:
    - name: default
      replicas: 3
      mode: worker
      controller: Deployment
      # Read-only account since 2026-10-30 (infra-az8.19.2): windmill-worker-reader,
      # get/list/watch everywhere incl. Secrets, no write, no exec. Scripts that
      # write or exec run on the `heal` group below. Still privileged (infra-az8.19.3).
      serviceAccountName: windmill
      privileged: true
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      terminationGracePeriodSeconds: 604800
      resources:
        # requests MUST be declared explicitly: with only `limits` set, k8s
        # defaults the request to equal the limit, so these 3 pods each
        # reserved 4Gi while using ~420Mi — 90% of qua/qui's schedulable
        # memory was over-request, not use (rancher-topology-study E8).
        # 2Gi tracks the VPA recommendation (mode Off = recommend-only, so it
        # will not fight this value): target 1.85GiB, lowerBound 826Mi.
        # The 4Gi LIMIT is unchanged and still covers the burst described above.
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
    - name: native
      replicas: 1
      mode: worker
      controller: Deployment
      # No kube-API token: 0 native-tagged jobs in the 30 d job history and 0
      # nativets/SQL scripts in the workspace (infra-az8.19.2, 2026-10-29).
      serviceAccountName: windmill-worker-nokube
      automountServiceAccountToken: false
      privileged: false
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      extraEnv:
        - name: NATIVE_MODE
          value: "true"
        - name: SLEEP_QUEUE
          value: "200"
      resources:
        # Explicit request (2026-09-24): with only `limits`, k8s defaulted the request to
        # the 2Gi limit, and as a SINGLE-replica Recreate VPA target the updater never
        # evicts it (default --min-replicas=2), so the pod reserved 2Gi while the working
        # set peaked at 249 MiB over 30 d (p99 7 d 187 MiB; VPA target 250Mi). 256Mi covers
        # the observed peak; the 2Gi LIMIT stays as burst headroom (1:8 ratio, so the VPA's
        # proportional limit scaling keeps ~2Gi).
        requests:
          memory: 256Mi
        limits:
          memory: 2Gi
    - name: gpu
      replicas: 0
      mode: worker
      controller: Deployment
      serviceAccountName: windmill-worker-nokube
      automountServiceAccountToken: false
      privileged: true
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      resources:
        limits:
          memory: 2Gi
    # Dedicated group for cert-delivery jobs to PULL-ONLY devices. Mounts the
    # cert-staging RWX (created by the cert-host Fleet bundle, also mounted
    # read-only by the cert-host web pod at 192.168.1.61) so jobs can stage a
    # PEM for a device to fetch (AOS-6 IAP `download-cert`, etc.), then delete
    # it. Isolated here so a CephFS hiccup can't stall the default/native
    # workers; tag delivery scripts with worker tag "certs". Non-privileged.
    - name: certs
      replicas: 1
      mode: worker
      controller: Deployment
      # Reads ONE Secret (monitoring/aruba-apin0325-cert), the only kube-API call
      # of the only script on this tag (f/infra_certs/aruba_aos6_cert_sync, the
      # sole `certs` job path in 30 d). Role in windmill/rbac/rbac.yml.
      serviceAccountName: windmill-worker-certs
      privileged: false
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      # Serve ONLY the custom "certs" tag so cert-delivery scripts (tagged
      # "certs") run here — the only worker mounting /staging. Dependency/lock
      # jobs keep their language tags and run on the default workers.
      extraEnv:
        - name: WORKER_TAGS
          value: "certs"
      volumes:
        - name: cert-staging
          persistentVolumeClaim:
            claimName: cert-staging
        # Pod-lifetime dep cache: an OOM kill restarts only the container, so
        # this emptyDir keeps /tmp/windmill/cache (uv wheels + py_runtime)
        # warm across restarts — otherwise each OOM wipes the cache and the
        # next job start re-bursts cold, a self-sustaining crash loop.
        - name: dep-cache
          emptyDir: {}
      volumeMounts:
        - name: cert-staging
          mountPath: /staging
        - name: dep-cache
          mountPath: /tmp/windmill/cache
      resources:
        # Explicit request so this pod stops reserving its whole 2Gi limit for
        # a steady ~190Mi (see the default group above / study E8). No VPA on
        # this deployment, so nothing will overwrite it.
        requests:
          memory: 512Mi
        limits:
          # 4Gi since 2026-08-10: the cold-cache uv install burst at aos6 job
          # start OOM-killed the worker at 2Gi on 08-09 and 08-10 (exit 137
          # <40s after start, too fast for the 30s scrape). The dep-cache
          # emptyDir above removes the burst on restarts; 4Gi absorbs the one
          # cold burst after a genuine pod replacement.
          memory: 4Gi
    # Dedicated group for hours-scale slot holders (infra-health ledger
    # ext:windmill-worker-pool-contention): the nightly rgw_offsite_backup
    # held a default slot for 5h+ (02:00-07:10), which together with the
    # hourly skill_dispatch hold (15-90 min) left ONE free default slot — a
    # third long job starved the whole heal/probe layer for ~25 min on
    # 2026-08-07. Scripts tagged "long" run here; the 3 default slots stay
    # for short latency-sensitive jobs. The dispatcher deliberately stays on
    # default: on this 1-slot group it would queue behind the 5h backup.
    - name: long
      replicas: 1
      mode: worker
      controller: Deployment
      # No kube-API token: the only `long` job path in 30 d is
      # f/config_backup/rgw_offsite_backup, which makes no kube-API call.
      serviceAccountName: windmill-worker-nokube
      automountServiceAccountToken: false
      privileged: false
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      # 6h grace: let an in-flight nightly backup finish during a roll
      terminationGracePeriodSeconds: 21600
      extraEnv:
        - name: WORKER_TAGS
          value: "long"
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 2Gi
    # Scripts that CHANGE PROD objects or exec into pods (infra-az8.19.2,
    # option A): tag them "heal". This group's account holds the write/exec
    # verbs (windmill-worker-heal in windmill/rbac/rbac.yml); `default` keeps
    # only reads. Unprivileged from the start: no heal script needs host
    # access (node_opt_image_prune's hostPath lives in the Job it creates).
    # One slot: 7 d of these scripts = ~34 h busy, mostly short 5-min heals.
    # Dependency/lock jobs keep their language tags and run on default.
    - name: heal
      replicas: 1
      mode: worker
      controller: Deployment
      serviceAccountName: windmill-worker-heal
      privileged: false
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      terminationGracePeriodSeconds: 600
      extraEnv:
        - name: WORKER_TAGS
          value: "heal"
      volumes:
        # Same pod-lifetime dep cache as the certs group above.
        - name: dep-cache
          emptyDir: {}
      volumeMounts:
        - name: dep-cache
          mountPath: /tmp/windmill/cache
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 4Gi
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    ## DEMO 2026-09-24 (RUM -> backend traces): continue the browser's W3C traceparent
    ## on THIS host only. The global rke2-ingress-nginx-config keeps trust OFF on purpose
    ## (a client can force sampling). With the global ratio at 0.5, trusting it here raises
    ## the worst case from 0.5 to 1.0 spans per request on this one host, i.e. 2x, not unbounded.
    ## The RUM bootstrap (rum-assets-cm.yml) only injects traceparent on same-origin
    ## https://windmill.mdapi.ch/api/ calls, so there are no CORS preflights anywhere.
    ## ⛔ ingress-nginx IGNORES the trust annotation unless enable-opentelemetry is ALSO
    ## set on the Ingress itself (the annotation parser returns early without it; the
    ## global enable-opentelemetry=true does not count). Verified 2026-09-24: with trust
    ## alone the rendered server block still read `opentelemetry_trust_incoming_spans off`.
    nginx.ingress.kubernetes.io/enable-opentelemetry: "true"
    nginx.ingress.kubernetes.io/opentelemetry-trust-incoming-span: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding $rum_accept_encoding;
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '</head>' '<script defer src="https://rum.mdapi.ch/rum.js"></script></head>';
  tls:
    - secretName: windmill-cert
      hosts:
        - windmill.mdapi.ch
    