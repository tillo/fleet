apiVersion: v1
kind: Service
metadata:
  name: backlog-ui
  namespace: backlog
spec:
  selector:
    app: beads-app
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
# bd serve HTTP API for automation (Windmill ledger sync etc.).
# Bearer-token auth (backlog-serve-token); cluster-internal only.
apiVersion: v1
kind: Service
metadata:
  name: backlog-api
  namespace: backlog
spec:
  selector:
    app: beads-app
  ports:
  - name: http
    port: 8090
    targetPort: 8090
