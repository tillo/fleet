# Portable beads workspace definition for the in-cluster containers.
# Same project_id as the mbptillo workspace (~/backlog) — one project, one DB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beads-workspace
  namespace: backlog
data:
  config.yaml: |
    # In-pod workspace: no JSONL auto-export (the git-tracked export lives in
    # ~/backlog on mbptillo); the database is the source of truth.
    export.auto: false
  metadata.json: |
    {
      "database": "dolt",
      "backend": "dolt",
      "dolt_mode": "server",
      "dolt_server_host": "dolt",
      "dolt_server_user": "root",
      "dolt_database": "infra",
      "project_id": "46a6356b-aa9c-44bf-9829-92db5184a37f"
    }
  dolt-server.port: "3306"
  local_version: "1.2.1"
  bd-user-config.yaml: |
    metrics:
      disabled: true
