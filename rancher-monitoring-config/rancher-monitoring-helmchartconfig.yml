## Override the rancher-monitoring chart values for resource limits.
## Rancher Monitoring is installed via the helm-controller HelmChart CR
## (see `kubectl -n cattle-monitoring-system get helmcharts`), which
## reads merged values from any HelmChartConfig with the same name in
## the same namespace. This file is that override.
##
## What we patch and why:
##
##   prometheus-node-exporter.resources -- the chart ships with
##     req=200m / lim=200m (a Guaranteed-QoS hardcap). Under cluster-
##     event bursts (large pod creates, heavy disk-I/O scrape periods)
##     each node-exporter was throttling ~9% of CFS periods, which then
##     makes the underlying metrics arrive late and dashboard rows go
##     stale. Bumping the limit to 1c keeps it responsive; the request
##     stays at 200m so scheduling overhead is unchanged.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rancher-monitoring
  namespace: cattle-monitoring-system
spec:
  valuesContent: |-
    ## ── Embedded server stack RETIRED 2026-06-24 — VictoriaMetrics is the
    ## single source of truth ───────────────────────────────────────────────
    ## VM (monitoring ns, vmagent) independently scrapes every
    ## ServiceMonitor/PodMonitor this chart defines, so the bundled
    ## Prometheus/Alertmanager/Grafana are pure duplication (proven: the
    ## embedded Prometheus had 0 jobs that VM didn't already have). Disable the
    ## SERVER components but KEEP the exporters + ServiceMonitors —
    ## kube-state-metrics, node-exporter, and the kubeApiServer/kubelet/coreDns
    ## SMs (via kubernetesServiceMonitors=true, untouched) — so VM keeps
    ## scraping exactly as before. Harvester's own KubeVirt/CDI/Longhorn SMs
    ## are operator-owned and unaffected.
    ##
    ## Why this survives Harvester upgrades: the Harvester Addon CR only manages
    ## `enabled`/`version`; its valuesContent does NOT carry these component
    ## flags, and HelmChartConfig values WIN over the Addon valuesContent on
    ## conflict (verified live: node-exporter cpu-limit "2" from here beats the
    ## Addon's "1"). So the Addon's alertmanager.enabled:true -> false here.
    ##
    ## prometheus-adapter off too: no HPA uses custom/external metrics (all 6
    ## are Resource / rke2-metrics-server), so its v1beta1.custom.metrics.k8s.io
    ## APIService is unused; disabling removes that aggregated API cleanly
    ## instead of leaving it dangling against a dead Prometheus.
    ##
    ## TRADE-OFF: the Harvester dashboard's built-in host/VM graphs and the
    ## Rancher-UI "Monitoring -> Grafana" link go dark (they read the embedded
    ## Prometheus/Grafana). Use grafana.mdapi.ch (VM-backed) instead.
    ## ROLLBACK: remove the four `enabled: false` lines; Fleet re-enables them.
    prometheus:
      enabled: false
    alertmanager:
      enabled: false

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 200m
          memory: 150Mi
        limits:
          cpu: 2000m
          memory: 420Mi
      ## Filesystem collector exclusions. extraArgs is a LIST, so setting it REPLACES the chart's
      ## default list: both flags are carried here, fs-types-exclude VERBATIM from the chart default.
      ## Added to mount-points-exclude (2026-09-24): run/k3s/containerd/.+, the containerd sandbox
      ## tmpfs mounts (.../sandboxes/<id>/shm). node-exporter can't statfs them (EACCES), so each
      ## node reported 120-185 node_filesystem_device_error=1 series for them, burying real device
      ## errors (see the O2 alert lib_host_filesystem_device_error).
      ## Added 2026-11-07: var/lib/rancher/rke2/agent/containerd/tmpmounts/.+, containerd's
      ## seconds-long image-unpack scratch mounts (parent 0700, same EACCES). A scrape that lands
      ## on one paged lib_host_filesystem_device_error (o2 row infra-37y16). Test:
      ## tests/test_node_exporter_skips_unreadable_containerd_mounts.py.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|run/k3s/containerd/.+|var/lib/rancher/rke2/agent/containerd/tmpmounts/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$

    grafana:
      ## Embedded Grafana SERVER retired (see header) — use grafana.mdapi.ch.
      enabled: false
      ## 2026-07-29 dashboard audit: the chart-shipped CMs rancher-monitoring-prometheus
    ## (Prometheus/Overview — no Prometheus exists; replaced by the fleet-provisioned
    ## "VictoriaMetrics — single node" dashboard) and rancher-monitoring-nodes-darwin
    ## (macOS node exporter — no macOS targets) were DELETED from cattle-dashboards.
    ## A future rancher-monitoring chart upgrade may recreate them — re-delete then.
    ## ...but still SHIP its default dashboard ConfigMaps (Kubernetes / Node /
      ## etcd / CoreDNS / apiserver / kubelet / Prometheus / ...). They land in
      ## cattle-dashboards (grafana.defaultDashboards.namespace), which the custom
      ## Grafana's dashboard sidecar watches, and the annotation routes them into
      ## a "Kubernetes" Grafana folder (sidecar FOLDER_ANNOTATION=grafana_folder
      ## + provider foldersFromFilesStructure). Chart-maintained across upgrades.
      ## NOTE: the Rancher-specific dashboards gate on grafana.enabled (NOT
      ## forceDeployDashboards) so they are NOT shipped here — they're added as
      ## Fleet CMs in the grafana-extra-dashboards bundle instead.
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes
      ## (resources kept-but-ignored while the server is disabled) Chart ships
      ## req=100m / lim=200m; bursts trip ContainerCpuThrottling — CPU lim 1c.
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: 1000m
          memory: 500Mi

    prometheus-adapter:
      ## Retired (see header): no HPA consumes custom metrics, and it has no
      ## Prometheus to query once the server is gone.
      enabled: false
      ## (kept-but-ignored while disabled) Chart ships NO resource requests/limits (BestEffort QoS) and a tight
      ## liveness (/healthz HTTPS, timeout 5s, failureThreshold 3 -> kill after
      ## ~30s of slow /healthz). Under custom-metrics query load the adapter
      ## burns ~1.3c, its /healthz times out, and it gets liveness-killed in a
      ## restart loop (~31 restarts, "http: Handler timeout"). Note: HPA CPU
      ## metrics come from rke2-metrics-server, not this; only custom metrics
      ## are affected. Give it resources (out of BestEffort) + a tolerant
      ## liveness/readiness so a slow /healthz can't kill it.
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        # Bumped cpu limit 2->4 (2026-06-15): still ContainerCpuThrottling under
        # custom-metrics query load at 2 cores (the adapter rules are expensive).
        limits:
          cpu: "4"
          memory: 2Gi
      livenessProbe:
        httpGet:
          path: /healthz
          port: https
          scheme: HTTPS
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 15
        failureThreshold: 6
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /healthz
          port: https
          scheme: HTTPS
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 15
        failureThreshold: 6
        successThreshold: 1

    ## Expose the cpu-throttle-exempt pod label through kube-state-metrics so
    ## the ContainerCpuThrottling rule (monitoring-rules/18-cpu-throttling.yml)
    ## can subtract intentionally CPU-capped, burst-to-lid workloads (frigate,
    ## tdarr, certspotter, ...) via `unless on(namespace,pod) kube_pod_labels`.
    ## A workload opts out by setting on its POD TEMPLATE the label
    ##   monitoring.mdapi.ch/cpu-throttle-exempt: "true"
    ## Scoped to that single key (not pods=[*]) to keep cardinality minimal.
    ## NOTE: this list REPLACES the base value (helm-controller overwrites list
    ## values from a HelmChartConfig), so nodes=[*] must be restated to keep it.
    kube-state-metrics:
      metricLabelsAllowlist:
        - nodes=[*]
        - pods=[monitoring.mdapi.ch/cpu-throttle-exempt]
      ## ⛔ No `secrets` collector (SA token audit 2026-11-10, infra-p6q07.4):
      ## it gave KSM's SA list/watch on EVERY Secret, the two cluster-admin
      ## token Secrets included, and nothing reads kube_secret_*. The chart
      ## derives --resources AND its ClusterRole from this list. It REPLACES
      ## the chart default, so it restates every other default collector.
      ## tests/test_kube_state_metrics_does_not_watch_secrets.py
      collectors:
        - certificatesigningrequests
        - configmaps
        - cronjobs
        - daemonsets
        - deployments
        - endpoints
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - leases
        - limitranges
        - mutatingwebhookconfigurations
        - namespaces
        - networkpolicies
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - poddisruptionbudgets
        - pods
        - replicasets
        - replicationcontrollers
        - resourcequotas
        - services
        - statefulsets
        - storageclasses
        - validatingwebhookconfigurations
        - volumeattachments
      ## VPA recommendation floors (2026-11-04, infra-r9mzd.5). KSM 2.x has no
      ## built-in VPA collector, so there was no VPA series at all and a pod
      ## admitted UNMUTATED while the VPA webhook was down (failurePolicy Ignore,
      ## 11-03 qua outage) was invisible. Feeds PodBelowVpaFloor in
      ## monitoring-rules/80-vpa-admission.yml. Memory only: KSM 2.17 keeps ONE
      ## family per metric name, so a second cpu entry under the same name was
      ## silently dropped (measured 11-04: 76 series, all resource=memory), and
      ## the alert reads memory only. 76 series. Quantities are parsed by KSM.
      rbac:
        extraRules:
          - apiGroups: ["autoscaling.k8s.io"]
            resources: ["verticalpodautoscalers"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: autoscaling.k8s.io
                  kind: VerticalPodAutoscaler
                  version: v1
                metricNamePrefix: kube
                labelsFromPath:
                  namespace: [metadata, namespace]
                  verticalpodautoscaler: [metadata, name]
                  target_kind: [spec, targetRef, kind]
                  target_name: [spec, targetRef, name]
                  update_mode: [spec, updatePolicy, updateMode]
                metrics:
                  - name: verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound
                    help: VPA memory lowerBound per container, in bytes.
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [lowerBound, memory]

    ## ── apiserver histograms nothing reads (infra-8f4.51, 2026-11-07) ────────
    ## The apiserver scrape (job=apiserver, 3 instances, the ONLY job carrying
    ## these; no duplicate scrape) put ~240k series into vmsingle through these
    ## 8 _bucket metrics alone (TSDB status 2026-11-07, of 1.08M):
    ##   apiserver_request_duration_seconds_bucket       54.3k
    ##   apiserver_request_body_size_bytes_bucket        40.1k
    ##   etcd_request_duration_seconds_bucket            34.5k
    ##   apiserver_request_sli_duration_seconds_bucket   30.7k
    ##   apiserver_watch_list_duration_seconds_bucket    27.9k
    ##   apiserver_response_sizes_bucket                 20.5k
    ##   apiserver_watch_cache_read_wait_seconds_bucket  19.3k
    ##   apiserver_watch_events_sizes_bucket             12.5k
    ## Consumers checked, all ZERO: every live VMRule/PrometheusRule (the
    ## kube-apiserver SLO/burnrate recording pyramid is NOT deployed: defaultRules
    ## create:false below, and monitoring-rules/35 deliberately skips it), all 75
    ## Grafana dashboards in grafana-pg + the 32 dashboard ConfigMaps, Grafana alert
    ## rules (0), ~/windmill, ~/fleet, the vmagent→O2 keep-list (only
    ## apiserver_admission_webhook_request_total), and vmsingle top_queries (last
    ## 20k queries / 7 d). The "Kubernetes / API server" dashboard's SLI panels read
    ## the never-deployed recording rules and were already dark; its Work Queue
    ## Latency panel reads workqueue_*_bucket, which is KEPT.
    ## Only the buckets go: _sum/_count stay, so mean latency/size per verb and
    ## resource remains queryable. To restore the SLO pyramid, drop the first rule
    ## (and expect +~85k series for request_duration + request_sli).
    ## This list REPLACES the chart default (Helm replaces lists): the last rule is
    ## the chart's own, copied verbatim from `helm get values rancher-monitoring
    ## --all` (108.0.2+up77.9.1-rancher.11); re-check it on a chart bump.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - {action: drop, sourceLabels: [__name__], regex: '(apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds)_bucket'}
        - {action: drop, sourceLabels: [__name__, le], regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'}

    ## The kubelet's eviction signal (infra-8f4.40). The chart's last cadvisor rule,
    ## drop [id, pod] =~ '.+;', drops EVERY pod-less cgroup -- including the root
    ## cgroup (id="/") whose working set IS the kubelet's memory.available input
    ## (capacity - root working set). Keeping the whole root cgroup costs ~12.8k
    ## series per node (fs/blkio per device, measured on qua 2026-11-04), so exactly
    ## ONE series is kept: container_memory_working_set_bytes{id="/"}. A temp label
    ## marks it, the drop spares the marked series, the marker is removed.
    ## This list REPLACES the chart default (Helm replaces lists), so the first seven
    ## rules are the chart's own, copied verbatim from
    ## `helm get values rancher-monitoring --all` (108.0.2+up77.9.1-rancher.11);
    ## re-check them on a chart bump. Recording rule:
    ## monitoring-rules/81-kubelet-memory-available.yml.
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - {action: drop, sourceLabels: [__name__], regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'}
        - {action: drop, sourceLabels: [__name__], regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'}
        - {action: drop, sourceLabels: [__name__], regex: 'container_memory_(mapped_file|swap)'}
        - {action: drop, sourceLabels: [__name__], regex: 'container_(file_descriptors|tasks_state|threads_max)'}
        - {action: drop, sourceLabels: [__name__, scope], regex: 'container_memory_failures_total;hierarchy'}
        - {action: drop, sourceLabels: [__name__, interface], regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'}
        - {action: drop, sourceLabels: [__name__], regex: 'container_spec.*'}
        - {action: replace, sourceLabels: [__name__, id], regex: 'container_memory_working_set_bytes;/', targetLabel: __tmp_kubelet_root, replacement: 'keep'}
        - {action: drop, sourceLabels: [id, pod, __tmp_kubelet_root], regex: '.+;;'}
        - {action: labeldrop, regex: '__tmp_kubelet_root'}

    ## ── STOP RENDERING RULES NOTHING EVALUATES (2026-10-05) ─────────────────
    ## `create: false` stops the chart shipping its whole default rule set at all.
    ## This is the honesty half of the 2026-10-05 rule-load finding (ledger
    ## alert:RancherMonitoringRulesNeverEvaluated): vmalert-mdapi is the ONLY rule
    ## evaluator here and it selects with `monitoring-stack: mdapi`, which none of
    ## the chart's rules carry — so all of them are inert. They render, they read
    ## as coverage in every UI, and nothing evaluates them.
    ##
    ## Measured before this change: 96 VMRule objects in the cluster, 62 selected
    ## carrying 615 rules, 34 unselected carrying 368 rules. 30 of those 34 objects
    ## (208 rules) are `cattle-monitoring-system/rancher-monitoring-*` and come from
    ## THIS chart — that is what this line removes.
    ##
    ## ⛔ The other 4 objects / 160 rules are NOT removable from here and are
    ## recorded so nobody hunts for a knob that does not exist:
    ##   rook-ceph/prometheus-ceph-rules                 89  (rook-ceph-cluster)
    ##   harvester-system/prometheus-kubevirt-rules      51  (Harvester kubevirt)
    ##   harvester-system/prometheus-cdi-rules           12  (Harvester CDI)
    ##   longhorn-system/prometheus-longhorn-rules        8  (Harvester Longhorn)
    ## They come from other charts/operators. The coverage they would have given is
    ## instead re-provided by our own rules under the mdapi label — see
    ## monitoring-rules/60-harvester-vm-cdi.yml (KubeVirt/CDI) and app-ceph.
    ##
    ## ⛔ WHY NOT `selectAllByDefault: true` ON THE VMAlert INSTEAD: that is the same
    ## lie in the other direction, at ten times the volume. It would load rules that
    ## watch a Prometheus server this estate retired, NVMe-oF and RBD-mirror rules for
    ## hardware that is not here, and node-exporter rules for collector names we do not
    ## use — all of which then fire, or worse, sit silently green. Widening the
    ## selector is done deliberately, one reviewed file at a time.
    ##
    ## ⚠️ THE VMRule ORPHANS MUST BE DELETED BY HAND AFTER THIS MERGES. The chart owns
    ## the PrometheusRules and Helm will remove those, but the vm-operator copies
    ## PrometheusRule→VMRule and sets NO ownerReferences (verified: 0 of the 34
    ## unselected VMRule objects have any ownerReference), so nothing garbage-collects
    ## the copies. Leaving them is exactly the state this change exists to end — an
    ## inventory of rules that mean nothing. Removal procedure and the saved manifest
    ## of what was deleted: ~/ih-rl-20261005/honesty-fix/
    ## A future re-render of these objects (a chart change that ignores this value) is
    ## caught by NewUnevaluatedRuleObject in monitoring-rules/59-rule-load-coverage.yml,
    ## which fires on an object that BECAME inert rather than on the standing set.
    ##
    ## KEPT despite being dead config while `create` is false: if anyone ever turns the
    ## default rules back on, these are the ones that must stay off.
    defaultRules:
      create: false
      disabled:
        CPUThrottlingHigh: true
        NodeSystemSaturation: true
        NodeBondingDegraded: true
        NodeDiskIOSaturation: true
