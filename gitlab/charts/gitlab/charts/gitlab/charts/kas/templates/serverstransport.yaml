{{- /* Lets Traefik verify the KAS certificate, like the proxy-ssl-* annotations do for NGINX. */ -}}
{{- if eq (include "kas.traefik.serversTransport.enabled" .) "true" -}}
apiVersion: {{ default "traefik.io/v1alpha1" .Values.global.traefik.apiVersion }}
kind: ServersTransport
metadata:
  name: {{ template "fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
spec:
  serverName: {{ include "gitlab.kas.serviceHost" . }}
  {{- if .Values.global.kas.tls.verify }}
  {{- with .Values.global.kas.tls.caSecretName }}
  rootCAs:
    - secret: {{ . }}
  {{- end }}
  {{- else }}
  insecureSkipVerify: true
  {{- end }}
{{- end -}}
