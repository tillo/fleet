{{- /* Traefik sets the backend protocol per Service, and the k8s-proxy behind the main Service does not accept h2c. */ -}}
{{- if and (eq .Values.global.ingress.provider "traefik") (eq (include "kas.ingress.grpc.render" .) "true") -}}
{{- $scheme := ternary "https" "h2c" (eq $.Values.global.kas.tls.enabled true) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "kas.ingress.grpc.serviceName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.serviceLabels" . | nindent 4 }}
  annotations:
    {{- include "kas.traefik.serviceAnnotations" (dict "context" . "scheme" $scheme) | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.service.trafficDistribution }}
  trafficDistribution: {{ .Values.service.trafficDistribution | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.service.externalPort }}
      targetPort: {{ .Values.service.internalPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-grpc
  selector:
    {{- include "kas.podSelectorLabels" . | nindent 4 }}
{{- end -}}
