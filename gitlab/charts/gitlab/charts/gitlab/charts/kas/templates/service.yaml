{{- if .Values.global.kas.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "gitlab.kas.serviceName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.serviceLabels" . | nindent 4 }}
  annotations:
    {{- if eq (include "kas.traefik.serversTransport.enabled" .) "true" }}
    {{- include "kas.traefik.serviceAnnotations" (dict "context" . "scheme" "https") | nindent 4 }}
    {{- else }}
    {{- include "gitlab.serviceAnnotations" . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type | quote }}
  {{- if (eq .Values.service.type "LoadBalancer") }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
  {{- range .Values.service.loadBalancerSourceRanges }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.service.trafficDistribution }}
  trafficDistribution: {{ .Values.service.trafficDistribution | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.service.externalPort }}
      targetPort: {{ .Values.service.internalPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-external-api
      {{- with .Values.service.appProtocol }}
      appProtocol: {{ . | quote }}
      {{- end }}
    - port: {{ .Values.global.kas.service.apiExternalPort }}
      targetPort: {{ .Values.service.apiInternalPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-internal-api
      {{- with .Values.service.appProtocol }}
      appProtocol: {{ . | quote }}
      {{- end }}
    - port: {{ .Values.service.kubernetesApiPort }}
      targetPort: {{ .Values.service.kubernetesApiPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-k8s-api
  {{- if .Values.metrics.enabled }}
    - port: {{ .Values.observability.port }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  {{- end }}
  {{- if (.Values.workspaces).enabled }}
    - port: {{ .Values.service.workspacesServerPort }}
      targetPort: {{ .Values.service.workspacesServerPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-workspaces-server
  {{- end }}
  selector:
    {{- include "kas.podSelectorLabels" . | nindent 4 }}
{{- end -}}
