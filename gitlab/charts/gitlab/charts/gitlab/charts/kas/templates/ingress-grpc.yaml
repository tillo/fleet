{{- if eq (include "kas.ingress.grpc.render" .) "true" -}}
{{- $hostname := include "gitlab.kas.hostname" . | trim -}}
{{- $tlsSecret := include "kas.tlsSecret" . -}}
{{- $ingressCfg := dict "global" .Values.global.ingress "local" .Values.ingress "context" . -}}
{{- $isIngressProviderNginx := eq .Values.global.ingress.provider "nginx" -}}
{{- $isIngressProviderTraefik := eq .Values.global.ingress.provider "traefik" -}}
apiVersion: {{ template "gitlab.ingress.apiVersion" $ingressCfg }}
kind: Ingress
metadata:
  name: {{ template "fullname" . }}-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
  annotations:
    kube-score/ignore: ingress-targets-service
    {{ include "ingress.class.annotation" $ingressCfg }}
    kubernetes.io/ingress.provider: "{{ template "gitlab.ingress.provider" $ingressCfg }}"
    {{- if $isIngressProviderNginx }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if $.Values.global.kas.tls.enabled }}
    nginx.ingress.kubernetes.io/backend-protocol: "GRPCS"
    {{-   if $.Values.global.kas.tls.verify }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    {{- $serviceAddress := include "gitlab.assembleServiceAddress" (dict "name" (include "fullname" .) "context" $) }}
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ $serviceAddress }}
    {{-     if $.Values.global.kas.tls.caSecretName }}
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ $.Release.Namespace }}/{{ $.Values.global.kas.tls.caSecretName }}
    {{-     end }}
    {{-   end }}
    {{- else }}
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    {{- end }}
    {{- end }}
    {{- if $isIngressProviderTraefik }}
    {{- /* A plain prefix, because Traefik PathRegexp is unanchored. Explicit, in case the default matcher changes. */}}
    traefik.ingress.kubernetes.io/router.pathmatcher: PathPrefix
    {{- end }}
  {{- range $key, $value := merge .Values.ingress.annotations .Values.global.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
spec:
  {{ include "ingress.class.field" $ingressCfg }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          {{- if $isIngressProviderTraefik }}
          - path: /gitlab.agent.
          {{- else }}
          - path: /gitlab\.agent\.(.+)
          {{- end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ template "kas.ingress.grpc.serviceName" . }}
                port:
                  number: {{ .Values.service.externalPort }}
  {{- if (and $tlsSecret (eq (include "gitlab.ingress.tls.enabled" $) "true")) }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ $tlsSecret }}
  {{- else }}
  tls: []
  {{- end }}
{{- end }}
