# Default values for gitlab-kas.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

annotations: {}
global:
  ingress: {}
  kas:
    enabled: true
  workspaces:
    enabled: false
  redis:
    # host: '0.0.0.0'
    auth: {}
  # hosts:
    # kas:
      # name: kas.example.com
      # https: true
    # workspaces:
      # name: workspaces.example.com

init:
  image: {}
    # repository:
    # tag:
  resources:
    requests:
      cpu: 50m
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ "ALL" ]

hpa:
  # targetAverageValue: 100m  # DEPRECATED: in favor of `hpa.cpu.targetAverageValue` below
  cpu:
    targetType: AverageValue  # Utilization or AverageValue
    targetAverageValue: 100m
    # targetAverageUtilization: 75
  # memory:
  #   targetType: Utilization  # Utilization or AverageValue
  #   targetAverageValue: 1G
  #   targetAverageUtilization: 75
  # Note that the HPA is limited to autoscaling/v2beta1, autoscaling/v2beta2 and autoscaling/v2
  customMetrics: []  # Overrides HPA metrics definition
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  # When Cluster Autoscaler (CA) wants to shut down a node, it only waits for up to 10 minutes for Pods
  # to shut down and then terminates them anyway.
  # This might not be enough for kas to drain all proxied connections.
  # Hence, you might want to configure CA to not evict kas.
  safeToEvict: "true"

keda:
  enabled: false
  ## See https://keda.sh/docs/2.10/concepts/scaling-deployments/#scaledobject-spec
  pollingInterval: 30
  cooldownPeriod: 300
  # minReplicaCount: 2
  # maxReplicaCount: 10
  # fallback:
  #   failureThreshold: 3
  #   replicas: 6
  # hpaName: keda-hpa-{scaled-object-name}
  # restoreToOriginalReplicaCount: false
  # behavior: {}
  # triggers: []

image:
  repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-kas
  # tag: latest
  # pullPolicy: IfNotPresent
  # pullSecrets: []

gatewayRoute:
  enabled: null
  sectionName: "kas-web"
  workspacesSectionName: "kas-workspaces-web"
  gatewayName: ""
  gatewayNamespace: ""
  annotations: {}
  filters: []

backendTLSPolicy:
  hostname: ""

# Envoy Gateway BackendTrafficPolicy rendered for the KAS HTTPRoute.
# Set `spec: null` to skip rendering the policy.
backendTrafficPolicy:
  spec:
    useClientProtocol: true

# Envoy Gateway ClientTrafficPolicy rendered for the KAS listener (gatewayRoute.sectionName).
# Envoy Gateway stops advertising HTTP/2 (ALPN h2) on a listener whose certificate overlaps
# with another listener on the same port, for example one wildcard certificate shared by
# every host (Gateway API GEP-3567). Agents need HTTP/2 for native gRPC (grpcs://), so the
# chart enables it explicitly on the KAS listener only. When `spec.targetRefs` is omitted the
# chart injects the Gateway and listener reference. Set `spec: null` to skip the policy.
clientTrafficPolicy:
  spec:
    tls:
      alpnProtocols:
        - h2
        - http/1.1

ingress:
  apiVersion:
  annotations: {}
  tls: {}
  agentPath: /
  workspacesServerApiPath: /workspaces
  k8sApiPath: /k8s-proxy
  grpc:
    # DEPRECATED, planned for removal in GitLab 20.0 (chart 11.0): use
    # `global.kas.ingress.grpc.enabled`. This local toggle still wins for the
    # Ingress itself, but it is invisible to the webservice, sidekiq and toolbox
    # charts, so it does not change the advertised grpcs:// or wss:// URL.
    enabled:
maxReplicas: 10
maxUnavailable: 1
minReplicas: 2
podLabels: {}
common:
  labels: {}
serviceLabels: {}
## Additional environment variables to set
extraEnv: {}
extraEnvFrom: {}
resources:
  requests:
    cpu: 100m
    memory: 256Mi
service:
  externalPort: 8150
  internalPort: 8150
  workspacesServerPort: 8160
  apiInternalPort: 8153
  kubernetesApiPort: 8154
  privateApiPort: 8155
  type: ClusterIP
  # loadBalancerIP:
  # loadBalancerSourceRanges:
  # See https://kubernetes.io/docs/concepts/services-networking/service/#traffic-distribution
  # trafficDistribution: PreferClose
  #
  # appProtocol:
  # Sets Service.spec.ports[].appProtocol on the gRPC-carrying ports
  # (external-api, internal-api), e.g. "grpc" or "kubernetes.io/h2c". Left
  # unset by default. Set it if your mesh/ingress needs an explicit
  # protocol hint to avoid downgrading kas's gRPC tunnel to HTTP/1.1.
  appProtocol: ""
metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    endpointConfig: {}
  podMonitor:
    enabled: false
    additionalLabels: {}
    endpointConfig: {}
observability:
  port: 8151
  livenessProbe:
    path: /liveness
  readinessProbe:
    path: /readiness
serviceAccount:
  enabled: false
  create: false
  annotations: {}
  ## Used for local override of global ServiceAccount token mounting
  # automountServiceAccountToken: false
  ## Name to be used for serviceAccount, otherwise defaults to chart fullname
  # name:
# Tolerations for pod scheduling
tolerations: []

# Pod-level DNS configuration. Overrides `global.dnsConfig` when set.
# See https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}
workhorse: {}
  # by default, Workhorse is a part of the Webservice Pods / Service
  # scheme: 'http'
  # host: '0.0.0.0'
  # serviceName: 'webservice'
  # port: 8181
# merged with the default kas config
customConfig: {}

websocketToken: {}
  # secret:
  # key:

privateApi: {}
  # secret:
  # key:

workspaces:
  listenGracePeriod: "1s"
  shutdownGracePeriod: "300s"

deployment:
  terminationGracePeriodSeconds: 300
  strategy: {}
  # revisionHistoryLimit: 10
  # minReadySeconds: 0

## Allow to overwrite under which User and Group the Pod will be running.
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: "RuntimeDefault"

## Allow to overwrite the specific security context under which the container is running.
containerSecurityContext:
  runAsUser: 65532
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ "ALL" ]

networkpolicy:
  enabled: false
  egress:
    enabled: false
    rules: []
  ingress:
    enabled: false
    rules: []
  annotations: {}

affinity:
  podAntiAffinity:
    topologyKey:
  nodeAffinity:
       key:
       values:

# Priority class assigned to pods
priorityClassName: ""

## Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in.
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []
 # - labelSelector:
 #     matchLabels:
 #       app: name
 #     maxSkew: 1
 #     topologyKey: topology.kubernetes.io/zone
 #     whenUnsatisfiable: DoNotSchedule
