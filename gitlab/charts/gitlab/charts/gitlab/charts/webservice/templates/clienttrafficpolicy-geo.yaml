{{- if and .Values.enabled (eq "true" (include "gitlab.gatewayApi.configureEnvoy" .)) (eq "true" (include "gitlab.gatewayApi.gateway.sameNamespace" .)) (eq "true" (include "gitlab.gatewayApi.gateway.geo.configure" .)) }}
{{/*
ClientTrafficPolicy targeting the Geo Rails listener (gitlab-web-geo).
Keeps paths with escaped slashes unchanged, as they are commonly used
in GitLab API calls to identify projects.

Only rendered when the Gateway is in the same namespace as this release: targetRefs below
uses a LocalPolicyTargetReference, which has no namespace field.
*/}}
{{- $spec := deepCopy .Values.clientTrafficPolicy.geo.spec }}
{{- if not $spec.targetRefs }}
{{-   $ref := (include "webservice.gatewayApi.gatewayRef.geo" . | fromYamlArray) }}
{{-   $_ := unset (first $ref) "namespace" }}
{{-   $_ := set $spec "targetRefs" $ref }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ template "fullname" . }}-ctp-geo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
spec:
  {{- $spec | toYaml | nindent 2 }}
{{- end }}
