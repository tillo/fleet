{{- if .Values.enabled -}}
{{-   if eq "true" (include "gitlab.gatewayApi.route.enabled" .) -}}
{{-     if eq "true" (include "gitlab.gatewayApi.envoy.installRoutePolicies" .) -}}
{{-       if and .Values.global.shell.tcp.proxyProtocol (eq "true" (include "gitlab.shell.proxyProtocol.outbound" .)) -}}
{{-         if .Values.backendTrafficPolicy.spec -}}
{{/* See values.yaml and the chart docs for the default spec, render conditions, and rationale. */}}
{{- $spec := deepCopy .Values.backendTrafficPolicy.spec }}
{{- if not $spec.targetRefs }}
{{-   $ref := dict "group" "gateway.networking.k8s.io" "kind" "TCPRoute" "name" (include "fullname" .) }}
{{-   $_ := set $spec "targetRefs" (list $ref) }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ template "fullname" . }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
spec:
  {{- $spec | toYaml | nindent 2 }}
{{-         end }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}
