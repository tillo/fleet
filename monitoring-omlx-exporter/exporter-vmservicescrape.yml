## Each scrape is one call to /api/status and one to /admin/api/stats over the
## bridge (~40 ms together). 30s matches vmagent's default interval.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: omlx-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: omlx-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 15s
