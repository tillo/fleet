            - footsteps
            - fire
            - car_alarm
            - power_tool
            - drill
            - gunshot
            - glass
            - smash
            - breaking
            - crushing
        objects:
          filters:
            # fast cyclists crossing the driveway score low per-frame; let weak
            # frames start a track (event creation still gated by threshold 0.7)
            person:
              min_score: 0.4
            bicycle:
              min_score: 0.4

    objects:
      track:
        - person
        - bicycle
        - car
        - motorcycle
        - bird
        - cat
        - hat
        - backpack
        - umbrella
        - knife
        - face
        - package
        - dog
      filters:
        umbrella:
          threshold: 0.9
        knife:
          threshold: 0.9
        bird:
          threshold: 0.9
        person:
          threshold: 0.7
        car:
          threshold: 0.8
        motorcycle:
          threshold: 0.8

    record:
      enabled: true
      alerts:
        retain:
          days: 42
      detections:
        retain:
          days: 42
    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true

    birdseye:
      enabled: true
      mode: continuous
      inactivity_threshold: 300
    version: 0.17-0
    semantic_search:
      enabled: true
      reindex: false
      model_size: small
    notifications:
      enabled: true
      email: 6a9vfiow4t@pomail.net
    detect:
      enabled: true
