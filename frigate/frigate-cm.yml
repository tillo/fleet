## Frigate's config.yaml, authoritative here (2026-08-16). It used to live only
## on the config PVC, where it could drift and was backed up nowhere.
##
## SECRETS ARE NOT IN THIS FILE and must never be: this repo is public. Every
## credential is an Akeyless static secret under
## /mdapi/frigate/frigate-env-secret/, delivered by frigate-es.yml and injected
## with envFrom. Frigate substitutes {FRIGATE_*} placeholders — including inside
## go2rtc.streams, which its create_config.py formats with the FRIGATE_* env
## vars before handing the block to go2rtc.
##
## This ConfigMap is mounted read-only over /config/config.yaml, so the Frigate
## UI's config editor cannot save. That is deliberate: git is the only source of
## truth. Change flow is edit here -> push -> Fleet applies -> restart Frigate
## (a subPath mount does not refresh in place).
##
## UPGRADE GOTCHA: Frigate logs "Config file is read-only, unable to migrate
## config file." at every start. Harmless while `version:` below matches the
## running Frigate (migrate_frigate_config() tests writability BEFORE deciding
## whether a migration is even needed, so it bails out either way). It stops
## being harmless the day a Frigate upgrade DOES need a config migration: it
## will skip it silently. When bumping the Frigate image, apply the migration
## here by hand and update `version:` in the same commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config-yaml
data:
  config.yaml: |
    detectors:
      coral:
        type: edgetpu
        device: usb

    model:
    # base: mobiledet	320x320	-	cpu	25/06/2025	2025.2
    #  path: plus://b045554b6a851da2d6dfecb34f3bcd81
    # custom: mobiledet	320x320	1991	cpu	01/09/2025	2025.2
    #  path: plus://8b882bbf9a2c40e858d0c3d0c3680e68
    # custom: mobiledet	320x320	2214	cpu	14/07/2026	2026.1
    #  path: plus://0412b84fedf089429370cc4353f11376
    # custom: mobiledet	320x320	2214	edgetpu	14/07/2026	2026.1
      path: plus://520b90f459b93071944148b26466f5f6

    mqtt:
      enabled: true
      host: eclipse-mosquitto.mqtt.svc.cluster.local
      port: 1883

    go2rtc:
      streams:
        cavecam: 
          "{FRIGATE_CAVECAM_STREAM}"
    #    doorbell:
    #      - "ffmpeg:doorbell#audio=aac#width=960#height=1280"
    #    balconycam:
    #      - "ffmpeg:balconycam#audio=aac#width=1920#height=1080"
    #    garagecam:
    #      - "ffmpeg:garagecam#audio=aac#width=1920#height=1080"
    # https://developers.google.com/nest/device-access/authorize
    # https://geoffhudik.com/tech/2023/03/04/trying-google-nest-api-with-postman-and-python/
    # https://developers.google.com/nest/device-access/api
        balconycam: 
          nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN_BALCONYCAM}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id={FRIGATE_NEST_DEVICE_ID_BALCONYCAM}
        doorbell: nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN_DOORBELL}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id={FRIGATE_NEST_DEVICE_ID_DOORBELL}
        garagecam: 
          nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN_GARAGECAM}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id={FRIGATE_NEST_DEVICE_ID_GARAGECAM}

    cameras:
      cavecam:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/cavecam
              roles:
                - detect
                - record
        zones: {}
        ## Indoor camera behind masks — no plates to read, no faces to name.
        lpr:
          enabled: false
        face_recognition:
          enabled: false
        motion:
          threshold: 60
          contour_area: 10
          improve_contrast: true
        objects:
          filters:
            ## 0.18-0: object filter masks are a dict keyed by mask id, not a
            ## bare coordinate string. Values below are verbatim what Frigate's
            ## own migrate_018_0() emits for the previous one-line form.
            bicycle:
              mask:
                object_mask_1:
                  friendly_name: Object Mask 1 (bicycle)
                  enabled: true
                  coordinates: 0,0.108,0.882,0.519,0.902,1,0,1
            car:
              mask:
                object_mask_1:
                  friendly_name: Object Mask 1 (car)
                  enabled: true
                  coordinates: 0.37,0.018,0.392,0.64,1,0.929,1,0.027
    #  gardencam:
    #    onvif:
    #      port: 888
    #      user: tillo
    #    ffmpeg:
    #      inputs:
    #          roles:
    #            - audio
    #            - detect
    #            - record
    #      output_args:
    #        record: preset-record-generic-audio-aac
    #    audio:
    #      enabled: true
    #      listen:
    #        - fire_alarm
    #        - scream
    #        - yell
    #        - whispering
    #        - crying
    #        - grunt
    #        - pant
    #        - cough
    #        - breathing
    #        - sneeze
    #        - sniff
    #        - run
    #        - footsteps
    #        - fire
    #        - car_alarm
    #        - power_tool
    #        - drill
    #        - gunshot
    #        - glass
    #        - smash
    #        - breaking
    #        - crushing
    #    motion:
    #      threshold: 200
    #      contour_area: 50
    #      improve_contrast: true
    #    zones: {}
    #    objects:
    #      filters:
    #        car:
    #          mask: 0.907,0.484,0.792,0,1,0,1,1,0.77,1

    #  doorbell:
    #    ffmpeg:
    #      inputs:
    #        - path: rtsp://127.0.0.1:8554/doorbell
    #          roles:
    #            - audio
    #            - detect
    #      output_args:
    #            - record
    #          record: preset-record-generic-audio-aac
    #    audio:
    #      listen:
    #      enabled: true
    #        - fire_alarm
    #        - scream
    #        - yell
    #        - whispering
    #        - crying
    #        - grunt
    #        - pant
    #        - cough
    #        - breathing
    #        - sneeze
    #        - sniff
    #        - run
    #        - footsteps
    #        - fire
    #        - car_alarm
    #        - power_tool
    #        - drill
    #        - gunshot
    #        - glass
    #        - smash
    #        - breaking
    #        - crushing

      doorbell:
        enabled: true
        ## Face recognition runs here only — the front door is the one place a
        ## face is both reliably framed and worth naming. We already track the
        ## `face` label and were throwing the result away.
        ##
        ## No faces are enrolled yet, so everything scores as unknown until
        ## someone is trained through the UI; that is the intended starting
        ## state, not a misconfiguration. save_attempts (200) keeps a pool of
        ## crops to train FROM, which is why enrolment should come after this
        ## has run for a while rather than before.
        face_recognition:
          enabled: true
        lpr:
          enabled: false
        ## guests: people arriving at the door is the expected state during a
        ## gathering, so stop NOTIFYING without losing detection or recording —
        ## the events are still there to review afterwards.
        profiles:
          guests:
            notifications:
              enabled: false
        ## The front door is the one camera where a delivery IS the event, so
        ## it overrides the global alerts.labels (person only) to promote
        ## packages and courier liveries. A courier label without `package`
        ## still alerts: the van arriving is the useful early signal.
        review:
          alerts:
            labels:
              - person
              - package
              - dhl
              - dpd
              - ups
              - fedex
              - gls
              - amazon
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/doorbell
              roles:
                - audio
                - detect
                - record
          output_args:
            record: preset-record-generic-audio-aac
        audio:
          enabled: true
          listen:
            - fire_alarm
            - scream
            - yell
            - whispering
            - crying
            - grunt
            - pant
            - cough
            - breathing
            - sneeze
            - sniff
            - run
            - footsteps
            - fire
            - car_alarm
            - power_tool
            - drill
            - gunshot
            - glass
            - smash
            - breaking
            - crushing

      balconycam:
        ## Neither enrichment earns its cost here: no vehicles, and faces on a
        ## balcony are framed too incidentally to name reliably.
        lpr:
          enabled: false
        face_recognition:
          enabled: false
        ## guests: the balcony is where people stand during a gathering, and it
        ## is our highest-traffic detector (23 det_fps under load). Same
        ## treatment as the door: keep recording, stop notifying.
        profiles:
          guests:
            notifications:
              enabled: false
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/balconycam
              roles:
                - audio
                - detect
          output_args:
            record: preset-record-generic-audio-aac
        audio:
          enabled: true
          listen:
            - fire_alarm
            - scream
            - yell
            - whispering
            - crying
            - grunt
            - pant
            - cough
            - breathing
            - sneeze
            - sniff
            - run
            - footsteps
            - fire
            - car_alarm
            - power_tool
            - drill
            - gunshot
            - glass
            - smash
            - breaking
            - crushing

      garagecam:
        ## LPR runs here only: this is the camera that watches the driveway.
        ## It keys off `car`/`motorcycle` objects (already tracked) and crops
        ## the plate out of the car box — the model's own `license_plate` label
        ## is only needed for a DEDICATED plate camera, which this is not.
        ##
        ## known_plates is intentionally EMPTY to start. Plates are still read,
        ## published on tracked_object_update over MQTT and searchable; nothing
        ## is classified as known until real plates are added here. Do that from
        ## observed detections rather than by typing them from memory — OCR has
        ## its own idea of O vs 0, which is what match_distance (1) absorbs.
        lpr:
          enabled: true
        face_recognition:
          enabled: false
        ## away: with nobody home a car in the driveway is exactly the thing
        ## worth knowing about, so it goes back to being an alert. This is the
        ## override that makes demoting `car` globally safe.
        profiles:
          away:
            review:
              alerts:
                labels:
                  - person
                  - car
                  - package
                  - dhl
                  - dpd
                  - ups
                  - fedex
                  - gls
                  - amazon
        ## Driveway: deliveries usually arrive here rather than at the door, so
        ## it gets the same promotion as doorbell. `car` stays a detection —
        ## demoting it is the entire point of the review block (it was alerting
        ## on our own car several times a day).
        review:
          alerts:
            labels:
              - person
              - package
              - dhl
              - dpd
              - ups
              - fedex
              - gls
              - amazon
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/garagecam
              roles:
                - audio
                - detect
          output_args:
            record: preset-record-generic-audio-aac
        audio:
          enabled: true
          listen:
            - fire_alarm
            - scream
            - yell
            - whispering
            - crying
            - grunt
            - pant
            - cough
            - breathing
            - sneeze
            - sniff
            - run
            - footsteps
            - fire
            - car_alarm
            - power_tool
            - drill
            - gunshot
            - glass
            - smash
            - breaking
            - crushing
        objects:
          filters:
            # fast cyclists crossing the driveway score low per-frame; let weak
            # frames start a track (event creation still gated by threshold 0.7)
            person:
              min_score: 0.4
            bicycle:
              min_score: 0.4

    objects:
      ## Every label here must exist in the model's labelmap or Frigate warns
      ## "configured to track [...] which are not supported by the current
      ## model" for EVERY camera at EVERY start and silently tracks nothing.
      ## Dropped 2026-09-13: hat, backpack, knife — absent from the current
      ## Frigate+ mobiledet model, so they had never done anything. Check with
      ## FrigateConfig.parse(...).model.merged_labelmap before adding a label.
      track:
        - person
        - bicycle
        - car
        - motorcycle
        - bird
        - cat
        - umbrella
        - face
        - package
        - dog
        ## Courier liveries, 2026-09-13. The model carries 14 of them; only the
        ## ones that actually deliver in Vaud are tracked, because every unused
        ## label is pure false-positive surface. Deliberately NOT tracked:
        ## an_post, canada_post, nzpost, postnl, postnord, purolator,
        ## royal_mail, usps. ⚠️ Swiss Post is NOT in the labelmap at all — a
        ## Swiss Post van is a plain `car`, so do not expect it here.
        - dhl
        - dpd
        - ups
        - fedex
        - gls
        - amazon
        ## Bin-out reminder without extra hardware.
        - waste_bin
      filters:
        umbrella:
          threshold: 0.9
        bird:
          threshold: 0.9
        person:
          threshold: 0.7
        car:
          threshold: 0.8
        motorcycle:
          threshold: 0.8
        ## Couriers drive ALERTS (see review.alerts below), so they are held
        ## above the 0.7 default: a false delivery notification is worse than a
        ## missed one, and the van is usually in frame for many frames. Lower
        ## these if real deliveries are being missed.
        dhl:
          threshold: 0.8
        dpd:
          threshold: 0.8
        ups:
          threshold: 0.8
        fedex:
          threshold: 0.8
        gls:
          threshold: 0.8
        amazon:
          threshold: 0.8

    ## GenAI: ON, and deliberately CLOUD. Owner decision 2026-09-13, after the
    ## investigation below established that a local option does not exist here.
    ##
    ## ⚠️ SNAPSHOTS OF THE HOUSE LEAVE THE ESTATE. `claude-haiku-4-5` goes
    ## through claude-shim on the Max subscription, so there is no per-token
    ## cost, but the image does go to Anthropic. That is the accepted trade;
    ## it is not a tuning knob, and the key below is scoped so it cannot
    ## silently become some other provider.
    ##
    ## Verified before enabling — and this is the check that was missing the
    ## first time: the reply's own `model` field says `claude-haiku-4-5`, so the
    ## answer came from the model we asked for and not from a fallback.
    genai:
      casa:
        provider: openai
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        api_key: "{FRIGATE_GENAI_API_KEY}"
        model: claude-haiku-4-5
        roles:
          - descriptions
          - chat

    ## ⛔ The history, kept because it nearly went unnoticed — do not "optimise"
    ## the model back to a local-sounding group without re-reading this.
    ##
    ## It was briefly enabled on 2026-09-13 pointing at the LiteLLM group
    ## `approfondito`, on the belief that this was a local model and therefore
    ## that snapshots never left the estate. That belief was WRONG, and the test
    ## that "confirmed" it was the thing that misled:
    ##
    ##   - `approfondito` resolves to hosted_vllm/google/gemma-4-26b-a4b, which
    ##     REJECTS images outright: "does not support image inputs".
    ##   - Its fallback chain is `approfondito: ["local-wg", "opus"]`, and
    ##     local-wg is the SAME model, so an image request walks the whole chain
    ##     and is answered by **opus — Anthropic, via claude-shim**.
    ##   - So the smoke test returned a cheerful IMAGE_OK in ~2s and proved the
    ##     exact opposite of what it was read as. Testing the GROUP NAME is not
    ##     testing the model that served it. Ask `local-only` (same model, no
    ##     cloud tail) and you get the honest rejection instead.
    ##
    ## There is therefore NO local vision model on this estate today — which is
    ## why option (a) was taken above rather than (b):
    ##   a) accept cloud vision  <- CHOSEN 2026-09-13 by the owner
    ##   b) stay local -> would need a vision-capable local model served first
    ##      (gemma-4-26b as served is not one), then a group whose chain has no
    ##      cloud tail. If that ever exists, switch `model:` and re-scope the key.
    ##
    ## The credential stays the second line of defence: the LiteLLM key
    ## `frigate-genai-2` is scoped to EXACTLY
    ## [claude-haiku-4-5, local-only, local-wifi, local-wg-closed]. Any other
    ## model — including a more expensive or less private one — 403s rather than
    ## being reached by editing this file alone. Widening the model list is a
    ## separate, deliberate act against LiteLLM, not a config edit.
    ##
    ## ⛔ No `embeddings` role either: LiteLLM has no embedding model at all, so
    ## semantic_search stays local on qui regardless.

    ## Enrichments, 2026-09-13. Each costs CPU/RAM on every matching object and
    ## this node has no GPU — qui does software video decode inside a deliberate
    ## 6-core cap and the pod sits at ~2.2Gi of a 4Gi limit — so both run on
    ## exactly one camera and are switched OFF on the others.
    ##
    ## ⛔ The narrowing has to be written this way round. A camera may only
    ## enable what is already enabled globally: setting enabled:false here and
    ## true on one camera is rejected outright —
    ##   "Camera doorbell has face_recognition enabled but face_recognition is
    ##    disabled at the global level of the config."
    ## So: ON globally, OFF per camera. Adding a camera therefore OPTS IT IN by
    ## default — remember to disable it there too.
    ##
    ## Both default to model_size: small and device: null (= CPU), which is the
    ## right choice here; do NOT raise model_size without re-measuring the pod
    ## against its 4Gi limit first.
    lpr:
      enabled: true
    face_recognition:
      enabled: true

    ## Profiles (0.18): named runtime overrides, switchable from Home Assistant
    ## over MQTT with no restart. The top-level block is only a REGISTRY of
    ## names — the actual overrides live per-camera under cameras.<cam>.profiles.
    ##
    ## ⭐ Compatible with our read-only config on purpose: the ACTIVE profile is
    ## persisted to /config/.profiles (a separate file on the writable PVC), not
    ## written back into config.yaml. Definitions stay in git, activation stays
    ## in MQTT. Switching one does NOT survive a config change that removes it.
    profiles:
      away:
        friendly_name: Away
      guests:
        friendly_name: Guests
    active_profile: null

    ## Review: what becomes an ALERT vs a mere DETECTION. Added 2026-09-13 —
    ## until then there was no review: block at all, so the defaults applied:
    ## alerts.labels = [person, car] on EVERY camera. On garagecam (driveway)
    ## and cavecam that made our own car an alert several times a day, which is
    ## how an alert stream stops being read.
    ##
    ## `car` is deliberately demoted to a detection: it is still tracked,
    ## recorded and searchable, it just no longer shouts. Once LPR has some
    ## known_plates behind it, "an UNKNOWN plate in the driveway" is the alert
    ## worth promoting — not "a car".
    ##
    ## detections.labels is left unset on purpose: unset means "everything that
    ## is not an alert", which is what we want. Naming a list here would
    ## silently DROP any label missing from it.
    review:
      alerts:
        labels:
          - person
      detections:
        cutoff_time: 30

    record:
      enabled: true
      alerts:
        retain:
          days: 42
      detections:
        retain:
          days: 42
    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true

    birdseye:
      enabled: true
      mode: continuous
      inactivity_threshold: 300
    version: 0.18-0
    semantic_search:
      enabled: true
      reindex: false
      model_size: small
    notifications:
      enabled: true
      email: 6a9vfiow4t@pomail.net
    detect:
      enabled: true
