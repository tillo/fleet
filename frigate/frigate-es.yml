apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-env-secret
spec:
  refreshInterval: 1m0s

  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless

  target:
    name: frigate-env-secret
    creationPolicy: Owner

  data:
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_RSTP_PASSWORD
      secretKey: FRIGATE_RTSP_PASSWORD
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/PLUS_API_KEY
      secretKey: PLUS_API_KEY

    ## Camera credentials, moved out of config.yaml when it became a ConfigMap
    ## (2026-08-16) — this repo is public. Frigate expands {FRIGATE_*} inside
    ## go2rtc.streams, so these arrive purely through envFrom.
    ## Rotating a Nest refresh token or the Synology stream key is an Akeyless
    ## edit plus a Frigate restart; no fleet change.
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_CAVECAM_STREAM
      secretKey: FRIGATE_CAVECAM_STREAM
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_CLIENT_ID
      secretKey: FRIGATE_NEST_CLIENT_ID
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_CLIENT_SECRET
      secretKey: FRIGATE_NEST_CLIENT_SECRET
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_PROJECT_ID
      secretKey: FRIGATE_NEST_PROJECT_ID
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_REFRESH_TOKEN_BALCONYCAM
      secretKey: FRIGATE_NEST_REFRESH_TOKEN_BALCONYCAM
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_REFRESH_TOKEN_DOORBELL
      secretKey: FRIGATE_NEST_REFRESH_TOKEN_DOORBELL
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_REFRESH_TOKEN_GARAGECAM
      secretKey: FRIGATE_NEST_REFRESH_TOKEN_GARAGECAM
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_DEVICE_ID_BALCONYCAM
      secretKey: FRIGATE_NEST_DEVICE_ID_BALCONYCAM
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_DEVICE_ID_DOORBELL
      secretKey: FRIGATE_NEST_DEVICE_ID_DOORBELL
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_NEST_DEVICE_ID_GARAGECAM
      secretKey: FRIGATE_NEST_DEVICE_ID_GARAGECAM

    ## GenAI (2026-09-13): a SCOPED LiteLLM virtual key, alias `frigate-genai`,
    ## restricted to the two models Frigate may call. Not the gateway master
    ## key — this one is independently revocable from the LiteLLM UI without
    ## touching anything else on the estate.
    - remoteRef:
        key: /mdapi/frigate/frigate-env-secret/FRIGATE_GENAI_API_KEY
      secretKey: FRIGATE_GENAI_API_KEY
