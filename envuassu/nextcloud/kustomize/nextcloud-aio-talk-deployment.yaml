apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-talk
  namespace: envuassu
spec:
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: io.kompose.service
                operator: In
                values:
                - nextcloud-aio-nextcloud
            topologyKey: kubernetes.io/hostname
      containers:
        - name: nextcloud-aio-talk
          # A2 (infra-ka2): explicit request floors sized from the VPA
          # recommender's targets — VPA Auto does NOT mutate envuassu pods
          # (works in other namespaces; tracked separately). No limits.
          resources:
            requests:
              cpu: 50m
              memory: 260Mi
          imagePullPolicy: IfNotPresent
          env:
            - name: INTERNAL_SECRET
              $patch: delete
            - name: SIGNALING_SECRET
              $patch: delete
            - name: TURN_SECRET
              $patch: delete
          envFrom:
            - secretRef:
                name: nextcloud-aio-env-secret
