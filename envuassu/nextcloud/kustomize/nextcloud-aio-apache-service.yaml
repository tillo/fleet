## S2a (infra-ka2, 2026-08-14/15): apache behind the ingress — ClusterIP on
## the reverse-proxy port. The chart renders 11000 tcp+udp (QUIC twin) with
## mergeKey=port, which collapsed into UDP-only on plain merge (503, zero
## nginx endpoints) — hence the explicit $patch: replace on the ports list.
## Talk's TURN LoadBalancer (.41) is unaffected.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-aio-apache
  namespace: envuassu
spec:
  type: ClusterIP
  loadBalancerClass: null
  externalTrafficPolicy: null
  loadBalancerIP: null
  ports:
    - $patch: replace
    - name: http
      port: 11000
      protocol: TCP
      targetPort: 11000
