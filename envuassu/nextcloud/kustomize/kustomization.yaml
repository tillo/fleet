# S2a fix (2026-08-15 01:50): the strategic merge of the apache Service ports
# collided with the chart's QUIC twin (11000/tcp + 11000/udp share mergeKey
# `port`) and left a single UDP port -> ingress-nginx computed NO endpoints
# (503). JSON6902 replaces the ports list wholesale, deterministically.
patches:
  - target:
      kind: Service
      name: nextcloud-aio-apache
    patch: |-
      - op: replace
        path: /spec/ports
        value:
          - name: http
            port: 11000
            protocol: TCP
            targetPort: 11000
