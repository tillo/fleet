## VolSync backup of nextcloud-aio-nextcloud-data-ceph (PPE user files) —
## envuassu hardening S1 / PVC-audit G1 (beads infra-ka2 / infra-jjb).
## Same pattern as owncloud + paperless: per-PVC restic repo in the external
## Garage ceph-backup bucket (offsite-swept to B2/SFTP since 2026-08-14),
## CSI snapshot, mover as uid 33 (www-data owns /mnt/ncdata). Daily 03:45 UTC
## — after paperless 03:15, before the 04:00 offsite sweep kickoff (the sweep
## reads yesterday's state; today's snapshot rides tomorrow's sweep).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-ceph-backup-restic
  namespace: envuassu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: volsync-ceph-backup-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ## In-cluster transit/garage, NOT api.garage.home.tillo.ch: that hostname
        ## resolves to the shared ingress VIP, so every backup hairpinned through
        ## ingress-nginx and would fail exactly when the front door is degraded --
        ## which is when a backup matters most. restic encrypts client-side and S3
        ## auth is a SigV4 signature, so losing the ingress TLS costs no
        ## confidentiality: Garage has no TLS listener of its own, and the ingress
        ## already re-emitted plaintext to these same LAN hosts. Same bucket and
        ## path, so the existing restic repository is untouched.
        ## ⭐ 2026-09-19: moved off the salt/pepper Garage to Backblaze B2 DIRECT,
        ## following the openvpn-pki canary. restic encrypts client-side, so these
        ## repos are the "send directly encrypted" half of the architecture and need
        ## no local staging. The B2 copy was never rclone-crypt wrapped (this bucket
        ## is in the offsite job's NO_ENCRYPT set precisely because restic already
        ## encrypts), so it is a REAL restic repo: config, data/ and snapshots/ were
        ## verified present for all 11 repos before switching. History carries over
        ## and nothing re-uploads -- 404 GiB leaves Garage in total.
        ##
        ## ⛔⛔ The offsite key's grant on this bucket was revoked FIRST. The offsite
        ## job runs `rclone sync`, which MIRRORS DELETIONS and derives its bucket
        ## list from that key's grants -- leaving it would have had the next 02:00
        ## run delete every snapshot written here, as they are absent from Garage.
        ##
        ## ⛔ B2's S3 endpoint is region us-west-001, read from b2_authorize_account's
        ## `s3ApiUrl`. Do not guess: 002/003/004 and eu-central all fail and read as
        ## "B2 is not S3 compatible" when it is only a different region. The S3
        ## endpoint keeps the AWS_* shape, so restic's native b2: backend and its
        ## B2_ACCOUNT_ID/KEY env are not needed.
        RESTIC_REPOSITORY: "s3:https://s3.us-west-001.backblazeb2.com/saltminio/ceph-backup/envuassu-nextcloud-data-ceph"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .b2_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .b2_app_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /mdapi/volsync/ceph-backup/restic-password
    - secretKey: b2_key_id
      remoteRef:
        key: /mdapi/volsync/b2/account-id
    - secretKey: b2_app_key
      remoteRef:
        key: /mdapi/volsync/b2/account-key
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nextcloud-aio-nextcloud-data-ceph
  namespace: envuassu
spec:
  sourcePVC: nextcloud-aio-nextcloud-data-ceph
  trigger:
    schedule: "45 3 * * *"
  restic:
    repository: volsync-ceph-backup-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    # uid 33 owns /mnt/ncdata — same CAP_DAC_OVERRIDE lesson as owncloud's RS.
    moverSecurityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
    cacheCapacity: 4Gi
    cacheStorageClassName: harvester-longhorn-1replica
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
