apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: envuassu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    # Inject the RUM bootstrap. See rum-assets/ for the self-hosted bundle.
    # Accept-Encoding is cleared because sub_filter cannot match gzipped HTML;
    # it costs upstream compression on HTML only, not on assets.
    # $edge_frame_guard off: Keycloak owns its framing policy (SAMEORIGIN +
    # frame-ancestors on its pages, NONE on the login-status/3p-cookies iframes every
    # client origin frames) - the edge default must not add X-Frame-Options to those.
    # See rke2-ingress-nginx-config/ (infra-7rog.31.10).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $edge_frame_guard "off";
      proxy_set_header Accept-Encoding $rum_accept_encoding;
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '</head>' '<script defer src="https://rum.mdapi.ch/rum.js"></script></head>';
spec:
  ingressClassName: nginx
  rules:
    - host: login.envuassu.ch
      http:
        paths:
          - backend:
              service:
                name: keycloak
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
      - login.envuassu.ch
      secretName: keycloak-cert
