## CloudNativePG cluster for envuassu's Keycloak, on PostgreSQL 18 (2026-11-20).
##
## Replaces the standalone `postgres` Deployment (keycloak-deploy.yml, PG 18), which
## had no WAL archive and no second instance, and whose data directory a bare major
## tag bump cannot upgrade (Renovate !2652, closed: 19 would initdb an empty cluster
## next to the 18 one). Bootstrap IMPORTS the `keycloak` database from it
## (initdb.import, microservice = logical dump/restore); later majors are done by
## CNPG the same way, from a new cluster.
##
## The import runs once at creation; the cutover stops Keycloak, re-syncs the dump,
## compares every table, and only then switches KC_DB_URL_HOST to keycloak-pg-rw
## (memory cnpg_import_is_a_point_in_time_copy_freeze_and_resync_before_cutover_2026_11_13).
## The owner role and password are the same as before (keycloak-pg-app is built from
## KC_DB_PASSWORD), so only the host changes.
##
## Shape copied from keycloak/keycloak-pg.yml: 2 instances, switchover, barman to its
## own RGW bucket over TLS via the Barman Cloud plugin, daily base backup, 14 d.
## ObjectStore declared BEFORE the Cluster (plugin pre-reconcile hook). The bucket name
## carries the tenant prefix: bucket names are cluster-global.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: keycloak-pg
  namespace: envuassu
spec:
  configuration:
    destinationPath: s3://cnpg-envuassu-keycloak-pg
    endpointURL: https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443
    endpointCA:
      name: rgw-transit-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: cnpg-envuassu-keycloak-pg
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-envuassu-keycloak-pg
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: cnpg-rgw-region
        key: REGION
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
  ## On the STORE, not the Cluster: left off, nothing prunes and nothing says so.
  retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: envuassu
spec:
  ## CNPG re-creates instance PVCs on every rebuild; this is the only place the
  ## backup class survives one (tests/test_cnpg_clusters_declare_backup_class.py).
  inheritedMetadata:
    labels:
      mdapi.ch/backup-class: default
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: harvester-longhorn-2replicas
    size: 2Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      effective_cache_size: 256MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  ## O2 Database Monitoring login (openobserve/o2-dbm-collector.yml, *_envkc), with the
  ## Akeyless password the collector already holds. Role passwords are not imported.
  managed:
    roles:
      - name: o2_dbm
        ensure: present
        login: true
        inherit: true
        inRoles: [pg_monitor]
        connectionLimit: 8
        passwordSecret:
          name: keycloak-pg-o2dbm

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-pg-app
      import:
        type: microservice
        databases:
          - keycloak
        source:
          externalCluster: legacy-postgres

  ## The PG 18 Deployment this cluster was imported from. Only read at bootstrap;
  ## delete this stanza together with postgres-deploy.yml once the soak is over.
  externalClusters:
    - name: legacy-postgres
      connectionParameters:
        host: postgres.envuassu.svc.cluster.local
        user: keycloak
        dbname: keycloak
        sslmode: disable
      password:
        name: postgres-env-secret
        key: POSTGRES_PASSWORD

  ## serverName stated explicitly: barman keys the archive <bucket>/<serverName>/,
  ## and it is accepted only as a plugin parameter (CEL rejects it on the store).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: keycloak-pg
        serverName: keycloak-pg

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-pg-daily
  namespace: envuassu
spec:
  schedule: "0 50 2 * * *"
  backupOwnerReference: self
  ## WAL archiving alone is not a backup: take the first base backup at once.
  immediate: true
  cluster:
    name: keycloak-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
## Owner credential: the password envuassu's Keycloak already uses, so KC_DB_PASSWORD needs no change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-app
  namespace: envuassu
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: keycloak-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          ## CNPG only re-reads a password secret it watches; without this a rotated
          ## password is never applied.
          cnpg.io/reload: "true"
      data:
        username: keycloak
        password: "{{ .password }}"
  data:
    - remoteRef:
        key: /mdapi/envuassu/keycloak/keycloak-env-secret/KC_DB_PASSWORD
      secretKey: password
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cnpg-envuassu-keycloak-pg
  namespace: envuassu
spec:
  bucketName: cnpg-envuassu-keycloak-pg
  storageClassName: ceph-bucket
  ## Declare the offsite grant so Rook OWNS it: the OBC reconciler deletes any policy
  ## not listed here (rgw_bucket_policy_loss_incident_2026_09_29).
  additionalConfig:
    bucketPolicy: '{"Version":"2012-10-17","Statement":[{"Sid":"OffsiteSweepRead","Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/offsite"]},"Action":["s3:ListBucket","s3:GetObject"],"Resource":["arn:aws:s3:::cnpg-envuassu-keycloak-pg","arn:aws:s3:::cnpg-envuassu-keycloak-pg/*"]}]}'
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-rgw-region
  namespace: envuassu
stringData:
  REGION: us-east-1
---
## Password for the o2_dbm login; CNPG wants a basic-auth secret whose username is the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-o2dbm
  namespace: envuassu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: keycloak-pg-o2dbm
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: o2_dbm
        password: "{{ .password }}"
  data:
    - remoteRef:
        key: /mdapi/envuassu/postgres-o2dbm/password
      secretKey: password
