apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webtunnel-bridge
  namespace: webtunnel-bridge
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    ## ⛔ Do not let a client choose its own X-Forwarded-For.
    ##
    ## The controller set use-forwarded-headers: true estate-wide until
    ## 2026-10-28, and a client-supplied XFF was PREPENDED to the real peer with
    ## the whole chain forwarded. webtunnel-server reads the first value, so it
    ## believed whatever the caller put there. The controller now sends
    ## $remote_addr on its own (infra-az8.40); this snippet stays as the
    ## per-host guarantee, so the bridge does not depend on a global setting.
    ##
    ## Measured 2026-09-23 over 24h on this host:
    ##   "127.0.0.1, 195.178.110.31"   1,378 requests
    ##   "10.0.0.1, 195.178.110.31"      132 requests
    ## — one remote caller spoofing a loopback/private client IP, which is what
    ## produced 773 "unexpected internal address in X-Forwarded-For header"
    ## warnings in six hours. For a Tor bridge the apparent client address is not
    ## cosmetic, so this is worth closing on its own merits.
    ##
    ## $remote_addr is the address nginx actually observed: `ingress-expose` is
    ## externalTrafficPolicy: Local so the client IP survives the LB, and the
    ## real_ip module is off (use-forwarded-headers: "false").
    ##
    ## ⚠️ This is NOT known to fix the webtunnel-server exit-2 crashes (Go exits
    ## 2 on an unrecovered panic, and tor does not relay the child's stderr, so
    ## the reason is still unseen). It removes the only hostile input found so
    ## far. `webtunnel_bridge_502_burst` stays armed to show whether it helped.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-For $remote_addr;
# Intentionally no `tls:` section — the `showcase` Ingress (showcase ns) owns TLS for
# mdapi.ch, and nginx-ingress merges per-host path rules across Ingresses.
# Requests on https://mdapi.ch/api/v1/proxy/* hit our sidecar; everything
# else falls through to showcase.
spec:
  ingressClassName: nginx
  rules:
    - host: mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: webtunnel-bridge
                port:
                  number: 8443
            path: /api/v1/proxy
            pathType: Prefix
