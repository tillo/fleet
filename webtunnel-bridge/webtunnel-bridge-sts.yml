apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webtunnel-bridge
  namespace: webtunnel-bridge
  annotations:
    # Roll the pod when SECRET_PATH (from Akeyless via ExternalSecret) changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  serviceName: webtunnel-bridge
  selector:
    matchLabels:
      app: webtunnel-bridge
  template:
    metadata:
      labels:
        app: webtunnel-bridge
    spec:
      securityContext:
        fsGroup: 101
      containers:
      - name: webtunnel-bridge
        ## ⛔ NOT docker.io. `thetorproject/webtunnel-bridge:latest` is FROZEN at its
        ## 2026-07-02 push (goptlib v1.5.0, whose DialOr type-assertion panic kills this
        ## bridge with exit status 2 on any ExtORPort dial/auth failure -- the source of
        ## the instant 502 bursts). Upstream moved publication to its own registry around
        ## 2026-07-23 and stopped pushing to Docker Hub without deprecating the repo, so
        ## Docker Hub's `latest` never moves and no updater can see it. `latest` here
        ## tracks releases again (== v0.0.7, goptlib v1.6.0, when repointed).
        ## ⭐ Verify image contents with `go version -m` on the extracted binary, never
        ## by tag date -- the whole trap was that the tag looked maintained. See infra-4ghs.
        image: containers.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel:latest@sha256:74eaf3ea7babb3a79996117ebeab571d744f04c918925e5a8dd8ce016a726132
        env:
        - name: TZ
          value: Europe/Zurich
        - name: OR_PORT
          value: "9001"
        - name: PT_PORT
          value: "15000"
        - name: EMAIL
          value: "tillo@tillo.ch"
        - name: NICKNAME
          value: "MDAPI"
        - name: SECRET_PATH
          valueFrom:
            secretKeyRef:
              name: webtunnel-bridge-secret
              key: secret-path
        # k8s substitutes $(SECRET_PATH) at container start using the env
        # value defined above. The full URL never lives in git.
        - name: WEBTUNNEL_URL
          value: "https://mdapi.ch/api/v1/proxy/$(SECRET_PATH)"
        ports:
        - name: webtunnel
          containerPort: 15000
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /var/lib/tor
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            # Tor `:latest` (0.4.9.5 + OpenSSL 3.5.5) sizes MaxMemInQueues
            # from node-level RAM (sees 8 GB) and OOMs at 1Gi after first
            # bootstrap pass (~2 min). 2Gi clears it; follow-up: mount a
            # torrc override that pins MaxMemInQueues to ~256 MB so the
            # pod limit can come back down.
            memory: 2Gi
            # Tor's onion-routing crypto bursts well above 500m during
            # traffic; with the old cap it was throttling 59% of CFS
            # periods. 2c gives the relay enough headroom for steady
            # circuit churn without throttling.
            cpu: 2
      - name: nginx
        ## library/ prefix matches what Keel canonicalized the live object to
        ## while it same-tag force-polled this sts (spider3 pattern). Keel is
        ## gone, but the live value still carries it -- keep git matching
        ## until the pod template recycles, or the bundle latches Modified.
        image: library/nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
        imagePullPolicy: Always
        env:
        - name: SECRET_PATH
          valueFrom:
            secretKeyRef:
              name: webtunnel-bridge-secret
              key: secret-path
        # Restrict envsubst to ONLY the SECRET_PATH variable so nginx's own
        # $http_upgrade / $host / etc. are preserved in the templates.
        - name: NGINX_ENVSUBST_FILTER
          value: "^SECRET_PATH$"
        ports:
        - name: ingress
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: nginx-template
          mountPath: /etc/nginx/templates
          readOnly: true
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            # 100m throttled ~10.5h/day (ContainerCpuThrottling, infra-health
            # 2026-07-14, user-approved raise)
            cpu: 500m
      volumes:
      - name: nginx-template
        configMap:
          name: webtunnel-bridge-nginx
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: harvester-longhorn-2replicas
      resources:
        requests:
          # Tor caches ~50MB of router descriptors at runtime — 100Mi
          # filled within minutes during bootstrap. 1Gi gives plenty of
          # headroom for cached-descriptors + state + keys.
          storage: 1Gi
