  storage-stall.json: |
    {
      "uid": "storage-stall",
      "title": "Storage Stall \u2014 PSI Early Warning",
      "tags": [
        "mdapi",
        "storage-stall",
        "psi"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "description": "Companion to ~/storage-stall-isolation-design.md and alert NodeMemoryStallPSI. The event family: allocation burst -> reclaim -> IO completions stall -> D-state avalanche (qua 06-30, qui 07-04/07-12, quo 07-17). PSI went live fleet-wide 2026-07-29.",
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Memory pressure \u2014 the precursor signal",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "PSI memory FULL-stall (every task blocked) \u2014 alert fires >0.60 for 3m",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "rate(node_pressure_memory_stalled_seconds_total[2m])",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.6
                  }
                ]
              },
              "max": 1.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Healthy idle ~0.0001. Heaviest legitimate churn ever observed (full quiesce + 3 reboots) peaked 0.548 and never sustained 0.60."
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "PSI memory SOME-stall (at least one task blocked)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "rate(node_pressure_memory_waiting_seconds_total[2m])",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "max": 1.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "MemAvailable per node",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Falls in the allocation burst 1-3 min before onset \u2014 a shadow of PSI, kept for context (the MemAvailable alert was backtested and rejected; see design doc \u00a70.1)."
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "ingress-nginx RSS per pod (ModSec reload = prime burst suspect)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "targets": [
            {
              "expr": "sum by (pod) (node_namespace_pod_container:container_memory_rss{namespace=\"kube-system\", pod=~\"rke2-ingress-nginx.*\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "A ModSec reload transiently doubles 8-13 GiB of nginx RSS per pod."
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Time since last successful nginx config reload",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "expr": "time() - nginx_ingress_controller_config_last_reload_successful_timestamp_seconds",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Reload events correlate with the allocation bursts \u2014 a fresh reload right before a PSI spike is the smoking gun."
        },
        {
          "id": 7,
          "type": "row",
          "title": "Downstream \u2014 IO and storage symptoms",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "PSI io FULL-stall",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "targets": [
            {
              "expr": "rate(node_pressure_io_stalled_seconds_total[2m])",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "max": 1.0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Legitimately reached 0.41 during volume-reattach storms \u2014 no alert threshold yet (no usable margin)."
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Processes in D-state (uninterruptible)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "targets": [
            {
              "expr": "node_procs_blocked",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
