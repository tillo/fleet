          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Pstore Records",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "expr": "bpi_r4_pstore_record_count",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "WAN throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "rate(bpi_r4_wan_tx_bytes_total[1m]) * 8",
