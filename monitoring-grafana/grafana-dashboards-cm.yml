apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-network
  namespace: monitoring
data:
  bpi-r4.json: |
    {
      "schemaVersion": 36,
      "version": 1,
      "uid": "bpi-r4-overview",
      "title": "BPI-R4 Router \u2014 Overview",
      "tags": [
        "bpi-r4",
        "router",
        "mdapi"
      ],
      "timezone": "browser",
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "expr": "bpi_r4_uptime_seconds",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 600
                  },
                  {
                    "color": "green",
                    "value": 3600
                  }
                ]
              }
            }
          }
        },
        {
