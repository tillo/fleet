              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "The avalanche signature: 994-1569 blocked procs at near-idle device throughput."
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Longhorn volumes not healthy",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 34
