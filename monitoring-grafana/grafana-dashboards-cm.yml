            "mdapi"
          ],
          "title": "All mdapi dashboards",
          "tooltip": "",
          "type": "dashboards",
          "url": ""
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Anything wrong?",
