          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ha-postgres"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "lineInterpolation": "stepAfter"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT TO_TIMESTAMP(s.last_updated_ts) AS time, s.state::float AS value FROM states s JOIN states_meta sm ON s.metadata_id = sm.metadata_id WHERE sm.entity_id = 'sensor.mbptillo_ac_online' AND s.state ~ '^-?[0-9.]+$' AND $__timeFilter(TO_TIMESTAMP(s.last_updated_ts)) ORDER BY 1",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ha-postgres"
              },
              "legendFormat": "AC online"
            },
            {
              "refId": "B",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT TO_TIMESTAMP(s.last_updated_ts) AS time, s.state::float AS value FROM states s JOIN states_meta sm ON s.metadata_id = sm.metadata_id WHERE sm.entity_id = 'sensor.mbptillo_cpu_max_ghz' AND s.state ~ '^-?[0-9.]+$' AND $__timeFilter(TO_TIMESTAMP(s.last_updated_ts)) ORDER BY 1",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ha-postgres"
              },
              "legendFormat": "CPU max GHz"
            }
          ],
          "description": "AC online = 1 does NOT mean AC is sufficient - it stayed 1 all through the 08-08 night while the battery fell 55% -> 11%. Judge by the trend panel, not by this. CPU cap should read 2.60 (base clock, turbo off); 3.00 means no_turbo was lost, 4.30 means the cap is gone entirely."
        }
      ]
    }
