apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-platform
  namespace: monitoring
data:
  clm.json: |
    {
      "schemaVersion": 36,
      "version": 1,
      "uid": "clm-overview",
      "title": "Certificate Lifecycle (CLM) \u2014 Overview",
      "tags": [
        "clm",
        "certificates",
        "horizon",
        "mdapi"
      ],
      "timezone": "browser",
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "title": "Horizon CLM",
          "type": "link",
          "url": "https://horizon.mdapi.ch/",
          "icon": "external link",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 10,
          "type": "stat",
          "title": "Horizon-managed certificates",
          "description": "Certificates Horizon actively manages (enroll + auto-renew). Discovered/external certs are tracked separately and not counted here.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "expr": "horizon_certs_managed_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "piechart",
          "title": "Managed by profile",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "expr": "horizon_certs_profile",
              "legendFormat": "{{profile}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "values": [
                "value"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "Managed by status",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 10,
            "y": 0,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "expr": "horizon_certs_status",
              "legendFormat": "{{status}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "revoked"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "expired"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Managed expiring soon",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "expr": "horizon_certs_expiring{window=\"30d\"}",
              "legendFormat": "\u226430d",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "horizon_certs_expiring{window=\"7d\"}",
              "legendFormat": "\u22647d",
              "instant": true,
              "refId": "B"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "bargauge",
          "title": "Certificate grades (inventory)",
          "description": "Security-grade distribution across the full Horizon inventory (Horizon-Grading-Policy). A best to F worst.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "expr": "horizon_certs_grade",
              "legendFormat": "{{grade}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "D"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "E"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "F"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 1,
          "type": "bargauge",
          "title": "Device cert \u2014 days to expiry (auto-renewed)",
          "description": "Per-device web-UI cert days-to-expiry, pushed by the Windmill renewal jobs. Red <15d, amber <30d. Each renews inside 15d.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "{__name__=~\".+_cert_days_to_expiry\"}",
              "legendFormat": "{{__name__}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "min": 0,
              "max": 60,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Soonest device-cert expiry",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "expr": "min({__name__=~\".+_cert_days_to_expiry\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Cert renewals (total)",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 18,
            "y": 6,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum({__name__=~\".+_cert_renewed_total\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "K8s TLS cert discovery \u2192 Horizon",
          "description": "Windmill k8s_cert_discovery feeder: certs fed to the CLM vs internal/self-signed skipped, plus feed errors.",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "k8s_cert_discovery_certs_fed",
              "legendFormat": "fed",
              "refId": "A"
            },
            {
              "expr": "k8s_cert_discovery_skipped_internal",
              "legendFormat": "skipped internal",
              "refId": "B"
            },
            {
              "expr": "k8s_cert_discovery_skipped_selfsigned",
              "legendFormat": "skipped self-signed",
              "refId": "C"
            },
            {
              "expr": "k8s_cert_discovery_errors",
              "legendFormat": "errors",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Discovery snapshot",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "k8s_cert_discovery_tls_secrets",
              "legendFormat": "TLS secrets scanned",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "k8s_cert_discovery_certs_fed",
              "legendFormat": "certs fed",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "k8s_cert_discovery_errors",
              "legendFormat": "errors",
              "instant": true,
              "refId": "C"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Horizon",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "expr": "up{job=\"horizon\"}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Horizon \u2014 HTTP request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 4,
            "y": 22,
            "w": 10,
            "h": 6
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_total{job=\"horizon\"}[5m]))",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Horizon \u2014 JVM memory committed",
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 14,
            "y": 22,
            "w": 10,
            "h": 6
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_committed_bytes{job=\"horizon\"})",
              "legendFormat": "committed",
              "refId": "A"
            },
            {
              "expr": "sum(jvm_memory_max_bytes{job=\"horizon\"} > 0)",
              "legendFormat": "max",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        }
      ]
    }
  victoriametrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "$ds"
            },
            "enable": false,
            "expr": "sum(ALERTS{job=~\"$job\", instance=~\"$instance\", alertgroup=\"vmsingle\",alertstate=\"firing\",show_at=\"dashboard\"}) by(alertname)",
            "hide": false,
            "iconColor": "red",
            "name": "alerts",
            "titleFormat": "{{alertname}}"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "$ds"
            },
            "enable": true,
            "expr": "sum(vm_app_version{job=~\"$job\", instance=~\"$instance\"}) by(version) unless (sum(vm_app_version{job=~\"$job\", instance=~\"$instance\"} offset $__interval) by(version))",
            "hide": true,
            "iconColor": "dark-blue",
            "name": "version",
            "textFormat": "{{version}}",
            "titleFormat": "Version change"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "$ds"
            },
            "enable": true,
            "expr": "sum(changes(vm_app_start_timestamp{job=~\"$job\", instance=~\"$instance\"}[$__interval])) by(job)",
            "hide": false,
            "iconColor": "dark-yellow",
            "name": "restarts",
            "textFormat": "{{job}} restarted"
          }
        ]
      },
