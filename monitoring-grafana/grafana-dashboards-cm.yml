            "mode": "markdown",
            "content": "\n| Platform | Storage | Edge & network | Home |\n|---|---|---|---|\n| [Certificate lifecycle](/d/clm-overview) | [Storage \u2014 Longhorn / FusionIO](/d/mdapi-storage) | [BPI-R4 router](/d/bpi-r4-overview) | [Home Assistant](/d/home-assistant-overview) |\n| [VictoriaMetrics](/d/victoriametrics-single) | [Ceph \u2014 cluster](/d/mdapi-ceph-cluster) | [Technitium DNS](/d/technitium-overview) | [ELCO heating](/d/mdapi-elco) |\n| [Backup landscape](/d/backup-landscape) | [Ceph \u2014 pools](/d/mdapi-ceph-pools) \u00b7 [OSDs](/d/mdapi-ceph-osds) | [NTP pool clients](/d/ntppool-clients) | [Solar](/d/mdapi-solar) \u00b7 [UPS](/d/mdapi-ups) |\n| | [RGW overview](/d/radosgw-overview) \u00b7 [CephFS](/d/cephfs-overview) | | [Frigate](/d/frigate-overview) \u00b7 [Carnotzet](/d/mdapi-carnotzet) |\n| | [Storage stall (PSI)](/d/storage-stall) | | |\n\n*Every panel above was built from a query verified live against VictoriaMetrics\non 2026-08-07. Dashboards are **fleet-managed** \u2014 edit\n`fleet/monitoring-grafana/dashboards/mdapi-overview.json`, run `regen-cm.sh`,\ncommit. UI edits are disabled (`allowUiUpdates: false`) and would be lost.*\n"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      }
    }
