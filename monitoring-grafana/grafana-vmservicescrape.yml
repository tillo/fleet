## Grafana self-metrics — the Grafana Overview dashboard went dark on 2026-06-24
## when the last Prometheus (and its grafana scrape job) was removed. Grafana's
## /metrics is unauthenticated on the ClusterIP service.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: grafana
  endpoints:
  - port: http
    path: /metrics
    interval: 60s
