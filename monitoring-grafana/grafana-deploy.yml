apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: grafana
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      imagePullSecrets:
      - name: zot-pull
      containers:
      - name: grafana
        image: zot.mdapi.ch/grafana/grafana:latest@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: TZ
          value: Europe/Zurich
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.mdapi.ch
        # 2026-07-29 dashboard audit: the provisioned Kubernetes-folder dashboards
        # default to 10s refresh (44-target dashboards) — floor it globally.
        - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
          value: 30s
        - name: GF_SERVER_DOMAIN
          value: grafana.mdapi.ch
        # Anonymous Viewer lands in org 2 "Embed", NOT Main Org (infra-o4i3m.6).
        # Anonymous is reachable from every pod (Service) and the LAN
        # (grafana-embed), and a Viewer can run ANY query on every datasource of
        # its org -- Grafana OSS has no per-datasource permissions. So Embed holds
        # only VictoriaMetrics + the VM-only Overview/Ceph folders the rack kiosks
        # and Ceph iframes use; HA-Postgres (the HA recorder) and every other
        # dashboard stay in Main Org, which now needs a login (/login).
        # Org 2 is a DB row in grafana-pg, not provisionable from files: on a
        # fresh DB create it first (POST /api/orgs {"name":"Embed"} -> id 2) or
        # provisioning fails loud at start.
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_ANONYMOUS_ORG_NAME
          value: "Embed"
        # SSO login into Main Org: Grafana's own OIDC against Keycloak client
        # `grafana` (realm tilloch, kc-gate role mdapi-admin; secret via
        # grafana-env-secret). NOT auth.proxy: ingress-nginx runs on pod IPs, so
        # a header whitelist cannot tell it from any other pod, and grafana-embed
        # forwards client headers ungated. grafana-ing.yml sends a browser with
        # no grafana_session to /login; auto-login takes it on to Keycloak.
        # Break-glass admin: /login?disableAutoLogin=true.
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: MDAPI
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: grafana
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid email profile
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/auth
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/token
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/userinfo
        - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: preferred_username
        - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
          value: email
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        # `roles` = the client's realm-role mapper. Strict: no mdapi-admin, no login.
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: "contains(roles[*], 'mdapi-admin') && 'Admin'"
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        - name: GF_AUTH_OAUTH_AUTO_LOGIN
          value: "true"
        - name: GF_AUTH_SIGNOUT_REDIRECT_URL
          value: https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.mdapi.ch%2F
        # Allow Ceph dashboard (ceph.mdapi.ch) to embed Grafana panels via iframe
        # (d-solo). NOTE: the iframe target must be an endpoint the browser can reach
        # WITHOUT the oauth2-proxy redirect (SSO cookies aren't sent cross-site in
        # iframes) — see grafana embed endpoint decision.
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        ## Backend DB lives on ha-recorder-pg (CNPG). SQLite hits SQLITE_BUSY
        ## storms on Grafana 13's unified-storage / job-driver / provisioning
        ## concurrency. Postgres handles it natively. Password is pulled from
        ## Akeyless via the ExternalSecret as GF_DATABASE_PASSWORD.
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          ## Moved off ha-recorder-pg 2026-07-31 (decision 8b): the recorder
          ## cluster's 07-30 WAL incident took Grafana down with it. Old
          ## `grafana` DB stays there as rollback until cleanup.
          value: grafana-pg-rw.monitoring.svc.cluster.local:5432
        - name: GF_DATABASE_NAME
          value: grafana
        - name: GF_DATABASE_USER
          value: grafana_rw
        - name: GF_DATABASE_SSL_MODE
          value: disable
        ## Native OpenTelemetry traces → OpenObserve (2026-09-24). Sent to the in-cluster
        ## otel-collector (ns openobserve), which adds k8s.namespace/pod via k8sattributes and the
        ## O2 ingest token; Grafana itself holds no O2 credential. service.name defaults to
        ## "grafana" = this workload's name, so O2 correlation joins traces to pod_logs/metrics.
        ## Probabilistic 0.5 caps volume until it is measured; raise to 1.0 if cheap.
        - name: GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS
          value: "otel-collector.openobserve.svc.cluster.local:4317"
        - name: GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION
          value: "w3c"
        - name: GF_TRACING_OPENTELEMETRY_SAMPLER_TYPE
          value: "probabilistic"
        - name: GF_TRACING_OPENTELEMETRY_SAMPLER_PARAM
          value: "0.5"
        ## Read-only VictoriaMetrics login for both VM datasources (infra-o4i3m.5.4).
        ## Same Secret as VMUser grafana-reader, so a rotation cannot split them.
        - name: VM_READER_USER
          valueFrom:
            secretKeyRef: { name: vmauth-grafana-reader, key: username }
        - name: VM_READER_PASSWORD
          valueFrom:
            secretKeyRef: { name: vmauth-grafana-reader, key: password }
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: ""
        envFrom:
        - secretRef:
            name: grafana-env-secret
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        ## One mount per dashboard folder. Each becomes a Grafana folder via the
        ## provider's foldersFromFilesStructure. Split from a single ConfigMap on
        ## 2026-08-07: the combined CM had reached 83% of the 1 MiB cap.
        ## Adding a folder = a dir under dashboards/, a mount here, and a volume below.
        - name: dashboards-overview
          mountPath: /var/lib/grafana/dashboards/mdapi/Overview
          readOnly: true
        - name: dashboards-ceph
          mountPath: /var/lib/grafana/dashboards/mdapi/Ceph
          readOnly: true
        ## Second mount of the VM-only folders into the anonymous "Embed" org
        ## (provider `embed`, orgId 2; infra-o4i3m.6). Only folders whose every
        ## dashboard is VictoriaMetrics-only may be mounted here.
        - name: dashboards-overview
          mountPath: /var/lib/grafana/dashboards/embed/Overview
          readOnly: true
        - name: dashboards-ceph
          mountPath: /var/lib/grafana/dashboards/embed/Ceph
          readOnly: true
        - name: dashboards-storage
          mountPath: /var/lib/grafana/dashboards/mdapi/Storage
          readOnly: true
        - name: dashboards-network
          mountPath: /var/lib/grafana/dashboards/mdapi/Network
          readOnly: true
        - name: dashboards-home
          mountPath: /var/lib/grafana/dashboards/mdapi/Home
          readOnly: true
        - name: dashboards-platform
          mountPath: /var/lib/grafana/dashboards/mdapi/Platform
        - name: dashboards-security
          mountPath: /var/lib/grafana/dashboards/mdapi/Security
          readOnly: true
        - name: dashboards-harvester
          mountPath: /var/lib/grafana/dashboards/harvester
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          ## Grafana 13 plugin registration takes ~3 min on cold-cache boots
          ## (exploretraces, lokiexplore, etc.). Liveness must outlive that or
          ## the pod gets killed mid-init and never finishes.
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      # Dashboard sidecar: live-imports the Harvester dashboards (cattle-dashboards
      # ConfigMaps labelled grafana_dashboard=1) into the "Harvester" Grafana folder,
      # replacing the embedded Grafana's sidecar after the rancher-monitoring server
      # stack was retired (2026-06-24). RBAC (scoped read on cattle-dashboards CMs)
      # is in the grafana-harvester-sidecar-rbac bundle. Image via zot pull-through
      # (rancher/** is already allow-listed).
      - name: dashboard-sidecar
        image: zot.mdapi.ch/rancher/mirrored-kiwigrid-k8s-sidecar:1.30.0@sha256:c47d4b89632b02553333bb0d84ba7fa72fa6a9040fa9a08e13a2f3530a4cb3ac
        imagePullPolicy: IfNotPresent
        env:
        - name: LABEL
          value: grafana_dashboard
        - name: LABEL_VALUE
          value: "1"
        - name: FOLDER
          value: /var/lib/grafana/dashboards/harvester
        # Route each dashboard CM into a subfolder named by its `grafana_folder`
        # annotation (kube-prom set -> "Kubernetes", Rancher -> "Rancher",
        # Longhorn -> "Longhorn"); un-annotated CMs (the Harvester ones) stay at
        # the root. Paired with provider foldersFromFilesStructure: true.
        - name: FOLDER_ANNOTATION
          value: grafana_folder
        - name: RESOURCE
          value: configmap
        - name: NAMESPACE
          value: cattle-dashboards
        - name: METHOD
          value: WATCH
        - name: UNIQUE_FILENAMES
          value: "true"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: dashboards-harvester
          mountPath: /var/lib/grafana/dashboards/harvester
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      - name: dashboards-overview
        configMap:
          name: grafana-dashboards-overview
      - name: dashboards-ceph
        configMap:
          name: grafana-dashboards-ceph
      - name: dashboards-storage
        configMap:
          name: grafana-dashboards-storage
      - name: dashboards-network
        configMap:
          name: grafana-dashboards-network
      - name: dashboards-home
        configMap:
          name: grafana-dashboards-home
      - name: dashboards-platform
        configMap:
          name: grafana-dashboards-platform
      - name: dashboards-security
        configMap:
          name: grafana-dashboards-security
      - name: dashboards-harvester
        emptyDir: {}
