## Dedicated tiny CNPG Postgres for Grafana's backend DB (user decision 8b,
## 2026-07-31). Until now Grafana used a `grafana` database ON the
## home-assistant/ha-recorder-pg cluster — which chained monitoring
## availability to the smart-home recorder DB: the 07-29/30 purge-night WAL
## incident on ha-recorder-pg took Grafana down ~32h (48 crash-loop
## restarts; DB connection refused at boot is fatal for Grafana).
##
## Sizing rationale: the DB is small and mostly disposable — 63/64
## dashboards + all recording rules are fleet-provisioned; unified storage
## holds little beyond sessions/annotations/short-urls. Hence: no barman.
## Durability = Longhorn 2-replica volumes + the recurring Longhorn backup
## groups (backup_label_enforcer labels the PVCs automatically).
## Rollback: the old `grafana` DB stays untouched on ha-recorder-pg until a
## later cleanup (see nightwindow-next/WORKLIST.md).

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-pg
  namespace: monitoring
spec:
  ## ⭐ 2026-10-07 (beads infra-zkak): WAL archiving + base backups now go
  ## through the Barman Cloud Plugin. This replaced `spec.backup.barmanObjectStore`
  ## -- the in-tree field the operator's own CRD marks deprecated and REMOVES in
  ## CNPG 1.31. The store config moved verbatim to the `ObjectStore` resource
  ## below; only `retentionPolicy` changed shape, because the plugin defines it
  ## on the store rather than on the cluster.
  ##
  ## ⛔ THIS CLUSTER IS THE PILOT, deliberately not gitlab-pg: its DB is small
  ## and mostly reconstructible, so it is the cheapest place to discover that the
  ## migration is wrong. gitlab-pg follows only once this one has proven
  ## plugin-written WAL + a plugin-written base backup in its own bucket.
  ##
  ## ⭐ `serverName` is stated EXPLICITLY even though the documented default is
  ## the cluster name. barman keys the archive as <destinationPath>/<serverName>/,
  ## so a default that differs from the in-tree one would not fail -- it would
  ## silently START A NEW ARCHIVE and orphan the existing PITR history at
  ## s3://cnpg-grafana-pg/grafana-pg/. A redundant line is the cheap side of that
  ## trade. (It cannot go on the ObjectStore: `configuration.serverName` is
  ## REJECTED there by CEL with FieldValueForbidden -- the plugin parameter is the
  ## only place it is accepted.)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: grafana-pg
        serverName: grafana-pg
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  ## switchover, NOT the default in-place restart: a restart-requiring change (e.g. a
  ## shared_preload_libraries edit) otherwise restarts the PRIMARY in place, a full DB
  ## outage (grafana-pg, 2026-09-24: ~3 min of connection refused). Switchover promotes
  ## the replica first, so only the switchover gap remains.
  primaryUpdateMethod: switchover

  ## Same lesson as ha-recorder-pg (2026-06-15): soft anti-affinity let both
  ## instances co-locate; `required` is always satisfiable (2 instances,
  ## 3 nodes) and guarantees real node-failure protection.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: harvester-longhorn-2replicas
    ## DB is ~tens of MB; 5Gi leaves a deep WAL cushion (the ha-recorder
    ## 07-30 disk-full lesson: pg_wal bursts eat headroom fast).
    size: 5Gi

  postgresql:
    ## O2 Database Monitoring demo (2026-09-24, QUICK-WINS #6): server-side Top
    ## queries read pg_stat_statements, which must be PRELOADED. Changing this list
    ## restarts Postgres; CNPG rolls the replica first, then switches the primary
    ## over (primaryUpdateStrategy: unsupervised). Same form as bootstrap/gitlab-pg.
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      max_connections: "50"
      shared_buffers: 128MB
      effective_cache_size: 256MB
    ## Lossless failover, same pattern as ha-recorder-pg: preferred keeps
    ## availability when the standby is down.
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  ## Read-only monitoring login for the O2 DBM collector (openobserve/o2-dbm-collector.yml).
  ## pg_monitor = read pg_stat_* / pg_stat_statements for every database; it cannot
  ## read table data. Password: Akeyless /mdapi/monitoring/grafana-pg-o2dbm/password.
  managed:
    roles:
      - name: o2_dbm
        ensure: present
        login: true
        # CNPG defaults inherit to true; declared so git matches the live
        # object (mdapi-prod-jump sat Modified on this one field 09-25..28).
        inherit: true
        inRoles: [pg_monitor]
        connectionLimit: 8
        passwordSecret:
          name: grafana-pg-o2dbm

  bootstrap:
    initdb:
      database: grafana
      owner: grafana_rw
      secret:
        name: grafana-pg-app

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # Quoted: CNPG stores the quantity as a string; an unquoted int
      # renders as a perpetual Fleet "Modified" diff (1 vs "1").
      cpu: "1"
      memory: 1Gi
---
## The barman store for grafana-pg, as a barmancloud.cnpg.io ObjectStore
## (beads infra-zkak, 2026-10-07). Contents are the cluster's former
## `spec.backup.barmanObjectStore` block, moved verbatim into
## `spec.configuration` -- the plugin documents that mapping as mechanical, and
## the drill (~/bootstrap/drills/cnpg-recovery/) proved the plugin reads an
## archive the in-tree code wrote, so the layout on disk is unchanged.
##
## ⛔ Two fields must NOT come along, for two DIFFERENT reasons -- one rejects
## you, the other does not:
##   * `serverName` -> FAILS LOUDLY. The CRD forbids it here (CEL,
##     FieldValueForbidden: "use the 'serverName' plugin parameter in the
##     Cluster resource"); it is a plugin parameter on the Cluster instead.
##   * `retentionPolicy` -> FAILS SILENTLY, which is the one to watch. The plugin
##     defines retention on the STORE, not on the cluster, so it lives at
##     `spec.retentionPolicy` below. Left off entirely, nothing complains --
##     nothing prunes either, and this bucket (70.6 GiB for a Grafana DB) grows
##     without bound. `s3 ls` is the only place that would ever show it.
##
## ⭐ Same store, same bucket, same credentials as before -- no cutover, no new
## archive. That is the point of the pilot: only the WRITER changes.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: grafana-pg
  namespace: monitoring
spec:
  configuration:
    destinationPath: s3://cnpg-grafana-pg
    ## ⭐ 2026-09-19: moved off the salt/pepper Garage to the IN-CLUSTER Ceph
    ## RGW, as part of retiring both those hosts. This is the "local" half of
    ## the backup architecture: short-window PITR and granular restore live
    ## here; the offsite copy is a separate, client-side-encrypted channel.
    ##
    ## ⛔ NEW bucket name on purpose. The Garage bucket was `grafana-pg-backup`;
    ## reusing it would mean a half-applied change (new store, stale
    ## endpointURL) kept writing to Garage and SUCCEEDED, silently. With a
    ## distinct name that mistake fails closed with NoSuchBucket.
    ##
    ## ⛔⛔ Changing destinationPath starts an EMPTY archive. WAL archiving
    ## alone is not a backup -- paperless-pg proved that with 33k objects and
    ## zero base backups. A one-shot Backup is taken immediately after this
    ## lands, and a completed base backup is the only acceptable evidence.
    ## ⭐ Under the plugin that evidence is NOT `Cluster.status.lastSuccessfulBackup`
    ## any more -- that field stays empty (measured 2026-10-07). Read it off the
    ## ObjectStore instead:
    ##   kubectl -n monitoring get objectstore grafana-pg \
    ##     -o jsonpath='{.status.serverRecoveryWindow.grafana-pg.lastSuccessfulBackupTime}'
    ## (apiVersion barmancloud.cnpg.io/v1 -- the bare `objectstore` short name
    ## also resolves to ceph.rook.io, so always qualify it.)
    ##
    ## ⭐ TLS restored. !369 landed this store on plain http, which handed
    ## back exactly the property the Garage terminator was built for on
    ## 2026-09-05: pods on qui/quo/qua reach an RGW pod on another node across
    ## the physical LAN, over an UNENCRYPTED VXLAN overlay, and barman does not
    ## encrypt. "It stays in the cluster" was the wrong reassurance -- the
    ## cluster is three separate machines. RGW now carries its own house-PKI
    ## leaf (rook-ceph-objectstore-users/rgw-tls-cert.yml) and this dials it.
    endpointURL: https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443
    ## The CA here is the house chain (MDAPI Root + MDAPI Issuing CA 01), which
    ## is what a Horizon-issued RGW leaf chains to.
    ## ⭐ Renamed garage-transit-ca -> rgw-transit-ca on 2026-09-21, across all
    ## six namespaces at once. Contents byte-identical; the old name was the
    ## last thing on the estate still calling Garage a live dependency.
    ## ⛔ CORRECTED 2026-10-07 (beads infra-zkak). This used to read: "Changing
    ## this name costs NOTHING here: measured on CNPG 1.30, the instance pods do
    ## not reference the secret at all (the operator resolves endpointCA through
    ## the API at backup time), so there is no pod-spec change and no switchover."
    ## That was TRUE of the in-tree `spec.backup.barmanObjectStore` block this store
    ## was moved from -- re-measured 2026-10-07, no cluster still on the in-tree
    ## stanza has its CA secret in a pod spec. It is FALSE here. The plugin PROJECTS
    ## the CA into every instance pod, as a `barman-certificates` volume (source:
    ## this secret, key ca.crt) mounted at /barman-certificates on the
    ## plugin-barman-cloud sidecar, one directory per referenced store:
    ##   /barman-certificates/<objectStoreName>/barman-ca.crt
    ## keyed on the ObjectStore's NAME, not on serverName. So the secret IS in the
    ## pod spec, and a rename is a pod-affecting change until re-measured otherwise.
    ## ⚠️ The projection is built ONCE and never revisited -- the operator adds the
    ## volume only if it is ABSENT, so a RUNNING cluster repointed at a store with a
    ## different NAME keeps the old store's directory and barman fails on the
    ## missing file:
    ##   SSL validation failed for <url> [Errno 2] No such file or directory  (exit 4)
    ## That reads like a stale-archive failure and is not one -- check this volume
    ## first. Drill that proves it: ~/bootstrap/drills/cnpg-recovery/README.md.
    endpointCA:
      name: rgw-transit-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: cnpg-grafana-pg
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-grafana-pg
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: cnpg-rgw-region
        key: REGION
    ## ⛔ `data:` and `wal:` were both absent, so CNPG's defaults applied: ONE
    ## upload worker and NO compression anywhere. This bucket is **70.6 GiB**
    ## for a Grafana database — the same symptom ha-recorder-pg showed at
    ## 1.68 TiB for 17 GB, where a base backup crawled at 0.3-1.0 MiB/s while
    ## the storage, the TLS terminator and Garage all sat idle.
    ## bootstrap/gitlab-pg has carried jobs + gzip all along without either
    ## problem. jobs: 2 matches it and fits this pod's 1-CPU limit.
    ## ⚠️ Compression is recorded PER BACKUP — existing backups stay
    ## restorable, and nothing shrinks retroactively; the 70.6 GiB needs the
    ## 14d retention to actually run.
    data:
      compression: gzip
      jobs: 2
    wal:
      compression: gzip
  ## Enforcement moved here with the value unchanged. ⚠️ It is read by the
  ## plugin's backup path, so it prunes on the next backup -- not retroactively.
  retentionPolicy: "14d"
---
## App-role credentials. Same Akeyless key Grafana's deployment already
## consumes as GF_DATABASE_PASSWORD (grafana-es.yml) — CNPG initdb sets the
## grafana_rw role password from here, so the migration is host-swap only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-pg-app
  namespace: monitoring
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: grafana-pg-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: grafana_rw
        password: "{{ .password }}"
  data:
    - remoteRef:
        key: /mdapi/grafana/pg-password
      secretKey: password
---
## S3 creds for grafana-pg barman backups (G6, beads infra-jjb, 2026-08-15).
## Key GK3afd8019c7a64b6ebe8b49d5 scoped RW to the grafana-pg-backup bucket on the external Garage;
## offsite-swept to B2/SFTP by rgw_offsite_backup.
## ⚠️ 2026-09-19: NO LONGER REFERENCED by the cluster above -- the barman store
## moved to the in-cluster Ceph RGW and now uses the OBC-written secret instead.
## This is kept ONLY so the abandoned Garage store on salt stays readable while
## that host is still up: it holds the sole pre-cutover PITR history, and the
## credentials to reach it exist nowhere else in git. Delete it together with
## the Garage buckets when salt is powered off -- an ExternalSecret nothing
## consumes is exactly the kind of config that rots into a false sense of cover.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-pg-backup-s3
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: grafana-pg-backup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .access_key }}"
        ACCESS_SECRET_KEY: "{{ .secret_key }}"
        ## Garage validates the SigV4 region scope; barman defaults us-east-1.
        REGION: "garage"
  data:
    - secretKey: access_key
      remoteRef:
        key: /mdapi/monitoring/grafana-pg-backup-s3/access_key
    - secretKey: secret_key
      remoteRef:
        key: /mdapi/monitoring/grafana-pg-backup-s3/secret_key
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-pg-daily
  namespace: monitoring
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: grafana-pg
  ## ⛔ Required after the plugin migration (beads infra-zkak). Without these two
  ## fields this ScheduledBackup keeps taking IN-TREE backups of a cluster that
  ## no longer has a `spec.backup` stanza -- so every night it would fail, and
  ## the failure would look like a backup problem rather than an unmigrated
  ## object. The schedule itself is unchanged.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
## Password for the o2_dbm login above. CNPG requires a basic-auth secret whose
## username matches the role name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-pg-o2dbm
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: grafana-pg-o2dbm
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          ## CNPG only re-reads a password secret it WATCHES: without this label a role that was
          ## reconciled before ESO created the secret stays "pending-reconciliation" forever
          ## (gitlab-pg / ha-recorder-pg, 2026-09-24), and a rotated password is never applied.
          cnpg.io/reload: "true"
      data:
        username: o2_dbm
        password: "{{ .password }}"
  data:
    - remoteRef:
        key: /mdapi/monitoring/grafana-pg-o2dbm/password
      secretKey: password
---
## Declares the pg_stat_statements extension in the `grafana` database (the
## receiver's top-query pass reads the view there). Adopting the existing
## database is safe: owner unchanged, and databaseReclaimPolicy defaults to
## retain, so deleting this object never drops the database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana-pg-grafana
  namespace: monitoring
spec:
  name: grafana
  owner: grafana_rw
  cluster:
    name: grafana-pg
  extensions:
    - name: pg_stat_statements
      ensure: present
