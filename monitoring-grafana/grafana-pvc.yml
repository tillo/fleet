apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
  ## Backup class `none` (dashboards are provisioned from Fleet), declared at
  ## definition time. `none` is MEMBERSHIP of the `nobackup` group, not an
  ## absence of labels — an unlabelled Longhorn volume is auto-put in
  ## `default`. Same set f/heal/backup_label_enforcer derives, so it patches
  ## nothing.
  labels:
    mdapi.ch/backup-class: none
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nobackup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
