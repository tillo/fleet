## Trust anchors for the Garage S3 TLS terminator on salt/pepper (:30288).
##
## Not a secret: CA *certificates* are public by construction. Checked in rather
## than pulled through External Secrets so a CNPG cluster can archive a WAL
## without ESO having to be up first.
##
## Contents: MDAPI Root CA (anchor, to 2036) + MDAPI Issuing CA 01 (to 2031).
## The terminator's leaf is issued by the house PKI through Horizon CLM, so it
## auto-renews on the estate's 47-day cycle -- there is no static long-lived
## certificate here to rot.
