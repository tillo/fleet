## Owns the 15 baseline-requests LimitRanges, which the repo-root bundle used to
## apply. That bundle is being removed (see the root fleet.yaml), and these would
## be pruned with it unless they own a bundle of their own first.
##
## No defaultNamespace/namespace on purpose: the root bundle set neither, and
## each LimitRange names its own namespace -- adding one here would move them.
## takeOwnership adopts the already-applied objects; without it Helm rejects
## them with invalid ownership metadata.
helm:
  takeOwnership: true
