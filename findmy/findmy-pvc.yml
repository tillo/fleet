## Collector state: the session as it is refreshed in use, the accessory keys
## fetched from the Mac, and the Apple library bundle findmy downloads once
## (~2.1 MB) rather than on every pod start.
##
## The session matters most. findmy rewrites it as tokens refresh, so a pod that
## always restarted from the secret-store seed would eventually be restarting
## from a session that has aged out -- and re-authenticating needs a human with
## a 2FA code.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: findmy-state
  namespace: findmy
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
