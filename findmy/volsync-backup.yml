## Off-site backup of findmy-state. Shared /mdapi/volsync/ceph-backup creds,
## per-PVC subpath in the offsite-swept external-Garage ceph-backup bucket.
##
## WHY, given the keys are already in the secret store: the volume also holds
## the Apple session AS IT IS REFRESHED IN USE, which drifts away from the seed
## in Akeyless. Losing the volume would fall back to a seed that eventually goes
## stale, and re-authenticating needs a human with a 2FA code -- the one step
## this whole pipeline exists to avoid. The keys are belt, this is braces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-ceph-backup-restic
  namespace: findmy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: volsync-ceph-backup-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ## In-cluster transit/garage, NOT api.garage.home.tillo.ch: that
        ## hostname resolves to the shared ingress VIP, so every backup would
        ## hairpin through ingress-nginx and fail exactly when the front door is
        ## degraded -- which is when a backup matters most. restic encrypts
        ## client-side and S3 auth is a SigV4 signature, so terminating without
        ## ingress TLS costs no confidentiality here.
        ## ⭐ 2026-09-19: moved off the salt/pepper Garage to Backblaze B2 DIRECT,
        ## following the openvpn-pki canary. restic encrypts client-side, so these
        ## repos are the "send directly encrypted" half of the architecture and need
        ## no local staging. The B2 copy was never rclone-crypt wrapped (this bucket
        ## is in the offsite job's NO_ENCRYPT set precisely because restic already
        ## encrypts), so it is a REAL restic repo: config, data/ and snapshots/ were
        ## verified present for all 11 repos before switching. History carries over
        ## and nothing re-uploads -- 404 GiB leaves Garage in total.
        ##
        ## ⛔⛔ The offsite key's grant on this bucket was revoked FIRST. The offsite
        ## job runs `rclone sync`, which MIRRORS DELETIONS and derives its bucket
        ## list from that key's grants -- leaving it would have had the next 02:00
        ## run delete every snapshot written here, as they are absent from Garage.
        ##
        ## ⛔ B2's S3 endpoint is region us-west-001, read from b2_authorize_account's
        ## `s3ApiUrl`. Do not guess: 002/003/004 and eu-central all fail and read as
        ## "B2 is not S3 compatible" when it is only a different region. The S3
        ## endpoint keeps the AWS_* shape, so restic's native b2: backend and its
        ## B2_ACCOUNT_ID/KEY env are not needed.
        RESTIC_REPOSITORY: "s3:https://s3.us-west-001.backblazeb2.com/saltminio/ceph-backup/findmy-state"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .b2_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .b2_app_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /mdapi/volsync/ceph-backup/restic-password
    - secretKey: b2_key_id
      remoteRef:
        key: /mdapi/volsync/b2/account-id
    - secretKey: b2_app_key
      remoteRef:
        key: /mdapi/volsync/b2/account-key
---
## Apple session (as refreshed), imported accessory keys, and the downloaded
## Apple library bundle. Small volume, so a daily snapshot is cheap.
##
## ⚠️ This volume is now genuinely sensitive: it carries keys that grant
## location access to another person's AirTags and AirPods. restic encrypts
## client-side with the shared repository password, so the off-site copy is not
## readable at the bucket.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: findmy-state
  namespace: findmy
spec:
  sourcePVC: findmy-state
  trigger:
    ## 03:20 UTC, clear of the other ceph-backup movers so they do not contend
    ## for the same Garage endpoint.
    schedule: "20 3 * * *"
  restic:
    repository: volsync-ceph-backup-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    cacheCapacity: 1Gi
    cacheStorageClassName: harvester-longhorn-1replica
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
