defaultNamespace: findmy
namespace: findmy
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25

## The state volume caches the Apple session as it is refreshed in use, plus the
## downloaded Apple library bundle. Losing it is recoverable -- the seed session
## is in the secret store -- but a bundle removal should not silently discard a
## session that has drifted from that seed.
keepResources: true
