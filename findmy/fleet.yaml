defaultNamespace: findmy
namespace: findmy
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25

## The state volume caches the Apple session as it is refreshed in use, plus the
## downloaded Apple library bundle. Losing it is recoverable -- the seed session
## is in the secret store -- but a bundle removal should not silently discard a
## session that has drifted from that seed.
keepResources: true
