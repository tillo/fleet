# mdapi family portal — static Basecoat front-end (repo mdapi/portal, web/)
# over the Windmill portal endpoints. Served at start.mdapi.ch behind the
# oauth2-proxy-portal instance (any tilloch-realm user); the ingress forwards
# the authenticated X-Auth-Request-Email and the pod's nginx injects it
# server-side into every Windmill call (see web/nginx.conf.template in the
# repo). Replaced the Lowcoder board (bundle retired at the 2026-07-03
# cutover, after preview sign-off at panel.mdapi.ch).
#
# ── TILE BOARD — THE SOURCE IS mdapi/portal, NOT THIS FILE AND NOT WINDMILL ─
# The board is the Windmill variable `f/portal/catalogue` (a JSON array), read
# by f/portal/resolve_board.py via wmill.get_variable(). It is flagged secret,
# so `wmill sync pull` SKIPS it and the ~/windmill mirror has no copy either.
#
# ⛔ But that variable is NOT the source — it is a DEPLOY TARGET. `catalogue.json`
# in the mdapi/portal repo is the source; deploy_catalogue.py writes it into the
# variable from a GitLab pipeline SCHEDULE (id 38, `12 */4 * * *` UTC), so the
# variable is rewritten out of git every four hours whether or not anyone pushed.
#
# ⇒ HAND-EDITING THE VARIABLE IS FUTILE: any manual fix survives at most 4 hours.
#   Change catalogue.json and let the schedule carry it.
#
# Read / write it:
#   GET|POST {WINDMILL}/api/w/mdapi/variables/{get_value,update}/f/portal/catalogue
# ⚠ SIZE CAP: the value is close to Windmill's per-field limit. At 57 tiles the
#   compact JSON is 10,857 bytes; writing it with json.dumps() DEFAULT separators
#   inflates it to ~11.6 KB and the API rejects it with "A field exceeds its
#   maximum length". Always dump with separators=(',',':'). Descriptions are the
#   only real slack left.
#
# Tile schema:
#   {name, url, icon (material-design-icons), group, seen_by[], if_locked, kind, desc}
#   seen_by  : "everyone", a Keycloak group (Family/Friends/Home/mdapi-admin/
#              mdapi-tv), or an individual username
#   if_locked: HIDE (default) | REQUEST
#   kind     : app (default) | request_product | request_help
#
# Snapshot 2026-08-28 (desc omitted — cosmetic; url + seen_by are what matter):
