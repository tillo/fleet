apiVersion: apps/v1
kind: Deployment
metadata:
  name: eclipse-mosquitto
  namespace: mqtt
  annotations:
    reloader.stakater.com/auto: "true"
    # Lane B since 2026-09-03 — pinned on purpose.
    #
    # This was `:latest` + an auto-updater force-poll. On Docker Hub `latest` tracks the
    # mosquitto 2.1 line while the 2.0 line is maintained separately at 2.0.22,
    # so `latest` crosses MINORS unattended — on a broker that is replicas=1,
    # strategy=Recreate, and the only MQTT bus for Frigate, ESPHome and a LAN
    # device (LoadBalancer 192.168.1.43). Every force-poll was a hard restart
    # with a real gap, and a minor could change broker behaviour with nobody
    # reading the release notes.
    #
    # It also moved invisibly: this Deployment's ReplicaSet dates from
    # 2026-04-05 and its image string never changed, yet the pod was serving a
    # 2026-06-22 build (mosquitto 2.1.2). Content drifted ~2 months with no
    # Deployment revision, no `rollout history` entry and no git commit.
    #
    # Now pinned by tag + digest and owned by Renovate (renovate.json), so
    # nothing here moves without an MR. Dropping `:latest` also flips the
    # implicit imagePullPolicy to IfNotPresent = the Lane-B boot-safety shape.
spec:
  selector:
    matchLabels:
      app: eclipse-mosquitto
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: eclipse-mosquitto
    spec:
      initContainers:
      ## Hash the users' passwords into the broker's password file. The broker
      ## container never mounts the plaintext Secret; it reads only this file.
      ## `-U` hashes a user:password file in place, so no password is ever on a
      ## command line.
      - name: passwd
        image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          umask 077
          f=/mosquitto/auth/passwd
          : > "$f"
          for u in homeassistant frigate findmy; do
            [ -s "/users/$u" ] || { echo "no password for $u"; exit 1; }
            printf '%s:%s\n' "$u" "$(cat "/users/$u")" >> "$f"
          done
          mosquitto_passwd -U "$f"
          chown mosquitto:mosquitto "$f"
          chmod 0600 "$f"
          cp /config/aclfile /mosquitto/auth/aclfile
          chown mosquitto:mosquitto /mosquitto/auth/aclfile
          chmod 0600 /mosquitto/auth/aclfile
        volumeMounts:
        - name: users
          mountPath: /users
          readOnly: true
        - name: mosquitto-config
          mountPath: /config
          readOnly: true
        - name: auth
          mountPath: /mosquitto/auth
      containers:
      - name: eclipse-mosquitto
        # 2.1.2. NOTE: the 2.1 line is published ONLY with an -alpine suffix —
        # there is no plain `2.1.2` tag. `2.0`/`2.0.22` is the older line.
        image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
        ## Declared 2026-09-28 (ledger alert:ImagePolicyWarn): the LIVE object still
        ## carried `Always` from the force-poll era because git never set the
        ## field, so removing it here changed nothing on the cluster.
        imagePullPolicy: IfNotPresent
        resources: {}
        ports:
        - containerPort: 1883
        env:
        - name: TZ
          value: Europe/Zurich
        volumeMounts:
        - name: mosquitto-data
          mountPath: /mosquitto/data
        - name: mosquitto-config
          mountPath: /mosquitto/config
        - name: auth
          mountPath: /mosquitto/auth
          readOnly: true
      volumes:
      - name: users
        secret:
          secretName: mqtt-users
      - name: auth
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: mosquitto-data
        persistentVolumeClaim:
          claimName: mosquitto-data
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
