## Cluster-scoped companion to jump/jump-seat-direct.yml.
##
## The ServiceAccount is namespaced and lives in the jump/ bundle. Its
## ClusterRoleBinding cannot: jump/fleet.yaml pins the bundle with `namespace:`,
## and Fleet silently drops cluster-scoped objects from a namespace-pinned
## bundle while still reporting it Ready. Same reason kube-bench/ and
## windmill/rbac/ declare their cluster RBAC in bundles that set only
## `defaultNamespace`.
defaultNamespace: jump
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25
  # The binding was kubectl-applied on 2026-10-15 and carries no Helm ownership
  # metadata — same live-vs-git shape as everything else applied during the
  # 2026-07-2x outage.
  takeOwnership: true
