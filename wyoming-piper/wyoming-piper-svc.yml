## No Ingress on purpose: Wyoming is a raw TCP protocol with no authentication
## of its own, consumed only by Home Assistant from inside the cluster. HA
## reaches it at wyoming-piper.wyoming.svc.cluster.local:10200.
apiVersion: v1
kind: Service
metadata:
  name: wyoming-piper
  namespace: wyoming
spec:
  selector:
    app: wyoming-piper
  ports:
    - name: wyoming
      port: 10200
      protocol: TCP
      targetPort: 10200
  type: ClusterIP
