## agentgateway.mdapi.ch — the standalone agentgateway's Admin UI (+ its /api)
## behind oauth2-proxy-admin (Keycloak, role mdapi-admin).
##
## agentgateway serves the UI with NO authentication of its own; this Ingress is
## the gate and agentgateway-netpol.yml makes it the only path to :4001. The UI
## WRITES the gateway's config (database mode), so reaching :4001 any other way
## is admin over every route, key and upstream credential it holds.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-ui
  namespace: agentgateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    ## Chat / tool playground responses stream.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [agentgateway.mdapi.ch]
      secretName: agentgateway-ui-tls
  rules:
    - host: agentgateway.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-ui
                port:
                  number: 4001
