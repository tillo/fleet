# Wiring for the standalone, database-mode agentgateway (helm bundle
# agentgateway-standalone): its namespace, its Postgres, the Ingress that puts the
# Admin UI at https://agentgateway.mdapi.ch behind oauth2-proxy-admin, the MCP
# front door (Service, Ingress and certificate for mcp.mdapi.ch, the upstream
# bearers), and the NetworkPolicy that names who may reach each port.
#
# Raw bundle: a helm bundle would silently drop these manifests.
defaultNamespace: agentgateway
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
