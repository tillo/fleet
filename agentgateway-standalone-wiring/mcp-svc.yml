## The MCP front door's in-cluster name: http://mcp.agentgateway.svc.cluster.local:8080/<server>/mcp
## (kagent's RemoteMCPServers, the blackbox probe, the Ingress mcp.mdapi.ch).
## A raw Service rather than the chart's extraServices, which would prefix it
## `agentgateway-mcp`. Listener `mcp` (:8080) is in the helm values' baseline;
## its routes are database rows.
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: agentgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: standalone
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/name: agentgateway-standalone
  ports:
    - name: http
      port: 8080
      targetPort: 8080
