## LLM provider keys for the evaluation copies of LiteLLM groups (bead
## infra-7rog.32). Same Akeyless paths as litellm/litellm-es.yml, so a rotation
## there reaches both gateways. Injected as env vars and referenced in the
## database rows as `params.apiKey: $NAME` — the row holds a name, never a key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-llm-keys
  namespace: agentgateway
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: agentgateway-llm-keys
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /mdapi/litellm/litellm-env-secret/ANTHROPIC_API_KEY
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: /mdapi/litellm/litellm-env-secret/DEEPSEEK_API_KEY
    - secretKey: LMSTUDIO_API_KEY
      remoteRef:
        key: /mdapi/litellm/litellm-env-secret/LMSTUDIO_API_KEY
