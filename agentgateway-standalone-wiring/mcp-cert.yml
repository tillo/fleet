## mcp.mdapi.ch, issued here BEFORE the Ingress moves (DNS-01, so no HTTP
## path is needed) — the cutover then never serves a default certificate.
## The Ingress carries no cert-manager annotation: a second Certificate for the
## same Secret would fight this one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-cert
  namespace: agentgateway
spec:
  secretName: mcp-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - mcp.mdapi.ch
