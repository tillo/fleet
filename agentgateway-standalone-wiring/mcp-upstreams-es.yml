---
## Windmill's MCP endpoint (/api/mcp/w/mdapi/mcp) takes a workspace token with the
## single scope mcp:all, label agentgateway-mcp-upstream (infra-az8.49).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-upstream-windmill
  namespace: agentgateway
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: mcp-upstream-windmill
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /mdapi/windmill/agentgateway-mcp-upstream/token

---
## GitLab's built-in MCP server (/api/v4/mcp, GA in 19.5). It accepts only an OAuth token
## carrying the mcp scope or a fine-grained PAT with the MCP tool, so this is a dedicated
## PAT minted for the gateway - the admin api-token cannot be used here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-upstream-gitlab
  namespace: agentgateway
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: mcp-upstream-gitlab
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /mdapi/gitlab/mcp-token
