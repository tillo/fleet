apiVersion: v1
kind: Endpoints
metadata:
  name: rancher
  namespace: transit
subsets:
  - addresses:
      # rancher-mgmt-1/2/3 — the ACTIVE in-cluster Rancher since 2026-08-10.
      # Its ingress serves the rancher.home.tillo.ch vhost (alias ingress,
      # dual-SAN cert), matching this transit's upstream-vhost/SNI rewrite.
      # mbptillo (192.168.1.246) is the standby; point back there on failover.
      - ip: 192.168.1.31
      - ip: 192.168.1.32
      - ip: 192.168.1.33
    ports:
      - port: 443
