## rancher.mdapi.ch -> transit/rancher Service -> rancher-mgmt-1/2/3 :443
## (the ACTIVE in-cluster Rancher; its alias ingress serves rancher.mdapi.ch
## FIRST-CLASS with a 3-SAN cert. mbptillo .246 is the standby.)
##
## NO Host rewrite since 2026-08-10: the original rancher.mdapi.ch Host passes
## through, so Rancher generates absolute links/self-URLs the browser can
## actually resolve. (The old upstream-vhost=rancher.home.tillo.ch rewrite made
## the dashboard fetch an internal-only name -> login "network error" from
## outside.) proxy-ssl-server-name/-name still pin the upstream SNI so the mgmt
## ingress picks the matching vhost + cert. Read/send timeouts bumped to 3600s
## so kubectl-exec / shell / log-tail streams from the Rancher UI don't get cut
## at the default 60s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher
  namespace: transit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: rancher.mdapi.ch
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: rancher.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rancher
                port:
                  number: 443
  tls:
    - hosts:
        - rancher.mdapi.ch
      secretName: rancher-cert
