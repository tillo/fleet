apiVersion: v1
kind: Endpoints
metadata:
  name: santillo
  namespace: transit
subsets:
  - addresses:
      # santillo NAS web UI (plain HTTP :5000). Was 192.168.1.191 — the
      # HARVESTER VIP, which has never listened on 5000: a paste error in the
      # original transit commit. The service only worked because an orphaned
      # 2024 EndpointSlice still carried .5 and nginx retried past the dead
      # backend (found during the 2026-08-10 E4 drill slice audit).
      - ip: 192.168.1.5
    ports:
      - port: 5000
