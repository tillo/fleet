apiVersion: v1
kind: Endpoints
metadata:
  name: garage
  namespace: transit
subsets:
  - addresses:
      - ip: 192.168.1.207   # salt
      - ip: 192.168.1.219   # pepper
    ports:
      - name: api
        port: 30188
      ## nginx TLS terminator on each Garage host -- see garage-svc.yml.
      - name: api-tls
        port: 30288
      - name: console
        port: 30186
