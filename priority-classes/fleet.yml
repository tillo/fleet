## Owns mdapi-critical / mdapi-default / mdapi-low.
##
## Same reason as limit-ranges/fleet.yml: these were applied by the repo-root
## bundle that the GitRepo's new explicit path list removes, so they need an
## owner of their own or they would be pruned with it.
##
## Losing a PriorityClass is worse than losing a LimitRange: existing pods keep
## running, but any NEW pod referencing a missing class is rejected outright.
helm:
  takeOwnership: true
