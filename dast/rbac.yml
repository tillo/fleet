# The edge-dast discovery identity. Its one permission (list Ingresses; no
# secrets, no pods, no write) is granted cluster-wide in dast/rbac/, a nested
# bundle, because this bundle is pinned to namespace dast and Fleet silently
# drops cluster-scoped kinds here. Only the init container mounts its token
# (cronjob.yml); the scanners, which parse content a stranger controls, never
# see one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-dast
  namespace: dast
automountServiceAccountToken: false
