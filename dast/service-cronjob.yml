# ACTIVE DAST against app SERVICES, behind the WAF (infra-7rog.31.5). The edge scan
# (cronjob.yml) is passive and goes through the ingress; this one attacks:
#
#   zap    -- zap-full-scan.py (spider + ACTIVE rules), or zap-api-scan.py when the
#             target names an OpenAPI URL. Sends payloads and POSTs.
#   nuclei -- the HTTP templates (`-t http/`), which the edge scan must never run
#             through the WAF. -ni: no interactsh callback server.
#
# Targets: discovered at run time by the init container (service-discover.yml,
# infra-7rog.31.17): every Ingress backend Service the pod can connect to, minus
# the opt-outs and the default exclusions listed there. What the pod can connect
# to is the egress fence in netpol.yml -- enrolling an app is one rule there.
# Reports use the edge scan's BEGIN/END pod-log markers ("zap-full <svc>.<ns>",
# "nuclei-http <svc>.<ns>"). A target whose report is missing makes its container
# exit 1.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: service-dast
  namespace: dast
spec:
  # Weekly, Sunday 03:17 UTC: an active scan is load on the target; odd minute.
  schedule: "17 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: service-dast
            # Same zap/nuclei scanners as edge-dast (cronjob.yml): CPU-capped
            # on purpose, exempt from ContainerCpuThrottling.
            monitoring.mdapi.ch/cpu-throttle-exempt: "true"
        spec:
          restartPolicy: Never
          # edge-dast's identity (list Ingresses + Services, nothing else). Only the
          # discover init container mounts its token (`api-token`); the scanners
          # parse content an app controls and hold no credential.
          serviceAccountName: edge-dast
          automountServiceAccountToken: false
          enableServiceLinks: false
          priorityClassName: mdapi-low
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: targets            # written by discover, read by the scanners
              emptyDir: {sizeLimit: 1Mi}
            - name: discover
              configMap: {name: dast-service-discover}
            - name: api-token
              projected:
                sources:
                  - serviceAccountToken: {path: token, expirationSeconds: 3600}
                  - configMap:
                      name: kube-root-ca.crt
                      items: [{key: ca.crt, path: ca.crt}]
            - name: zap-wrk
              emptyDir: {sizeLimit: 512Mi}
            - name: nuclei-home
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: discover
              image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              volumeMounts:
                - {name: discover, mountPath: /discover, readOnly: true}
                - {name: api-token, mountPath: /var/run/secrets/dast, readOnly: true}
                - {name: targets, mountPath: /targets}
              command: ["python3", "-I", "/discover/service-discover.py"]
          containers:
            - name: zap
              image: docker.io/zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 250m, memory: 1Gi}
                limits: {cpu: "1", memory: 3Gi}
              volumeMounts:
                - {name: targets, mountPath: /targets, readOnly: true}
                - {name: zap-wrk, mountPath: /zap/wrk}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -u
                  # Every scanner call reads /dev/null, never the loop's list: nuclei reads
                  # stdin and once swallowed every remaining target (edge-dast 2026-11-10).
                  RC=0
                  while read -r name url api; do
                    case "$name" in ''|'#'*) continue ;; esac
                    r=0
                    f="/zap/wrk/zap-$name.xml"
                    # UA-tagged; each active scan capped at 30 min so one slow app
                    # cannot eat the job's 3 h deadline.
                    ua="-config connection.defaultUserAgent=mdapi-dast/zap-active -config scanner.maxScanDurationInMins=30"
                    if [ -n "${api:-}" ]; then
                      zap-api-scan.py -t "$api" -f openapi -z "$ua" -x "zap-$name.xml" </dev/null || r=$?
                    else
                      zap-full-scan.py -t "$url" -m 5 -z "$ua" -x "zap-$name.xml" </dev/null || r=$?
                    fi
                    if [ "$r" -ge 3 ] || [ ! -s "$f" ]; then
                      echo "zap: no report for $name (exit $r)"; RC=1; continue
                    fi
                    echo "-----BEGIN DAST REPORT zap-full $name-----"
                    gzip -c "$f" | base64
                    echo "-----END DAST REPORT zap-full $name-----"
                  done < /targets/targets
                  exit $RC
            - name: nuclei
              image: docker.io/projectdiscovery/nuclei:v3.11.1@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              env:
                - {name: HOME, value: /home/nuclei}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                # 2Gi, not 1Gi: the FIRST live run (2026-11-23) OOMKilled this
                # container after 15 min, before one report, loading `-t http/`
                # (the whole HTTP template tree parses at ~809 MiB). CPU stays
                # capped -- that exemption is deliberate (18-cpu-throttling.yml).
                limits: {cpu: 500m, memory: 2Gi}
              volumeMounts:
                - {name: targets, mountPath: /targets, readOnly: true}
                - {name: nuclei-home, mountPath: /home/nuclei}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  nuclei -ut -silent || { echo "nuclei: template download failed"; exit 1; }
                  RC=0
                  while read -r name url _openapi; do
                    case "$name" in ''|'#'*) continue ;; esac
                    f="$HOME/nuclei-$name.jsonl"
                    # -t http/ (a directory, never -pt: that parses the whole tree,
                    # 809 MiB). -ni: no interactsh. -es info: inventory is not a finding.
                    if ! nuclei -target "$url" -t http/ -es info -ni -duc -silent -nc \
                         -H "User-Agent: mdapi-dast/nuclei-active" -jsonl -o "$f" </dev/null; then
                      echo "nuclei: scan failed for $name"; RC=1; continue
                    fi
                    [ -s "$f" ] || echo "[]" > "$f"   # DefectDojo rejects an empty upload
                    echo "-----BEGIN DAST REPORT nuclei-http $name-----"
                    gzip -c "$f" | base64
                    echo "-----END DAST REPORT nuclei-http $name-----"
                  done < /targets/targets
                  exit $RC
