## Cluster-scoped RBAC for the edge-dast Ingress discovery (infra-7rog.31.6).
## Nested under dast/ so Fleet discovers it by recursion: no fleet-paths.txt
## line and no GitRepo entry. No `namespace:` key -- the parent bundle is
## pinned to namespace dast, where Fleet silently drops a ClusterRole.
defaultNamespace: dast
helm:
  maxHistory: 25
