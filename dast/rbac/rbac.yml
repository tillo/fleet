# Cluster-scoped half of the edge-dast discovery RBAC (the ServiceAccount is
# in dast/rbac.yml): list Ingresses and Services in every namespace, nothing else -- no
# secrets, no pods, no write.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dast-ingress-reader
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dast-ingress-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dast-ingress-reader
subjects:
  - kind: ServiceAccount
    name: edge-dast
    namespace: dast
