# Edge DAST hosts that NO Ingress serves. Every Ingress host is discovered
# at run time (discover.yml), so a new application needs no line here.
#
# Only HTTP fronts that bypass the cluster ingress belong here: today the
# haproxy TLS front on the router. ⛔ This repo is public: a hosted tenant's
# domain never goes in here (CLAUDE.md, tenant names).
#
# Not here on purpose: the non-HTTP exposures (mail, DNS, NTP, SFTP, rsync,
# FTP, TURN, IRC, Plex, the jump sslh). ZAP has nothing to say about them;
# the TLS ones are tracked separately (infra-7rog.31.7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dast-targets
  namespace: dast
data:
  hosts: |
    cm.mdapi.ch
