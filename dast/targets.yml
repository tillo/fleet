# The hosts the edge scan visits, one per line (https:// is implied).
#
# ⛔ Only the estate's own hosts. This repo is public: a hosted tenant's
# domain never goes in here (CLAUDE.md, tenant names). Each host added here
# shows up as its own test in DefectDojo (`zap <host>`, `nuclei <host>`).
#
# Before adding a host, check what the WAF does with a scan from INSIDE.
# Each block raises one ModSecBlockLikelyFalsePositive, because the relay
# trusts 10/8 (memory waf_canary_from_trusted_source_raises_modsec_fp_alert):
# a passive spider normally causes none.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dast-targets
  namespace: dast
data:
  hosts: |
    backstage.mdapi.ch
