defaultNamespace: metallb-system
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
helm:
  maxHistory: 25
  releaseName: metallb
  repo: https://metallb.github.io/metallb
  chart: metallb
  version: 0.16.1  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
# Post-render the chart with kustomize to raise the frr container's liveness
# timeout — the frr-k8s subchart exposes no value for it (see kustomize/).
# Same helm+kustomize pattern as cribl/ and envuassu/nextcloud.
kustomize:
  dir: kustomize
diff:
  comparePatches:
    # MetalLB controller rotates a CA into each CRD's conversion webhook
    # clientConfig at runtime; Fleet would otherwise mark the bundle as
    # drifted on every rotation. jsonPointers, not `operations: remove`: only
    # bgppeers has a conversion webhook at all, and a remove op on an absent path
    # fails (logged as an agent error, infra-8f4.19). An absent jsonPointer is
    # skipped silently.
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: bfdprofiles.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: bgpadvertisements.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: communities.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: ipaddresspools.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: l2advertisements.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: servicel2statuses.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
