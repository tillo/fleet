## Cluster-scoped StorageClasses for VolSync restic CACHE volumes, one per
## non-root mover uid (see storageclasses.yml for why they exist).
## Nested under volsync/ so Fleet discovers it by recursion: no fleet-paths.txt
## line and no GitRepo entry. No `namespace:` key — StorageClasses are
## cluster-scoped and the parent bundle owns volsync-system.
defaultNamespace: volsync-system
helm:
  maxHistory: 25
