## kgateway PoC (bead infra-qwet.1): the controller (ns kgateway-system) and the
## LAN-only test Gateway + echo backend (ns kgw-poc).
##
## Warning tier, INTERNAL component `Automation` (never on mdapi.statuspage.io):
## nothing in production is served through it, so an outage only pauses the
## evaluation. Delete this file with the PoC bundles.
##
## What covers what:
##   * workload arms (both namespaces, both kinds) — replicas short;
##   * KgwPocUnreachable — the outside view through the VIP: DNS override, MetalLB
##     announcement, Envoy listener and TLS, which replica counts cannot see;
##   * KgwPocCertExpiring — re-provided because the target carries no
##     `component`, so SyntheticProbeTLSExpiringSoon does not cover it.
##
## Selectors are NAMESPACE-WIDE on purpose (alert-coverage contract).
## `deployment=~".+"` / `statefulset=~".+"` are no-ops in PromQL and
## load-bearing for f/probe/alert_coverage_check — without them a namespace-only
## selector claims coverage of a kind it can never fire on.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-kgateway-poc
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
    - name: app-kgateway-poc.rules
      rules:
        - alert: KgwPocWorkloadUnavailable
          expr: |
            ( kube_deployment_spec_replicas{namespace=~"kgateway-system|kgw-poc", deployment=~".+"}
              - kube_deployment_status_replicas_available{namespace=~"kgateway-system|kgw-poc", deployment=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.deployment "kgateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} unavailable (kgateway PoC)"
            description: |
              A Deployment of the kgateway PoC has no available replica. Production
              traffic is unaffected (it never goes through kgateway). Check:
                kubectl --context mdapi-prod-direct -n {{ $labels.namespace }} get pod,gateway,httproute
                kubectl --context mdapi-prod-direct -n kgateway-system logs deploy/kgateway --tail=50

        ## ⚠️ Keep this arm even though it matches nothing today: the coverage
        ## probe treats a namespace-only selector as covering both kinds.
        - alert: KgwPocStatefulSetUnavailable
          expr: |
            ( kube_statefulset_replicas{namespace=~"kgateway-system|kgw-poc", statefulset=~".+"}
              - kube_statefulset_status_replicas_available{namespace=~"kgateway-system|kgw-poc", statefulset=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.statefulset "kgateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.statefulset }} unavailable (kgateway PoC)"
            description: |
              A StatefulSet in a kgateway PoC namespace has fewer available replicas than desired.

        - alert: KgwPocUnreachable
          ## avg_over_time gives hysteresis on both edges (as IastSinkUnreachable).
          expr: avg_over_time(probe_success{probe="kgw-poc"}[10m]) < 0.5
          for: 15m
          labels:
            service: kgateway-poc
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "https://plain.kgw.mdapi.ch/ unreachable through the kgateway VIP"
            description: |
              The blackbox probe of the PoC Gateway (192.168.1.66 via the
              split-horizon override) has been mostly failing for >15m. Walk it:
                dig +short @192.168.1.1 plain.kgw.mdapi.ch      # want 192.168.1.66
                kubectl --context mdapi-prod-direct -n kgw-poc get gateway kgw -o yaml   # Programmed?
                ~/kgw-poc/matrix.sh

        - alert: KgwPocCertExpiring
          expr: (probe_ssl_earliest_cert_expiry{probe="kgw-poc"} - time()) / 86400 < 14
          for: 1h
          labels:
            service: kgateway-poc
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "*.kgw.mdapi.ch certificate expires in {{ $value | humanize }} days"
            description: |
              cert-manager should have renewed kgw-poc/kgw-wildcard 30 days before expiry.
                kubectl --context mdapi-prod-direct -n kgw-poc describe certificate kgw-wildcard
---
## No `component`/`team` on the target, deliberately: SyntheticProbe* matches
## component!="" and is critical + statuspage-coupled. The alerts above select
## on `probe` and carry their own warning-tier labels.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kgw-poc
  namespace: monitoring
spec:
  jobName: kgw-poc
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://plain.kgw.mdapi.ch/
      labels:
        probe: kgw-poc
