## Home-assistant + companions: home-assistant itself, appdaemon
## (Python automations), esphome (device firmware), frigate (camera
## NVR), eclipse-mosquitto (MQTT broker). All single-replica, RWO
## storage, so deployment-unavailable is the only meaningful signal.
## If MQTT is down, HA loses Zigbee/Z-Wave bridges; if HA is down,
## the BPI-R4 storm/ONU/T2 self-heal automations stop reacting.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-home
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
  - name: app-home.workload
    rules:
    - alert: HomeAssistantUnavailable
      expr: |
        max by (namespace, deployment) (
          ( kube_deployment_spec_replicas{
              namespace="home-assistant", deployment="home-assistant"
            }
            - kube_deployment_status_replicas_available{
              namespace="home-assistant", deployment="home-assistant"
            }
          ) > 0
        )
      for: 5m
      labels:
        severity: critical
        component: Smart Home
        team: mdapi
      annotations:
        summary: "home-assistant down"
        description: |
          Home Assistant is unavailable. Router/ONU/T2 self-heal automations
          stop reacting; Zigbee/MQTT integrations stop publishing state.

    - alert: HomeStackPodCrashLooping
      expr: |
        max by (namespace, pod) (
          rate(kube_pod_container_status_restarts_total{
            namespace=~"home-assistant|appdaemon|esphome|frigate|mqtt"
          }[15m]) * 60
        ) > 0.5
      for: 10m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "{{ $labels.namespace }}/{{ $labels.pod }} crash-looping"
        description: "Container restart rate > 0.5/min for 10m. Check `kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous`."

    - alert: MqttBrokerUnavailable
      expr: |
        max by (namespace) (
          ( kube_deployment_spec_replicas{
              namespace="mqtt", deployment="eclipse-mosquitto"
            }
            - kube_deployment_status_replicas_available{
              namespace="mqtt", deployment="eclipse-mosquitto"
            }
          ) > 0
        )
      for: 3m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "MQTT broker eclipse-mosquitto unavailable"
        description: |
          Without MQTT, HA loses devices that publish via MQTT (Zigbee2MQTT
          bridge, esphome devices). Check pod logs and broker config.

    - alert: FrigateUnavailable
      expr: |
        max by (namespace) (
          ( kube_deployment_spec_replicas{
              namespace="frigate", deployment="frigate"
            }
            - kube_deployment_status_replicas_available{
              namespace="frigate", deployment="frigate"
            }
          ) > 0
        )
      for: 5m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "frigate camera NVR down"
        description: "No recording / detection while down. Check GPU/coral, PVC space."

    - alert: AppDaemonUnavailable
      expr: |
        max by (namespace) (
          ( kube_deployment_spec_replicas{
              namespace="appdaemon", deployment="appdaemon"
            }
            - kube_deployment_status_replicas_available{
              namespace="appdaemon", deployment="appdaemon"
            }
          ) > 0
        )
      for: 10m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "appdaemon down"
        description: "Python automations on top of HA stopped. HA-builtin automations continue working."

    - alert: EsphomeUnavailable
      expr: |
        max by (namespace) (
          ( kube_deployment_spec_replicas{
              namespace="esphome", deployment="esphome"
            }
            - kube_deployment_status_replicas_available{
              namespace="esphome", deployment="esphome"
            }
          ) > 0
        )
      for: 15m
      labels:
        severity: info
        component: Smart Home
        team: mdapi
      annotations:
        summary: "esphome dashboard down"
        description: "Device firmware editor unavailable. Devices keep running; this only blocks OTA updates."

    ## Per-DEVICE ESPHome liveness. EsphomeUnavailable above watches only the
    ## dashboard Deployment, so an individual node can die in total silence —
    ## carnotzetdoor did, from 2026-06-07 to 2026-09-10, and came back still
    ## running a Sep 2025 firmware that predated the BLE-proxy rollout.
    ##
    ## EsphomeDeviceOfflinePersistent (12-batch-jobs.yml) was supposed to cover
    ## this and cannot: it reads esphome_device_offline, which the monthly
    ## f/heal/esphome_firmware_sync publishes with NO device label (verified
    ## 2026-09-10: one unlabelled series, 0 for all 18 samples across 90 days,
    ## spanning the whole outage) while its annotation interpolates
    ## {{ $labels.device }} — and it waits `for: 32d`. Keep it for the
    ## firmware-sync view; this rule is the one that actually sees a dead node.
    ##
    ## hass_entity_available is scraped live from HA and is the signal that
    ## works for MAINS-POWERED nodes: back-tested over the 30 days to
    ## 2026-09-10 it read 0 on 121 of 121 six-hourly samples for carnotzetdoor
    ## and never for the other five.
    ##
    ## ⛔⛔ That back-test is precisely WHY carnotzetdoor is no longer in this
    ## rule: it was measuring a node that was DEAD. Since 2026-09-11 the node
    ## deep-sleeps by design (sleep_duration 6h) and is unavailable ~99% of the
    ## time, so a 30m threshold would fire on every cycle, forever — the rule
    ## would page us for the fix working. Deep-sleep nodes are watched by
    ## EsphomeDeepSleepNodeMissedHeartbeat below instead: for them
    ## "unreachable" is the NORMAL state and cannot be the signal.
    ##
    ## `max by (node)` collapses each node's ~7 entities to one alert, and also
    ## defuses the per-pod series churn — every HA restart mints new series
    ## carrying a fresh `pod` label, so counting series would count restarts.
    ##
    ## ⛔ The node list is explicit because PromQL/RE2 has no backreferences and
    ## the ESPHome entity convention duplicates the node (`<domain>.<node>_<node>_…`),
    ## which cannot be matched generically. ADD NEW NODES HERE when you add one
    ## to the esphome dashboard, or they are not watched — UNLESS it deep-sleeps,
    ## in which case it belongs in the heartbeat rule below, not this one.
    ## A node DELETED from HA drops its series entirely and goes quiet by
    ## design — deletion is deliberate, death is not.
    - alert: EsphomeNodeOffline
      expr: |
        max by (node) (
          label_replace(
            hass_entity_available{
              entity=~"(binary_sensor|sensor|fan|switch)\\.(displaytest|fanspeed|garagedoor|skylightnorth|skylightsouth)_.*"
            },
            "node", "$1", "entity", ".*\\.([a-z0-9]+)_.*"
          )
        ) == 0
      for: 30m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "ESPHome node {{ $labels.node }} offline"
        description: |
          Every entity of ESPHome node {{ $labels.node }} has been unavailable
          for 30 minutes. The node is not reachable from Home Assistant: it has
          lost WiFi, lost power, or is a battery device with a flat pack.
          A BLE-proxy node that is down also silently removes its room from
          Bermuda's coverage, so presence in that area degrades without warning.
          Check the ESPHome dashboard, then power-cycle. If it does not come
          back, OTA cannot help a device that will not boot — it needs USB.

    ## Deep-sleep ESPHome nodes: liveness by HEARTBEAT, never by reachability.
    ## carnotzetdoor sleeps 6h between wakes and is unavailable in HA for almost
    ## all of it, so EsphomeNodeOffline above cannot watch it — see the note there.
    ##
    ## The signal is the node's own boot counter: an NVS-restored global published
    ## from on_boot that increments on EVERY wake — the 6h timer heartbeat AND
    ## every door edge — and survives deep sleep. It exists precisely because HA
    ## dedupes an unchanged state, so a timer wake with the door unmoved otherwise
    ## leaves NO trace at all, not even last_reported.
    ##
    ## ⭐ last_updated is the right clock HERE, against the general rule. It tracks
    ## VALUE CHANGES rather than freshness (that is what made the ELCO Remocon
    ## check false-fire, 2026-09-11) — and this value changes on every wake. For a
    ## stable sensor it would cry wolf; for a monotonic boot counter it IS the
    ## last-wake clock. Verified live 2026-09-15: 9340 s since the last change,
    ## boot_count 31, +6 over the preceding 8h.
    ##
    ## 8h = one 6h heartbeat plus 2h grace, so a single jittered or WiFi-glitched
    ## wake does not page; two consecutive misses do. `max()` collapses the
    ## per-pod series churn from HA restarts.
    ## ⚠️ An HA restart resets last_updated and so masks a dead node for up to 8h.
    ## Accepted: this under-alerts briefly rather than crying wolf every cycle.
    - alert: EsphomeDeepSleepNodeMissedHeartbeat
      expr: |
        time() - max(
          hass_last_updated_time_seconds{
            entity="sensor.carnotzet_carnotzetdoor_carnotzetdoor_boot_count"
          }
        ) > 8 * 3600
      for: 30m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "Deep-sleep node carnotzetdoor has missed its heartbeat"
        description: |
          carnotzetdoor has not woken for over 8 hours. It wakes every 6h on a
          timer and on every door edge, so at least two heartbeats are missing
          and its boot counter has not advanced — the node is not running.
          Likely: flat pack, brownout under the WiFi transmit burst, or it has
          latched into ESPHome safe mode.
          ⛔ Do NOT judge this node by reachability — it is asleep and
          unreachable ~99% of the time by design, which is why it is excluded
          from EsphomeNodeOffline.
          Check the pack voltage first, under load rather than open-circuit.
          Safe mode looks like ICMP and TCP 3232 open but 6053 REFUSED; it
          clears itself after 5 minutes without an OTA.

    ## Frigate / Nest camera silently offline — ffmpeg dies, the RTSP/WebRTC
    ## stream stalls, or the upstream Nest device is unreachable. HA's
    ## Frigate/Nest integration drops hass_entity_available for the camera.
    ## Excludes camera.pwhtillo_guest (static QR-code "camera" — local file
    ## sensor, never has a producer feeding it).
    ## Re-tiered 2026-08-29. This was a flat warning at `for: 15m` and measured 29 episodes
    ## in 30 days — the highest count of any warning — with a 20-minute median and 86%
    ## resolving inside half an hour unaided. Cameras drop and come back; that is the
    ## normal texture of this estate, not a call to action.
    ## FrigateNestBounceStuck below already escalates, but ONLY for the Nest cameras
    ## eligible for the auto-repair heal, so a flat downgrade here would leave every other
    ## camera with no warning tier at all. Hence the same info/sustained split used for the
    ## Ceph pairs, at 2h — well past both the 45m heal window and the observed 86% band.
    ##
    ## ⚠️ OPERATOR SEMANTICS (fixed 2026-09-04, broken by the 08-29 re-tier). On a 0/1
    ## gauge, "offline for the WHOLE window" is max_over_time(...) == 0 — the maximum is
    ## 0 only when every sample is 0. min_over_time(...) == 0 means "offline at least
    ## ONCE in the window", which is a completely different question. The re-tier used
    ## min_over_time in both places, with two consequences:
    ##   * Sustained fired for any camera that blipped once, and kept firing for 2h
    ##     AFTER it recovered (balconycam, 2026-09-04).
    ##   * The `unless` below subtracted every currently-offline camera from itself
    ##     (offline now ⇒ min over 2h is 0), so FrigateCameraOffline could NEVER fire.
    ##     f/heal/frigate_nest_camera_bounce keys on that alertname, so the auto-bounce
    ##     went blind for six days and garagecam sat dead 5h with no heal attempt.
    ## Do not swap these back. The two tiers must stay mutually exclusive: `unless` uses
    ## the SAME expression as Sustained, so a camera is in exactly one tier at a time.
    - alert: FrigateCameraOffline
      expr: |
        max by (entity, friendly_name) (
          hass_entity_available{
            domain="camera",
            entity!~"camera\\.(pwhtillo_guest|.*_qr|.*_static)"
          } == 0
        )
        unless on (entity) (
          max_over_time(hass_entity_available{domain="camera"}[2h:5m]) == 0
        )
      for: 15m
      labels:
        severity: info
        component: Smart Home
        team: mdapi
      annotations:
        summary: "Camera offline: {{ $labels.friendly_name }}"
        description: |
          Camera has been unavailable for 15m. Most recover on their own — 86% of
          these cleared inside 30 minutes over the last 30 days. If it does not,
          FrigateCameraOfflineSustained escalates at 2h.

    - alert: FrigateCameraOfflineSustained
      expr: |
        max by (entity, friendly_name) (
          max_over_time(hass_entity_available{
            domain="camera",
            entity!~"camera\\.(pwhtillo_guest|.*_qr|.*_static)"
          }[2h:5m]) == 0
        )
      for: 15m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "Camera offline 2h+: {{ $labels.friendly_name }}"
        description: |
          Camera entity {{ $labels.entity }} has been continuously unavailable for
          over two hours, so it is not coming back by itself. For a Nest camera the
          auto-repair heal has already had its 45 minutes (see FrigateNestBounceStuck).
          For Frigate cams: check go2rtc producers (`/api/streams?src=<name>`) and
          ffmpeg logs. Read the RECEIVERS, not just the producer: a dead video track
          (bytes 0) sitting next to a live one is normal — go2rtc's nest producer
          always negotiates a first video track that never carries data, and the real
          video lands ~2-4s later on a second one. The fault is when NO video receiver
          is growing. That is a consumer-teardown livelock, not a stale session:
          frigate's ffmpeg probes the dead track, exits, and its exit drops the last
          consumer, so go2rtc destroys the producer whose video had just started
          working. A pod bounce only re-rolls that race — the fix is to re-add the one
          stream and hold a tolerant consumer open past the ~4s mark, which
          f/heal/frigate_nest_camera_bounce does automatically for balconycam and
          garagecam. For Nest cams: a Google SDM 500 on the device usually means the
          Nest cam itself is offline — check the Google Home app.

    ## f/heal/frigate_nest_camera_bounce (every 5 min): repairs balconycam or
    ## garagecam when it is offline >=15m AND verified not streaming right now.
    ## Tier 1 re-adds that ONE go2rtc stream and holds a tolerant RTSP consumer
    ## ~20s, which costs nothing to the other cameras; the pod bounce is tier 2,
    ## reached only after 3 failed repairs in one episode. Info while it acts;
    ## warning only when the offline condition survives the heal for 45m.
    ##
    ## ⚠️ Both gauges below are pushed every run, so a rule that keys on the last
    ## ACTION timestamp must union the two tiers — keying on the bounce alone
    ## would go quiet exactly when the heal starts working properly, which is the
    ## same class of bug as the 08-29 re-tier: a signal that reads "healthy"
    ## because the thing it watches stopped being reachable.
    - alert: FrigateNestBounceHealActive
      expr: |
        (time() - max by (job) (
          {__name__=~"frigate_nest_camera_bounce_last_(bounce|repair)_timestamp_seconds",
           job="frigate_nest_camera_bounce"}
        )) < 3600
      labels:
        severity: info
        component: Smart Home
        team: mdapi
      annotations:
        summary: "Frigate Nest camera auto-repair ran in the last hour"
        description: "Nest camera auto-remediation ran. A tier-1 targeted stream repair touches one camera only and causes no blip; a tier-2 pod bounce blips all cameras ~90s. No action needed unless FrigateNestBounceStuck follows."

    - alert: FrigateNestBounceStuck
      expr: min_over_time(frigate_nest_camera_bounce_offline_cameras{job="frigate_nest_camera_bounce"}[45m]) > 0
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "Nest camera still offline despite auto-repair heal"
        description: "An eligible Nest camera (balconycam/garagecam) has been continuously offline for 45m+ — verified not streaming, not merely alerting — with the auto-repair heal running: the targeted stream repair and the pod bounce both failed, or a cooldown/latch is blocking. Check go2rtc receivers (is ANY video receiver growing?), the Google Home app, and heal runs at https://windmill.mdapi.ch/runs?path=f%2Fheal%2Ffrigate_nest_camera_bounce"

    ## HA backup integration tracks last successful + last failed timestamps.
    ## binary_sensor.auto_backup_backup_status: 0 healthy, 1 last attempt failed.
    ## sensor.auto_backup_monitored_backups < expected count → retention regression.
    - alert: HomeAssistantBackupFailed
      expr: |
        hass_binary_sensor_state{entity="binary_sensor.auto_backup_backup_status"} == 1
      for: 30m
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "HA Auto Backup last attempt failed"
        description: |
          binary_sensor.auto_backup_backup_status reports failure for >30m.
          Check sensor.auto_backup_last_failure for the error and verify
          the rclone-backups-s3 sidecar push to Garage.

    ## Same signal projected through the monitored-count: if HA suddenly
    ## drops below 15 monitored backups, retention/rotation went wrong.
    - alert: HomeAssistantBackupCountLow
      expr: |
        hass_sensor_state{entity="sensor.auto_backup_monitored_backups"} < 15
      for: 1h
      labels:
        severity: info
        component: Smart Home
        team: mdapi
      annotations:
        summary: "HA Auto Backup monitored count {{ $value }} (<15)"
        description: |
          Expected ~20 daily/weekly/monthly retained backups. Current count
          is unusually low — verify auto_backup add-on is purging correctly.

    ## Battery-powered devices (Zigbee/Z-Wave/BLE). Project current discharge
    ## rate forward 48h and warn if the device will hit 0% — earlier signal
    ## than the bare 20% threshold.
    ##
    ## ⛔ Rechargeable personal devices are EXCLUDED by entity. A phone, tablet,
    ## laptop or smartwatch discharges to near-0 and is recharged EVERY DAY —
    ## that daily sawtooth is exactly the shape this rule looks for, so they
    ## would fire perpetually while behaving perfectly normally. The Tractive
    ## pet tracker (nyo_tracker) and the UPS are deliberately NOT excluded:
    ## they discharge monotonically over days and a low reading is real news.
    ## Adding a new phone/wearable? Add it here or it will page you nightly.
    - alert: BatteryLowPredictive
      expr: |
        predict_linear(hass_sensor_battery_percent{entity!~"sensor\\.(wtillo|s23ultra|eliphone16|itillo|tb330xu|mbp_mda_2024_internal)_battery_level"}[7d], 48 * 3600) < 0
        and hass_sensor_battery_percent{entity!~"sensor\\.(wtillo|s23ultra|eliphone16|itillo|tb330xu|mbp_mda_2024_internal)_battery_level"} < 40
      for: 1h
      labels:
        severity: info
        component: Smart Home
        team: mdapi
      annotations:
        summary: "{{ $labels.friendly_name }} battery will deplete in <48h"
        description: |
          7d linear projection puts {{ $labels.entity }} below 0% within
          48h (current {{ $value | printf "%.0f" }}%). Replace battery now.

    ## Cross-namespace heartbeat: BPI-R4 router pushes sensor.bpi_r4_heartbeat
    ## every minute (epoch seconds). >5 min stale = router lost network to HA,
    ## or health-snapshot.sh died. Last-resort canary for the homelab uplink
    ## that doesn't depend on the cluster-side Pushgateway path.
    - alert: BpiR4HeartbeatStale
      expr: |
        time() - max(hass_sensor_state{entity="sensor.bpi_r4_heartbeat"}) > 300
      for: 3m
      labels:
        severity: warning
        component: Internet
        team: mdapi
      annotations:
        summary: "BPI-R4 sensor heartbeat stale (>5min)"
        description: |
          The BPI-R4 router has not pushed sensor.bpi_r4_heartbeat to HA
          in >5 min. Either the router is unreachable, the script
          health-snapshot.sh died, or HA stopped accepting writes.

    ## Catch integration regressions hiding in HA's baseline of unavailable
    ## entities. A large block of "dead" entities is normal here (devices
    ## that are pending, seasonal, or not always on), so we alert on jumps
    ## per domain rather than absolute counts. >10 newly-unavailable entities
    ## in a single domain over 1h almost always means an integration/hub/
    ## bridge dropped off, not a few stragglers powering down.
    ## 2026-07-30 (infra-health, user-approved): for: 30m -> 1h. All five
    ## firings since 07-15 were upstream-cloud polling blips (Garmin Connect
    ## ~40min, similar cloud integrations) that self-resolved — nothing on
    ## our side to fix. A real hub/bridge/integration failure stays
    ## unavailable well past 1h and still fires.
    - alert: HomeAssistantUnavailableEntitiesSpike
      expr: |
        (count by (domain) (hass_entity_available == 0))
        - (count by (domain) ((hass_entity_available offset 1h) == 0))
        > 10
      for: 1h
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "HA domain '{{ $labels.domain }}' lost {{ $value }} entities in 1h"
        description: |
          {{ $value }} more entities in domain '{{ $labels.domain }}' became
          unavailable compared to 1h ago. Probable causes: integration token
          expired, hub/bridge offline, network segment down. Use the HA
          Developer Tools → States filter `state:unavailable domain:{{ $labels.domain }}`
          to identify the cluster of dropped entities.

    ## SolarEdge inverter at 0W during solid daytime hours = inverter
    ## or cloud-poll lost contact (not weather — even overcast produces).
    ## Hour gate is UTC 09–16 (covers 10–18 CET / 11–18 CEST).
    - alert: SolarEdgeInverterOfflineDaytime
      expr: |
        hass_sensor_state{entity="sensor.solaredge_m1_ac_power"} == 0
        and on() (hour() >= 9)
        and on() (hour() <= 16)
      for: 2h
      labels:
        severity: warning
        component: Smart Home
        team: mdapi
      annotations:
        summary: "SolarEdge M1 at 0W mid-day"
        description: |
          Inverter has reported 0 W AC for 2h between 09–16 UTC.
          Likely SolarEdge cloud API outage, modem offline, or
          inverter fault. Check https://monitoring.solaredge.com.

    ## Per-NODE flap detection. GarageClusterDegraded below cannot do this job:
    ## its `for: 5m` cannot see a ~100-second dip, and on 2026-09-11 and again on
    ## 2026-09-17 `cluster_storage_nodes_ok` did not even register the outage that
    ## killed a backup. I previously concluded the blip was simply unobservable —
    ## that was wrong. `cluster_layout_node_disconnected_time` is per node, is
    ## measured in seconds, and caught every event cleanly.
    ##
    ## max_over_time makes it STICKY: the raw metric is only non-zero during the
    ## outage itself, which on 2026-09-17 was ~4 minutes lit across two hours of
    ## flapping — far too transient to act on. A 2h lookback keeps it lit through
    ## a cluster of drops and clears 2h after the last one.
    ##
    ## ⚠️ It will RESOLVE AND RE-FIRE several times a day while a node is sick,
    ## and that is intended, not alert flapping. Measured over the 24h to
    ## 2026-09-17 19:00Z, pepper had 12 episodes of 79-156s, but they arrive in
    ## clusters separated by quiet gaps of up to 6h38m — no practical lookback
    ## keeps this continuously lit. 2h is chosen for the other end of the
    ## trade-off: once the node is actually repaired the alert goes quiet within
    ## 2h, instead of leaving you guessing for most of a day.
    ##
    ## ⚠️ The metric is exposed under BOTH the `garage` and `garage-headless`
    ## scrape jobs; without the job selector every alert would be duplicated.
    ##
    ## Back-tested over 2026-09-17: fires for zone=pepper continuously 07:11-17:11,
    ## covering both the 03:21 and 17:05 ha-recorder-pg backup failures, and
    ## returns NO SERIES AT ALL for salt and the witness — so it names the faulty
    ## node instead of lighting up the cluster.
    ## ⛔ PEPPER IS EXCLUDED because it was RETIRED on 2026-09-18 — powered off
    ## deliberately after `consistency_mode` was set to `dangerous` on salt (see
    ## ~/pepper-garage-stall-20260917.md). It is still in the Garage layout, so
    ## `cluster_layout_node_disconnected_time{role_zone="pepper"}` climbs forever
    ## and this rule would fire permanently. An alert that can never clear trains
    ## you to ignore the whole family, which is worse than not having it.
    ##
    ## ⇒ REMOVE THIS EXCLUSION when either happens:
    ##    - pepper is brought back (IPMI: chassis power on, 192.168.1.195), or
    ##    - pepper is removed from the Garage layout, at which point the series
    ##      disappears on its own and the exclusion is dead weight.
    - alert: GarageNodeFlapping
      expr: max_over_time(cluster_layout_node_disconnected_time{job="garage",role_zone!="pepper"}[2h]) > 0
      for: 5m
      labels:
        severity: warning
        component: Backups
        team: mdapi
      annotations:
        summary: "Garage node {{ $labels.role_zone }} has been disconnecting"
        description: |
          Node {{ $labels.role_zone }} ({{ $labels.id }}) dropped out of the Garage
          cluster within the last 2h, for {{ $value }}s at the longest.
          Write quorum here is 2 of 2 data nodes, so EVERY such blip fails any
          in-flight backup upload — barman gives up after 4 retries and Longhorn
          recurring jobs log the failure and still exit 0. Expect silent backup
          failures for as long as this fires. Check the node's Garage daemon and
          its network path; the box answering SNMP does not mean Garage is
          reachable.

    ## Garage cluster degradation — fewer ok nodes than total.
    ##
    ## ⚠️ THRESHOLD RAISED 0 -> 1 on 2026-09-18, and this is a topology change, not
    ## a tuning tweak. Pepper was retired (powered off) after `consistency_mode` was
    ## set to `dangerous` on salt, so the external cluster is now salt + witness
    ## serving, with pepper still listed in the layout. `cluster_storage_nodes` is
    ## therefore permanently 3 while `cluster_storage_nodes_ok` is 2, and `> 0`
    ## could never clear again.
    ##
    ## `> 1` still catches what matters: losing salt or the witness ON TOP of the
    ## retired node. ⛔ But the safety margin is genuinely gone — with pepper down
    ## there is exactly ONE copy of the data locally, so this alert firing now means
    ## the LAST data node is in trouble. Treat it as more urgent than before, not
    ## less, despite the higher number.
    ##
    ## ⇒ PUT THIS BACK TO `> 0` when pepper is removed from the Garage layout or
    ## returns to service. Until then the number encodes a deliberate topology.
    - alert: GarageClusterDegraded
      expr: |
        max by (namespace) (cluster_storage_nodes - cluster_storage_nodes_ok) > 1
      for: 5m
      labels:
        severity: warning
        component: Backups
        team: mdapi
      annotations:
        summary: "Garage {{ $labels.namespace }} cluster degraded"
        description: |
          {{ $value }} Garage node(s) reporting not-ok in {{ $labels.namespace }}.
          Backup writes will fail. Check pod status and disk health.
