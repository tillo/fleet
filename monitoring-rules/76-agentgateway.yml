## agentgateway — the MCP front door (ns `agentgateway`, epic infra-7rog).
##
## Internal tooling for seats and kagent: warning tier, INTERNAL component
## `Automation` (never mapped to mdapi.statuspage.io).
##
## What covers what:
##   * workload arms — the gateway Deployment short of replicas;
##   * AgentgatewayDatabaseUnready — the CNPG agentgateway-pg cluster below 2
##     ready instances (it holds the MCP route rows);
##   * McpGatewayUnreachable — the outside view of the proxy Service. The probe
##     sends NO key, so the healthy answer is 401 (http_any_redirect accepts it);
##     a 404/5xx/timeout means a route row, Postgres or the NetworkPolicy broke;
##   * McpGatewayTlsExpiring — mcp.mdapi.ch's certificate (the ingress answers
##     403 to the blackbox pod's source; TLS is still measured).
##
## Selectors are NAMESPACE-WIDE on purpose (alert-coverage contract).
## `deployment=~".+"` / `statefulset=~".+"` are no-ops in PromQL and
## load-bearing for f/probe/alert_coverage_check.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-agentgateway
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
    - name: app-agentgateway.rules
      rules:
        - alert: AgentgatewayWorkloadUnavailable
          expr: |
            ( kube_deployment_spec_replicas{namespace="agentgateway", deployment=~".+"}
              - kube_deployment_status_replicas_available{namespace="agentgateway", deployment=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.deployment "agentgateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "agentgateway/{{ $labels.deployment }} unavailable"
            description: |
              The MCP front door is short of replicas. Every seat and kagent reach
              memsearch/kubernetes/backstage MCP only through it. Check:
                kubectl --context mdapi-prod-direct -n agentgateway get pod,cluster
                kubectl --context mdapi-prod-direct -n agentgateway logs deploy/agentgateway --tail=50

        ## ⚠️ Keep this arm even though it matches nothing today: the coverage
        ## probe treats a namespace-only selector as covering both kinds.
        - alert: AgentgatewayStatefulSetUnavailable
          expr: |
            ( kube_statefulset_replicas{namespace="agentgateway", statefulset=~".+"}
              - kube_statefulset_status_replicas_available{namespace="agentgateway", statefulset=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.statefulset "agentgateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "agentgateway/{{ $labels.statefulset }} unavailable"
            description: |
              A StatefulSet in ns agentgateway has fewer available replicas than desired.

        ## Postgres holds the MCP route rows and every UI/API overlay: a degraded
        ## CNPG cluster is one failure away from a front door with no routes.
        - alert: AgentgatewayDatabaseUnready
          expr: |
            count by (namespace) (kube_pod_status_ready{namespace="agentgateway", condition="true", pod=~"agentgateway-pg-[0-9]+"} == 1) < 2
          for: 30m
          labels:
            service: agentgateway-pg
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "agentgateway-pg has fewer than 2 ready instances"
            description: |
              The CNPG cluster behind the MCP front door runs degraded. Check:
                kubectl --context mdapi-prod-direct -n agentgateway get cluster.postgresql.cnpg.io,pod -l cnpg.io/cluster=agentgateway-pg

        - alert: McpGatewayUnreachable
          expr: avg_over_time(probe_success{probe="mcp-gateway"}[10m]) < 0.5
          for: 15m
          labels:
            service: agentgateway
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "MCP gateway does not answer 401 on /memsearch/mcp"
            description: |
              The keyless probe of http://mcp.agentgateway.svc.cluster.local:8080/memsearch/mcp
              should get 401 (key required). Anything else for >15m: the route rows
              (Admin UI, traffic.route mcp-*), Postgres agentgateway-pg or
              agentgateway-standalone-wiring/agentgateway-netpol.yml.
                kubectl --context mdapi-prod-direct -n agentgateway logs deploy/agentgateway --tail=50
                kubectl --context mdapi-prod-direct -n agentgateway get cluster agentgateway-pg

        - alert: McpGatewayTlsExpiring
          ## Re-provided because the target carries no `component` (see Probe below),
          ## so SyntheticProbeTLSExpiringSoon does not cover it.
          expr: (probe_ssl_earliest_cert_expiry{probe="mcp-gateway-tls"} - time()) < 14 * 86400
          for: 1h
          labels:
            service: agentgateway
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "mcp.mdapi.ch certificate expires in {{ $value | humanizeDuration }}"
            description: |
              cert-manager should have renewed at 30 days. Check:
                kubectl --context mdapi-prod-direct -n agentgateway describe certificate mcp-cert
---
## No `component`/`team` on the targets, deliberately: SyntheticProbe* matches
## component!="" and is critical + statuspage-coupled.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mcp-gateway
  namespace: monitoring
spec:
  jobName: mcp-gateway
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        - http://mcp.agentgateway.svc.cluster.local:8080/memsearch/mcp
      labels:
        probe: mcp-gateway
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mcp-gateway-tls
  namespace: monitoring
spec:
  jobName: mcp-gateway-tls
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        - https://mcp.mdapi.ch/
      labels:
        probe: mcp-gateway-tls
