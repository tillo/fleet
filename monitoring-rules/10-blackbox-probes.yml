      static:
        ## ns.mdapi.ch (192.168.1.53) is BIND9's authoritative LB. The
        ## A record was fixed in zone 2026-05-18; ns-mdapi-ch-{udp,tcp,
        ## dnssec} probes below give us the full K-integration coverage
        ## (UDP+TCP+DNSSEC-AD+SOA-serial). This dns_mdapi probe stays
        ## for historical compatibility with the dns_authoritative alert.
        - 192.168.1.53:53
      labels:
        component: DNS
        team: mdapi
        probe: dns_authoritative
---
## K-integration (DNS audit 2026-05-17): blackbox probe for
## ns.mdapi.ch covering UDP + TCP + DNSSEC. Catches a DNSSEC chain break
## from outside the cluster.
##
## ⚠️ CORRECTED 2026-08-29: this comment used to also claim it "catches secondary
## NS desync (puck.nether.net / ns2.afraid.org)". It does NOT and never did. The
## dns_ns_mdapi_* modules query ONE server for `mdapi.ch SOA` and assert only that
## the SOA MNAME matches `ns\.mdapi\.ch\.` — they never query a secondary and never
## compare serials, so a secondary could serve month-old data with these all green.
## The claim made the gap invisible: it read as covered.
## Secondary desync is now genuinely checked by Windmill
## f/probe/bind_zone_transfer_check -> alert group app-dns.bind-replication in
## 07-dns.yml, which compares SOA serials across every delegated nameserver.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ns-mdapi-ch-udp
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: dns-ns-mdapi
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  module: dns_ns_mdapi_udp
  targets:
    staticConfig:
      static:
        - ns.mdapi.ch:53
      labels:
        component: DNS
        team: mdapi
        probe: ns_mdapi_ch_udp
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ns-mdapi-ch-tcp
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: dns-ns-mdapi
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  module: dns_ns_mdapi_tcp
  targets:
    staticConfig:
      static:
        - ns.mdapi.ch:53
      labels:
        component: DNS
        team: mdapi
        probe: ns_mdapi_ch_tcp
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ns-mdapi-ch-dnssec
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: dns-ns-mdapi
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  module: dns_ns_mdapi_dnssec
  targets:
    staticConfig:
      static:
        - ns.mdapi.ch:53
      labels:
        component: DNS
        team: mdapi
        probe: ns_mdapi_ch_dnssec
---
## External-internet view: arbitrary recursive resolvers must be able
## to resolve mdapi.ch A. Verifies the full delegation chain (registrar
## → public NS → authoritative response) is reachable from outside.
## Two independent resolvers so a single Cloudflare/Google outage
## doesn't false-fire — alert only fires if both consecutive probes
## fail.
