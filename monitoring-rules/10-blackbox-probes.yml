# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure / management plane — TLS cert-expiry coverage (added 2026-06-05
# to close the gap that let rancher.home.tillo.ch silently expire 2026-06-02).
# Probes are scraped purely for `probe_ssl_earliest_cert_expiry`; some endpoints
# (oauth2-proxy gated, redirect to /sign_in) will fail probe_success but the
# TLS handshake — and thus cert validity — is what we care about here.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infra-platform
  namespace: monitoring
spec:
  jobName: infra-platform
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        - https://harvester.mdapi.ch
        ## /admin is the only mounted oauth2-proxy ingress path at
        ## auth.mdapi.ch (the other being /tv). Probing the bare host
        ## returns 404 because no ingress rule matches /.
        - https://auth.mdapi.ch/admin
      labels:
        component: Platform
        team: mdapi
---
## Management-plane probes (Rancher on mbptillo). Split out of infra-platform
## 2026-07-26: mbptillo being down showed the PUBLIC statuspage "Platform"
## component as major_outage for 3 days while every public service was fine.
## `statuspage: exclude` keeps these out of the public page (the adapter's
## derive_status skips the label — the mechanism built for internal signals)
## while alerting/Pushover behavior stays identical.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infra-mgmt
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: infra-mgmt
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        ## rancher-mgmt = the ACTIVE in-cluster Rancher since 2026-08-10
        ## (agents + automation connect to it directly); rancher.mdapi.ch =
        ## external path, transiting to the mgmt Rancher.
        ##
        ## https://rancher.home.tillo.ch (mbptillo STANDBY UI) removed
        ## 2026-08-10: the standby is parked COLD (RKE2 disabled on mbptillo)
        ## while the in-cluster Rancher is assessed — probing a deliberately
        ## stopped host would page forever. RESTORE that target whenever the
        ## standby is brought back up (it exists to catch its cert silently
        ## expiring, the 2026-06-02 incident).
        - https://rancher-mgmt.home.tillo.ch
        - https://rancher.mdapi.ch
      labels:
        component: Platform
        team: mdapi
        statuspage: exclude
---
