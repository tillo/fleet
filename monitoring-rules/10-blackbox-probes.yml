        team: mdapi
        probe: openwebui

# ====== Bussola (bussola.mdapi.ch) ======
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: bussola
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: bussola
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  ## Protetta da oauth2-proxy-bussola: una sonda non autenticata riceve un 302
  ## verso auth.mdapi.ch, quindi http_any_redirect è il modulo onesto — stesso
  ## trattamento di chat.mdapi.ch qui sopra. Verifica che il bordo sia in piedi
  ## (DNS, TLS, ingress, oauth2-proxy), non che il narratore risponda: quello è
  ## opzionale per costruzione e la sua assenza non è un guasto.
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        - https://bussola.mdapi.ch
      labels:
        component: Bussola
        team: mdapi
        probe: bussola

# ====== Rack status screen (bone) ======
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: rack-kiosk-bone
  namespace: monitoring
spec:
  jobName: rack-kiosk-bone
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  ## bone (Pi 3B+, 192.168.1.185) drives the Carnotzet rack display. It hangs
  ## off the un-scraped PoE switch, so it has no ifOperStatus on the C9300 and
  ## until now NOTHING observed it: the screen could go dark and no alert would
  ## fire — only a human walking into the cellar would notice. ICMP is the only
  ## honest check here; it serves no port worth probing.
  module: icmp
  targets:
    staticConfig:
      static:
        - 192.168.1.185
      ## ⛔ Deliberately NO `component`/`team` label. SyntheticProbeFailing
      ## matches component!="" and is CRITICAL + statuspage-coupled — a rack
      ## display must page nobody at 3am and must never appear on the public
      ## status page. The dedicated warning rule RackKioskUnreachable in
      ## 11-blackbox-alerts.yml selects on `probe` and sets its own labels.
      labels:
        probe: rack-kiosk
        purpose: rack-display
