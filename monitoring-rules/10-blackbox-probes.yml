# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure / management plane — TLS cert-expiry coverage (added 2026-06-05
# to close the gap that let rancher.home.tillo.ch silently expire 2026-06-02).
# Probes are scraped purely for `probe_ssl_earliest_cert_expiry`; some endpoints
# (oauth2-proxy gated, redirect to /sign_in) will fail probe_success but the
# TLS handshake — and thus cert validity — is what we care about here.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infra-platform
  namespace: monitoring
spec:
  jobName: infra-platform
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        - https://harvester.mdapi.ch
        ## /admin is the only mounted oauth2-proxy ingress path at
        ## auth.mdapi.ch (the other being /tv). Probing the bare host
        ## returns 404 because no ingress rule matches /.
        - https://auth.mdapi.ch/admin
      labels:
        component: Platform
        team: mdapi
---
## Management-plane probes. Split out of infra-platform 2026-07-26: the
## management plane being down showed the PUBLIC statuspage "Platform"
## component as major_outage for 3 days while every public service was fine.
## `statuspage: exclude` keeps these out of the public page (the adapter's
## derive_status skips the label — the mechanism built for internal signals)
## while alerting/Pushover behavior stays identical.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infra-mgmt
  namespace: monitoring
  labels:
    release: rancher-monitoring
spec:
  jobName: infra-mgmt
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_any_redirect
  targets:
    staticConfig:
      static:
        ## rancher-mgmt = the ACTIVE in-cluster Rancher since 2026-08-10
        ## (agents + automation connect to it directly); rancher.mdapi.ch =
        ## external path, transiting to the mgmt Rancher.
        ##
        ## https://rancher.home.tillo.ch (the standby Rancher UI) was removed
        ## 2026-08-10 when that standby was parked cold, and the host carrying
        ## it was retired permanently on 2026-09-01. ⛔ Do NOT restore that
        ## target — there is no standby behind the name any more. If a second
        ## Rancher is ever stood up, probe it under its OWN name: the target
        ## existed to catch a cert silently expiring (the 2026-06-02 incident),
        ## so a replacement needs the same cover, not this dead one.
        - https://rancher-mgmt.home.tillo.ch
        - https://rancher.mdapi.ch
        ## /healthz added 2026-08-24 after the mgmt Rancher restart storm
        ## (24 liveness kills in one day, exit 137) went completely unnoticed:
        ## the root URL keeps redirecting happily while Rancher itself is
        ## stalled, and prod's Prometheus can only see the mgmt cluster as
        ## KubeVirt VMs, never its pods — so no pod-restart rule is possible.
        ## This target closes that gap with rules that already exist: Rancher's
        ## own livenessProbe kills the container after 5 failures of a
        ## /healthz check, so SyntheticProbeSlowResponse (probe_duration_seconds
        ## > 5 for 10m) fires on exactly the precursor, and
        ## SyntheticProbeFailing catches the hard hang.
        - https://rancher-mgmt.home.tillo.ch/healthz
      labels:
        component: Platform
        team: mdapi
        statuspage: exclude
---
