## Envoy Gateway PoC (bead infra-qwet.1): the controller (ns envoy-gateway-system) and the
## LAN-only test Gateway + echo backend (ns eg-poc).
##
## Warning tier, INTERNAL component `Automation` (never on mdapi.statuspage.io):
## nothing in production is served through it, so an outage only pauses the
## evaluation. Delete this file with the PoC bundles.
##
## What covers what:
##   * workload arms (both namespaces, both kinds) — replicas short;
##   * EgPocUnreachable — the outside view through the VIP: DNS override, MetalLB
##     announcement, Envoy listener and TLS, which replica counts cannot see;
##   * EgPocCertExpiring — re-provided because the target carries no
##     `component`, so SyntheticProbeTLSExpiringSoon does not cover it.
##
## Selectors are NAMESPACE-WIDE on purpose (alert-coverage contract).
## `deployment=~".+"` / `statefulset=~".+"` are no-ops in PromQL and
## load-bearing for f/probe/alert_coverage_check — without them a namespace-only
## selector claims coverage of a kind it can never fire on.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-envoy-gateway-poc
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
    - name: app-envoy-gateway-poc.rules
      rules:
        - alert: EgPocWorkloadUnavailable
          expr: |
            ( kube_deployment_spec_replicas{namespace=~"envoy-gateway-system|eg-poc", deployment=~".+"}
              - kube_deployment_status_replicas_available{namespace=~"envoy-gateway-system|eg-poc", deployment=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.deployment "envoy-gateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} unavailable (Envoy Gateway PoC)"
            description: |
              A Deployment of the Envoy Gateway PoC has no available replica. Production
              traffic is unaffected (it never goes through Envoy Gateway). Check:
                kubectl --context mdapi-prod-direct -n {{ $labels.namespace }} get pod,gateway,httproute
                kubectl --context mdapi-prod-direct -n envoy-gateway-system logs deploy/envoy-gateway --tail=50

        ## ⚠️ Keep this arm even though it matches nothing today: the coverage
        ## probe treats a namespace-only selector as covering both kinds.
        - alert: EgPocStatefulSetUnavailable
          expr: |
            ( kube_statefulset_replicas{namespace=~"envoy-gateway-system|eg-poc", statefulset=~".+"}
              - kube_statefulset_status_replicas_available{namespace=~"envoy-gateway-system|eg-poc", statefulset=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.statefulset "envoy-gateway" }}'
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.statefulset }} unavailable (Envoy Gateway PoC)"
            description: |
              A StatefulSet in a Envoy Gateway PoC namespace has fewer available replicas than desired.

        - alert: EgPocUnreachable
          ## avg_over_time gives hysteresis on both edges (as IastSinkUnreachable).
          expr: avg_over_time(probe_success{probe="eg-poc"}[10m]) < 0.5
          for: 15m
          labels:
            service: envoy-gateway-poc
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "https://plain.eg.mdapi.ch/ unreachable through the Envoy Gateway VIP"
            description: |
              The blackbox probe of the PoC Gateway (192.168.1.67 via the
              split-horizon override) has been mostly failing for >15m. Walk it:
                dig +short @192.168.1.1 plain.eg.mdapi.ch      # want 192.168.1.67
                kubectl --context mdapi-prod-direct -n eg-poc get gateway eg -o yaml   # Programmed?
                ~/eg-poc/matrix.sh

        - alert: EgPocCertExpiring
          expr: (probe_ssl_earliest_cert_expiry{probe="eg-poc"} - time()) / 86400 < 14
          for: 1h
          labels:
            service: envoy-gateway-poc
            severity: warning
            component: Automation
            team: mdapi
          annotations:
            summary: "*.eg.mdapi.ch certificate expires in {{ $value | humanize }} days"
            description: |
              cert-manager should have renewed eg-poc/eg-wildcard 30 days before expiry.
                kubectl --context mdapi-prod-direct -n eg-poc describe certificate eg-wildcard
---
## No `component`/`team` on the target, deliberately: SyntheticProbe* matches
## component!="" and is critical + statuspage-coupled. The alerts above select
## on `probe` and carry their own warning-tier labels.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: eg-poc
  namespace: monitoring
spec:
  jobName: eg-poc
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://plain.eg.mdapi.ch/
      labels:
        probe: eg-poc
