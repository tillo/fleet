  - name: PrometheusServer
    rules:
    - alert: PrometheusJobMissing
      annotations:
        description: The prometheus job that scrapes from Ceph MGR is no longer defined, this will effectively mean you'll have no metrics or alerts for the cluster.  Please review the job definitions in
          the prometheus.yml file of the prometheus instance.
        summary: The scrape job for Ceph MGR is missing from Prometheus
      expr: absent(up{job="rook-ceph-mgr"})
      for: 30s
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.12.1
        severity: critical
        type: ceph_default
        team: mdapi
        component: Storage
    - alert: PrometheusJobExporterMissing
      annotations:
        description: The prometheus job that scrapes from Ceph Exporter is no longer defined, this will effectively mean you'll have no metrics or alerts for the cluster.  Please review the job definitions
          in the prometheus.yml file of the prometheus instance.
        summary: The scrape job for Ceph Exporter is missing from Prometheus
      expr: sum(absent(up{job="rook-ceph-exporter"}))
      for: 30s
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.12.1
        severity: critical
        type: ceph_default
        team: mdapi
        component: Storage
  - name: rados
    rules:
    - alert: CephObjectMissing
      annotations:
        description: The latest version of a RADOS object can not be found, even though all OSDs are up. I/O requests for this object from clients will block (hang). Resolving this issue may require the
          object to be rolled back to a prior version manually, and manually verified.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#object-unfound
        summary: Object(s) marked UNFOUND on cluster {{ $labels.cluster }}
      expr: (ceph_health_detail{name="OBJECT_UNFOUND"} == 1) * on() group_right(cluster) (count(ceph_osd_up == 1) by (cluster) == bool count(ceph_osd_metadata) by(cluster)) == 1
      for: 30s
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.10.1
        severity: critical
        type: ceph_default
        team: mdapi
        component: Storage
  - name: generic
    rules:
    - alert: CephDaemonCrash
      annotations:
        description: One or more daemons have crashed recently, and need to be acknowledged. This notification ensures that software crashes do not go unseen. To acknowledge a crash, use the 'ceph crash
          archive <id>' command.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks/#recent-crash
        summary: One or more Ceph daemons have crashed, and are pending acknowledgement on cluster {{ $labels.cluster }}
      expr: ceph_health_detail{name="RECENT_CRASH"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.1.2
        severity: critical
        type: ceph_default
        team: mdapi
        component: Storage
  - name: certmgr
    rules:
    - alert: CephCertificateError
      annotations:
        description: '{{ $labels.message }}. Please check ''ceph health detail'' for more information and take appropriate action to resolve the certificate issue.'
        summary: Ceph certificate error detected on cluster {{ $labels.cluster }}
      expr: ceph_health_detail{name="CEPHADM_CERT_ERROR"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.15.1
        severity: critical
        type: ceph_default
        team: mdapi
        component: Storage
    - alert: CephCertificateWarning
      annotations:
        description: '{{ $labels.message }}. Please check ''ceph health detail'' for more information and take appropriate action to resolve the certificate issue.'
        summary: Ceph certificate warning detected on cluster {{ $labels.cluster }}
      expr: ceph_health_detail{name="CEPHADM_CERT_WARNING"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.15.2
        severity: warning
        type: ceph_default
        team: mdapi
        component: Storage
