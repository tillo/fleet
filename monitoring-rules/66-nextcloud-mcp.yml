## nextcloud-mcp — the read-only Nextcloud Files connector for chat.mdapi.ch.
##
## Nothing here is visitor-facing: the connector is reached only from the Chat
## pods, and its failure degrades one chat tool rather than any published site.
## Hence warning + `statuspage: exclude` (component Files & Documents is a public
## component; the exclusion is what keeps an internal connector off
## mdapi.statuspage.io — 64-omlx does the same with Automation).
##
## Selectors are NAMESPACE-WIDE on purpose (alert-coverage contract): every
## workload later added to ns nextcloud-mcp is then born covered, instead of the
## rule pinning a name that moves. `deployment=~".+"` / `statefulset=~".+"` are
## no-ops in PromQL and load-bearing for f/probe/alert_coverage_check: without
## them a namespace-only selector claims coverage of a kind it can never fire on.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-nextcloud-mcp
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
    - name: app-nextcloud-mcp.rules
      rules:
        - alert: NextcloudMcpWorkloadUnavailable
          expr: |
            ( kube_deployment_spec_replicas{namespace="nextcloud-mcp", deployment=~".+"}
              - kube_deployment_status_replicas_available{namespace="nextcloud-mcp", deployment=~".+"}
            ) > 0
          for: 15m
          labels:
            service: '{{ or $labels.deployment "nextcloud-mcp" }}'
            severity: warning
            component: Files & Documents
            team: mdapi
            statuspage: exclude
          annotations:
            summary: "nextcloud-mcp/{{ $labels.deployment }} has {{ $value }} unavailable replica(s)"
            description: |
              The Files connector is down for every user. Chat keeps working;
              asking about Nextcloud files returns a tool error instead.
                kubectl --context mdapi-prod-direct -n nextcloud-mcp get pods
                kubectl --context mdapi-prod-direct -n nextcloud-mcp logs deploy/{{ $labels.deployment }}
              A pod stuck in CreateContainerConfigError usually means the
              ExternalSecret `nextcloud-mcp-env` has not materialised (Akeyless
              path /mdapi/nextcloud-mcp/nextcloud-mcp-env/MCP_CLIENT_SECRET).

        - alert: NextcloudMcpStatefulSetUnavailable
          ## Empty today — the arm exists so the namespace-wide claim above stays
          ## true if a StatefulSet is ever added here.
          expr: |
            kube_statefulset_status_replicas_ready{namespace="nextcloud-mcp", statefulset=~".+"}
              < kube_statefulset_status_replicas{namespace="nextcloud-mcp", statefulset=~".+"}
          for: 15m
          labels:
            service: '{{ or $labels.statefulset "nextcloud-mcp" }}'
            severity: warning
            component: Files & Documents
            team: mdapi
            statuspage: exclude
          annotations:
            summary: "nextcloud-mcp/{{ $labels.statefulset }} has unavailable replicas"
