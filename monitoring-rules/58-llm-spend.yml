## DeepSeek account credit — the balance that pays for the estate's cheap automation.
##
## WHY THIS EXISTS (2026-09-30). At 04:32 UTC the DeepSeek account hit
## "Insufficient Balance": infra-health and backlog-sync both errored that run and
## nothing said so. It surfaced only because a spend audit happened to read the
## automation ledger the same morning. The estate had just moved its cheap
## automation onto DeepSeek Flash to cut cost, which turned a cost optimisation
## into an availability dependency with no alarm on it. litellm records spend per
## call but knows nothing about the account's remaining credit — this probe is the
## only thing that sees the cliff coming.
##
## Published every 4h by f/probe/deepseek_balance_health. Staleness of the probe
## itself needs no arm here: the generic BatchJobStale in 12-batch-jobs.yml covers
## any job pushing <job>_last_run_timestamp_seconds, and its cadence join was
## verified to resolve for this job.
##
## component: Automation is an INTERNAL component, so the adapter never publishes
## these to mdapi.statuspage.io (statuspage: exclude repeats that explicitly). An
## internal automation credit is not visitor-observable, and a spend figure is not
## something to show strangers.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-llm-spend
  namespace: monitoring
  labels:
    monitoring-stack: mdapi
spec:
  groups:
  - name: app-llm-spend.rules
    rules:
    - alert: DeepSeekBalanceLow
      ## ⭐ 2026-10-30 (infra-health, user-approved): this was `deepseek_balance_usd
      ## < 10`, a static floor that sat under a balance of ~6.45 USD for weeks and
      ## fired continuously without anything being wrong — at Flash burn (~$1-3 a
      ## weekday) $6.45 is days of cover. A floor that is permanently below is a
      ## light that is permanently on, and the 09-30 outage it was built for would
      ## not be distinguished from it.
      ##
      ## Replaced by a BURN-RATE FORECAST: fire when linear extrapolation over the
      ## last 24h reaches zero within ~3 days. An idle or flat balance never fires
      ## however low it sits; a real burn fires with days of lead time, which is
      ## what a top-up needs. The probe publishes every 4h, so [24h] holds ~6
      ## samples — enough that one stale reading cannot invent a slope.
      ## The old absolute-level tier (DeepSeekBalanceFloor, info) was retired
      ## 2026-11-13 (infra-health, user-approved): it fired on the same gauge and
      ## the same <$10 condition as this warning tier, so one low balance raised
      ## two alertnames and two ledger items, and it never once triggered a
      ## top-up on its own. The burn forecast is the only balance alert now.
      ## Per-workload breakdown: ~/ds-pro-spend-analysis-2026-09-30.md
      expr: predict_linear(deepseek_balance_usd[24h], 3 * 86400) < 0
      ## 15m rides out one bad reading; the probe re-measures every 4h.
      for: 15m
      labels:
        service: 'deepseek'
        namespace: '{{ if or (eq $labels.namespace "") (eq $labels.namespace "monitoring") }}litellm{{ else }}{{ $labels.namespace }}{{ end }}'
        severity: warning
        component: Automation
        team: mdapi
        statuspage: exclude
      annotations:
        summary: "DeepSeek balance is burning down — 3 days of runway left at the current rate"
        description: |
          Linear extrapolation of deepseek_balance_usd over 24h reaches zero
          inside three days. The account behind the litellm gateway's cheap
          models is about to be spent: at zero every automation run on a
          DeepSeek model fails, as it did on 2026-09-30 unnoticed for hours.
          Top up at platform.deepseek.com, then confirm the new figure:
            f/probe/deepseek_balance_health   (or read its last job log)
          Note the balance covers BOTH the Pro and Flash models; it is one account.

    - alert: DeepSeekBalanceProbeFailing
      ## The probe could not read the balance: Akeyless unreachable, the key revoked
      ## or rotated without updating /mdapi/deepseek/api-key, or DeepSeek's API down.
      ## The balance is UNMEASURED, not necessarily empty — but while this fires,
      ## DeepSeekBalanceLow is blind, which is the state that made the 09-30 outage
      ## invisible in the first place.
      ## On failure the probe PUTs probe_success=0 alone, so every other series of
      ## this job is absent on purpose: a stale "balance is fine" can never outlive
      ## the reading that produced it. So absence of deepseek_balance_usd is
      ## EXPECTED here and is not a second signal.
      expr: deepseek_balance_probe_success == 0
      for: 1h
      labels:
        service: 'deepseek'
        namespace: '{{ if or (eq $labels.namespace "") (eq $labels.namespace "monitoring") }}litellm{{ else }}{{ $labels.namespace }}{{ end }}'
        severity: warning
        component: Automation
        team: mdapi
        statuspage: exclude
      annotations:
        summary: "deepseek_balance_health cannot read the DeepSeek balance"
        description: |
          The last job log's FAIL line carries the exception class. Usual causes:
          the DeepSeek key was rotated without updating Akeyless
          (/mdapi/deepseek/api-key), cm.mdapi.ch is unreachable, or the DeepSeek API
          is down. A 200 carrying no balance_infos is treated as a failure too —
          an unreadable answer is not a zero balance.

    - alert: LiteLLMKeyBudgetUncounted
      ## THE CAP CANNOT FIRE. A key's max_budget is enforced on ONE number,
      ## LiteLLM_VerificationToken.spend, while LiteLLM_SpendLogs is what the
      ## window actually cost. Measured 2026-11-08 (infra-od3qw): openobserve-ai
      ## sat at $3.72 counted against $37.25 recorded on a $30 cap and kept
      ## serving — every request was admitted against a counter that could not
      ## reach the limit. Both series come from f/probe/litellm_budget_drift,
      ## which compares them over the key's OWN window (budget_reset_at minus
      ## budget_duration); comparing a 24h key against a month of logs invents a
      ## gap that is not one, so that arithmetic lives in the probe, not here.
      ## Deliberately NOT a delta rule: an over-cap key the counter cannot see is
      ## a standing hole, not an event, and it should keep firing until the
      ## counter is reconciled or the spend window rolls.
      expr: litellm_key_window_spend >= litellm_key_max_budget and litellm_key_spend_counter < litellm_key_max_budget
      for: 1h
      labels:
        service: 'litellm'
        namespace: 'litellm'
        severity: warning
        component: Automation
        team: mdapi
        statuspage: exclude
      annotations:
        summary: "litellm key {{ $labels.key }} is over its cap but the counter cannot see it"
        description: |
          Recorded spend for the key's open budget window has reached its
          max_budget while the counter the cap enforces against is still below
          it, so litellm keeps admitting requests. Read the two numbers beside
          the cap:
            f/probe/litellm_budget_drift      (last job log names the key and both figures)
          To stop the spend now, block the key or lower its budget; do not wait
          for the counter to catch up — it demonstrably cannot on its own.

    - alert: LiteLLMKeySpendCounterDrift
      ## The same mechanism before it costs anything: the counter has lost spend
      ## but the cap is not reached yet. 6h so a DB flush lag cannot page, and the
      ## probe's own floor ($1 AND 10%) keeps rounding out of it.
      expr: litellm_key_counter_gap > 1 and litellm_key_spend_counter < 0.9 * litellm_key_window_spend
      for: 6h
      labels:
        service: 'litellm'
        namespace: 'litellm'
        severity: info
        component: Automation
        team: mdapi
        statuspage: exclude
      annotations:
        summary: "litellm key {{ $labels.key }} has spend its cap cannot see"
        description: |
          The key's recorded window spend exceeds the counter it is capped on by
          more than a dollar and 10%. The cap still works, but it will fire late
          by the size of the gap — the failure that let openobserve-ai sit $33
          over budget unnoticed. Reconcile the counter (or accept the offset and
          note it on infra-od3qw) before the key approaches its budget.
