# Apache Guacamole (clientless SSH/RDP/VNC) — the "real service" behind the sslh
# TLS cover, and the borrowed-device access path. In-cluster => jump.mdapi.ch.
# Postgres is CNPG (guac-pg); schema was loaded once by a one-shot guac-initdb Job,
# since retired (ttlSecondsAfterFinished deleted it -> permanent Fleet "modified" drift).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: guac-pg
  namespace: jump
spec:
  backup:
    ## G6 (infra-jjb, 2026-08-15): barman to the external Garage — this
    ## cluster previously had NO offsite story at all.
    barmanObjectStore:
      destinationPath: s3://guac-pg-backup
      ## ⭐ TLS terminated by Garage's own hosts, not by the ingress.
      ## Garage has no TLS listener of its own -- upstream: "This endpoint
      ## does not support TLS: a reverse proxy should be used to provide
      ## it." So https://api.garage.home.tillo.ch only ever encrypted the
      ## FIRST hop: ingress-nginx terminated it and re-emitted plaintext to
      ## salt/pepper over the LAN. barman compresses but does not encrypt
      ## (there is no `encryption:` key below), so these Postgres dumps
      ## crossed the LAN in the clear on that last hop.
      ## :30288 is an nginx TLS terminator running ON salt and pepper,
      ## reached through the selector-less transit/garage Service, so this
      ## also drops the ingress out of the backup's dependency chain.
      ## Bucket and path are unchanged -- the barman store is untouched.
      endpointURL: https://garage.transit.svc.cluster.local:30288
      endpointCA:
        name: garage-transit-ca
        key: ca.crt
      s3Credentials:
        accessKeyId:
          name: guac-pg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: guac-pg-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: guac-pg-backup-s3
          key: REGION
    retentionPolicy: "14d"
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 1Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: guacamole_db
      owner: guacamole
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { memory: "256Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: jump
  labels: { app: guacd }
spec:
  replicas: 1
  selector: { matchLabels: { app: guacd } }
  template:
    metadata:
      labels: { app: guacd }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports: [ { containerPort: 4822 } ]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: guacd, namespace: jump }
spec:
  selector: { app: guacd }
  ports: [ { port: 4822, targetPort: 4822 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: jump
  labels: { app: guacamole }
spec:
  replicas: 1
  selector: { matchLabels: { app: guacamole } }
  template:
    metadata:
      labels: { app: guacamole }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: GUACD_HOSTNAME, value: "guacd" }
            - { name: GUACD_PORT, value: "4822" }
            - { name: WEBAPP_CONTEXT, value: "ROOT" }     # serve at / not /guacamole
            - { name: POSTGRESQL_HOSTNAME, value: "guac-pg-rw" }
            - { name: POSTGRESQL_PORT, value: "5432" }
            - { name: POSTGRESQL_DATABASE, value: "guacamole_db" }
            - { name: POSTGRESQL_AUTO_CREATE_ACCOUNTS, value: "false" }
            - name: POSTGRESQL_USERNAME
              valueFrom: { secretKeyRef: { name: guac-pg-app, key: username } }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: guac-pg-app, key: password } }
            # TOTP removed (user, 2026-07-25): Keycloak provides MFA on the SSO path;
            # guacadmin break-glass is password-only behind kubeconfig+oauth2.
            - { name: TOTP_ENABLED, value: "false" }
            # Native OIDC SSO — dedicated Keycloak client 'guacamole' in realm tilloch
            # (created via apibot 2026-07-25). Admin-only is still enforced upstream by
            # the oauth2-proxy-admin gate (allowed_roles=mdapi-admin); this gives
            # Guacamole the real Keycloak identity. Break-glass: guacadmin via
            # `kubectl port-forward` (OIDC redirect only fires through the ingress).
            - { name: OPENID_AUTHORIZATION_ENDPOINT, value: "https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/auth" }
            - { name: OPENID_JWKS_ENDPOINT,          value: "https://idp.mdapi.ch/realms/tilloch/protocol/openid-connect/certs" }
            - { name: OPENID_ISSUER,                 value: "https://idp.mdapi.ch/realms/tilloch" }
            - { name: OPENID_CLIENT_ID,              value: "guacamole" }
            - { name: OPENID_REDIRECT_URI,           value: "https://jump.mdapi.ch/" }
            - { name: OPENID_USERNAME_CLAIM_TYPE,    value: "preferred_username" }
            - { name: OPENID_SCOPE,                  value: "openid email profile" }
            # openid first so its auto-redirect to Keycloak wins over the postgresql
            # login form. postgresql still supplies authorization (user permissions),
            # and is the break-glass form once OIDC is disabled (see README).
            - { name: EXTENSION_PRIORITY,            value: "openid" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits:   { memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: guacamole, namespace: jump }
spec:
  selector: { app: guacamole }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guacamole
  namespace: jump
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"    # long-lived guac tunnels
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Admin-only gate: only Keycloak (realm tilloch) users with the mdapi-admin role
    # reach Guacamole — oauth2-proxy-admin enforces allowed_roles=["mdapi-admin"].
    # Identity comes from Guacamole's own native OIDC (client 'guacamole'), so no
    # identity headers are needed here (set_xauthrequest reverted on oauth2-proxy).
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ jump.mdapi.ch ]
      secretName: guacamole-cert
  rules:
    - host: jump.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: guacamole, port: { number: 80 } } }
---
## S3 creds for guac-pg barman backups (G6, beads infra-jjb, 2026-08-15).
## Key GK4e5c90e0ae114aeac5a5fffe scoped RW to the guac-pg-backup bucket on the external Garage;
## offsite-swept to B2/SFTP by garage_offsite_backup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guac-pg-backup-s3
  namespace: jump
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: guac-pg-backup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .access_key }}"
        ACCESS_SECRET_KEY: "{{ .secret_key }}"
        ## Garage validates the SigV4 region scope; barman defaults us-east-1.
        REGION: "garage"
  data:
    - secretKey: access_key
      remoteRef:
        key: /mdapi/jump/guac-pg-backup-s3/access_key
    - secretKey: secret_key
      remoteRef:
        key: /mdapi/jump/guac-pg-backup-s3/secret_key
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: guac-pg-daily
  namespace: jump
spec:
  schedule: "0 40 2 * * *"
  backupOwnerReference: self
  cluster:
    name: guac-pg
