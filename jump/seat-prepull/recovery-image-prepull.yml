# Keeps the INTERNET-sourced recovery images cached on every node (infra-8f4, 2026-11-21):
# cert-manager + trust-manager, MetalLB (controller, speaker, frr-k8s, frr),
# external-secrets, the CNPG operator + barman plugin, and the seat's web door
# (guacamole, guacd, and guac-pg's postgresql + barman sidecar). They come from ghcr.io,
# quay.io and docker.io, so a node that never ran one cannot start it while the internet
# edge is down. The Ceph-backed one (the seat itself) is seat-image-prepull.yml.
#
# ⛔ A SEPARATE DaemonSet from the seat's on purpose: a pull failure here (rate limit,
# upstream outage, a bad digest) holds back THIS pod only, never the seat image's.
# Each image is a MAIN container, so they pull in parallel and one failure cannot block
# the rest the way sequential init containers would. A running container also keeps
# kubelet image GC (85 %/80 % imagefs) off the image.
#
# Most of these images are distroless (no sleep, no shell): the one init container
# copies a STATIC busybox (the -musl build; the default glibc build is dynamically
# linked) into an emptyDir, and every holder runs `busybox sleep` from there.
#
# ⛔ The block between the markers is GENERATED from the live pods by
# `python3 tools/recovery-prepull-sync.py` -- never edit it by hand, and Renovate is
# switched off for this file (renovate.json): the chart workloads pull by TAG, so the
# digest to hold is the one the cluster runs, which neither a chart bump nor a Renovate
# bump of these lines can know. Alert RecoveryImageNotPrepulled (monitoring-rules/88)
# fires when a running recovery container's digest is not held here; the tool is the fix.
# tests/test_recovery_images_are_prepulled_on_every_node.py pins the shape.
#
# maxUnavailable 0 + maxSurge 1: the old pod (and every image it holds) stays until the
# new pod has pulled ALL of its images, so a bump that cannot pull keeps the old cache.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: recovery-image-prepull
  namespace: jump
  labels: { app: recovery-image-prepull }
spec:
  selector:
    matchLabels: { app: recovery-image-prepull }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: recovery-image-prepull }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1      # sleep as PID 1 ignores SIGTERM
      tolerations:
        - operator: Exists                  # every node, whatever it is tainted with
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: hold
          emptyDir: { sizeLimit: 8Mi }
      initContainers:
        - name: stage-busybox
          image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
          imagePullPolicy: IfNotPresent
          command: ["/bin/cp", "/bin/busybox", "/hold/busybox"]
          volumeMounts: [{ name: hold, mountPath: /hold }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 1m, memory: 2Mi }, limits: { memory: 16Mi } }
      containers:
      # BEGIN derived
      - name: cloudnative-pg
        image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913
        imagePullPolicy: IfNotPresent
        command: ["/hold/busybox", "sleep", "2147483647"]
        volumeMounts: [{ name: hold, mountPath: /hold, readOnly: true }]
        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        resources: { requests: { cpu: 1m, memory: 2Mi }, limits: { memory: 16Mi } }
      - name: plugin-barman-cloud-sidecar
