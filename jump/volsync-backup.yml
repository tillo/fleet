## File-level backup for jump-home-ceph (mbptillo retirement, 2026-09-02).
##
## The jump namespace had NO ReplicationSource at all while seven other namespaces
## did — jump-home carried only Longhorn recurring-job labels (block-level volume
## backups), so there was no per-file restore for anything on the seat. This closes
## that gap and is the replacement for mbptillo's timeshift+rsnapshot chain.
##
## Shared /mdapi/volsync/ceph-backup creds, per-PVC subpath in the offsite-swept
## external-Garage ceph-backup bucket (same convention as esphome/paperless/...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-ceph-backup-restic
  namespace: jump
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: volsync-ceph-backup-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ## In-cluster transit/garage, NOT api.garage.home.tillo.ch: that hostname
        ## resolves to the shared ingress VIP, so every backup hairpinned through
        ## ingress-nginx and would fail exactly when the front door is degraded --
        ## which is when a backup matters most. restic encrypts client-side and S3
        ## auth is a SigV4 signature, so losing the ingress TLS costs no
        ## confidentiality: Garage has no TLS listener of its own, and the ingress
        ## already re-emitted plaintext to these same LAN hosts. Same bucket and
        ## path, so the existing restic repository is untouched.
        ## ⭐ 2026-09-19: moved off the salt/pepper Garage to Backblaze B2 DIRECT,
        ## following the openvpn-pki canary. restic encrypts client-side, so these
        ## repos are the "send directly encrypted" half of the architecture and need
        ## no local staging. The B2 copy was never rclone-crypt wrapped (this bucket
        ## is in the offsite job's NO_ENCRYPT set precisely because restic already
        ## encrypts), so it is a REAL restic repo: config, data/ and snapshots/ were
        ## verified present for all 11 repos before switching. History carries over
        ## and nothing re-uploads -- 404 GiB leaves Garage in total.
        ##
        ## ⛔⛔ The offsite key's grant on this bucket was revoked FIRST. The offsite
        ## job runs `rclone sync`, which MIRRORS DELETIONS and derives its bucket
        ## list from that key's grants -- leaving it would have had the next 02:00
        ## run delete every snapshot written here, as they are absent from Garage.
        ##
        ## ⛔ B2's S3 endpoint is region us-west-001, read from b2_authorize_account's
        ## `s3ApiUrl`. Do not guess: 002/003/004 and eu-central all fail and read as
        ## "B2 is not S3 compatible" when it is only a different region. The S3
        ## endpoint keeps the AWS_* shape, so restic's native b2: backend and its
        ## B2_ACCOUNT_ID/KEY env are not needed.
        RESTIC_REPOSITORY: "s3:https://s3.us-west-001.backblazeb2.com/saltminio/ceph-backup/jump-home-ceph"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .b2_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .b2_app_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /mdapi/volsync/ceph-backup/restic-password
    - secretKey: b2_key_id
      remoteRef:
        key: /mdapi/volsync/b2/account-id
    - secretKey: b2_app_key
      remoteRef:
        key: /mdapi/volsync/b2/account-key
---
## HOURLY, not the usual daily: this replaces timeshift, whose real cadence on
## mbptillo was daily x2 (schedule_hourly was false) plus a single rsnapshot
## generation. restic dedupes, so the per-run scan is cheap.
## NOTE: VolSync has no exclude support — whatever is in the PVC is what gets
## snapshotted; the scope WAS enforced by ~/mbptillo-home-curation.rsync-filter at
## copy-in time (2026-09-02 migration only — nothing enforces it continuously).
##
## 2026-09-16: that filter is no longer the live scope, and had not been for some
## time. It excludes `/src/`, `/.local/opt/`, `/.local/lib/` and `/.local/share/`;
## all four are back in the PVC, two of them BY DECISION and not by accident:
##   - ~/src   — standing preference is to keep small repos checked out there.
##   - ~/.local/opt/node22 — pinned on the PVC on purpose so `dsh` survives a roll.
## So the copy-in figure quoted here for years ("the curated set is only ~11.5k
## files") is dead. Measured 2026-09-16: 245,571 files / 8.3 GiB — 21x the number
## this cache was sized against. Do not "restore" the filter; size for reality.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jump-home-ceph
  namespace: jump
spec:
  sourcePVC: jump-home-ceph
  trigger:
    schedule: "17 * * * *"
  restic:
    repository: volsync-ceph-backup-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    # Data is owned by tillo (uid/gid 1000) — the mover must match the data owner
    # or it cannot read it.
    # fsGroup is NOT optional here: VolSync provisions the cache PVC root-owned, so
    # a mover pinned to uid 1000 without it gets
    #   "unable to open cache: open /cache/CACHEDIR.TAG: permission denied"
    # and restic then runs CACHELESS — it still reports Successful, it just re-reads
    # everything every run. Observed on the first real backup, 2026-09-02.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    # 4Gi until 2026-09-16, sized against the ~11.5k-file curated set (see header).
    # At 245k files it wedged: restic's cache holds the repo's index + every TREE
    # pack, so it scales with file count and snapshot churn, not with the 8.3 GiB
    # of file data. Measured full at 3.9G/3.9G — 3.6G data/ + 231M index/ — and the
    # mover died at 99.76% of the scan with
    #   Fatal: unable to save snapshot: Copy: write /cache/.../data/ff/tmp-...:
    #   no space left on device
    # This is self-sustaining, which is why it never recovered on its own: prune
    # runs AFTER a successful backup, so a cache-full failure also skips the prune
    # that would have reclaimed the unreferenced packs (lastPruned froze at
    # 2026-09-09 with pruneIntervalDays 7). Expect the first good run to shrink it.
    # 16Gi = ~4x the observed high-water mark. It is 1-replica Longhorn on nodes
    # with 1-2 TiB free, so headroom here is far cheaper than a stalled backup.
    cacheCapacity: 16Gi
    cacheStorageClassName: harvester-longhorn-1replica
    pruneIntervalDays: 7
    # 2026-09-02: the one-off `restic-verify` pod that was proving a single-file
    # restore died with its session still holding an exclusive lock (PID 152,
    # UID 0, taken 08:21:40Z). Every mover since then backed up fine — snapshots
    # kept landing — and then aborted in `forget`, so lastSyncTime froze at
    # 08:20:58Z while VolSync respawned a mover every ~4 min, each re-reading the
    # full 6.47 GiB, and retention never ran.
    #
    # f/heal/volsync_restic_stale_lock did NOT catch this one. Its real gate is
    # "the newest mover pod's log contains the lock signature", and a mover only
    # prints that line in the last seconds of its ~3 min life — so sampling the
    # newest pod every 15 min lands mid-backup more often than not. It logged
    # "the log does NOT match ... different fault, leaving it alone" and stood
    # down for 4 h. Cleared from git instead.
    #
    # VolSync runs `restic unlock` once per NEW value of this field and records
    # it in status.restic.lastUnlocked, so leaving it here is idempotent, not a
    # recurring unlock. Excluded from the Fleet diff (see jump/fleet.yaml) — the
    # heal overwrites it live, so git and cluster can never agree on it. This is
    # the seed, not the live truth; read status.restic.lastUnlocked for that.
    unlock: "2026-09-02-stale-restic-verify-lock"
    retain:
      hourly: 24
      daily: 14
      weekly: 8
      monthly: 6
