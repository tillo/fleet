apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivodellambrogio
  namespace: ivodellambrogio
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: ivodellambrogio
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ivodellambrogio
    spec:
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: ivodellambrogio
          image: zot.mdapi.ch/mdapi/ivodellambrogio:latest@sha256:46468718a030d73e39d68c17dcb9afb25510b6b6e261d478ad91cea3224fd05f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ivodellambrogio
  namespace: ivodellambrogio
spec:
  selector:
    app: ivodellambrogio
  ports:
    - port: 80
      targetPort: 80
