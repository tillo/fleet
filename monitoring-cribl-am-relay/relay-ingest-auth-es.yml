## Basic-auth password cribl-am-relay demands on every POST (infra-o4i3m.5.3).
##
## Mounted at /secrets/ingest-auth/password (relay.yml). The relay refuses to
## start without it, so a missing Secret is a CrashLoop, never an open relay.
## The sender's copy is monitoring-logging-flows/am-relay-ingest-auth-es.yml;
## both read the SAME Akeyless item, and
## tests/test_am_relay_ingest_requires_the_fluentd_login.py pins that.
##
## Rotation: write the Akeyless item. ESO refreshes both Secrets within 1 h;
## Reloader rolls the relay, the logging operator re-renders fluentd. Alerts
## posted between the two moments get 401 and fluentd retries them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: am-relay-ingest-auth
  namespace: cribl
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: am-relay-ingest-auth
    creationPolicy: Owner
  data:
  - remoteRef: { key: /mdapi/monitoring/am-relay/ingest-password }
    secretKey: password
