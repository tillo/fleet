## No Ingress on purpose: Wyoming is a raw TCP protocol with no authentication
## of its own, consumed only by Home Assistant from inside the cluster. HA
## reaches it at wyoming-whisper.wyoming.svc.cluster.local:10300.
apiVersion: v1
kind: Service
metadata:
  name: wyoming-whisper
  namespace: wyoming
spec:
  selector:
    app: wyoming-whisper
  ports:
    - name: wyoming
      port: 10300
      protocol: TCP
      targetPort: 10300
  type: ClusterIP
