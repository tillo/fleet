apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: showcase
  namespace: showcase
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
spec:
  ingressClassName: nginx
  rules:
    - host: www.mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: showcase
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: showcase
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
      - www.mdapi.ch
      secretName: showcase-cert
    - hosts:
      - mdapi.ch
      secretName: mdapi-cert
