          "title": "Round trip outcomes \u2014 restored vs failed",
          "description": "Whether the values came back. `restored` is a sentinel that was unsealed and put back; `FAILED` is the alarm panel above, shown here per door so a model that reliably mangles one token is identifiable rather than just counted.",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (door) (increase(gheim_rt_restored_spans_total[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "restored \u00b7 {{door}}"
            },
            {
              "refId": "B",
              "expr": "sum by (door) (increase(gheim_rt_restore_failures_total[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "FAILED \u00b7 {{door}}"
            }
