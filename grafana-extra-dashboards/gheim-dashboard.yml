              "legendFormat": "masked",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "sum by (door) (increase(gheim_rt_restored_spans_total[$__range]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "restored",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "sum by (door) (increase(gheim_rt_restore_failures_total[$__range]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "failed",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "D",
              "expr": "sum by (door) (increase(gheim_rt_floor_spans_total[$__range]))",
              "datasource": {
