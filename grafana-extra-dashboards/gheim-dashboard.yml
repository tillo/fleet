## gheim round-trip guardrail: what was transformed, per class and per door.
##
## litellm's Guardrails Monitor answers "blocked or passed". This dashboard answers
## the other question -- which entity classes were masked, how often, through which
## -gheim door, and whether the values were given back on the response. The
## counters are emitted by the guardrail itself (gheim-rt-guard), value-free by
## construction: a count, the detector's entity class, the door name, this
## process's tag. Never a value.
##
## Lives in THIS bundle rather than a new gheim-dashboards/ directory on purpose:
## gitrepo/mdapi-prod enumerates its bundle dirs in spec.paths, so a new directory
## is invisible to Fleet until that list is patched on the mgmt cluster. Adding a
## file to an already-listed bundle needs no such step. The AI folder is created
## by Grafana's file provisioning (foldersFromFilesStructure).
##
## Every PromQL expression here was evaluated against live VictoriaMetrics before
## commit. ⛔ What was NOT verified this way is Grafana's own rendering of the
## table's joinByField transformation; the queries behind it return the right
## numbers, but if that panel looks wrong in the UI, the transform is the suspect.
##
## ⚠️ Two litellm replicas run the guardrail independently and both push
## cumulative counters, so every series carries a `replica` tag and every panel
## aggregates with sum by (...). Reading a raw series would show one replica's
## total, which is not the fleet's, and would run backwards as the two processes
## take turns overwriting each other.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gheim-dashboard
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: AI
data:
