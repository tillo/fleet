        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Restore failures (range)",
          "description": "The one true alarm. A sentinel came back to the caller with its ciphertext still attached: the value is lost in the reply AND an opaque blob was displayed. Any non-zero value here is a broken round trip. Compare with the door panel below to see WHICH door's model mangled a blob -- an instruction-following model sometimes rewrites part of a long opaque token.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(gheim_rt_restore_failures_total[$__range])) or vector(0)",
