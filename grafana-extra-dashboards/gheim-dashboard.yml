          "type": "stat",
          "title": "Replicas reporting",
          "description": "Distinct guardrail processes that have pushed a counter. Both litellm replicas should appear, each as its own series: two processes pushing the same labels would otherwise overwrite each other and run the values backwards. A re-registration of the guardrail starts a new series, so this reads high for a few minutes after a reload.",
          "gridPos": {
