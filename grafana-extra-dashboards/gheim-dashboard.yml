        {
          "id": 7,
          "type": "timeseries",
          "title": "Masked spans \u2014 by door and entity class",
          "description": "What was transformed, how often, and where. One span is one value taken out of the request and replaced by a sentinel. The class names are the detector's own labels. Empty stretches are simply requests with no PII in them.",
