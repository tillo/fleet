        {
          "id": 11,
          "type": "text",
          "title": "What this dashboard is, and what it deliberately cannot show",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "**Value-free by construction.** The round trip exists so the upstream never holds the data, and telemetry is the one place a leak could undo that without anyone looking. What is exported is a count, the detector's own entity class, and the door name \u2014 never a value, a fragment, a length, or the request text. A harness (`telemetry_harness_rt.py`) feeds synthetic PII through the real sandbox and fails if any input substring reaches the payload.\n\n**Door** is the litellm model name of the `-gheim` door, taken from the request. The response pass of a round trip often carries no model at all, so the masking pass remembers the blob and the restore pass asks it back \u2014 without that, every restore was attributed to `unknown`.\n\n**This cannot tell you *what* a value was, only that one was there** \u2014 by design; if you need the actual text, that is what the guardrail is protecting you from storing. It also cannot tell you which *conversation* or *user* a span belonged to: the counters carry no request identity. For per-request detail, litellm's own request logs are the place, and `gheim-pii-guard` exists as the second, mask-only guardrail."
          }
        }
