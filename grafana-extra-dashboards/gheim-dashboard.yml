          "type": "piechart",
          "title": "Which PII classes, over the whole range",
          "description": "The same data as the panel to the left, totalled over the selected range and split by entity class only, so the mix is readable at a glance.",
          "gridPos": {
            "x": 14,
            "y": 4,
            "w": 10,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (label) (increase(gheim_rt_masked_spans_total[$__range]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
