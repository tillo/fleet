          "type": "stat",
          "title": "Telemetry push failures",
          "description": "Counts failed pushes to VictoriaMetrics. This exists so a silent metrics store is visible as a number rather than as an absence of data -- which is the one failure mode a counter cannot otherwise show.",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
