        {
          "id": 10,
          "type": "table",
          "title": "Per-door totals over the range",
          "description": "One row per door: values masked, values given back, values lost, and spans masked with no recoverable blob because the vault was unreachable. `door=unknown` is either the rearm sidecar's own registration probe or a call that reached the response hook with no model in its request data.",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (door) (increase(gheim_rt_masked_spans_total[$__range]))",
              "datasource": {
