## Single-node VictoriaMetrics instance. Long retention for multi-year energy
## / solar analysis. PVC on Longhorn (2 replicas, fio-hot tier).
##
## SIZING: grew to 92% of 50Gi by 2026-08-07 (3.8 GiB free, ~1 GiB/day => ~4
## days to full). A full disk stops ingestion, which blinds every probe/heal
## job that queries VM. Raised to 100Gi (~50 days of headroom at that rate;
## the fio tier had ~2 TiB free per node, so 2 replicas cost ~100 GiB).
##
## RESOLVED 2026-08-17 (infra-14y, user decision): retention 13 months on
## 500Gi -- year-over-year energy/solar/pool comparisons, one month margin.
## VictoriaMetrics does NOT trim to fit the disk (a full disk just stops
## ingestion) and prunes whole MONTHLY partitions, so peak disk is
## (retention + up to 1 month) x rate: (13mo + 1mo) x ~0.9 GiB/day ~= 385
## GiB = 77% of 500Gi at the 2026-08 rate (0.8-0.9 GiB/day over 14/30d).
## Re-decide if growth pushes the projection past ~80%.
## Operator naming: pod and Service get the prefix `vmsingle-mdapi`.
## The Service exposes :8429 (HTTP API + remoteWrite endpoint).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: mdapi
  namespace: monitoring
spec:
  ## Pull via the in-cluster Zot cache (zot.mdapi.ch is htpasswd-protected
  ## via the zot-pull dockerconfigjson Secret in this namespace, owned by
  ## fleet bundle `zot-pull-secrets/`). Tag is left to the VM operator's
  ## default so existing version-rollout behaviour is unchanged.
  image:
    repository: zot.mdapi.ch/victoriametrics/victoria-metrics
  imagePullSecrets:
    - name: zot-pull
  ## Plain number = months (VictoriaMetrics -retentionPeriod semantics).
  retentionPeriod: "13"
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 500Gi
  ## Sized for QUERIES, not for scraping (2026-10-23). The steady-state working set
  ## is ~3.1 GiB, so the old 4Gi limit left under 1 GiB of headroom for query
  ## execution — and a single wide query is enough to eat that: on 2026-10-23
  ## `sum(increase(container_oom_events_total[30d]))` ran 31.9 s and vmsingle was
  ## OOMKilled (exit 137) sixteen seconds later. That is the metrics DATABASE: while
  ## it is down, every dashboard, vmalert and the OOM rule itself are blind, and a
  ## fast OOM-restart is invisible to MonitoringComponentDown (for: 5m).
  ## The request moves to 4Gi because that is what the process actually uses; the
  ## limit gets room for a heavy query. Node quo has ~19 GiB of unrequested
  ## allocatable and limits are not reserved, so scheduling is unaffected.
  ## ⚠️ This does not make wide queries safe — bucket long ranges or pre-aggregate.
  resources:
    requests:
      cpu: 100m
      memory: 4Gi
    limits:
      memory: 8Gi
  extraArgs:
    ## Smooth out series-churn behaviour for the recorder's per-sensor cardinality
    dedup.minScrapeInterval: "30s"
    ## Default 16 is too low when vmalert evaluates ~50 rule groups every 30s
    ## (kube-prometheus-stack rules + our custom rules). 64 keeps things headroom-y
    ## without exploding memory.
    search.maxConcurrentRequests: "64"
    ## Admin endpoints need ?authKey= (infra-o4i3m.5). See
    ## vmsingle-admin-authkey-es.yml. Query, write and /metrics stay open:
    ## they have no per-endpoint key, and gating them is a separate change.
    snapshotAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    deleteAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    forceMergeAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    search.resetCacheAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    reloadAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    flagsAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    pprofAuthKey: file:///etc/vm/secrets/vmsingle-admin-authkey/authkey
    ## ── one login for every other path (infra-o4i3m.5.4) ──────────────────────
    ## Before this, any pod could write, import or read any series here. Every client
    ## now goes through vmauth-vmsingle (monitoring-vm/vmauth-vmsingle.yml) with its own
    ## scoped user, and vmauth alone holds THIS login (targetRefBasicAuth on every
    ## route). /health and /ping are answered before the auth check, so the probes are
    ## unchanged. Break-glass read from the seat: ~/bin/vmq.py falls back to this login
    ## when vmauth is unreachable.
    httpAuth.username: vmauth
    httpAuth.password: file:///etc/vm/secrets/vmsingle-httpauth/password
  secrets:
    - vmsingle-admin-authkey
    - vmsingle-httpauth
  ## The self-scrape must log in too: with -httpAuth on and no -metricsAuthKey, /metrics
  ## falls back to the Basic login. (-metricsAuthKey is deliberately unset: the operator
  ## copies its value into the generated scrape's params in plain text.)
  serviceScrapeSpec:
    endpoints:
      - port: http
        path: /metrics
        basicAuth:
          username: { name: vmsingle-httpauth, key: username }
          password: { name: vmsingle-httpauth, key: password }
