## Single-node VictoriaMetrics instance. Long retention for multi-year energy
## / solar analysis. PVC on Longhorn (2 replicas, fio-hot tier).
##
## SIZING: grew to 92% of 50Gi by 2026-08-07 (3.8 GiB free, ~1 GiB/day => ~4
## days to full). A full disk stops ingestion, which blinds every probe/heal
## job that queries VM. Raised to 100Gi (~50 days of headroom at that rate;
## the fio tier had ~2 TiB free per node, so 2 replicas cost ~100 GiB).
##
## UNRESOLVED: `retentionPeriod: 3y` has never been achievable at this volume
## size -- at ~1 GiB/day three years needs ~1 TiB, not 100 GiB. VictoriaMetrics
## does NOT trim to fit the disk, it just runs out. So this will recur roughly
## every 50 days until either retention is cut to something that fits or the
## volume is sized for the real retention target. Deliberately left as a
## decision rather than guessed at.
## Operator naming: pod and Service get the prefix `vmsingle-mdapi`.
## The Service exposes :8429 (HTTP API + remoteWrite endpoint).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: mdapi
  namespace: monitoring
spec:
  ## Pull via the in-cluster Zot cache (zot.mdapi.ch is htpasswd-protected
  ## via the zot-pull dockerconfigjson Secret in this namespace, owned by
  ## fleet bundle `zot-pull-secrets/`). Tag is left to the VM operator's
  ## default so existing version-rollout behaviour is unchanged.
  image:
    repository: zot.mdapi.ch/victoriametrics/victoria-metrics
  imagePullSecrets:
    - name: zot-pull
  retentionPeriod: "3y"
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 100Gi
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 4Gi
  extraArgs:
    ## Smooth out series-churn behaviour for the recorder's per-sensor cardinality
    dedup.minScrapeInterval: "30s"
    ## Default 16 is too low when vmalert evaluates ~50 rule groups every 30s
    ## (kube-prometheus-stack rules + our custom rules). 64 keeps things headroom-y
    ## without exploding memory.
    search.maxConcurrentRequests: "64"
