apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  selectAllByDefault: false
  userSelector:
    matchLabels:
      mdapi.ch/vmauth: vmsingle
  userNamespaceSelector: {}
  ## Docker Hub, as vmauth-pushgateway.yml explains (zot does not sync it).
  image:
    repository: victoriametrics/vmauth
  ## Two replicas: vmagent/vmalert buffer and retry through one pod's roll, but
  ## not through both. Sized for all remoteWrite (~640 KB/s, ~50 req/s in
  ## 2026-11-18): vmauth streams bodies, so CPU, not memory, is what grows.
  replicaCount: 2
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
