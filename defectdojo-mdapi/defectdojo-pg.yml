## Postgres for DefectDojo (epic infra-7rog.4, 2026-11-02).
##
## DefectDojo is the findings store and the record of every risk acceptance
## (won't-fix). Findings can be re-imported from the scanners; the
## acceptances cannot -- they are decisions -- so this database is backed up
## like any other: pattern copied from openfga/openfga-pg.yml (2 instances,
## switchover, barman plugin to its own RGW bucket over TLS, daily base
## backup, offsite grant declared on the OBC from birth).
##
## The chart's bundled Bitnami postgresql is disabled; the app credential is
## CNPG-generated (secret defectdojo-pg-app, key `password`, owner
## `defectdojo`) and never leaves the cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: defectdojo-pg
  namespace: defectdojo
spec:
  ## Backup class for the instance PVCs. CNPG creates them (and re-creates one on
  ## every instance rebuild), so the Cluster is the only place a label survives;
  ## `default` = what Longhorn already does to an undeclared volume, now declared.
  ## Barman is the recovery substrate; the PVC backup is the consistency hedge.
  ## (tests/test_cnpg_clusters_declare_backup_class.py, infra-r9mzd)
  inheritedMetadata:
    labels:
      mdapi.ch/backup-class: default
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: harvester-longhorn-2replicas
    size: 5Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 64MB
      effective_cache_size: 192MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  bootstrap:
    initdb:
      database: defectdojo
      owner: defectdojo

  ## `serverName` stated explicitly: barman keys the archive by it, so a
  ## changed default would silently start a new archive (see openfga-pg.yml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: defectdojo-pg
        serverName: defectdojo-pg

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 768Mi
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: defectdojo-pg
  namespace: defectdojo
spec:
  configuration:
    destinationPath: s3://cnpg-defectdojo-pg
    endpointURL: https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443
    endpointCA:
      name: rgw-transit-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: cnpg-defectdojo-pg
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-defectdojo-pg
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: cnpg-rgw-region
        key: REGION
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
  ## Retention lives on the STORE with the plugin; left off, nothing prunes.
  retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: defectdojo-pg-daily
  namespace: defectdojo
spec:
  schedule: "0 50 2 * * *"
  backupOwnerReference: self
  ## WAL archiving alone is not a backup: take the first base backup now.
  immediate: true
  cluster:
    name: defectdojo-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
## Creates the bucket AND a credential scoped to it (secret
## cnpg-defectdojo-pg). The offsite grant is declared here so Rook owns it:
## the OBC reconciler deletes any bucket policy it does not declare.
## ⚠️ The offsite sweep ALSO needs this bucket classified in
## g/all/RGW_OFFSITE_ENCRYPT_BUCKETS (bead infra-blil), or it fails closed.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cnpg-defectdojo-pg
  namespace: defectdojo
spec:
  bucketName: cnpg-defectdojo-pg
  storageClassName: ceph-bucket
  additionalConfig:
    bucketPolicy: '{"Version":"2012-10-17","Statement":[{"Sid":"OffsiteSweepRead","Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/offsite"]},"Action":["s3:ListBucket","s3:GetObject"],"Resource":["arn:aws:s3:::cnpg-defectdojo-pg","arn:aws:s3:::cnpg-defectdojo-pg/*"]}]}'
---
## NOT a credential: RGW's default zonegroup. CNPG types `region` as a
## SecretKeySelector, so a constant needs a Secret to be referenced.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-rgw-region
  namespace: defectdojo
stringData:
  REGION: us-east-1
