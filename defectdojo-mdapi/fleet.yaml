# The estate's own DefectDojo objects (epic infra-7rog.4): the CNPG database
# and its barman store, the ExternalSecrets the chart expects to exist
# (createSecret / createValkeySecret are false), and the namespace's
# NetworkPolicies. Raw sibling of the defectdojo/ helm bundle, which never
# applies loose manifests -- and which depends on this one, so the database
# and the secrets exist before the chart's initializer Job runs migrations.
defaultNamespace: defectdojo
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
dependsOn:
  - name: mdapi-prod-external-secrets
