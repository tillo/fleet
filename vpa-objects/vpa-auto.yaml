# tv namespace: moved from Off → Auto on 2026-06-04 after radarr OOM-looped.
# All these workloads recover from eviction within seconds to a couple
# minutes; chasing per-container OOMs by hand was the wrong default.
# minAllowed = safe baseline so VPA doesn't shrink below working size.
# maxAllowed = generous ceiling so VPA can grow during scans/transcodes.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: radarr
  namespace: tv
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: radarr
  updatePolicy:
    # In-place resize (k8s 1.35 GA + VPA 1.5 InPlaceOrRecreate, 2026-09-24): minReplicas: 1 overrides the
    # updater's global --min-replicas=2, which otherwise never touches this single-replica pod. The resize is
    # applied WITHOUT a restart; only if the kubelet can't resize in place does the VPA fall back to eviction.
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: radarr
      minAllowed:
        cpu: 25m
        memory: 256Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sonarr
  namespace: tv
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sonarr
  updatePolicy:
    # In-place resize (k8s 1.35 GA + VPA 1.5 InPlaceOrRecreate, 2026-09-24): minReplicas: 1 overrides the
    # updater's global --min-replicas=2, which otherwise never touches this single-replica pod. The resize is
    # applied WITHOUT a restart; only if the kubelet can't resize in place does the VPA fall back to eviction.
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: sonarr
      ## Floor = real need: ffprobe media analysis spikes past 1.3 GB (36 OOMs 2026-09-24). With the
      ## deploy's 1.25 request:limit ratio this admits a 3.75 GiB limit.
      minAllowed:
        cpu: 50m
        memory: 3Gi
      maxAllowed:
        cpu: 3000m
        memory: 8Gi
---
