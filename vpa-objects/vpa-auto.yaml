apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: threadfin
  namespace: tv
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threadfin
  updatePolicy:
    # Off (recommend-only): threadfin is bursty — idle most of the time, then
    # ~6Gi spike during the XMLTV parse (15k channels + 40k programs). VPA Auto
    # capped it at maxAllowed=1Gi (req 1Gi/limit 3Gi) -> OOMKilled crashloop
    # (2026-06-07). Let the deploy's hand-sized 2Gi req / 6Gi limit stand.
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: threadfin
      minAllowed:
        cpu: 25m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m
        memory: 6Gi
---
# transmission-pia: 3 containers (transmission + PIA WireGuard + port-mgr).
# Eviction breaks active torrent connections; recoverable within ~2 min
# as peers reconnect. Wildcard policy sizes the swarm container; the
# sidecars stay tiny.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: transmission-pia
  namespace: tv
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transmission-pia
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: transmission
      minAllowed:
        cpu: 100m
        memory: 1Gi
      maxAllowed:
        cpu: 4000m
        # Lowered 8Gi->4Gi 2026-06-21 to cap the swarm footprint (was sitting
        # at ~11.5GiB actual). Sustained use above this means too many active
        # torrents -> prune the torrent list (see todo) rather than raise.
        memory: 4Gi
    - containerName: pia
      minAllowed:
        cpu: 10m
        memory: 32Mi
      maxAllowed:
        cpu: 500m
        memory: 256Mi
    - containerName: port-manager
      minAllowed:
        cpu: 10m
        memory: 32Mi
      maxAllowed:
        cpu: 500m
        memory: 256Mi
---
# seerr (Overseerr fork) — Next.js SSR app. Was missed from the 2026-06-04
# tv-app sweep; 32% of its CPU scheduling periods were being throttled
# against the 500m hardcap, giving the user-visible 246-857ms TTFB swing
# on /login. Same Auto profile as the other tv apps; max headroom set to
# 1500m since the workload is largely idle but spiky on SSR render.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: seerr
  namespace: tv
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seerr
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: seerr
      minAllowed:
        cpu: 25m
        memory: 256Mi
      maxAllowed:
        cpu: 3000m
        memory: 1Gi
