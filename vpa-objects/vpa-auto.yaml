# VPA Auto mode — right-sizing for stateless workloads with no PVCs.
# Pods may be evicted and recreated with updated requests/limits.
# ⛔ NOT all targets here have replicas:2 (corrected 2026-09-24). The VPA updater runs with the default
# --min-replicas=2, so it NEVER evicts a single-replica pod ("Too few replicas" in its log). For those
# (sonarr, radarr, bazarr, prowlarr, …) "Recreate" silently behaves like "Initial": the recommendation is
# applied only when the pod is recreated for another reason. If usage grows past the admitted limit, the pod
# OOM-loops while the VPA shows a correct, higher recommendation it cannot apply (sonarr: 36 OOMs on 2026-09-24
# at a 1.38 GB limit vs a 1.84 GB target). For growers, set a minAllowed floor at real peak need, and recreate
# the pod once to apply it.
# ⭐ In-place single-replica resizing (2026-09-24): `updateMode: InPlaceOrRecreate` + `updatePolicy.minReplicas: 1`
# lets the updater resize a single-replica pod WITHOUT restarting it (tested: 200Mi→64Mi, same pod, 0 restarts).
# Opted in so far: radarr, sonarr, bazarr, prowlarr. Keep DBs, keycloak, openldap and tenant sites OUT (fallback = eviction).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: joplin-mcp
  namespace: joplin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: joplin-mcp
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: joplin-mcp
      minAllowed:
        cpu: 10m
        memory: 128Mi
      maxAllowed:
        cpu: 500m
        memory: 1Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: joplin
  namespace: joplin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: joplin
  updatePolicy:
    # Initial, not Auto: VPA right-sizes requests at pod creation but never
    # evicts running pods. Auto-mode eviction churn left the 2-replica
    # Deployment at 1/2 for ~3.5 min while the evicted pod's replacement
    # re-pulled the 563 MB joplin/server:latest image, tripping the
    # replica-availability alert.
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
    - containerName: joplin
      minAllowed:
        cpu: 50m
        memory: 256Mi
      maxAllowed:
        cpu: 1
        memory: 2Gi
---
