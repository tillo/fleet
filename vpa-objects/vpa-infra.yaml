# Infrastructure utility services: honeypot, mqtt, squid, nameserver,
# certspotter, mirror, znc, zot, cribl
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trapeye-clusterip
  namespace: honeypot
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trapeye-clusterip
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 5m
        memory: 16Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trapeye-loadbalancer
  namespace: honeypot
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trapeye-loadbalancer
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 5m
        memory: 16Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trapeye-nodeport
  namespace: honeypot
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trapeye-nodeport
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 5m
        memory: 16Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: eclipse-mosquitto
  namespace: mqtt
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eclipse-mosquitto
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 5m
        memory: 8Mi
      maxAllowed:
        cpu: 100m
        memory: 128Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: squid
  namespace: squid
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: squid
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 10m
        memory: 64Mi
      maxAllowed:
        cpu: 500m
        memory: 512Mi
---
# certspotter: bursts to 272m CPU during cert checks — give it headroom
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: certspotter
  namespace: certspotter
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: certspotter
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      # RequestsOnly (2026-07-04 N-1 program): the deployment's 4c limit stays
      # the scan-burst ceiling; the schedulable REQUEST caps near steady-state.
      controlledValues: RequestsOnly
      minAllowed:
        cpu: 50m
        memory: 256Mi
      maxAllowed:
        cpu: 1200m
        memory: 2Gi
---
# mirror-ceph (Ceph-RBD mirror): recommend-only. The mirror does bursty full-tree
# re-syncs whose rsync file lists + page-cache OOM if the limit is pinned to the
# idle figure (it OOM-killed at 1Gi during the initial re-sync). Keep the static
# 2Gi limit from the deployment; VPA only advises.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mirror-ceph
  namespace: mirror
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mirror-ceph
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 10m
        memory: 256Mi
      maxAllowed:
        cpu: 500m
        memory: 2Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: znc
  namespace: znc
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: znc
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 5m
        memory: 16Mi
      maxAllowed:
        cpu: 100m
        memory: 256Mi
---
# zot: registry mirror — holds ~908Mi, needs headroom for concurrent pulls
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: zot
  namespace: zot
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zot
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 10m
        memory: 512Mi
      maxAllowed:
        cpu: "1"
        memory: 2Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: logstream-leader
  namespace: cribl
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logstream-leader
  updatePolicy:
    updateMode: Recreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      # RequestsOnly (2026-09-23, infra-health ContainerCpuThrottling:cribl,
      # user-approved "raise the leader CPU limit"). Without it VPA rewrites the
      # LIMIT too, scaling it by the chart's 6:1 limit:request ratio off its own
      # request — measured live: git said limits.cpu "6", the pod ran with
      # request 247m / limit 1482m. So every past bump of limits.cpu in
      # cribl/values.yml (2 -> 4 -> 6) was silently discarded, and the bursty
      # PQ-drain kept hitting a ~1.5-core CFS quota (334 min firing in 24h,
      # 5.6% of periods throttled; the 7d 1-min peak is only 0.89 cores, so it
      # is sub-second bursts across the worker processes that hit the quota).
      # With RequestsOnly the values.yml limit (6 cores / 4096Mi; 7d memory
      # peak 1.13 GB) is what the pod gets; VPA still sizes the schedulable
      # request. Same pattern as certspotter above.
      controlledValues: RequestsOnly
      minAllowed:
        cpu: 10m
        memory: 256Mi
      maxAllowed:
        cpu: "2"
        memory: 2Gi
