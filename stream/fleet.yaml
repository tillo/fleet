defaultNamespace: stream
namespace: stream
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: stream
  # EverTrust Stream (PKI/CA backend for Horizon). Anonymous chart repo (same as
  # horizon) — trailing slash REQUIRED so Fleet resolves the index's relative
  # chart URL correctly. Private bit is the image (registry.evertrust.io), via the
  # evertrust-registry imagePullSecret in extraObjects.
  repo: https://repo.evertrust.io/repository/charts/
  chart: stream
  version: 2.3.4          # Lane-B pinned (appVersion 2.1.10); bump deliberately
  valuesFiles:
    - values.yml
