## Who may talk to mail-mcp, and what it may reach. ENFORCING from birth:
## nothing else in the cluster has a reason to call a per-user mail connector,
## and the pod needs exactly three destinations.
##
## WHY INGRESS IS THIS NARROW. The pod holds the Keycloak client secret that
## performs the token exchange, so anyone who can reach it can ask it to exchange
## *their* token — that is the feature. What must not happen is another workload
## using it as a stepping stone: the boundary is "the Chat pods and nothing
## else", not "the cluster".
##
## ⚠️ A wrongly-blocked caller shows up as a TCP timeout in the openwebui pod,
## not as an error in this one — there is nothing to log for a packet that never
## arrived. Debug from the caller's side first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail-mcp-restricted
  namespace: mail-mcp
spec:
  podSelector:
    matchLabels:
      app: mail-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    ## 1. Open WebUI, the only intended caller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
      ports:
        - protocol: TCP
          port: 8080
    ## 2. The kubelet's probes, which arrive from the NODE IP, not from a pod.
    ## ⚠️ Leave this out and readiness fails, the pod never becomes Ready and it
    ## restarts forever. The same allowance means the LAN can reach 8080; that is
    ## accepted because the endpoint is useless without a token this pod will
    ## validate (nextcloud-mcp makes the same trade).
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 8080
  egress:
    ## 1. DNS, by SELECTOR: CoreDNS is reached at its pod IP, never the
    ## 10.53.0.10 service VIP (an ipBlock on the VIP would look right and block
    ## all name resolution).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    ## 2. Keycloak (idp.mdapi.ch: JWKS + the token exchange), behind the estate
    ## ingress. ⭐ Calico evaluates the POST-DNAT far end, so the destination is
    ## an rke2-ingress-nginx CONTROLLER POD on 443, not the LB VIP — an ipBlock
    ## on the VIP matches nothing. Same rule and same accepted cost as
    ## nextcloud-mcp-netpol.yml: L4 cannot scope by Host name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rke2-ingress-nginx
      ports:
        - protocol: TCP
          port: 443
    ## 3. Dovecot, IMAPS only. The pod dials the in-cluster Service
    ## docker-mailserver.mail:993; post-DNAT that is the docker-mailserver POD on
    ## container port 993 (`imaps`). Deliberately NOT 10993 (the PROXY-protocol
    ## port the LAN edge uses) and nothing SMTP: this connector has no send path,
    ## and the policy says so independently of the code.
    ## Dovecot's own `allow_nets` (10.52.0.0/16) is the second lock on this door.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mail
          podSelector:
            matchLabels:
              app.kubernetes.io/name: docker-mailserver
      ports:
        - protocol: TCP
          port: 993
