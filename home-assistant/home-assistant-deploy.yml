apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    ## ⛔ Added 2026-09-19, when the backup sidecar moved to Ceph RGW. It takes
    ## its WHOLE S3 configuration through `envFrom: secretRef`, and env is
    ## injected ONLY at pod start: rewriting the secret changes nothing in a
    ## running pod. Nothing fails either -- the old endpoint keeps working,
    ## rclone keeps exiting 0, no alert fires. The only symptom would be the new
    ## bucket staying empty, which is indistinguishable from "no backup due yet".
    ##
    ## ⭐ That move happened to be safe WITHOUT this annotation, and the reason
    ## is worth knowing because it will not always hold: the same MR also
    ## changed this Deployment (the rclone remote `garage:` -> `rgw:`), so Fleet
    ## rolled the pod out anyway. A credential-only change -- new key, same
    ## endpoint -- touches no Deployment field and would NOT have restarted
    ## anything.
    ##
    ## ⚠️ reloader restarts on a hash it records from this annotation onward, so
    ## it does not repair an already-stale pod; it prevents the next one.
    ##
    ## The cost is the same ~2 min of no automations an image upgrade
    ## already costs (see below), and a credential only changes deliberately.
    reloader.stakater.com/auto: "true"
    ## UPGRADE COST: HA is the home's control plane, so an upgrade costs
    ## ~2 min of no automations, no Zigbee, no doorbell.
    ##
    ## ⚠️ HA's image is a Renovate digest pin. renovate.json carries NO merge
    ## window since 2026-10-23 (`automergeSchedule` was removed — see its
    ## top-level description), so a digest MR can merge, and roll HA, at any
    ## hour. A real night window would have to be an external merge gate.
spec:
  ## HA's measured cold start (pod created -> /api/prometheus scraping again)
  ## is 90-105 s across the last four rollouts (2026-09-05 13:40:30->13:42:00,
  ## 09-08 20:55:30->20:57:00, 09-09 08:46:30->08:48:30). The startupProbe
  ## below buys 20 min, so the deadline has to sit above that or a slow but
  ## healthy boot (recorder schema migration, custom-component wheel builds)
  ## would be reported as a failed rollout. 1800 s = startup budget + 10 min.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  replicas: 1
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # Home's control plane — evicted last among user workloads (N-1 program).
      priorityClassName: mdapi-critical
      # Pinned to the node that physically hosts the Zigbee USB stick.
      # Pod is privileged, so /dev access is granted unconditionally —
      # no device plugin needed. Edit this if the stick is moved.
      nodeSelector:
        kubernetes.io/hostname: qui
      initContainers:
      # Bootstrap initContainer (2026-05-14 migration):
      # If a /config/configuration.yaml.bootstrap exists on the PVC AND the
      # real configuration.yaml is missing OR empty (0 bytes — happened on the
      # initial migration because the PVC had a 0-byte stub from pre-CM-mount
      # days), promote .bootstrap to configuration.yaml. On normal restarts,
      # this is a no-op because configuration.yaml is present and non-empty.
      - name: bootstrap-configuration
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          if [ -f /config/configuration.yaml.bootstrap ] && [ ! -s /config/configuration.yaml ]; then
            mv -f /config/configuration.yaml.bootstrap /config/configuration.yaml
            echo "bootstrap-configuration: installed configuration.yaml from .bootstrap (target was missing or empty)"
          else
            echo "bootstrap-configuration: nothing to do (target=$( [ -s /config/configuration.yaml ] && echo non-empty || echo missing-or-empty ), bootstrap=$( [ -f /config/configuration.yaml.bootstrap ] && echo present || echo absent ))"
          fi
        volumeMounts:
        - name: home-assistant-data
          mountPath: /config
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:latest@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - containerPort: 8123
#        command: ['/bin/sh']
#        args:
#        - '+x'
#        - '-c'
#        - >-
#          udevd -d
#          && sleep 20
#          && [ -c "/dev/ttyUSB0" ]
#          && /run/s6/legacy-services/home-assistant/run
#          || apk add --no-cache eudev
#          ; /run/s6/legacy-services/home-assistant/run
#          ; sleep infinity
        ## Probes added 2026-09-09 with the night upgrade window. Until now the
        ## Deployment had none at all, so the pod counted Ready the instant the
        ## container process existed and `Available` said nothing about whether
        ## HA was serving — a rollout could "succeed" onto an image that never
        ## finished booting.
        ##
        ## /manifest.json is HA's own unauthenticated static endpoint (200 in
        ## 8 ms, measured); / and /auth/providers also answer 200 without a
        ## token, /api/ does not (401) and is unusable as a probe.
        ##
        ## startupProbe: 120 x 10 s = 20 min of boot budget before readiness is
        ## evaluated at all — ~12x the measured 90-105 s cold start, so a slow
        ## but healthy start (DB migration, HACS component wheel builds) is not
        ## treated as a failure. There is deliberately NO livenessProbe: with a
        ## single-replica Recreate workload on an RWO PVC, a liveness restart
        ## loop during a slow boot is a worse outcome than a hung HA.
        startupProbe:
          httpGet:
            path: /manifest.json
            port: 8123
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
        ## readinessProbe: after startup, 6 x 30 s = 3 min of failure before the
        ## Service drops the endpoint. Longer than HA's in-place core restart
        ## (~2.5 min, f/heal/ha_stream_unwedge) so that does not flap the ingress.
        readinessProbe:
          httpGet:
            path: /manifest.json
            port: 8123
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        env:
        - name: TZ
          value: Europe/Zurich
        envFrom:
        - secretRef:
            name: home-assistant-env-secret
        volumeMounts:
        - name: home-assistant-data
          mountPath: /config
        # /media was the container OVERLAY until 2026-09-13 — there was no mount
        # for it at all, so everything HA wrote there was destroyed on every pod
        # restart. That silently ate the people-curation working area
        # (/media/llmvision/people_inbox and people_library, used by the
        # llmvision_people_inbox_collector automation and the Windmill flow
        # f/desk/people_inbox_curator), including _google_names.jsonl — the only
        # capture of Google Home's familiar-face names, which SDM never exposes.
        # An emptied inbox is indistinguishable from one nobody ever used, which
        # is how this went unnoticed.
        #
        # Backed by the same PVC via subPath rather than a new volume: the 38
        # existing files were copied to /config/media first, so the mount is
        # continuous rather than a reset, and everything under /media now lands
        # inside the weekly HA backup that already ships to Garage.
        # Nothing else had to change — the automations and the flow keep their
        # existing /media paths.
        - name: home-assistant-data
          mountPath: /media
          subPath: media
        # configuration.yaml lives on the PVC (home-assistant-data) since
        # 2026-05-14 — see bootstrap-configuration initContainer above and the
        # home-assistant-bootstrap ConfigMap (kept as DR seed, not mounted).
        - name: home-assistant-secrets
          mountPath: /config/secrets.yaml
          subPath: secrets.yaml
        # /dev/ttyUSB* re-enumerate across reboots (a node reboot moved the Zigbee
        # ZBT-1 from ttyUSB1->ttyUSB0, breaking ZHA which was pinned to ttyUSB1).
        # Mount the udev /dev/serial/by-id symlinks so ZHA can use the stable
        # by-id path (privileged already exposes the underlying ttyUSB* nodes).
        - name: dev-serial
          mountPath: /dev/serial
          readOnly: true
        # Honest request = observed steady-state (~2.4Gi). The main container was
        # BestEffort ({}), so HA was first against the wall on node-memory
        # eviction/OOM — unacceptable for the home's control plane (2026-07-05
        # N-1 program). Limit left generous for recorder/history spikes; this
        # only makes the scheduler account for memory HA already uses.
        resources:
          requests:
            cpu: 200m
            memory: 2560Mi
          limits:
            memory: 4Gi
      # Sidecar: hourly off-site sync of /config/backups → Garage S3.
      # Local retention is unchanged (auto_backup keeps the rolling window).
      #
      # ⚠️ An update to this container restarts the whole pod (Recreate, single
      # replica) — i.e. a digest bump of this sidecar takes HA down too.
      - name: rclone-backups-s3
        image: rclone/rclone:latest@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -u
          : "${BUCKET:?BUCKET env required}"
          while true; do
            rclone copy --min-age 1h --transfers 4 --s3-no-check-bucket \
              /config/backups "rgw:${BUCKET}" 2>&1 || true
            sleep 3600
          done
        envFrom:
        - secretRef:
            name: rgw-ha-backup-s3
        volumeMounts:
        - name: home-assistant-data
          mountPath: /config
          readOnly: true
        ## House CA chain (MDAPI Root + Issuing CA 01); rclone reads it via
        ## RCLONE_CA_CERT, set in the rgw-ha-backup-s3 secret. Since
        ## 2026-09-19 it verifies the Ceph RGW leaf rather than the Garage
        ## terminator on salt/pepper -- same chain, different server.
        ## ⭐ Renamed to rgw-transit-ca / /etc/rgw-tls on 2026-09-21.
        ## ⛔ The mountPath and RCLONE_CA_CERT (in rgw-s3-es.yml) must move
        ## TOGETHER -- the env var names this exact path, so changing one alone
        ## leaves rclone pointing at a directory that is no longer mounted.
        - name: rgw-transit-ca
          mountPath: /etc/rgw-tls
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: home-assistant-data
        persistentVolumeClaim:
          claimName: home-assistant-data
      - name: rgw-transit-ca
        secret:
          secretName: rgw-transit-ca
      # home-assistant-config volume removed 2026-05-14 (configuration.yaml on PVC).
      # The home-assistant-bootstrap ConfigMap still exists in fleet as a DR seed.
      - name: home-assistant-secrets
        secret:
          secretName: home-assistant-secrets
      - name: dev-serial
        hostPath:
          path: /dev/serial
          type: Directory      # exists while the ZBT-1 (permanently installed) is present on qui
