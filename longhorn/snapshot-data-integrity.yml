# fast-check only re-hashes files that are new or whose mtime changed, so it
# cannot see bit rot. `enabled` checksums whole snapshots and does -- this is the
# corruption gate the worn quo/fio-hot disk is gated on. The CR pre-exists
# Longhorn's own default, so it is adopted in place (fleet.yaml takeOwnership).
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: snapshot-data-integrity
  namespace: longhorn-system
value: '{"v1":"enabled","v2":"enabled"}'
