defaultNamespace: longhorn-system
namespace: longhorn-system
helm:
  maxHistory: 25
  # backuptargets/default and its credential secret predate this bundle -- they
  # were created out-of-band and carry no Helm ownership metadata, so the first
  # reconcile of backup-target.yml fails on "invalid ownership metadata" without
  # this. Adopting them in place is the point: a delete+recreate of the
  # BackupTarget would drop the target while Longhorn re-discovers the store.
  takeOwnership: true
