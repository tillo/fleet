apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-docker
  namespace: tv
spec:
  selector:
    matchLabels:
      app: pms-docker
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pms-docker
    spec:
      priorityClassName: mdapi-low
      containers:
      - name: pms-docker
        image: plexinc/pms-docker:latest@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 32400
        resources:
          requests:
            cpu: 100m
            memory: 4Gi
          # 2026-06-06: limits.cpu 4 -> 8 to absorb Plex transcoding /
          # library-scan bursts that were CFS-throttled >50% of periods.
          # VPA maxAllowed.cpu raised to 8000m in lockstep (vpa-objects).
          # 2026-11-04 (infra-r9mzd.9): with the VPA on RequestsOnly these limits
          # are the REAL ceiling (no more 80:1 ratio scaling to 111 cores).
          # memory 6Gi -> 10Gi = VPA maxAllowed, so the VPA request (~9.4Gi
          # target) never exceeds the limit; above the 30 d working-set peak
          # (7.9Gi, RSS ~2Gi) and below the 14.1Gi limit the ratio had applied.
          limits:
            cpu: 8
            memory: 10Gi
        env:
        - name: TZ
          value: Europe/Zurich
        - name: PLEX_CLAIM
          value: claim-V9R4xvBixsJK6GbbjPkn
        - name: ADVERTISE_IP
          value: http://31.3.128.62:32400/
        volumeMounts:
        - name: pms-docker-config
          mountPath: /config
        - name: pms-docker-transcode
          mountPath: /transcode
        - name: tv
          mountPath: /data
      volumes:
      - name: pms-docker-config
        persistentVolumeClaim:
          claimName: pms-docker-config
      - name: pms-docker-transcode
        persistentVolumeClaim:
          # Fio Longhorn scratch since 2026-11-04 (infra-r9mzd.9), off Ceph.
          claimName: pms-docker-transcode-fio
      - name: tv
        persistentVolumeClaim:
          claimName: tv-v3-ceph
