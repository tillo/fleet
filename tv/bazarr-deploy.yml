apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: bazarr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      priorityClassName: mdapi-low
      ## SA tv/default holds no Role and the app has no Kubernetes client:
      ## the token is unused (infra-p6q07.6).
      automountServiceAccountToken: false
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6767
        # Initial seed only — VPA Auto (vpa-objects/vpa-auto.yaml)
        # right-sizes per usage. 2 GiB headroom; previous 400Mi cap was
        # at 78 % steady-state, next OOM candidate after radarr.
        resources:
          requests:
            cpu: 25m
            memory: 250Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: TZ
          value: Europe/Zurich
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        volumeMounts:
        - name: bazarr-config
          mountPath: /config
        - name: tv
          mountPath: /tv
      volumes:
      - name: bazarr-config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: tv
        persistentVolumeClaim:
          claimName: tv-v3-ceph
