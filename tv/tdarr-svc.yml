apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: tv
spec:
  selector:
    app: tdarr
  ports:
    - name: http
      port: 8265
      protocol: TCP
      targetPort: 8265
    # Node<->server channel. The server listens on 8266 (serverPort in
    # tdarr-deploy.yml) and 8265 is only the web UI, so an external node has no
    # way to reach it without this. Required by tv/tdarr-node-quarto-deploy.yml.
    - name: node
      port: 8266
      protocol: TCP
      targetPort: 8266
  type: ClusterIP
