apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: autobrr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      priorityClassName: mdapi-low
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:latest@sha256:72bb5fe5e8c73f85660f92502d9015b21b07156495f039b55864633b9f8b7a89
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7474
        resources:
          requests:
            cpu: 25m
            memory: 350Mi
          limits:
            cpu: 500m
            memory: 500Mi
        env:
        - name: TZ
          value: Europe/Zurich
        volumeMounts:
        - name: autobrr-config
          mountPath: /config
      volumes:
      - name: autobrr-config
        persistentVolumeClaim:
          claimName: autobrr-config
