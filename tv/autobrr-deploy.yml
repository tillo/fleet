apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: autobrr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      priorityClassName: mdapi-low
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:latest@sha256:1a72b15b3cc3899082de38fbc05efab0dc0498135be359aa280078876c68f455
        imagePullPolicy: Always
        ports:
        - containerPort: 7474
        resources:
          requests:
            cpu: 25m
            memory: 350Mi
          limits:
            cpu: 500m
            memory: 500Mi
        env:
        - name: TZ
          value: Europe/Zurich
        volumeMounts:
        - name: autobrr-config
          mountPath: /config
      volumes:
      - name: autobrr-config
        persistentVolumeClaim:
          claimName: autobrr-config
