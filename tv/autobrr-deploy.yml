apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: autobrr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      priorityClassName: mdapi-low
      ## SA tv/default holds no Role and the app has no Kubernetes client:
      ## the token is unused (infra-p6q07.6).
      automountServiceAccountToken: false
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:latest@sha256:8c63fa0ba732eb33b2e531a84b3de3c99ae88e87c49bf077a6194020667ef92f
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7474
        resources:
          requests:
            cpu: 25m
            memory: 350Mi
          limits:
            cpu: 500m
            memory: 500Mi
        env:
        - name: TZ
          value: Europe/Zurich
        volumeMounts:
        - name: autobrr-config
          mountPath: /config
      volumes:
      - name: autobrr-config
        persistentVolumeClaim:
          claimName: autobrr-config
