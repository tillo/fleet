# NAME IS LEGACY, VOLUME IS LIVE: this is seerr's config volume — the seerr
# Deployment (seerr-deploy.yml) mounts claimName overseerr-config, kept from
# the overseerr→seerr migration (2026-05). Do NOT delete or "clean up" as
# stale; renaming would need a data migration for zero benefit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config
spec:
  storageClassName: harvester-longhorn-2replicas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
