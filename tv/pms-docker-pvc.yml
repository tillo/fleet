apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pms-docker-config
spec:
  storageClassName: harvester-longhorn-2replicas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 10Gi hit 100% on 2026-10-08 and stayed there; Plex began returning 500s
      # and the Home Assistant integration dropped out (alert:MediaPVCNearlyFull,
      # approved 2026-10-18). The StorageClass allows expansion; the live volume
      # was grown first and this declaration follows.
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pms-docker-transcode-ceph
  labels:
    app.mdapi.ch/phase2: migrated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
