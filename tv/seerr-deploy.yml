apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: seerr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: seerr
    spec:
      priorityClassName: mdapi-low
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: chown-config
        ## alpine:3, not :latest — bounded to Alpine 3.x; `latest` would cross
        ## into 4.x unattended. Same digest today (3.24.1).
        ## IfNotPresent: the @sha256 digest decides what is pulled and Renovate
        ## bumps it in git, so Always only added a registry round-trip per start
        ## (tests/test_digest_pinned_images_pull_if_not_present.py, infra-91rbx).
        image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
        imagePullPolicy: IfNotPresent
        command: [sh, -c, "chown -R 1000:1000 /app/config"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5055
        # Initial seed only -- VPA Auto (vpa-objects/vpa-auto.yaml) rewrites
        # requests/limits per actual usage. Old 500m lid throttled 32% of
        # SSR renders; 1500m was still hitting 13% throttle on bursts. 3c
        # is plenty for the Next.js render path. Memory request matches
        # observed steady-state (~230Mi); 1Gi limit caps any leak.
        resources:
          requests:
            cpu: 25m
            memory: 350Mi
          limits:
            cpu: 3000m
            memory: 1Gi
        env:
        - name: TZ
          value: Europe/Zurich
        - name: PORT
          value: "5055"
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      volumes:
      - name: seerr-config
        persistentVolumeClaim:
          claimName: overseerr-config
