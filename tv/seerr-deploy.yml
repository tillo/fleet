apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: tv
spec:
  selector:
    matchLabels:
      app: seerr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: seerr
    spec:
      priorityClassName: mdapi-low
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: chown-config
        ## alpine:3, not :latest — bounded to Alpine 3.x; `latest` would cross
        ## into 4.x unattended. Same digest today (3.24.1).
        ## imagePullPolicy is now EXPLICIT: it was only Always because the tag
        ## was `:latest`. Moving to `3` would have silently defaulted it to
        ## IfNotPresent, freezing this init container on a cached digest.
        image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        imagePullPolicy: Always
        command: [sh, -c, "chown -R 1000:1000 /app/config"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
        imagePullPolicy: Always
        ports:
        - containerPort: 5055
        # Initial seed only -- VPA Auto (vpa-objects/vpa-auto.yaml) rewrites
        # requests/limits per actual usage. Old 500m lid throttled 32% of
        # SSR renders; 1500m was still hitting 13% throttle on bursts. 3c
        # is plenty for the Next.js render path. Memory request matches
        # observed steady-state (~230Mi); 1Gi limit caps any leak.
        resources:
          requests:
            cpu: 25m
            memory: 350Mi
          limits:
            cpu: 3000m
            memory: 1Gi
        env:
        - name: TZ
          value: Europe/Zurich
        - name: PORT
          value: "5055"
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      volumes:
      - name: seerr-config
        persistentVolumeClaim:
          claimName: overseerr-config
