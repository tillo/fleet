## Pull secret for zot.mdapi.ch. Runtime images come from zot rather than
## registry.mdapi.ch on purpose: zot is the runtime registry, so a GitLab outage
## cannot block a pod from being scheduled. Same pattern as kustodyan-mcp.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-pull
  namespace: tv
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: cm-akeyless
  target:
    name: zot-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"zot.mdapi.ch":{"username":"zot","password":"{{ .password }}","auth":"{{ printf "zot:%s" .password | b64enc }}"}}}
  data:
    - remoteRef:
        key: /mdapi/zot/zot-auth/password
      secretKey: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: tv
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 4h"
spec:
  selector:
    matchLabels:
      app: flaresolverr
  replicas: 1
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      priorityClassName: mdapi-low
      imagePullSecrets:
      - name: zot-pull
      containers:
      - name: flaresolverr
        ## OUR REBUILD, not upstream. Upstream's :latest is v3.5.0 built 2026-05-26
        ## and not rebuilt since, so its Debian layer had accumulated three months of
        ## published fixes: 617 fixable CRITICAL CVEs, 609 of them chromium and its
        ## two companion packages — two thirds of the entire estate's fixable-critical
        ## burden, in this one pod.
        ##
        ## ⚠️ The instinct "make sure it updates" does NOT apply and is worth not
        ## re-deriving: Keel below was already polling upstream every 4h with
        ## policy=force and had refreshed this pod two days before the audit found it.
        ## Nothing was broken here. There was simply nothing newer upstream to pull.
        ## An image can be perfectly current against an upstream that has stopped
        ## moving, and no amount of pull automation detects that.
        ##
        ## mdapi/flaresolverr rebuilds upstream's image against current Debian
        ## packages every 4h. First build took chromium 148.0.7778.178 ->
        ## 151.0.7922.173 from oldstable-security.
        ##
        ## Worth the trouble for THIS container specifically: it renders arbitrary
        ## untrusted web pages through Cloudflare challenges for prowlarr, in the very
        ## Chromium the CVEs are in — the vulnerable surface is the one aimed at
        ## hostile input. beads infra-az8.3.
        ## ⚠️ The first cutover on 2026-08-29 CRASH-LOOPED and was reverted: the apt
        ## upgrade moved chromium to 151 while FlareSolverr's own vendored
        ## /app/chromedriver stayed at 148, and utils.py prefers that vendored binary
        ## unconditionally. The image had zero CVEs and could not start — a CVE count
        ## is not a working service. Fixed in mdapi/flaresolverr by replacing the
        ## vendored driver with the one apt installs, plus a BUILD-TIME assertion that
        ## the two majors match, so that failure can never ship again.
        ## Re-cut over only after a functional test: browser launched, User-Agent
        ## obtained, and a real request.get returned HTTP 200 with the expected page.
        image: zot.mdapi.ch/mdapi/flaresolverr:latest
        imagePullPolicy: Always
        ## Added 2026-08-31 (beads infra-az8.3, user decision). This container had
        ## resources:{} — no bound of any kind on a workload whose entire job is
        ## rendering arbitrary untrusted web pages. That is the half of the CVE
        ## finding a rebuilt image does not address: patched Chromium still executes
        ## whatever a hostile page sends it, and until now it could do so with the
        ## whole node's CPU and memory available.
        ##
        ## Sized from 7 days of measurement, not guessed: memory working set peaked
        ## at 1.18 GiB across pod generations (Chromium accumulates over a long-lived
        ## pod; a fresh one sits near 110 MiB), and CPU peaked at 0.33 cores. So 2Gi
        ## is ~1.7x the observed peak and 2 cores is ~6x — comfortable headroom for a
        ## legitimate render burst.
        ##
        ## ⚠️ The CPU limit is deliberate despite ContainerCpuThrottling being the
        ## noisiest warning in the estate. At 6x headroom, throttling here would mean
        ## something genuinely anomalous is running — which for a hostile-content
        ## renderer is a signal worth having, not noise. If it does start throttling,
        ## investigate before raising it.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
        env:
        - name: TZ
          value: Europe/Zurich
