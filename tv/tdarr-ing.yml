apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tdarr
  namespace: tv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ## No auth-response-headers: Authorization (infra-o4i3m.4): oauth2-proxy-tv
    ## sets none, so it would strip the client's own Authorization header.
    nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/tv/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-tv.oauth2-proxy.svc.cluster.local/tv/oauth2/auth
spec:
  ingressClassName: nginx
  rules:
    - host: tdarr.mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: tdarr
                port:
                  number: 8265
            path: /
            pathType: Prefix
  tls:
    - hosts:
      - tdarr.mdapi.ch
      secretName: tdarr-cert
