apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: tv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Express sets X-Powered-By and seerr has no setting to turn it off; the edge drops it
    # (edge-dast, infra-7rog.31.12).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Powered-By;
spec:
  ingressClassName: nginx
  rules:
    - host: seerr.mdapi.ch
      http:
        paths:
          - backend:
              service:
                name: seerr
                port:
                  number: 5055
            path: /
            pathType: Prefix
  tls:
    - hosts:
      - seerr.mdapi.ch
      secretName: seerr-cert
