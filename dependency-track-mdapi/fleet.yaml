# The estate's own Dependency-Track objects (epic infra-7rog.42): the CNPG
# database and its barman store, the KEK ExternalSecret the chart expects to
# exist, and the namespace's NetworkPolicies. Raw sibling of the
# dependency-track/ helm bundle, which never applies loose manifests -- and
# which depends on this one, so the database and the KEK exist before the
# api-server runs its init tasks (schema migration) on first start.
defaultNamespace: dependency-track
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
dependsOn:
  - name: mdapi-prod-external-secrets
