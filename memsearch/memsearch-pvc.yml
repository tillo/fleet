## One SQLite file (index + FTS5 + vectors + embedding cache) and its WAL.
## Measured on the full corpus 2026-10-27: 147 MB for 1,644 docs / 11,306 chunks.
##
## Nothing here needs a backup: the index is fully rebuilt from the seat's files by
## the next ingest (~5 min including embeddings). Losing it costs that, not data.
## storageClassName is explicit because two classes claim `(default)`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memsearch-data
  namespace: memsearch
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
