apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennic-tier2
  namespace: opennic
spec:
  selector:
    matchLabels:
      app: opennic-tier2
  replicas: 1
  template:
    metadata:
      labels:
        app: opennic-tier2
    spec:
      containers:
      - name: opennic-tier2
        image: zot.mdapi.ch/mdapi/opennic-tier2:latest@sha256:366bac85b23a5feed82f0d56c8c7373e99067a3ac144813bc6e92bf25b7e87d5
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - name: nameserver-udp
          containerPort: 53
          protocol: UDP
        - name: nameserver-tcp
          containerPort: 53
          protocol: TCP
        env:
        - name: TZ
          value: Europe/Zurich
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
        - 127.0.0.1
      imagePullSecrets:
      - name: zot-pull
