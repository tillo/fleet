apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennic-tier2
  namespace: opennic
spec:
  selector:
    matchLabels:
      app: opennic-tier2
  replicas: 1
  template:
    metadata:
      labels:
        app: opennic-tier2
    spec:
      containers:
      - name: opennic-tier2
        image: registry.mdapi.ch/mdapi/opennic-tier2:latest@sha256:c732603395ac8e81f10053511d9a56c7c5841553b0a863194047768d868a3cef
        securityContext:
          privileged: true
        ports:
        - name: nameserver-udp
          containerPort: 53
          protocol: UDP
        - name: nameserver-tcp
          containerPort: 53
          protocol: TCP
        env:
        - name: TZ
          value: Europe/Zurich
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
        - 127.0.0.1
      imagePullSecrets:
      - name: mdapi-registry
