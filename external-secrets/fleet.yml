defaultNamespace: external-secrets
namespaceLabels:
  cd.mdapi.ch: fleet
  cdenv.mdapi.ch: prod
  # PSA warn+audit=baseline (no enforce). Since Fleet v0.16 (2026-10-29) the
  # live namespace labels equal this list exactly, so the PSA labels must be
  # declared here or they are stripped (infra-r9mzd.14, PsaLabelDrift).
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/warn-version: latest
  pod-security.kubernetes.io/audit: baseline
  pod-security.kubernetes.io/audit-version: latest
helm:
  maxHistory: 25
  releaseName: external-secrets
  # Upstream moved the index.yaml to https://external-secrets.io/index.yaml;
  # the old charts.* subdomain now 302-redirects, which fleet's helm fetcher
  # occasionally times out on (stalls the whole gitrepo reconcile).
  # Chart .tgz files themselves live on GitHub Releases — only the index
  # location changed.
  repo: https://external-secrets.io
  chart: external-secrets
  version: 2.14.0  # Renovate-managed (renovate.json)
  valuesFiles:
    - values.yml
