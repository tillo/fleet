## backstage.mdapi.ch behind oauth2-proxy-admin (Keycloak, role mdapi-admin).
##
## ⭐ auth-response-headers is the sign-in: ingress-nginx copies these headers
## from oauth2-proxy's auth response onto the upstream request with
## proxy_set_header, which REPLACES any value a client sent -- so a client
## cannot claim an identity. Backstage's oauth2Proxy provider reads
## X-Auth-Request-Preferred-Username (needs set_xauthrequest=true in
## oauth2-proxy/admin/values.yml). The NetworkPolicy admits nothing else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-signin: https://auth.mdapi.ch/admin/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-admin.oauth2-proxy.svc.cluster.local/admin/oauth2/auth
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-Preferred-Username,X-Auth-Request-Email,X-Auth-Request-User
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [backstage.mdapi.ch]
      secretName: backstage-tls
  rules:
    - host: backstage.mdapi.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  name: http
